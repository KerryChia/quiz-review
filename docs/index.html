<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#faf9f6">
<title>概率论与数理统计 · 期中强化</title>
<style>
:root{--bg:#faf9f6;--surface:#fff;--ink:#241f1e;--muted:#6d6663;--line:#e5e0d8;--gold:#9E1B2C;--gold-bg:#fbf1f1;--blue:#2c4f7c;--blue-bg:#eef2f7;--green:#2f6b4f;--green-bg:#edf4ef;--red:#a33e32;--red-bg:#fbeeea;--radius:16px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.75 "Microsoft YaHei","PingFang SC",system-ui,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer;transition:background .15s,border-color .15s,color .15s;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
a{color:var(--blue)}
.wrap{max-width:1200px;margin:0 auto;padding:26px 28px 46px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:14px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:.03em;min-width:0}
.brandmark{display:grid;place-items:center;background:var(--ink);color:#fff;border-radius:10px;width:36px;height:36px;flex:0 0 36px;font-family:Georgia,serif;font-size:19px}
.brand>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topnote{color:var(--muted);font-size:12px;text-align:right;white-space:nowrap}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 22px}
.tab{background:transparent;border:1px solid var(--line);border-radius:10px;padding:9px 13px;color:var(--muted);font-size:13px}
.tab:hover{border-color:#cfc7b8;color:var(--ink)}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.layout{display:grid;grid-template-columns:252px minmax(0,1fr);gap:24px;align-items:start}
.sidebar{position:sticky;top:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.panel+.panel{margin-top:14px}
.panel h2{font-size:15px;margin:0 0 4px}
.panel p{margin:0;font-size:12.5px;color:var(--muted)}
.pack-subtitle{font-size:12px;color:var(--muted);margin:0 0 12px;line-height:1.6}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.stat-number{font:700 25px/1.1 -apple-system,"Segoe UI",Roboto,"PingFang SC",sans-serif;color:var(--gold);font-variant-numeric:lining-nums tabular-nums}
.stat-label{font-size:11.5px;color:var(--muted);line-height:1.4}
.progress{height:7px;background:#efeae1;border-radius:99px;overflow:hidden;margin:10px 0 6px}
.progress span{display:block;height:100%;width:0;background:var(--gold);transition:width .25s}
.progress-caption{font-size:11.5px;color:var(--muted);margin:0 0 12px}
.map{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.map button{aspect-ratio:1;border:1px solid var(--line);background:#fff;border-radius:7px;font-size:11.5px;color:var(--muted);padding:0;position:relative}
.map button:hover{border-color:#c9bfae}
.map button.done{background:var(--green-bg);border-color:#bcd6c5;color:var(--green);font-weight:700}
.map button.wrong{background:var(--red-bg);border-color:#e3c3bb;color:var(--red);font-weight:700}
.map button.mastered{background:var(--blue-bg);border-color:#c3d7e0;color:var(--blue);font-weight:700}
.map button.current{outline:2px solid var(--ink);outline-offset:1px}
.map button.star::after{content:"★";position:absolute;top:-2px;right:1px;font-size:8px;color:var(--gold)}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px}
.legend .g{background:#bcd6c5}.legend .r{background:#e3c3bb}.legend .b{background:#c3d7e0}
.save-label{font-size:11px;color:var(--muted);margin-top:12px}
.save-label.error{color:var(--red)}
.reset{width:100%;margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px;font-size:12px;color:var(--muted)}
.reset:hover{border-color:var(--red);color:var(--red)}
.main{min-width:0}
.notes{background:var(--gold-bg);border:1px solid #efe0c4;border-radius:var(--radius);padding:14px 18px;margin-bottom:16px;font-size:13px}
.notes summary{cursor:pointer;font-weight:700;color:var(--gold);font-size:13px;list-style:none}
.notes summary::-webkit-details-marker{display:none}
.notes summary::before{content:"▸ ";font-size:11px}
.notes[open] summary::before{content:"▾ "}
.notes .notes-body{margin-top:10px;color:#5b554c;line-height:1.85}
.notes .notes-body p{margin:0 0 6px}
.notes .notes-body ul{margin:4px 0 8px 1.2em;padding:0}
.notes .notes-body li{margin:3px 0;padding-left:2px}
.notes .notes-body p:last-child{margin:0}
.sol ul{margin:6px 0 8px 1.2em;padding:0}
.sol li{margin:4px 0}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filter{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-size:12px;color:var(--muted)}
.filter[aria-pressed="true"]{background:var(--gold-bg);border-color:#e2cda5;color:var(--gold);font-weight:700}
.filter-count{font-size:12px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:28px 30px;min-height:340px}
.qtop{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.badge{font-size:11px;padding:3px 8px;border-radius:6px;background:var(--blue-bg);color:var(--blue);font-weight:700}
.badge.pts{background:var(--gold-bg);color:var(--gold);border:1px solid rgba(158,27,44,.18)}
.badge.chap{background:#f2efe9;color:var(--muted)}
.qid{font-size:12px;color:var(--muted);margin-left:auto}
.star{background:none;border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:13px;color:#c9bfae}
.star[aria-pressed="true"]{color:var(--gold);border-color:#e2cda5;background:var(--gold-bg)}
.stem{font-size:16px;line-height:1.85;margin:0 0 18px;font-weight:600}
.stem .sub{font-weight:400;color:var(--muted);font-size:13.5px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px 14px;font-size:14px;line-height:1.7;width:100%}
.opt:hover{border-color:#cfc7b8;background:#fdfcfa}
.opt .k{flex:0 0 22px;height:22px;border-radius:6px;background:#f2efe9;color:var(--muted);display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:1px}
.opt.picked{border-color:var(--ink);background:#fbfaf7}
.opt.correct{border-color:#9cc4ab;background:var(--green-bg)}
.opt.correct .k{background:#bcd6c5;color:var(--green)}
.opt.wrong{border-color:#e0bcb3;background:var(--red-bg)}
.opt.wrong .k{background:#e3c3bb;color:var(--red)}
.opt[disabled]{opacity:1}
.judge{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.fillrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.fillrow label{font-size:13.5px;color:var(--muted);min-width:100%}
.fillrow input{border:1px solid var(--line);border-radius:9px;padding:9px 12px;width:190px;background:#fff}
.fillrow input:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:var(--blue)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn{background:var(--ink);color:#fff;border:1px solid var(--ink);border-radius:10px;padding:9px 16px;font-size:13.5px}
.btn:hover{background:#2b2926}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:#cfc7b8;background:#fbfaf7}
.fb{margin-top:16px;border-radius:12px;padding:14px 16px;font-size:13.5px;line-height:1.8}
.fb.ok{background:var(--green-bg);border:1px solid #c9dece}
.fb.no{background:var(--red-bg);border:1px solid #e6c8c0}
.fb.info{background:var(--blue-bg);border:1px solid #c8dae2}
.fb h3{margin:0 0 6px;font-size:13px;letter-spacing:.04em}
.fb p{margin:0 0 6px}
.fb p:last-child{margin:0}
.sol{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px;font-size:13.5px;color:#4d4842;line-height:1.85;display:none}
.sol.show{display:block}
.sol b{color:var(--gold)}
.stem,.sol,.fb,.notes-body{overflow-wrap:break-word}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px}
.pager .btn{display:inline-flex;align-items:center;gap:6px}
@media(min-width:901px) and (max-width:1407px){.has-ai .pager{padding-right:104px}}
.pos{font-size:12.5px;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:40px 10px;text-align:center;color:var(--muted);font-size:14px}
@media(max-width:900px){
  .layout{display:flex;flex-direction:column}
  .main{order:1}
  .sidebar{order:2;position:static}
  .wrap{padding:20px 16px calc(84px + env(safe-area-inset-bottom))}
  .card{padding:20px 18px}
  .tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px;scrollbar-width:thin}
  .tab{flex:0 0 auto;white-space:nowrap}
  .brand{font-size:14px}
  .topnote{font-size:11px}
  .pager{position:sticky;bottom:0;z-index:30;margin:14px -16px 0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    background:rgba(250,249,246,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
  .pager .btn{min-height:44px}
  .notes{overflow:hidden}
}
@media(max-width:520px){
  .topnote{display:none}
  .brand>span:last-child{font-size:13px}
  .map{grid-template-columns:repeat(8,1fr)}
  .judge{grid-template-columns:1fr}
  .wrap{padding:16px 12px calc(80px + env(safe-area-inset-bottom))}
  .card{padding:18px 14px;min-height:0}
  .stem{font-size:15.5px;line-height:1.8}
  .opt{padding:11px 12px}
  .fillrow label{min-width:100%}
  .fillrow input{width:100%}
  .pager{margin-left:-12px;margin-right:-12px;padding-left:12px;padding-right:12px}
  .pager{gap:8px}
  .pager .btn{flex:1 1 0;min-width:0;justify-content:center;padding:11px 10px}
  .notes{padding:12px 13px}
  .panel{padding:14px}
  .tabs{margin:14px -12px 16px;padding:0 12px 6px}
  .qtop{gap:6px}
  .qid{margin-left:0}
}
@media(max-width:360px){
  .map{grid-template-columns:repeat(6,1fr)}
  .wrap{padding:14px 10px calc(80px + env(safe-area-inset-bottom))}
  .pager{margin-left:-10px;margin-right:-10px;padding-left:10px;padding-right:10px}
  .tabs{margin-left:-10px;margin-right:-10px;padding-left:10px;padding-right:10px}
}

.m{font-family:"Cambria Math","Latin Modern Math",Georgia,serif;font-style:italic;white-space:nowrap}
.m .frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .18em;font-size:.94em;line-height:1.18}
.m .frac .fn{border-bottom:1px solid currentColor;padding:0 .18em}
.m .frac .fd{padding:0 .18em}
.m .sqrt .sq{border-top:1px solid currentColor;padding:0 .16em}
.m .binom sub,.m .binom sup{font-size:.72em;vertical-align:baseline}
.m .binom sup{vertical-align:super}
.m .binom sub{vertical-align:-.25em}
.m .ovl{text-decoration:overline}
.m .acc,.eq .acc{text-decoration:overline;margin:0 .13em;padding:0}
.cases{display:inline-flex;align-items:center;vertical-align:middle;margin:0 .25em}
.cbrace{font-weight:300;line-height:.82;margin-right:.1em;transform:translateY(-.02em)}
.crows{display:inline-grid;grid-template-columns:max-content max-content;column-gap:.95em;row-gap:.1em;text-align:left}
.crow{display:contents}
.crow .cl{text-align:right;white-space:nowrap}
.crow .cr{text-align:left;white-space:nowrap}
.eq .cases{font-size:1.02em}
.m .up{font-style:normal}
.m sup,.m sub{font-size:.72em}
.notes .m{font-style:italic}
.eqi{font-weight:400}
.eq{display:block;text-align:center;margin:11px 0;font-family:"Cambria Math","Latin Modern Math",Georgia,serif;font-style:italic;line-height:1.95;max-width:100%;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
.eq .frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .22em;line-height:1.2;font-size:.96em}
.eq .frac .fn{border-bottom:1px solid currentColor;padding:0 .22em}
.eq .frac .fd{padding:0 .22em}
.eq sup,.eq sub{font-size:.72em}
.eq .ovl{text-decoration:overline}
@media(pointer:coarse){.fillrow input{font-size:16px}}
</style>
<style>
/* AI 助教 · 前端直连版（无后端） */
#ai-fab{position:fixed;right:24px;bottom:24px;z-index:60;display:inline-flex;align-items:center;gap:8px;
  padding:11px 18px;border:none;border-radius:99px;cursor:pointer;font:inherit;font-size:13.5px;
  background:var(--gold);color:#fff;box-shadow:0 8px 22px rgba(158,27,44,.28)}
#ai-fab:hover{filter:brightness(1.06)}
#ai-fab .dot{width:7px;height:7px;border-radius:50%;background:#fff;opacity:.85}
#ai-fab.off{background:#8d8580;box-shadow:0 8px 22px rgba(36,31,30,.18)}

#ai-panel{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:100vw;height:100dvh;z-index:70;display:none;
  flex-direction:column;background:var(--surface);border-left:1px solid var(--line);
  box-shadow:-12px 0 40px rgba(36,31,30,.14)}
#ai-panel.open{display:flex}
#ai-panel header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--bg)}
#ai-panel header strong{font-size:14px;letter-spacing:.02em}
#ai-model{font:inherit;font-size:12px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);max-width:140px}
#ai-gear{margin-left:auto;border:none;background:none;font-size:15px;line-height:1;color:var(--muted);cursor:pointer;padding:2px 4px}
#ai-gear:hover{color:var(--ink)}
#ai-close{border:none;background:none;font-size:20px;line-height:1;color:var(--muted);cursor:pointer;padding:0 4px}
#ai-close:hover{color:var(--ink)}
#ai-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.ai-msg{max-width:96%;font-size:13.5px;line-height:1.72}
.ai-msg.user{align-self:flex-end;background:var(--gold);color:#fff;padding:8px 12px;border-radius:12px 12px 3px 12px;white-space:pre-wrap}
.ai-msg.bot{align-self:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px 12px 12px 3px;padding:10px 13px}
.ai-msg.bot p{margin:0 0 8px}
.ai-msg.bot p:last-child{margin-bottom:0}
.ai-msg.bot ul{margin:6px 0 6px 1.15em;padding:0}
.ai-msg.bot code{background:var(--bg);padding:1px 5px;border-radius:4px;font-size:.92em}
.ai-msg .eq{font-size:1.02em}
.ai-msg .m{font-family:"Cambria Math","Latin Modern Math",Georgia,serif;font-style:italic}
.ai-msg .up{font-style:normal}
.ai-msg.err{border-color:#a33e32;color:#a33e32}
.ai-reasoning{font-size:12px;color:var(--muted);border-left:3px solid var(--line);padding:4px 8px;margin-bottom:6px;white-space:pre-wrap;max-height:110px;overflow-y:auto}
.ai-quick{display:flex;gap:6px;padding:8px 12px;border-top:1px solid var(--line);flex-wrap:wrap;background:var(--surface)}
.ai-quick button{font:inherit;font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:99px;background:#fff;color:var(--muted);cursor:pointer}
.ai-quick button:hover{border-color:var(--gold);color:var(--gold)}
.ai-inputrow{display:flex;gap:8px;align-items:flex-end;padding:10px 12px;background:var(--bg);border-top:1px solid var(--line)}
#ai-input{flex:1;min-height:46px;max-height:120px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;
  font:inherit;font-size:13.5px;resize:none;background:#fff;color:var(--ink)}
#ai-send{white-space:nowrap}

.aigrade{margin-top:10px;border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:8px;padding:10px 12px;background:var(--gold-bg)}
.aigrade .hd{display:flex;align-items:center;gap:10px;font-size:13px;margin-bottom:4px}
.aigrade .sc{font-weight:600;color:var(--gold)}
.aigrade .mdl{font-size:11px;color:var(--muted);margin-left:auto}
.aigrade p{margin:0;font-size:13px;line-height:1.7;color:var(--ink)}

.solinput{margin:0 0 12px}
.solinput label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.solinput textarea{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
  font:inherit;font-size:13.5px;line-height:1.7;background:#fff;color:var(--ink);resize:vertical;min-height:96px}
.solinput textarea:focus{outline:none;border-color:var(--gold)}

/* 设置弹窗 */
#ai-setup{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(36,31,30,.38)}
#ai-setup.open{display:flex}
.ai-modal-box{width:min(460px,100%);background:var(--surface);border-radius:16px;padding:22px 22px 18px;box-shadow:0 24px 60px rgba(0,0,0,.24);max-height:92vh;overflow-y:auto}
.ai-modal-box h3{margin:0 0 6px;font-size:17px}
.ai-modal-box>p{margin:0 0 16px;font-size:12.5px;color:var(--muted);line-height:1.7}
.ai-field{display:block;margin-bottom:12px;font-size:12.5px;color:var(--muted)}
.ai-field input{display:block;width:100%;box-sizing:border-box;margin-top:5px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;font:inherit;font-size:13.5px;background:#fff;color:var(--ink)}
.ai-field input:focus{outline:none;border-color:var(--gold)}
.ai-modal-box details{margin:2px 0 6px}
.ai-modal-box summary{cursor:pointer;font-size:12px;color:var(--muted)}
.ai-modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:8px}
.ai-modal-hint{margin:14px 0 0;font-size:12px;color:var(--muted);line-height:1.7;border-top:1px solid var(--line);padding-top:12px}
.ai-modal-hint a{color:var(--blue)}
.ai-err{color:var(--red);font-size:12px;margin:6px 0 0;display:none}

@media (max-width:900px){
  #ai-fab{right:16px;bottom:calc(80px + env(safe-area-inset-bottom))}
}
@media (max-width:721px){
  #ai-fab{right:12px;bottom:calc(76px + env(safe-area-inset-bottom));padding:10px 14px}
  #ai-panel{width:100vw;border-left:none}
  #ai-panel header{padding-top:calc(12px + env(safe-area-inset-top))}
  .ai-inputrow{padding-bottom:calc(10px + env(safe-area-inset-bottom))}
  #ai-setup{padding:12px;align-items:flex-start;overflow-y:auto}
  .ai-modal-box{margin:auto;border-radius:14px;padding:18px 16px 14px}
  .ai-msg{max-width:100%}
  .ai-quick button{padding:6px 12px}
  #ai-input,.solinput textarea,.ai-field input{font-size:16px}
  #ai-close{padding:0 8px;font-size:24px}
  #ai-gear{padding:4px 8px;font-size:17px}
  #ai-model{max-width:120px}
}

</style>
</head>
<body>
<div class="wrap">
<header class="topbar">
  <div class="brand"><span class="brandmark">P</span><span>概率论与数理统计 · 期中强化</span></div>
  <div class="topnote">共 186 题</div>
</header>

<nav id="pack-tabs" class="tabs" aria-label="切换板块"></nav>

<div class="layout">
<aside class="sidebar">
  <section class="panel">
    <h2 id="pack-name">—</h2>
    <p class="pack-subtitle" id="pack-subtitle"></p>
    <div class="stats">
      <div><div class="stat-number" id="done-number">0</div><div class="stat-label">已完成 / 本组题数</div></div>
      <div><div class="stat-number" id="correct-number">0</div><div class="stat-label">客观题答对</div></div>
    </div>
    <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="progress-bar"></span></div>

<script id="quiz-data" type="application/json">{"packs":[{"id":"K1","head":"考点 01","name":"事件运算与概率性质","subtitle":"四格法 · 容斥 · S₁S₂S₃ 简式 · 交集界","notes":"\n**事件语言**：$A\\cup B$ 至少一个；$AB$ 同时；$A-B=A\\bar B$ 只有 A；$A\\bar B\\cup\\bar AB$ 恰有一个。\n\n**上划线怎么看（全章最容易混的一处）**：\n- $\\bar A\\,\\bar B$：两条**短**线，各盖住一个字母 $\\Rightarrow$「$A$ 不发生」**且**「$B$ 不发生」。\n- $\\overline{AB}$：一条**长**线，盖住整块 $AB$ $\\Rightarrow$「$A$ 与 $B$ 同时发生」不成立 $\\Rightarrow$ 至少一个不发生。\n\n两者正好是德摩根的一对：\n$\\bar A\\,\\bar B=\\overline{A\\cup B}$（都不发生 = 并非至少一个发生），\n$\\overline{AB}=\\bar A\\cup\\bar B$（不同时发生 = 至少一个不发生）。\n\n**口诀**：线长盖谁，谁就整体取反；线短各自盖，先各自取反再取交。\n算数值时：$P(\\bar A\\,\\bar B)=1-P(A\\cup B)$，而 $P(\\overline{AB})=1-P(AB)$，**两者一般不相等**。\n\n**必背三条**：\n- $P(A\\cup B)=P(A)+P(B)-P(AB)$\n- $P(A-B)=P(A)-P(AB)$\n- $P(\\bar A)=1-P(A)$\n\n**三事件速算**（考场上比画韦恩图快）：令 $S_1=\\sum P$，$S_2=\\sum P(\\text{两两交})$，$S_3=P(ABC)$，则\n恰好一个 $=S_1-2S_2+3S_3$；恰好两个 $=S_2-3S_3$；至少两个 $=S_2-2S_3$。\n\n**四格法**：设 $u=P(AB)$、$v=P(A\\bar B)$、$w=P(\\bar AB)$、$z=P(\\bar A\\bar B)$，四项非负、和为 1。则\n$P(A)=u+v$，$P(B)=u+w$，$P(\\bar A\\bar B)=z$，**独立 $\\Leftrightarrow uz=vw$**。\n条件概率在四格里就是「行内做比」：$P(A\\mid\\bar B)=\\dfrac{v}{v+z}$。\n\n**交集界**：$\\max(0,P(A)+P(B)-1)\\le P(AB)\\le\\min(P(A),P(B))$。\n"},{"id":"K2","head":"考点 02","name":"古典概型与计数","subtitle":"分房 · 抽签 · 圆排列 · 配对问题","notes":"\n**两大前提**：样本点有限、等可能。缺一个就不能用古典概型。\n\n**四种抽取口径**（从 $N$ 个中取 $n$ 个）：\n- 不放回且有序：$A_N^n=\\dfrac{N!}{(N-n)!}$\n- 不放回且无序：$\\binom{N}{n}$\n- 放回且有序：$N^n$\n- 放回且无序：各多重集**不等可能**，不能直接用计数做分母\n\n**高频模型**：\n- 分房：$n$ 人进 $m$ 房共 $m^n$ 种；每房至多一人 $\\dfrac{A_m^n}{m^n}$。\n- 抽签：不放回时任一固定位置抽到目标签的概率恒为 $\\dfrac{1}{N}$（与顺序无关）。\n- 圆排列：$n$ 人围坐 $(n-1)!$；两人相邻 $2(n-2)!$，概率 $\\dfrac{2}{n-1}$。\n- 排队间隔：$n$ 人一排，甲乙之间恰 $k$ 人概率 $\\dfrac{2(n-k-1)}{n(n-1)}$。\n- 错排：$n$ 封信全装错 $D_n=n!\\sum_{k=0}^{n}\\dfrac{(-1)^k}{k!}$；恰 $k$ 封装对 $=\\binom{n}{k}D_{n-k}$。\n\n**易错**：分子分母必须同一口径；「至少」优先取补。\n"},{"id":"K3","head":"考点 03","name":"几何概型","subtitle":"面积比 · 会面 · 断棒 · 角度区域","notes":"\n**公式**：$P(A)=\\dfrac{m(A)}{m(\\Omega)}$，长度／面积／体积之比。\n\n**会面模板**：两人在 $[0,T]$ 独立均匀到达，先到者等 $d$：\n$$P=1-\\left(\\frac{T-d}{T}\\right)^2$$\n只算「甲等乙」一侧时，再除以 2。\n\n**断棒模板**：长度 $l$ 上取两断点 $x<y$，三段 $x,\\ y-x,\\ l-y$。\n成三角形 $\\Leftrightarrow$ 每段 $<l/2$，有利面积 $l^2/8$，总 $l^2/2$，故 $P=1/4$。\n\n**角度型**：区域是圆／半圆时，把「夹角 $<\\theta$」化成 $y<kx$（$k=\\tan\\theta$），再用**扇形减三角形**算面积，不要直接目测。\n\n**易错**：单点概率为 0，但事件并非不可能；「随机」必须落实成均匀取点。\n"},{"id":"K4","head":"考点 04","name":"条件概率与乘法公式","subtitle":"方向别搞反 · 乘法链 · 抽签的条件性","notes":"\n**定义**：$P(A\\mid B)=\\dfrac{P(AB)}{P(B)}$，$P(B)>0$。\n\n**乘法链**：$P(A_1A_2\\cdots A_n)=P(A_1)P(A_2\\mid A_1)\\cdots P(A_n\\mid A_1\\cdots A_{n-1})$。\n每一步的**分母是当前剩余总数**，分子随已取走的颜色动态变化。\n\n**条件概率也是概率**：固定 $B$ 后，$P(\\cdot\\mid B)$ 满足全部三条公理，因此\n$P(\\bar A\\mid B)=1-P(A\\mid B)$、$P(A\\cup C\\mid B)=P(A\\mid B)+P(C\\mid B)-P(AC\\mid B)$。\n\n**两条铁律**：\n- $P(A\\mid B)$ 与 $P(B\\mid A)$ 分母不同，一般**不相等**。\n- $P(A\\mid B)+P(A\\mid\\bar B)=1$ **不成立**（成立的是 $P(A\\mid B)+P(\\bar A\\mid B)=1$）。\n\n**抽签的边际性**：不放回抽样中「第 $k$ 次取到某色」的概率与 $k$ 无关；但**条件概率会变**，不要混。\n"},{"id":"K5","head":"考点 05","name":"全概率与贝叶斯","subtitle":"划分 · 两阶段抽检 · 检测问题 · 假阳性","notes":"\n**全概率**（$\\{B_i\\}$ 是划分：两两互斥、并为 $\\Omega$）：\n$$P(A)=\\sum_i P(B_i)P(A\\mid B_i)$$\n\n**贝叶斯**：\n$$P(B_j\\mid A)=\\frac{P(B_j)P(A\\mid B_j)}{\\sum_i P(B_i)P(A\\mid B_i)}=\\frac{\\text{分子}}{\\text{全概率}}$$\n\n**方向判断**：知道来源求结果 $\\to$ 全概率；知道结果反查来源 $\\to$ 贝叶斯。\n路径上**相乘**，互斥路径之间**相加**。\n\n**两阶段抽检模板**（近年高频）：第一次抽到不合格后「从同一条生产线再抽一件」，说明第二次的条件概率仍用该线的不合格率，且两次独立，故\n$P(\\text{拒收}\\mid \\text{线 }i)=p_i^2$，再对生产线用全概率。**千万不要**把第二次写成全体不合格率。\n\n**检测问题**：患病率很低时，阳性者中真患者比例可能很低（基础率谬误）。答题必须写出\n$P(+\\mid \\text{病})$ 与 $P(+\\mid\\text{健康})$ 两个数。\n"},{"id":"K6","head":"考点 06","name":"独立性与伯努利概型","subtitle":"相互独立 · 系统可靠度 · 等比级数","notes":"\n**定义**：$A,B$ 独立 $\\Leftrightarrow P(AB)=P(A)P(B)$。独立事件**各取补后仍独立**。\n\n**三个事件相互独立**要 4 条等式全成立：三条两两乘积 + 一条三重乘积。\n**两两独立推不出相互独立**（经典反例：掷两枚硬币，$A$=第一枚正，$B$=第二枚正，$C$=两枚同面）。\n\n**至少一个发生**：$P\\left(\\bigcup A_i\\right)=1-\\prod(1-P(A_i))$，这是全课程最好用的一条。\n\n**系统可靠度**：串联相乘、并联取补。\n两个元件并联：$1-(1-p)^2$；再与第三个串联，整体乘 $p$。\n\n**轮流制**：一轮双方都没结束的概率记 $q$，则先手胜率 $\\dfrac{p_1}{1-q}$（等比级数）。\n"},{"id":"K7","head":"考点 07","name":"离散型与常用分布","subtitle":"二项 · 几何 · 负二项 · 超几何 · 泊松","notes":"\n**五种分布，认准「固定次数」还是「等第几次」**：\n\n- 0-1：$P(X=1)=p$；$E=p$，$D=pq$。\n- 二项 $B(n,p)$：**固定 $n$ 次**中成功 $k$ 次，$P=\\binom nk p^kq^{n-k}$；$E=np$，$D=npq$。\n- 几何 $G(p)$：**首次成功所需的次数**，从 1 开始，$P=q^{k-1}p$；$E=\\dfrac1p$，$D=\\dfrac q{p^2}$。\n- 负二项：**第 $r$ 次成功**所需总次数，$P=\\binom{k-1}{r-1}p^rq^{k-r}$；$E=\\dfrac rp$。\n- 超几何：$N$ 中 $M$ 个目标，不放回取 $n$，$P=\\dfrac{\\binom Mk\\binom{N-M}{n-k}}{\\binom Nn}$；$E=n\\dfrac MN$。\n- 泊松 $P(\\lambda)$：$P=\\dfrac{\\lambda^k}{k!}e^{-\\lambda}$；$E=D=\\lambda$。\n\n**三个「别搞混」**：\n- 「固定 5 次里中 3 次」是二项；「第 5 次才中第 3 次」是负二项；「第 5 次才首次中」是几何。\n- 超几何 vs 二项：**放回用二项，不放回用超几何**；$n/N$ 很小才能近似。\n- 二项 → 泊松：$n$ 大、$p$ 小、$\\lambda=np$ 适中。\n\n**几何的尾部最有用**：$P(X>m)=q^m$，$P(X\\ge m)=q^{m-1}$。\n"},{"id":"K8","head":"考点 08","name":"分布函数与连续密度","subtitle":"三条件 · 分段拼接 · 跳跃 · 混合型","notes":"\n**分布函数** $F(x)=P(X\\le x)$，判定三条件：单调不减、**右连续**、$F(-\\infty)=0,\\ F(+\\infty)=1$。\n\n**八个区间概率**（左端点是否扣、右端点是否计，按事件定义判断）：\n- $P(X<a)=F(a-)$，$P(X=a)=F(a)-F(a-)$\n- $P(a<X\\le b)=F(b)-F(a)$\n- $P(a\\le X\\le b)=F(b)-F(a-)$\n- $P(a<X<b)=F(b-)-F(a)$\n\n**连续型**：$F(x)=\\int_{-\\infty}^{x}f$，$P(X=a)=0$，在连续点 $F'=f$。\n密度**可以大于 1**，只需非负且积分为 1。\n\n**分段拼接三条检查**：接点两侧相等（连续性）、每段单调、两端极限 0 与 1。\n**只要求右连续**——左侧允许跳跃，跳跃高度就是该点的概率。\n\n**混合型**：既有连续部分又有点质量（如交通灯等待时间、$\\min(X,c)$）。做题先找跳点，再写分段。\n"},{"id":"K9","head":"考点 09","name":"随机变量函数的分布","subtitle":"分布函数法 · 单调公式 · 平方 · 截断","notes":"\n**万能路径**：先写 $F_Y(y)=P(g(X)\\le y)$，再与 $X$ 的取值范围取交，最后求导。\n\n**单调可导时**（$g'$ 不变号）：\n$$f_Y(y)=\\frac{f_X\\big(g^{-1}(y)\\big)}{\\big|g'\\big(g^{-1}(y)\\big)\\big|}$$\n线性特例：$f_{aX+b}(y)=\\dfrac1{|a|}f_X\\left(\\dfrac{y-b}{a}\\right)$。\n\n**非单调必须分支**，且只看**落在支持集内**的原像：\n- $Y=X^2$：$f_Y(y)=\\dfrac{f_X(\\sqrt y)+f_X(-\\sqrt y)}{2\\sqrt y}$，$y>0$。\n- $Y=|X|$：$f_Y(y)=f_X(y)+f_X(-y)$，$y>0$。\n\n**截断产生点质量**：\n$$P\\big(\\min(X,c)=c\\big)=1-F_X(c-),\\qquad P\\big(\\max(X,c)=c\\big)=F_X(c)$$\n截断后**既非离散也非连续**，是混合型，必须单独写出跳点的概率。\n\n**概率积分变换**：$F_X$ 连续时 $F_X(X)\\sim U(0,1)$；反过来 $F^{-1}(U)$ 的分布函数就是 $F$。\n"},{"id":"K10","head":"考点 10","name":"期望、方差与不等式","subtitle":"矩 · 阶乘矩 · 尾部求和 · 切比雪夫","notes":"\n**定义与性质**：\n- $E(aX+b)=aE(X)+b$，$D(aX+b)=a^2D(X)$。\n- $E(X+Y)=E(X)+E(Y)$ **不需要独立**；$D(X+Y)=D(X)+D(Y)$ **需要独立**（或至少不相关）。\n- $E(X^2)=D(X)+[E(X)]^2$。\n\n**函数期望不必先求分布**：$E[g(X)]=\\int g f$ 或 $\\sum g(x_i)p_i$。\n\n**两个高效工具**：\n- 非负整数型：$E X=\\sum_{j\\ge0}P(X>j)$。\n- 尾部积分：$E X=\\int_0^{\\infty}P(X>t)\\,dt$。\n\n**阶乘矩**：二项 $E[(X)_r]=(n)_rp^r$，泊松 $E[(X)_r]=\\lambda^r$；再配合 $X^2=(X)_2+X$ 反解方差。\n\n**切比雪夫**（$D$ 有限，$\\varepsilon>0$）：\n$$P(|X-EX|\\ge\\varepsilon)\\le\\frac{DX}{\\varepsilon^2}$$\n它只给**界**，不给精确值；下界为负时取 0。已知正态时才可算精确概率。\n"},{"id":"K11","head":"考点 11","name":"正态分布与标准化","subtitle":"标准化 · 对称性 · 区间概率 · 正态可加","notes":"\n**标准化**：$Z=\\dfrac{X-\\mu}{\\sigma}\\sim N(0,1)$，注意**第二个参数是方差**，除的是标准差。\n\n$$P(a\\le X\\le b)=\\Phi_0\\!\\left(\\frac{b-\\mu}{\\sigma}\\right)-\\Phi_0\\!\\left(\\frac{a-\\mu}{\\sigma}\\right)$$\n$$P(|X-\\mu|<c)=2\\Phi_0\\!\\left(\\frac c\\sigma\\right)-1$$\n\n**对称性**：$\\Phi_0(-z)=1-\\Phi_0(z)$；$P(X\\le\\mu)=\\dfrac12$。\n\n**常背数值**：$\\Phi_0(1)=0.8413$，$\\Phi_0(1.645)=0.95$，$\\Phi_0(1.96)=0.975$，$\\Phi_0(2)=0.9772$，$\\Phi_0(3)=0.9987$。\n一倍、两倍、三倍标准差内约为 $0.6827,\\ 0.9545,\\ 0.9973$。\n\n**可加性**：$X\\sim N(\\mu_1,\\sigma_1^2)$、$Y\\sim N(\\mu_2,\\sigma_2^2)$ 独立 $\\Rightarrow X+Y\\sim N(\\mu_1+\\mu_2,\\sigma_1^2+\\sigma_2^2)$。\n\n**两步套路**（近年最爱考）：先用正态算出「单次合格概率」$p$，再把「$n$ 次中至少 $k$ 次合格」建成二项尾部。\n"},{"id":"K12","head":"考点 12","name":"综合应用","subtitle":"递推 · 停止规则 · 混合分布 · 最优化","notes":"\n**递推三步**：定义状态与初值 $\\to$ 对上一步用全概率列出一阶差分 $\\to$ 解不动点、作差化等比。\n\n两状态通用式（$a$＝上轮在同侧仍留、$b$＝上轮在对侧跳过来）：\n$$p_{n+1}=b+(a-b)p_n,\\qquad p_n=p^*+(a-b)^n(p_0-p^*),\\quad p^*=\\frac{b}{1-a+b}$$\n\n**赌徒输光**（总资金 $N$，起始 $i$，赢率 $p$）：\n$$W_i=\\begin{cases} \\dfrac iN, & p=\\dfrac12 \\\\[6pt] \\dfrac{1-(q/p)^i}{1-(q/p)^N}, & p\\ne\\dfrac12\\end{cases}$$\n\n**分赌本**：甲还需 $a$ 局、乙还需 $b$ 局，补齐 $a+b-1$ 局虚拟结果，甲赢当且仅当其中至少 $a$ 胜。\n\n**混合分布**：按来源加权\n$$F=\\sum w_iF_i,\\qquad S=\\sum w_iS_i,\\qquad E X=\\sum w_i\\mu_i$$\n反查来源时把 $S_i(t)$ 当似然用贝叶斯。\n\n**报童模型**：售价 $r$、进价 $c$，需求连续分布 $F$，最优进货量满足\n$$F(y^*)=\\frac{r-c}{r}$$\n即「临界分位点」。\n"},{"id":"MA","head":"模拟卷 A","name":"期中基准卷","subtitle":"12 单选 + 3 解答 · 100 分 · 90 分钟","notes":"\n**整卷结构**（与 24–25、25–26 两套真题一致）：\n\n- 一、单项选择题：12 题 × 5 分 = 60 分\n- 二、解答题：第 1 题 12 分、第 2 题 12 分、第 3 题 16 分 = 40 分\n- 总分 100 分，建议 90 分钟闭卷完成。\n\n**本卷定位**：把两章的基础题型完整走一遍，难度对标 24–25 卷。**先做这套摸底线**，再上 C、D、E 三套提高卷。\n\n**时间分配建议**：选择 35 分钟，解答 50 分钟，检查 5 分钟。\n\n**答题顺序**：先做会做的选择，把卡住的标记跳过；解答题按「13 → 14 → 15」顺序做，最后一道是连续型综合，分步给分，写一步得一步。\n"},{"id":"MB","head":"模拟卷 B","name":"期中基准卷（新题型）","subtitle":"12 单选 + 3 解答 · 100 分 · 90 分钟","notes":"\n**本卷定位**：对标 25–26 卷（线上机考版），题目场景更新，压轴题考 Pareto 分布。\n\n**与 A 卷的区别**：\n- 选择题更偏「判断哪个说法正确」，需要逐个验证，不能靠套公式；\n- 解答题第 1 题要求写出**样本空间**并用集合表示事件（新增题型，占分不少）；\n- 第 3 题是重尾分布，考「方差存在的参数条件」与对数变换，是本卷的分水岭。\n\n**得分策略**：\n- 前 10 题尽量全对（50 分）；\n- 解答第 1 题是送分题，样本空间写全就给分；\n- 第 3 题的 (a) 问几乎是白给（$6$ 分），(b)(c) 能写多少写多少。\n"},{"id":"MC","head":"模拟卷 C","name":"提高卷","subtitle":"多步综合 · 计算量加大 · 100 分 / 90 分钟","notes":"\n**本卷定位**：难度高于真题平均线，用来把「会做但不熟」的题型练到条件反射。\n\n**三个新增考点**：\n- 选择题第 2 题是**曲线与直线围面积的几何概型**，要解 $b\\le a^2$ 这种非线性不等式；\n- 第 4 题是**三门问题**，考条件概率的方向，答错的人多半把「主持人开门」当成随机事件；\n- 第 14 题是**递推**，必须自己写出一阶差分并解不动点。\n\n**做法建议**：\n- 限时 90 分钟，卡住的题超过 3 分钟就跳过；\n- 做完先别看解析，把错题重算一遍再看；\n- 若某题连续两次算错，回到对应考点把「梳理」那段重读一遍。\n\n**分数参照**：60 分以下说明基础题型还不熟，先回去做 A、B 卷；75 分以上可以上 E 卷。\n"},{"id":"MD","head":"模拟卷 D","name":"概念辨析卷","subtitle":"12 道判断型选择 · 专治「好像对」","notes":"\n**本卷定位**：不与计算较劲，专门拆概念。12 道选择题全部是「下列说法正确的是／错误的是」，覆盖历年卷子里出现频率最高的 12 组混淆点。\n\n**为什么单独做一套**：\n历年真题里，选择题失分的主因不是不会算，而是**概念边界模糊**——把「互斥」当「独立」、把「密度」当「概率」、把「不相关」当「独立」。这类错误一旦形成，计算再熟也会反复丢分。\n\n**做题方式**：\n- 每道题先在心里给每个选项判「对／错」，并想一个**反例**；\n- 想不出反例的选项，才算「可能是对的」；\n- 对完答案后，把错的那条抄到笔记本上，考前只看这一页。\n\n**配套**：本卷与考点梳理里的「易错清单」一一对应，做完再回看那几段，效果最好。\n"},{"id":"ME","head":"模拟卷 E","name":"冲刺卷","subtitle":"压轴难度 · 证明与建模 · 100 分 / 90 分钟","notes":"\n**本卷定位**：比真题难一档，题目多来自两章习题课的「综合题」与历年压轴。\n\n**四道题需要用「建模」而不是「套公式」**：\n- 第 1 题火柴盒（Banach 问题），要把「首次发现一盒空」翻译成路径计数；\n- 第 2 题赌徒输光，要解二阶差分方程；\n- 第 4 题泊松稀释，要会做无穷级数求和；\n- 第 15 题带无界支撑的密度，要判断广义积分收敛性。\n\n**分数参照**：能拿到 70 分以上，期中进前 20% 没问题；50–70 分说明综合能力够用，把错题吃透即可；50 分以下不必慌，先保证 A、B 两卷满分更划算。\n\n**使用建议**：这张卷子不要限时做第一遍，允许查笔记；第二遍再限时，效果更好。\n"},{"id":"MF","head":"模拟卷 F","name":"易错专项卷","subtitle":"12 个高频陷阱 · 每题都有「差一点」的干扰项","notes":"\n**本卷定位**：难度中等，但**每一题都埋了坑**。目的是把「会做却做错」的那部分分数捞回来。\n\n**十二个坑依次是**：\n1. 独立求差事件，误用 $P(A-B)=P(A)-P(B)$\n2. 正态标准化，除方差而不是除标准差\n3. 条件区间概率，忘记同时压缩分子分母\n4. 二项「至少一次」，忘记取补\n5. 指数参数是率不是均值\n6. 几何方差分母是 $p^2$\n7. 泊松取补时漏掉 $k=0$\n8. 均匀方差是 $\\dfrac{(b-a)^2}{12}$\n9. 三事件容斥漏掉 $+P(ABC)$\n10. 「至少一次」与「恰好一次」混淆\n11. 混合分布期望漏掉权重\n12. 条件概率方向做反\n\n**用法**：做完对答案，错的题在旁边写下「我踩的是第几个坑」。考前只看这十二行。\n"}],"questions":[{"id":"K1-1","type":"choice","stem":"设 $P(A)=0.6$，$P(B)=0.5$，$P(A\\cup B)=0.8$，则 $P(A-B)=$____。","options":[["A","$0.1$"],["B","$0.2$"],["C","$0.3$"],["D","$0.4$"]],"answer":"C","solution":"**第 1 步　先认清「$A-B$」到底指哪一块。**\n$A-B$ 读作「$A$ 发生而 $B$ 不发生」，写成集合就是 $A\\bar B$。它**不是**「$A$ 减掉整个 $B$」，而是「$A$ 里挖掉与 $B$ 重叠的那一块」。\n$$A-B=A\\bar B=A-AB$$\n\n**第 2 步　题目没给交集，先用加法公式把它反解出来。**\n$$P(A\\cup B)=P(A)+P(B)-P(AB)$$\n把已知代入：\n$$0.8=0.6+0.5-P(AB)\\ \\Rightarrow\\ P(AB)=1.1-0.8=0.3$$\n\n**第 3 步　再代减法公式。**\n$$P(A-B)=P(A)-P(AB)=0.6-0.3=0.3$$\n\n**第 4 步　用四格图整体核对（这一步能兜住所有算错）。**\n四个格子是：$AB$、$A\\bar B$、$\\bar AB$、$\\bar A\\bar B$，它们互斥且拼满全集。\n\n- $P(AB)=0.3$\n- $P(A\\bar B)=P(A)-P(AB)=0.6-0.3=0.3$ ← 本题所求\n- $P(\\bar AB)=P(B)-P(AB)=0.5-0.3=0.2$\n- $P(\\bar A\\bar B)=1-P(A\\cup B)=1-0.8=0.2$\n\n四格相加 $0.3+0.3+0.2+0.2=1$ ✓，说明没有任何一块算错。\n\n**错项是怎么来的**\n- $0.1$：写成了 $P(A)-P(B)=0.6-0.5$，把「重叠部分」当成了「整个 $B$」。\n- $0.2$：正好是 $P(\\bar AB)$，那是「只有 $B$」，方向反了。\n- $0.4$：把 $P(A\\cup B)-P(B)=0.8-0.5$ 当答案，那是「只有 $A$ 但不含 $AB$」的错误拼法。\n\n**一句话记住**：见到 $A-B$，先在草稿上写 $P(A)-P(AB)$，不要写 $P(A)-P(B)$。","pack":"K1"},{"id":"K1-2","type":"choice","stem":"设 $P(A)=0.5$，$P(B)=0.4$，$P(A\\cup B)=0.7$，则 $P(\\bar A\\,\\bar B)=$____。","options":[["A","$0.2$"],["B","$0.3$"],["C","$0.5$"],["D","$0.7$"]],"answer":"B","solution":"**第 1 步　先只盯着横线看，别急着算。**\n题目是 $\\bar A\\,\\bar B$：**两条短线**，一条盖 $A$、一条盖 $B$。它表示两个条件同时成立——\n「$A$ 不发生」**并且**「$B$ 不发生」。\n\n如果写成 $\\overline{AB}$（一条长线盖住整块 $AB$），意思完全不同：「$A$ 与 $B$ 同时发生」这件事不成立，也就是**至少有一个不发生**。\n\n**第 2 步　用一句大白话翻译成德摩根。**\n「$A$ 不发生且 $B$ 不发生」= 「$A$、$B$ 两个都没有」= 「并非『至少有一个发生』」，也就是\n$$\\bar A\\,\\bar B=\\overline{A\\cup B}$$\n\n**第 3 步　整体取补，一步出结果。**\n$$P(\\bar A\\,\\bar B)=P\\big(\\overline{A\\cup B}\\big)=1-P(A\\cup B)=1-0.7=0.3$$\n\n**第 4 步　换一条路验算（防「口诀记反」）。**\n先由加法公式得 $P(AB)=0.5+0.4-0.7=0.2$，再用四格恒等式\n$$P(\\bar A\\bar B)=1-P(A)-P(B)+P(AB)=1-0.5-0.4+0.2=0.3\\ ✓$$\n\n**第 5 步　顺手把「如果题目换成长线」算一遍，体会差别。**\n若问的是 $P(\\overline{AB})$（一条长线）：\n$$P(\\overline{AB})=1-P(AB)=1-0.2=0.8$$\n本题若答 $0.8$，就完全跑偏了——同一组数据，短线和长线差出 $0.5$，所以**记号看错必错，且错得很远**。\n\n**错项是怎么来的**\n- $0.2=P(AB)$：把「两个都不发生」当成了「两个都发生」。\n- $0.5=P(A)$：用不上 $B$ 的信息。\n- $0.7=P(A\\cup B)$：没取补，直接把并集概率搬过来——这正是把 $\\bar A\\bar B$ 与 $\\overline{AB}$ 混为一谈时的典型结果。\n\n**一句话记住**：**短线各自盖 $=$ 各自取反再取交；长线整块盖 $=$ 整体取反。** 前者算 $1-P(A\\cup B)$，后者算 $1-P(AB)$。","pack":"K1"},{"id":"K1-3","type":"choice","stem":"设 $P(A)=P(B)=P(C)=\\dfrac14$，$P(AB)=P(BC)=P(CA)=\\dfrac18$，$P(ABC)=\\dfrac1{16}$，则 $A,B,C$ 中**恰好一个**发生的概率为____。","options":[["A","$\\dfrac18$"],["B","$\\dfrac3{16}$"],["C","$\\dfrac14$"],["D","$\\dfrac5{16}$"]],"answer":"B","solution":"**第 1 步　把「恰好一个」拆成三块互斥的事件。**\n$$\\{\\text{恰好一个}\\}=\\{\\text{只 }A\\}\\cup\\{\\text{只 }B\\}\\cup\\{\\text{只 }C\\}$$\n三块互斥，所以概率可以直接相加。问题变成：怎么算「只 $A$」。\n\n**第 2 步　先算「只 $A$」：从 $A$ 出发，扣掉与别人重叠的部分。**\n$A$ 里面装了三类人：只订 $A$、$A$ 与 $B$ 重叠、$A$ 与 $C$ 重叠。于是先做\n$$P(A)-P(AB)-P(AC)$$\n但这一步有毛病：$ABC$ 那一块（三个都发生）既在 $AB$ 里、又在 $AC$ 里，被扣了**两次**，需要加回一次：\n$$P(\\text{只 }A)=P(A)-P(AB)-P(AC)+P(ABC)$$\n代入：\n$$=\\frac14-\\frac18-\\frac18+\\frac1{16}=\\frac4{16}-\\frac2{16}-\\frac2{16}+\\frac1{16}=\\frac1{16}$$\n\n**第 3 步　对称性：三个事件数据完全一样，所以三块相等。**\n$$P(\\text{恰好一个})=3\\times\\frac1{16}=\\frac3{16}$$\n\n**第 4 步　用 $S_1,S_2,S_3$ 简式复核（考场上更快）。**\n令 $S_1=\\sum P(\\text{单个})=\\frac34$，$S_2=\\sum P(\\text{两两交})=\\frac38$，$S_3=P(ABC)=\\frac1{16}$：\n$$\\text{恰好一个}=S_1-2S_2+3S_3=\\frac34-\\frac34+\\frac3{16}=\\frac3{16}\\ ✓$$\n\n**第 5 步　再验一次「拼得回去」。**\n恰好两个 $=S_2-3S_3=\\frac38-\\frac3{16}=\\frac3{16}$；三个都发生 $=\\frac1{16}$。三者相加\n$$\\frac3{16}+\\frac3{16}+\\frac1{16}=\\frac7{16}$$\n应当等于「至少一个」$=S_1-S_2+S_3=\\frac34-\\frac38+\\frac1{16}=\\frac7{16}$ ✓\n\n**错项是怎么来的**\n- $\\frac18$：只算了「只 $A$」一块，忘了乘 3。\n- $\\frac14$：算成了「至少两个」$=S_2-2S_3=\\frac38-\\frac18=\\frac14$。\n- $\\frac5{16}$：把 $S_1-2S_2$ 之外又多加了一次 $S_3$ 的系数（写成 $+4S_3$ 之类）。\n\n**一句话记住**：系数 $1,-2,+3$ 不是背出来的，是从「被扣两次要加回一次」推出来的；推一遍比背三遍牢。","pack":"K1"},{"id":"K1-4","type":"choice","stem":"设 $P(A)=0.5$，$P(B)=0.6$，$P(A\\mid\\bar B)=\\dfrac14$，则 $P(AB)=$____。","options":[["A","$0.2$"],["B","$0.3$"],["C","$0.4$"],["D","$0.5$"]],"answer":"C","solution":"**第 1 步　写出条件概率的定义式，别凭感觉。**\n$$P(A\\mid\\bar B)=\\frac{P(A\\bar B)}{P(\\bar B)}$$\n这就是「已知 $B$ 不发生，$A$ 发生的概率」。分母是 $\\bar B$，**不是** $B$。\n\n**第 2 步　把分母算出来。**\n$$P(\\bar B)=1-P(B)=1-0.6=0.4$$\n\n**第 3 步　反解分子（交集）。**\n$$P(A\\bar B)=P(\\bar B)\\cdot P(A\\mid\\bar B)=0.4\\times\\frac14=0.1$$\n读法：「$A$ 发生」这件事里，落在「$B$ 不发生」那一侧的部分占 $0.1$。\n\n**第 4 步　把 $A$ 切成互斥的两块，解出 $AB$。**\n$A$ 要么与 $B$ 同时发生，要么与 $B$ 不同时发生，没有第三种：\n$$A=A\\bar B\\ \\cup\\ AB\\quad(\\text{两块互斥})$$\n$$P(A)=P(A\\bar B)+P(AB)\\ \\Rightarrow\\ P(AB)=0.5-0.1=0.4$$\n\n**第 5 步　四格图核对。**\n- $P(AB)=0.4$\n- $P(A\\bar B)=0.1$\n- $P(\\bar AB)=P(B)-P(AB)=0.6-0.4=0.2$\n- $P(\\bar A\\bar B)=P(\\bar B)-P(A\\bar B)=0.4-0.1=0.3$\n\n合计 $0.4+0.1+0.2+0.3=1$ ✓；且 $P(A\\cup B)=0.7\\le1$ ✓。\n\n**错项是怎么来的**\n- $0.2$：把 $P(\\bar AB)=0.2$ 当答案，那是「只有 $B$」。\n- $0.3$：把 $P(\\bar A\\bar B)=0.3$ 当答案，那是「两个都不发生」。\n- $0.5$：直接抄了 $P(A)$，等于认为 $A\\bar B$ 概率为 0。\n\n**最典型的错法**：把分母写成 $P(B)=0.6$，得 $P(A\\bar B)=0.15$，于是 $P(AB)=0.35$——四个选项里根本没有 $0.35$，这是命题人留的「镜子」，照一下就知错了。\n\n**一句话记住**：条件概率的分母**永远是竖线后面那个事件**，哪怕它是带横线的。","pack":"K1"},{"id":"K1-5","type":"judge","stem":"若 $P(A)=P(B)=1$，则必有 $P(AB)=1$。","answer":"对","solution":"**第 1 步　把要证的结论换个等价说法。**\n$P(AB)=1$ 等价于 $P(\\overline{AB})=0$（一条长线，整块取补）。所以只需证明「$A,B$ 不同时发生」的概率是 0。\n\n**第 2 步　用德摩根把长线拆成两条短线。**\n$$\\overline{AB}=\\bar A\\cup\\bar B$$\n读法：「$A$、$B$ 不同时发生」=「$A$ 不发生，或者 $B$ 不发生」。这一步正是把长线换成短线的标准动作。\n\n**第 3 步　用「并集不超过概率之和」压住它。**\n$$P(\\bar A\\cup\\bar B)\\le P(\\bar A)+P(\\bar B)$$\n已知 $P(A)=1\\Rightarrow P(\\bar A)=0$，$P(B)=1\\Rightarrow P(\\bar B)=0$，故\n$$P(\\overline{AB})\\le 0+0=0$$\n概率非负，所以 $P(\\overline{AB})=0$。\n\n**第 4 步　回到原式。**\n$$P(AB)=1-P(\\overline{AB})=1-0=1\\ ✓$$\n\n**第 5 步　检查有没有偷用条件。**\n全程只用了「并集次可加」$P(X\\cup Y)\\le P(X)+P(Y)$ 与「取补」，**没有**用到 $A,B$ 独立，也没有用到任何包含关系。所以结论对任意两个概率为 1 的事件都成立。\n\n**延伸（判断题常连着问）**：$P(AB)=1$ 推不出 $AB=\\Omega$。概率 1 只表示「几乎必然」，允许差一个零概率的集合。","pack":"K1"},{"id":"K1-6","type":"judge","stem":"若 $P(A\\mid B)+P(A\\mid\\bar B)=1$（$0<P(B)<1$），则 $A$ 与 $B$ 相互独立。","answer":"错","solution":"**第 1 步　先把「独立」的判据写在纸上，别用感觉。**\n$$A,B\\text{ 独立}\\iff P(AB)=P(A)P(B)$$\n要否定这句话，只需造一组数：满足题设等式，但**不满足**上面的乘积式。\n\n**第 2 步　造数：取 $P(B)=0.5$，$P(A\\mid B)=0.2$，$P(A\\mid\\bar B)=0.8$。**\n先检查题设：$0.2+0.8=1$ ✓，条件满足。\n\n**第 3 步　算 $P(AB)$。**\n$$P(AB)=P(B)P(A\\mid B)=0.5\\times0.2=0.1$$\n\n**第 4 步　算 $P(A)$，用全概率把两种情形合起来。**\n$$P(A)=P(B)P(A\\mid B)+P(\\bar B)P(A\\mid\\bar B)=0.5\\times0.2+0.5\\times0.8=0.1+0.4=0.5$$\n\n**第 5 步　对比。**\n$$P(A)P(B)=0.5\\times0.5=0.25\\ \\ne\\ 0.1=P(AB)$$\n所以**不独立**，题干说法错误。\n\n**第 6 步　想清楚「为什么直觉会错」——问题出在竖线后面。**\n正确的那条等式是\n$$P(A\\mid B)+P(\\bar A\\mid B)=1$$\n竖线后面是**同一个**事件 $B$，这不过是「条件概率也是概率」：在 $B$ 这个新世界里，$A$ 与 $\\bar A$ 是对立的。\n而本题把竖线后面换成了 $B$ 与 $\\bar B$，相当于把**两个不同世界**里的概率相加，它们凭什么等于 1？上面第 2 步已经给出反例：$0.2$ 与 $0.8$ 恰好凑成 1，纯属人为设定。\n\n**第 7 步　那独立到底该怎么写？三条等价，任选其一。**\n$$P(AB)=P(A)P(B)\\iff P(A\\mid B)=P(A)\\iff P(A\\mid B)=P(A\\mid\\bar B)$$\n注意第三条是「**两个条件概率相等**」，不是「相加等于 1」。一字之差，结论相反。\n\n**补充（记下来能省一道题）**：若题目改为 $P(A\\mid B)=P(A\\mid\\bar B)$，则由全概率可证 $P(A)$ 等于这个公共值，从而独立——所以那条是真命题。","pack":"K1"},{"id":"K1-7","type":"fill","stem":"设 $A,B$ 相互独立，$P(A)=0.5$，$P(A\\cup B)=0.8$，求 $P(B)$。","fields":[{"label":"$P(B)$","a":"0.6","kind":"num"}],"solution":"**第 1 步　设未知量。** 令 $P(B)=p$。\n\n**第 2 步　把「独立」翻译成可代入的等式。**\n$$P(AB)=P(A)P(B)=0.5p$$\n\n**第 3 步　把三个量一起塞进加法公式。**\n$$P(A\\cup B)=P(A)+P(B)-P(AB)$$\n$$0.8=0.5+p-0.5p$$\n\n**第 4 步　解这个一元一次方程。**\n$$0.5+0.5p=0.8\\ \\Rightarrow\\ 0.5p=0.3\\ \\Rightarrow\\ p=0.6$$\n\n**第 5 步　回代验算两个条件。**\n- 加法公式：$P(AB)=0.5\\times0.6=0.3$，$P(A\\cup B)=0.5+0.6-0.3=0.8$ ✓\n- 独立性：$P(AB)=0.3$，$P(A)P(B)=0.5\\times0.6=0.3$ ✓\n\n**第 6 步　顺手看看「如果误当成互斥会怎样」。**\n互斥时 $P(A\\cup B)=P(A)+P(B)$，得 $p=0.3$。代回去 $P(AB)=0$，与独立要求的 $0.15$ 冲突——所以 $0.3$ 是典型错答。区别就在于：互斥是「减 0」，独立是「减乘积」。\n\n**一句话记住**：这类题只有一条通路——独立写成乘积，代进加法公式，解一元一次方程。不要试图先猜 $P(B)$。","pack":"K1"},{"id":"K1-8","type":"subjective","points":10,"stem":"某单位职工订阅报纸，设 $A,B,C$ 分别表示订阅甲、乙、丙三种报纸。已知\n$$P(A)=0.45,\\ P(B)=0.35,\\ P(C)=0.30,\\ P(AB)=0.10,\\ P(AC)=0.08,\\ P(BC)=0.05,\\ P(ABC)=0.03$$\n求：(1) 恰好订阅一种的概率；(2) 恰好订阅两种的概率；(3) 至少订阅一种的概率；(4) 一种也不订阅的概率；(5) 在至少订阅一种的条件下，恰好订阅两种的条件概率。","solution":"**第 0 步　先把给定的七个数摆好，按「阶」分层。**\n- 一阶（单个）：$0.45,\\ 0.35,\\ 0.30$\n- 二阶（两两交）：$0.10,\\ 0.08,\\ 0.05$\n- 三阶（三重交）：$0.03$\n\n**关键认识**：题目给的 $P(AB)=0.10$ 是「订甲乙」的全部人，**包含**了也订丙的那 $0.03$。凡是问「恰好」，就必须先往下剥一层。\n\n**(1) 恰好一种。** 以「只订甲」为例，从 $P(A)$ 出发：\n$$P(\\text{只甲})=P(A)-P(AB)-P(AC)+P(ABC)$$\n$$=0.45-0.10-0.08+0.03=0.30$$\n为什么要 $+0.03$：$ABC$ 那块既在 $AB$ 里又在 $AC$ 里，被减了两次，要补回一次。\n对称地\n$$P(\\text{只乙})=0.35-0.10-0.05+0.03=0.23,\\qquad P(\\text{只丙})=0.30-0.08-0.05+0.03=0.20$$\n$$P(\\text{恰好一种})=0.30+0.23+0.20=0.73$$\n\n**(2) 恰好两种。** 「订甲乙但不订丙」就是把 $AB$ 里的三重交剥掉：\n$$P(\\text{只甲乙})=P(AB)-P(ABC)=0.10-0.03=0.07$$\n同理 $P(\\text{只甲丙})=0.08-0.03=0.05$，$P(\\text{只乙丙})=0.05-0.03=0.02$。\n$$P(\\text{恰好两种})=0.07+0.05+0.02=0.14$$\n\n**(3) 至少一种。** 三事件容斥，符号 $+-+-$：\n$$P(A\\cup B\\cup C)=0.45+0.35+0.30-0.10-0.08-0.05+0.03$$\n$$=1.10-0.23+0.03=0.90$$\n\n**(4) 一种也不订。** 取补即可：\n$$1-0.90=0.10$$\n这个数正是 $P(\\bar A\\bar B\\bar C)$，也等于 $\\overline{A\\cup B\\cup C}$——又一次用到「长线整体取补」。\n\n**(5) 条件概率。** 分母是条件事件，分子是交集（恰两种本身已含在「至少一种」里，故交集就是它自己）：\n$$P(\\text{恰两种}\\mid\\text{至少一种})=\\frac{0.14}{0.90}=\\frac7{45}\\approx0.1556$$\n\n**第 6 步　整体验算（务必养成习惯）。**\n$$0.73\\ (\\text{恰一})+0.14\\ (\\text{恰二})+0.03\\ (\\text{三科全订})=0.90$$\n与 (3) 的并集概率吻合 ✓；再加上 (4) 的 $0.10$，合计 $1$ ✓。\n\n**错项与失分点**\n- 直接写 $0.45+0.35+0.30-0.10-0.08-0.05=0.87$：漏了最后 $+0.03$。\n- 把 $P(AB)=0.10$ 当成「只订甲乙」，于是恰好两种算成 $0.10+0.08+0.05=0.23$——这是本题第一大坑。\n- 第 (5) 问分母写成 $1$，得 $0.14$。\n\n**一句话记住**：题目给的交集都「带上面的人」，问「恰好」就要一层层往下剥，剥的时候记住「减两次的地方要补回一次」。","pack":"K1"},{"id":"K2-1","type":"choice","stem":"8 个人独立地等可能进入 10 个房间（每个房间可容纳任意多人），则每个房间**至多一人**的概率为____。","options":[["A","$\\dfrac{A_{10}^{8}}{10^{8}}$"],["B","$\\dfrac{C_{10}^{8}}{10^{8}}$"],["C","$\\dfrac{8!}{10^{8}}$"],["D","$\\dfrac{10^{8}}{A_{10}^{8}}$"]],"answer":"A","solution":"**分母**：每人有 10 种选择，8 人独立，共 $10^8$ 种（放回、有序）。\n\n**分子**：要求 8 人占据 8 个**不同**房间。先选出 8 个房间并分配给人——这就是「不放回、有序」的排列数\n$$A_{10}^{8}=10\\times9\\times8\\times\\cdots\\times3$$\n\n**答案**：$\\dfrac{A_{10}^{8}}{10^{8}}=\\dfrac{1814400}{10^{8}}\\approx0.0181$。\n\n**辨析三个干扰项**：\n- $C_{10}^{8}$：只选了房间没安排人，少乘 $8!$。\n- $8!$：默认前 8 个房间，漏掉了「选哪 8 间」。\n- 倒数：概率不可能大于 1。\n\n**口诀**：分房问题，分母一律 $m^n$；分子看「是否允许同房」——允许就用幂，不允许就用排列。","pack":"K2"},{"id":"K2-2","type":"choice","stem":"同时掷两枚均匀骰子，点数和为 4 的倍数的概率为____。","options":[["A","$\\dfrac16$"],["B","$\\dfrac14$"],["C","$\\dfrac13$"],["D","$\\dfrac5{18}$"]],"answer":"B","solution":"**样本空间**：$6\\times6=36$ 个有序结果。\n\n**点数和为 4 的倍数** 只有 $4,8,12$ 三种（最小 2，最大 12）。\n\n逐个计数（按第一个骰子的点数枚举）：\n- 和为 4：$(1,3),(2,2),(3,1)$ —— 3 个\n- 和为 8：$(2,6),(3,5),(4,4),(5,3),(6,2)$ —— 5 个\n- 和为 12：$(6,6)$ —— 1 个\n\n合计 $3+5+1=9$，故\n$$P=\\frac9{36}=\\frac14$$\n\n**通用公式**（值得记）：两骰和为 $s$ 的概率为 $\\dfrac{6-|s-7|}{36}$，$2\\le s\\le12$。\n代 $s=4$：$\\dfrac{6-3}{36}=\\dfrac3{36}$；$s=8$：$\\dfrac{6-1}{36}=\\dfrac5{36}$；$s=12$：$\\dfrac{6-5}{36}=\\dfrac1{36}$。\n\n**易错**：把「和为 4 的倍数」漏掉 12，或误以为 16 也算（不可能）。","pack":"K2"},{"id":"K2-3","type":"choice","stem":"从 $1,2,\\dots,9$ 中等可能且不放回地取 3 个数，则这 3 个数的乘积为**偶数**的概率为____。","options":[["A","$\\dfrac5{21}$"],["B","$\\dfrac{11}{21}$"],["C","$\\dfrac{37}{42}$"],["D","$\\dfrac34$"]],"answer":"C","solution":"**取补最快**：乘积为奇数 $\\Leftrightarrow$ 三个数**全是奇数**。\n\n$1\\sim9$ 中奇数有 $1,3,5,7,9$ 共 5 个，偶数 4 个。总取法\n$$\\binom{9}{3}=\\frac{9\\times8\\times7}{3\\times2\\times1}=84$$\n三个全奇数的取法 $\\binom{5}{3}=10$，故\n$$P(\\text{乘积为奇数})=\\frac{10}{84}=\\frac5{42}$$\n$$P(\\text{乘积为偶数})=1-\\frac5{42}=\\frac{37}{42}\\approx0.881$$\n\n**为什么不直接数偶数**：乘积为偶等价于「至少一个偶数」，要分「恰 1 个、恰 2 个、恰 3 个偶数」三种情况相加，容易漏。**「至少」一律先取补。**\n\n**顺带核对**：恰 1 偶 $\\binom41\\binom52=40$，恰 2 偶 $\\binom42\\binom51=30$，恰 3 偶 $\\binom43=4$，合计 $74$，$\\dfrac{74}{84}=\\dfrac{37}{42}$ ✓。","pack":"K2"},{"id":"K2-4","type":"choice","stem":"8 个人随机排成一排，则甲、乙两人之间**恰好**隔着 2 个人的概率为____。","options":[["A","$\\dfrac5{28}$"],["B","$\\dfrac3{14}$"],["C","$\\dfrac14$"],["D","$\\dfrac27$"]],"answer":"A","solution":"**方法一（位置法）**：甲乙占两个位置，共有 $8\\times7=56$ 种有序占位。要让两人之间隔 2 人，位置差必须为 3：\n$$(1,4),(2,5),(3,6),(4,7),(5,8)\\ \\text{共 }5\\ \\text{对，甲乙可互换}\\ \\Rightarrow\\ 2\\times5=10\\ \\text{种}$$\n$$P=\\frac{10}{56}=\\frac5{28}$$\n\n**方法二（公式）**：$n$ 人一排、间隔恰 $k$ 人的概率为\n$$\\frac{2(n-k-1)}{n(n-1)}$$\n代 $n=8,k=2$：$\\dfrac{2\\times5}{56}=\\dfrac5{28}$ ✓。\n\n**易错**：\n- 只数了 5 对却忘了乘 2（甲乙位置可交换）——这是最常见的失分点。\n- 把「间隔 2 人」理解成位置差为 2。\n\n**记忆**：位置差 $=k+1$；可用起点数 $=n-(k+1)$。","pack":"K2"},{"id":"K2-5","type":"judge","stem":"从 5 双不同的鞋（共 10 只）中任取 4 只，则「恰好配成一双」的概率为 $\\dfrac47$。","answer":"对","solution":"**总数**：$\\binom{10}{4}=210$。\n\n**恰好一双**分三步：\n- 选出「配成的那一双」：$\\binom51=5$ 种；\n- 剩下 4 双中选 2 双（这两双各只取 1 只，保证不再成双）：$\\binom42=6$ 种；\n- 这 2 双中各取左脚或右脚：$2^2=4$ 种。\n\n$$5\\times6\\times4=120,\\qquad P=\\frac{120}{210}=\\frac47\\approx0.571$$\n\n**为什么不重复计数**：题目说「恰好一双」，所以另外两只必须来自不同双，第 2 步选 2 双 + 第 3 步各取一只，恰好保证这一点，既不重也不漏。\n\n**同类题速记**：把「双」看成「组」，先从组中选出成双的，再从剩余组中「每组至多取一只」。","pack":"K2"},{"id":"K2-6","type":"judge","stem":"$n$ 个人（$n\\ge3$）随机围成一圈，则甲、乙相邻的概率为 $\\dfrac1{n-1}$。","answer":"错","solution":"**正确结果是 $\\dfrac{2}{n-1}$。**\n\n**推导**：$n$ 人圆排列共 $(n-1)!$ 种。把甲乙捆成一块，与其余 $n-2$ 人一起排成圆，共 $(n-2)!$ 种；块内甲乙可互换，乘 2。故\n$$P=\\frac{2(n-2)!}{(n-1)!}=\\frac{2}{n-1}$$\n\n**更快的想法**：先固定甲的位置（圆排列可以旋转），乙在剩下 $n-1$ 个位置中等可能，其中与甲相邻的有 2 个，直接得 $\\dfrac{2}{n-1}$。\n\n**什么时候才是 $\\dfrac1{n-1}$**：若题目额外规定「乙必须坐在甲的**顺时针**相邻位」，那只有 1 个有利位置，概率才是 $\\dfrac1{n-1}$。**「相邻」默认两侧都算。**\n\n**数值感**：$n=6$ 时为 $0.4$，不是 $0.2$——这个差别在选择题里足够致命。","pack":"K2"},{"id":"K2-7","type":"fill","stem":"5 封信随机装入 5 个写好地址的信封（每封一信），求**恰好有 2 封**装对的概率。","fields":[{"label":"$P$","a":"1/6","kind":"num","alt":["0.1667","20/120"]}],"solution":"**总数**：$5!=120$。\n\n**恰好 2 封装对**分两步：\n- 先选出哪 2 封装对：$\\binom52=10$ 种；\n- 剩下 3 封**全部装错**（错排）：$D_3=2$ 种（三元素的错排只有两个：$2,3,1$ 与 $3,1,2$）。\n\n$$P=\\frac{10\\times2}{120}=\\frac{20}{120}=\\frac16$$\n\n**错排数列**（值得背前五个）：$D_1=0,\\ D_2=1,\\ D_3=2,\\ D_4=9,\\ D_5=44$。\n\n**易错**：只算 $\\dfrac{2}{120}$ —— 忘了先选出「哪 2 封装对」；或写成 $\\dfrac{10}{120}$ —— 忘了剩下的必须**全错**（若允许再对一封，就不是「恰好 2 封」了）。\n\n**推广**：恰 $k$ 封装对的概率为 $\\dfrac{\\binom nk D_{n-k}}{n!}$。","pack":"K2"},{"id":"K2-8","type":"subjective","points":10,"stem":"袋中有 6 个红球、4 个白球，共 10 个球，除颜色外完全相同。\n(1) 不放回地一次取出 4 个，求恰好取到 2 个红球的概率；\n(2) 不放回地逐个抽取，求「第 3 次才首次取到红球」的概率；\n(3) 不放回地逐个抽取，求第 4 次取到红球的概率。","solution":"**(1) 组合计数（一次取 4 个，不讲顺序）**\n$$P=\\frac{\\binom62\\binom42}{\\binom{10}{4}}=\\frac{15\\times6}{210}=\\frac{90}{210}=\\frac37$$\n\n其中 $\\binom{10}{4}=210$ 是所有取法，分子是「从 6 红中取 2、从 4 白中取 2」。\n\n**(2) 乘法链（讲顺序，用条件概率）**\n「第 3 次才首次取到红」即前两次都是白、第 3 次是红：\n$$P=\\frac{4}{10}\\times\\frac{3}{9}\\times\\frac{6}{8}=\\frac{72}{720}=\\frac1{10}$$\n\n**注意分母的变化**：$10\\to9\\to8$，每抽一次总数减少 1；分子也跟着颜色走（白球 $4\\to3$，红球仍是 6）。\n若写成 $\\dfrac{4}{10}\\times\\dfrac{4}{10}\\times\\dfrac{6}{10}$，那就是「有放回」，结论完全不同。\n\n**(3) 抽签的边际性**\n第 4 次取到红球的概率就是红球占比：\n$$P=\\frac6{10}=\\frac35$$\n\n**严谨验证**：把 10 个球随机排成一列，第 4 个位置上的球在 10 个位置中对称，因此是 6 个红球之一的机会为 $\\dfrac6{10}$。\n也可用全概率硬算：前 3 次抽走 $k$ 个红球（$k=0,1,2,3$）的概率乘以剩余红球比例，逐项相加仍得 $\\dfrac35$，但没必要。\n\n**本题要点**：**「第几次取到什么」的概率与次序无关（边际），但「前几次都是什么」的条件概率与次序强相关。** 这一条几乎每年都考。","pack":"K2"},{"id":"K3-1","type":"choice","stem":"甲、乙两人约定在 0 到 60 分钟内独立地等可能到达某地，先到者等待 20 分钟便离开。则两人能见面的概率为____。","options":[["A","$\\dfrac13$"],["B","$\\dfrac49$"],["C","$\\dfrac59$"],["D","$\\dfrac23$"]],"answer":"C","solution":"**建模**：设到达时刻为 $X,Y\\sim U(0,60)$ 且独立，样本空间是 $60\\times60$ 的正方形，面积 $3600$。\n\n**事件**：$|X-Y|\\le20$，即正方形中夹在两条平行线 $Y=X+20$ 与 $Y=X-20$ 之间的带子。\n\n**取补更快**：不能见面是两个等腰直角三角形\n$$\\{|X-Y|>20\\}\\ \\text{的面积为}\\ 2\\times\\frac{(60-20)^2}{2}=(40)^2=1600$$\n$$P(\\text{见面})=1-\\frac{1600}{3600}=1-\\frac49=\\frac59$$\n\n**通用公式**：窗口 $T$、等待 $d$，则 $P=1-\\left(\\dfrac{T-d}{T}\\right)^2$。本题 $1-\\left(\\dfrac{40}{60}\\right)^2=\\dfrac59$ ✓。\n\n**变式警告**：若题目问「甲先到且等到乙」的概率，就只取**一条**三角形，答案再除以 2，即 $\\dfrac29$。这是最容易看错的一类。","pack":"K3"},{"id":"K3-2","type":"choice","stem":"在长度为 1 的线段上独立均匀地取两个点，把线段分成三段，则**至少有一段**长度小于 $\\dfrac14$ 的概率为____。","options":[["A","$\\dfrac{15}{16}$"],["B","$\\dfrac78$"],["C","$\\dfrac34$"],["D","$\\dfrac12$"]],"answer":"A","solution":"**建模**：设两点为 $x<y$（无序两点按大小记），样本区域是三角形 $0<x<y<1$，面积 $\\dfrac12$。三段长为 $x,\\ y-x,\\ 1-y$。\n\n**取补**：先求「三段都不小于 $\\dfrac14$」的概率。条件为\n$$x\\ge\\frac14,\\quad y\\ge x+\\frac14,\\quad y\\le\\frac34$$\n有利区域：$x$ 从 $\\dfrac14$ 到 $\\dfrac12$，$y$ 从 $x+\\dfrac14$ 到 $\\dfrac34$，面积\n$$\\int_{1/4}^{1/2}\\left(\\frac34-x-\\frac14\\right)dx=\\int_{1/4}^{1/2}\\left(\\frac12-x\\right)dx=\\frac1{32}$$\n$$P(\\text{都不小于 }\\tfrac14)=\\frac{1/32}{1/2}=\\frac1{16}$$\n\n**所求**：\n$$P\\left(\\text{至少一段}<\\frac14\\right)=1-\\frac1{16}=\\frac{15}{16}$$\n\n**最容易错的地方**：把总区域当成单位正方形（面积 1）。两点无序时必须用三角形区域（面积 $\\dfrac12$），因为 $(x,y)$ 与 $(y,x)$ 是同一组断点，不能重复计数。","pack":"K3"},{"id":"K3-3","type":"choice","stem":"在长度为 $l$ 的棒上独立均匀地取两个断点，则三段能构成三角形的概率为____。","options":[["A","$\\dfrac18$"],["B","$\\dfrac13$"],["C","$\\dfrac38$"],["D","$\\dfrac14$"]],"answer":"D","solution":"**建模**：断点记为 $x<y$，三段为 $x,\\ y-x,\\ l-y$，样本区域是三角形 $0<x<y<l$，面积 $\\dfrac{l^2}{2}$。\n\n**成三角形的条件**：每段都小于 $\\dfrac l2$：\n$$x<\\frac l2,\\qquad y-x<\\frac l2\\ (\\Leftrightarrow y<x+\\tfrac l2),\\qquad y>\\frac l2$$\n\n有利区域是一个顶点为 $\\left(\\dfrac l2,\\dfrac l2\\right)$、$\\left(0,\\dfrac l2\\right)$、$\\left(\\dfrac l2,l\\right)$ 的小三角形，面积 $\\dfrac{l^2}{8}$。\n\n$$P=\\frac{l^2/8}{l^2/2}=\\frac14$$\n\n**几何直觉**：三段能围成三角形当且仅当「没有一段超过一半」。这里的 $1/4$ 是全课程最著名的几何概型结论之一，建议直接背。\n\n**常见错法**：用正方形 $[0,l]^2$ 作总区域，得 $\\dfrac{1}{8}$——错在把两个断点的顺序当成了可区分。","pack":"K3"},{"id":"K3-4","type":"choice","stem":"在正方形 $[0,2]\\times[0,2]$ 内独立均匀地取一点 $(X,Y)$，则 $|X-Y|<1$ 的概率为____。","options":[["A","$\\dfrac34$"],["B","$\\dfrac23$"],["C","$\\dfrac12$"],["D","$\\dfrac78$"]],"answer":"A","solution":"**总区域**：边长 2 的正方形，面积 $4$。\n\n**事件** $|X-Y|<1$ 是夹在 $Y=X+1$ 与 $Y=X-1$ 之间的带子。取补更简单：$|X-Y|\\ge1$ 是左上、右下两个等腰直角三角形，直角边长为 $2-1=1$：\n$$\\text{面积}=2\\times\\frac{1\\times1}{2}=1$$\n$$P=1-\\frac14=\\frac34$$\n\n**核对带子面积**：$4-1=3$，占 $\\dfrac34$ ✓。\n\n**通用式**：$[0,L]^2$ 中 $|X-Y|<d$ 的概率为 $1-\\left(1-\\dfrac dL\\right)^2$。本题 $L=2,d=1$ 得 $1-\\dfrac14=\\dfrac34$ ✓。\n\n**与会面问题的关系**：同一个公式，只是把「等待时间」换成了「距离差」。","pack":"K3"},{"id":"K3-5","type":"judge","stem":"几何概型中，若某事件的概率为 0，则该事件一定是不可能事件。","answer":"错","solution":"**反例**：在 $[0,1]$ 上均匀取一点，事件 $A=\\{$取到的点恰为 $0.5\\}$。单点区域长度为 0，故 $P(A)=0$；但 $A$ 非空，取到 $0.5$ 并非逻辑上不可能。\n\n**正确表述**：\n- 概率为 0 $\\nRightarrow$ 不可能事件；\n- 概率为 1 $\\nRightarrow$ 必然事件（叫「几乎必然」）。\n\n**只有离散情形才等价**：当样本空间至多可列且每个样本点概率为正时，$P(A)=0$ 才等价于 $A=\\varnothing$。\n\n**同类陷阱**：连续型随机变量 $P(X=a)=0$，但 $\\{X=a\\}$ 完全可能发生；连续型的密度 $f(a)$ 可以大于 1（如 $U(0,0.1)$ 的密度为 10）。","pack":"K3"},{"id":"K3-6","type":"judge","stem":"在 $[0,2]\\times[0,2]$ 内独立均匀取点 $(X,Y)$，则 $P(X+Y<1)=\\dfrac18$。","answer":"对","solution":"**区域**：$X+Y<1$ 是正方形左下角、直角边长为 1 的等腰直角三角形，面积\n$$\\frac12\\times1\\times1=\\frac12$$\n总面积 $4$，故\n$$P=\\frac{1/2}{4}=\\frac18$$\n\n**不是 $\\dfrac12$**：只有当样本空间是 $[0,1]^2$ 时答案才是 $\\dfrac12$。本题分母是 4，很容易被忽略。\n\n**本题的教训**：几何概型第一步永远是**写清总区域的度量**，而不是先算分子。历年卷子里因分母写错而丢分的比例极高。","pack":"K3"},{"id":"K3-7","type":"fill","stem":"在圆周上任取三个点，求这三个点构成**锐角三角形**的概率。","fields":[{"label":"$P$","a":"1/4","kind":"num","alt":["0.25"]}],"solution":"**关键结论**：圆周上三点构成锐角三角形 $\\Leftrightarrow$ 三点**不落在同一半圆内**。\n\n**推导**：固定第一个点 $A$（圆的对称性允许）。另外两点 $B,C$ 各自独立、均匀地落在圆周上。三角形为钝角或直角 $\\Leftrightarrow$ 存在一条直径使三点全在同一侧开半圆内。\n\n设 $B$ 相对 $A$ 的弧角为 $\\alpha$（$0<\\alpha<2\\pi$）。为使 $A,B,C$ 都在某个半圆内，$C$ 必须落在一个长度为 $\\pi$ 的弧上。按 $\\alpha$ 分情况对 $\\alpha$ 积分（或直接利用结论），可得钝角（含直角）情形总概率为 $\\dfrac34$。\n\n**因此**\n$$P(\\text{锐角})=\\frac14$$\n\n**直观检验**：直角三角形的概率为 0（要求 $AB$ 恰为直径），所以「锐角 $1/4$、钝角 $3/4$」正好互补。\n\n**记忆**：圆周三点 → 锐角 $1/4$；这题几乎是几何概型的「标配」结论。","pack":"K3"},{"id":"K3-8","type":"subjective","points":10,"stem":"设 $a>0$ 为常数。某点在半圆区域\n$$\\Omega=\\left\\{(x,y)\\ \\middle|\\ 0\\le x\\le 2a,\\ 0\\le y\\le\\sqrt{2ax-x^{2}}\\right\\}$$\n内随机抛掷（落在任何子区域的概率与该子区域面积成正比）。求原点与该点的连线与 $x$ 轴夹角小于 $\\dfrac{\\pi}{4}$ 的概率。","solution":"**第一步：把区域认出来。** $y\\le\\sqrt{2ax-x^2}$ 两边平方得 $(x-a)^2+y^2\\le a^2$，再配上 $y\\ge0$，所以 $\\Omega$ 是圆心 $(a,0)$、半径 $a$ 的**上半圆**，面积\n$$m(\\Omega)=\\frac{\\pi a^2}{2}$$\n\n**第二步：把「夹角」翻译成不等式。** 设点为 $(x,y)$，与 $x$ 轴夹角 $\\theta$ 满足 $\\tan\\theta=\\dfrac yx$（$x>0$）。于是\n$$\\theta<\\frac{\\pi}{4}\\iff y<x$$\n\n**第三步：算有利区域面积。** 按 $x$ 切片，上边界为 $y_1=\\sqrt{2ax-x^2}$，下边界为 $y=0$，直线为 $y=x$。\n\n比较 $y_1$ 与 $x$：$2ax-x^2\\ge x^2\\iff x\\le a$。所以\n- $0\\le x\\le a$ 时，$y=x$ 在圆内，纵向可用长度为 $x$；\n- $a\\le x\\le 2a$ 时，整条竖线 $0\\le y\\le y_1$ 都满足 $y<x$，长度就是 $y_1$。\n\n$$m=\\int_0^a x\\,dx+\\int_a^{2a}\\sqrt{2ax-x^2}\\,dx=\\frac{a^2}{2}+\\frac{\\pi a^2}{4}$$\n\n第二个积分是圆心在 $(a,0)$、半径 $a$ 的圆在 $x\\in[a,2a]$ 上的右上四分之一圆，面积 $\\dfrac{\\pi a^2}{4}$。\n\n**第四步：作比。**\n$$P=\\frac{\\dfrac{a^2}{2}+\\dfrac{\\pi a^2}{4}}{\\dfrac{\\pi a^2}{2}}=\\frac{1}{\\pi}+\\frac12\\approx0.818$$\n\n**几何检验**：$P>1/2$ 是合理的——$\\theta<\\pi/4$ 的扇形是圆的 $1/8$，但半圆本身就只占圆的一半，占比被放大了一倍，再加直线右侧那一块，正好落在 0.82 附近。\n\n**易错点**：\n- 直接用量角器式想法写 $\\dfrac{\\pi/4}{\\pi}=\\dfrac14$：错，因为角不是均匀分布的（区域均匀才是前提）。\n- 只算到圆心的 $x\\le a$ 那一段，漏掉 $a\\le x\\le2a$ 的整块。\n- 忘记除以**半圆**面积而除以整圆面积，得 $\\dfrac1\\pi+\\dfrac14\\cdot\\dfrac{1}{2}$ 之类的错值。","pack":"K3"},{"id":"K4-1","type":"choice","stem":"袋中有 3 个白球、2 个黑球，不放回地依次取两球。已知第二球是黑球，则第一球是白球的概率为____。","options":[["A","$\\dfrac25$"],["B","$\\dfrac12$"],["C","$\\dfrac35$"],["D","$\\dfrac34$"]],"answer":"D","solution":"**设** $A=$「第一球白」，$B=$「第二球黑」。\n\n**交集**：$P(AB)=\\dfrac35\\times\\dfrac24=\\dfrac{3}{10}$。\n\n**分母**：$P(B)$ 用抽签的边际性直接得 $\\dfrac25$（第二球在 5 个位置中对称）。\n\n$$P(A\\mid B)=\\frac{3/10}{2/5}=\\frac34$$\n\n**注意**：$P(B)=\\dfrac25$ 与「第一次取到黑球」的概率相同，但两件事并不独立——$P(AB)=\\dfrac{3}{10}\\ne P(A)P(B)=\\dfrac35\\cdot\\dfrac25=\\dfrac{6}{25}$。\n\n**反向检查**：已知第二球黑，第一球只能是白（3 个）或另一个黑（1 个），故概率 $\\dfrac{3}{3+1}=\\dfrac34$ ✓。这种「剩下的球直接数」的方法在双色球问题里非常快。","pack":"K4"},{"id":"K4-2","type":"choice","stem":"设 $P(A)=\\dfrac13$，$P(B\\mid A)=\\dfrac14$，$P(A\\mid B)=\\dfrac16$，则 $P(B)=$____。","options":[["A","$\\dfrac14$"],["B","$\\dfrac12$"],["C","$\\dfrac23$"],["D","$\\dfrac34$"]],"answer":"B","solution":"**第一步：先求交集。**\n$$P(AB)=P(A)\\,P(B\\mid A)=\\frac13\\times\\frac14=\\frac1{12}$$\n\n**第二步：用另一条乘法公式反解分母。**\n$$P(A\\mid B)=\\frac{P(AB)}{P(B)}\\ \\Rightarrow\\ P(B)=\\frac{P(AB)}{P(A\\mid B)}=\\frac{1/12}{1/6}=\\frac12$$\n\n**验算**：$P(A\\mid B)=\\dfrac{1/12}{1/2}=\\dfrac16$ ✓。\n\n**本题的意义**：$P(B\\mid A)$ 与 $P(A\\mid B)$ 共享同一个分子 $P(AB)$，只是分母不同。知道其中一个、再知道 $P(A)$ 或 $P(B)$ 中的任意一个，就能把另一个推出来。这类「方向互换」是选择题的高频考点。","pack":"K4"},{"id":"K4-3","type":"choice","stem":"从 $1,2,\\dots,10$ 中等可能地取一个数。已知取到的数不小于 6，则它是偶数的概率为____。","options":[["A","$\\dfrac35$"],["B","$\\dfrac12$"],["C","$\\dfrac25$"],["D","$\\dfrac3{10}$"]],"answer":"A","solution":"**条件事件**：$B=\\{X\\ge6\\}=\\{6,7,8,9,10\\}$，共 5 个样本点。\n\n**有利事件**：$AB=\\{6,8,10\\}$，共 3 个。\n\n$$P(A\\mid B)=\\frac{P(AB)}{P(B)}=\\frac{3/10}{5/10}=\\frac35$$\n\n**关键**：条件概率相当于把样本空间**压缩**到 $B$ 上重新做古典概型，分母换成 $|B|$，不是原来的 10。\n\n**易错**：\n- 写 $\\dfrac{5}{10}=\\dfrac12$：把「偶数」的全体（5 个）当成了分子，忘了先筛掉小于 6 的部分。\n- 写 $\\dfrac3{10}$：忘了除以 $P(B)$。\n\n**口诀**：条件概率 = 「在缩小后的样本空间里重新数」。","pack":"K4"},{"id":"K4-4","type":"choice","stem":"设 $0<P(B)<1$。下列等式**恒成立**的是____。","options":[["A","$P(A\\mid B)+P(\\bar A\\mid\\bar B)=1$"],["B","$P(A\\mid B)+P(\\bar A\\mid B)=1$"],["C","$P(A\\mid B)+P(B\\mid A)=1$"],["D","$P(A\\mid B)=P(B\\mid A)$"]],"answer":"B","solution":"**正确选项 B**：固定条件 $B$ 后，$P(\\cdot\\mid B)$ 满足概率的全部公理，$A$ 与 $\\bar A$ 是 $B$ 上的对立事件，故\n$$P(A\\mid B)+P(\\bar A\\mid B)=\\frac{P(AB)}{P(B)}+\\frac{P(\\bar AB)}{P(B)}=\\frac{P(B)}{P(B)}=1$$\n\n**为什么 A 错**：竖线后面是两个不同事件，两个不同条件下的概率相加没有理由等于 1。反例：$P(A\\mid B)=0.2$，$P(A\\mid\\bar B)=0.8$ 时和为 1 只是巧合。\n\n**为什么 C 错**：$P(A\\mid B)$ 与 $P(B\\mid A)$ 的分母分别是 $P(B)$ 与 $P(A)$，一般不等。例如 $P(A)=0.9,P(B)=0.1,P(AB)=0.09$：$P(A\\mid B)=0.9$，$P(B\\mid A)=0.1$。\n\n**为什么 D 错**：同 C，方向不同分母不同。只有当 $P(A)=P(B)$ 时才可能相等。\n\n**记忆**：**「竖线后面同一个事件」才能相加为 1**；这是「条件概率也是概率」最直接的推论。","pack":"K4"},{"id":"K4-5","type":"judge","stem":"对任意事件 $A,B$（$P(A)P(B)>0$），都有 $P(A\\mid B)=P(B\\mid A)$。","answer":"错","solution":"**反例**：$P(A)=0.9$，$P(B)=0.1$，$P(AB)=0.09$。则\n$$P(A\\mid B)=\\frac{0.09}{0.1}=0.9,\\qquad P(B\\mid A)=\\frac{0.09}{0.9}=0.1$$\n两者相差 9 倍。\n\n**差别在哪**：两者共享分子 $P(AB)$，但分母分别是 $P(B)$ 与 $P(A)$。只有当 $P(A)=P(B)$ 时才相等。\n\n**什么时候可以互换**：只有在「对称」的情形，例如两个箱子里球的构成完全相同、或题目明确给出 $P(A)=P(B)$。\n\n**记忆法**：$P(\\text{得病}\\mid\\text{阳性})$ 与 $P(\\text{阳性}\\mid\\text{得病})$ 完全是两件事，前者叫后验概率，后者叫灵敏度。医学检测题年年考这一点。","pack":"K4"},{"id":"K4-6","type":"judge","stem":"若 $A\\subset B$ 且 $P(B)>0$，则 $P(A\\mid B)=\\dfrac{P(A)}{P(B)}$。","answer":"对","solution":"**推导**：$A\\subset B$ 意味着 $AB=A$，于是\n$$P(A\\mid B)=\\frac{P(AB)}{P(B)}=\\frac{P(A)}{P(B)}$$\n\n**检验**：因 $P(A)\\le P(B)$，故右端 $\\le1$，符合概率的取值范围。\n\n**这条结论的用处**：概率的单调性 $P(A)\\le P(B)$ 与它是同一件事的两个侧面。做题时若发现 $P(A\\mid B)>1$，说明要么 $A\\not\\subset B$，要么算错了。\n\n**延伸**：若 $B\\subset A$，则 $P(A\\mid B)=1$（因为 $AB=B$），$P(B\\mid A)=\\dfrac{P(B)}{P(A)}$。两个方向的结论不同，不要混。","pack":"K4"},{"id":"K4-7","type":"fill","stem":"10 件产品中有 3 件次品。不放回地依次取 2 件，已知第一件是次品，求第二件也是次品的概率。","fields":[{"label":"$P$","a":"2/9","kind":"num","alt":["0.2222"]}],"solution":"**直接数剩下的球**：第一件已确认是次品并取走，剩下 9 件，其中次品 2 件。故\n$$P=\\frac{2}{9}$$\n\n**用公式验证**：设 $A_i=$「第 $i$ 件是次品」，\n$$P(A_1)=\\frac3{10},\\quad P(A_1A_2)=\\frac3{10}\\times\\frac29=\\frac1{15}$$\n$$P(A_2\\mid A_1)=\\frac{P(A_1A_2)}{P(A_1)}=\\frac{1/15}{3/10}=\\frac{2}{9}\\ ✓$$\n\n**易错**：写 $\\dfrac3{10}$（没扣掉已取走的那件）或 $\\dfrac3{9}$（忘了次品也少了一个）。\n\n**要点**：不放回条件下，**分子分母都要减**，而且减少的量取决于取走的是什么颜色。","pack":"K4"},{"id":"K4-8","type":"subjective","points":10,"stem":"袋中有 5 个红球、3 个白球，共 8 个球，逐个不放回抽取。\n(1) 求「第 3 次才首次取到白球」的概率；\n(2) 已知前两次都取到红球，求第 3 次取到白球的概率；\n(3) 已知第 3 次取到白球，求前两次都取到红球的概率。","solution":"**(1) 乘法链**\n「第 3 次才首次取到白」= 红、红、白：\n$$P=\\frac58\\times\\frac47\\times\\frac36=\\frac{60}{336}=\\frac5{28}$$\n\n注意三个分母 $8,7,6$ 与三个分子 $5,4,3$ 都在变。\n\n**(2) 条件概率（已知前两次红）**\n此时袋中剩 3 红 3 白，共 6 个：\n$$P=\\frac36=\\frac12$$\n\n这一步只需在**已经取走 2 个红球**的剩余袋中数球，不必再乘前面的因子。\n\n**(3) 逆条件（已知第 3 次白，反查前两次）**\n$$P(\\text{前两次红}\\mid\\text{第 3 次白})=\\frac{P(\\text{红红白})}{P(\\text{第 3 次白})}$$\n\n由抽签的边际性，**第 3 次取到白球的概率与次序无关**，等于白球占比：\n$$P(\\text{第 3 次白})=\\frac38$$\n于是\n$$P=\\frac{5/28}{3/8}=\\frac{5}{28}\\times\\frac{8}{3}=\\frac{10}{21}\\approx0.476$$\n\n**三个问的区别（本题的全部价值）**：\n- (1) 是**联合概率**，路径相乘；\n- (2) 是「已知前两次」的**后向条件**，只数剩余；\n- (3) 是「已知结果倒推原因」的**前向条件**，分子相同、分母换成结果的边际概率。\n\n**(3) 的合理性检查**：$P(\\text{红红白})=\\dfrac{5}{28}\\approx0.179$，除以 $P(\\text{第3次白})=0.375$ 得 $0.476$。因为「第三次是白」还包含了「前两次有一白」的大量情形，所以后验概率不到一半，符合直觉。","pack":"K4"},{"id":"K5-1","type":"choice","stem":"某厂有甲、乙两条生产线，产量分别占 $55%$ 与 $45%$，次品率分别为 $1%$ 与 $4%$。任取一件产品，若已知它是次品，则它来自甲线的概率约为____。","options":[["A","$0.11$"],["B","$0.18$"],["C","$0.23$"],["D","$0.31$"]],"answer":"C","solution":"**第一步：全概率求总次品率。**\n$$P(D)=0.55\\times0.01+0.45\\times0.04=0.0055+0.0180=0.0235$$\n\n**第二步：贝叶斯。**\n$$P(\\text{甲}\\mid D)=\\frac{0.0055}{0.0235}=\\frac{55}{235}=\\frac{11}{47}\\approx0.234$$\n\n**为什么不是 0.55**：甲线产量虽大（占 55%），但次品率只有乙线的四分之一，所以次品里甲只占约 23%。\n\n**两个分母的区分（最重要的一点）**：\n- 先验 $P(\\text{甲})=0.55$，回答「随便拿一件来自甲线」；\n- 后验 $P(\\text{甲}\\mid D)=0.234$，回答「已知是次品，来自甲线」。\n\n题干只要出现「已知它是次品」，就必须算后验。","pack":"K5"},{"id":"K5-2","type":"choice","stem":"三个外形相同的箱子：箱 1 装 2 个红球，箱 2 装 1 红 1 白，箱 3 装 2 个白球。任取一箱，再从中任取一球，结果取到红球。则此球来自箱 1 的概率为____。","options":[["A","$\\dfrac23$"],["B","$\\dfrac12$"],["C","$\\dfrac35$"],["D","$\\dfrac13$"]],"answer":"A","solution":"**第一步：全概率（三个来源等可能）。**\n$$P(R)=\\frac13\\times1+\\frac13\\times\\frac12+\\frac13\\times0=\\frac13+\\frac16=\\frac12$$\n\n**第二步：贝叶斯。**\n$$P(\\text{箱1}\\mid R)=\\frac{\\frac13\\times1}{\\frac12}=\\frac23$$\n\n**验算直觉**：三个箱子抽到红球的「概率质量」分别是 $\\dfrac13,\\dfrac16,0$，总质量 $\\dfrac12$。箱 1 贡献了其中的 $\\dfrac13$，占 $\\dfrac{2}{3}$ ✓。\n\n**常见错法**：认为「既然取到红球，就不可能是箱 3」，于是在箱 1、箱 2 中二选一答 $\\dfrac12$。错在箱 1 抽到红球的**可能性**是箱 2 的两倍，不能等权。","pack":"K5"},{"id":"K5-3","type":"choice","stem":"某病的患病率为 $2%$。检测对患病者的阳性率为 $90%$，对健康者的阳性率（假阳性率）为 $5%$。若某人检测呈阳性，则他真正患病的概率约为____。","options":[["A","$0.90$"],["B","$0.50$"],["C","$0.27$"],["D","$0.09$"]],"answer":"C","solution":"**设** $A=$ 患病，$B=$ 阳性。已知 $P(A)=0.02$，$P(B\\mid A)=0.90$，$P(B\\mid\\bar A)=0.05$。\n\n**第一步：全概率。**\n$$P(B)=0.02\\times0.90+0.98\\times0.05=0.018+0.049=0.067$$\n\n**第二步：贝叶斯。**\n$$P(A\\mid B)=\\frac{0.018}{0.067}=\\frac{18}{67}\\approx0.269$$\n\n**为什么反直觉**：健康人占 98%，其中 5% 被误判为阳性，这批「假阳性」（$0.049$）的数量是真患者被查出数量（$0.018$）的近三倍。\n\n**这就是基础率谬误**：检测本身很准（灵敏度 90%、特异度 95%），但患病率太低，阳性结果里真患者仍是少数。\n\n**答题规范**：必须写清两个条件概率分别是谁对谁。把 $P(B\\mid A)$ 写成 $P(A\\mid B)$ 是本类题第一大失分点。","pack":"K5"},{"id":"K5-4","type":"choice","stem":"使用全概率公式 $P(B)=\\sum_i P(A_i)P(B\\mid A_i)$ 时，对 $\\{A_i\\}$ 的要求是____。","options":[["A","$A_i$ 两两相互独立"],["B","$A_i$ 两两互斥且 $\\bigcup_i A_i=\\Omega$"],["C","各 $P(A_i)$ 相等且为正"],["D","$B$ 与每个 $A_i$ 都独立"]],"answer":"B","solution":"**全概率公式的本质**：把 $B$ 按「来源」切分成互不重叠的若干块\n$$B=B A_1\\cup B A_2\\cup\\cdots\\cup B A_n$$\n要使这个分解既**不重**又**不漏**，必须\n- 不重：$A_i$ 两两互斥 $\\Rightarrow BA_i$ 两两互斥，可直接相加；\n- 不漏：$\\bigcup A_i=\\Omega\\Rightarrow$ 所有可能来源都被覆盖。\n\n**为什么其它选项不对**：\n- 独立性完全不需要，甚至常常相反（$A_i$ 通常互斥）；\n- $P(A_i)$ 不必相等，加权时可以不等权；\n- $B$ 与 $A_i$ 独立会让公式退化为 $P(B)=P(B)\\sum P(A_i)=P(B)$，毫无信息量。\n\n**术语**：满足上述两条的 $\\{A_i\\}$ 称为样本空间的一个**划分**（完备事件组）。","pack":"K5"},{"id":"K5-5","type":"judge","stem":"全概率公式要求划分 $\\{A_i\\}$ 中的事件相互独立。","answer":"错","solution":"**恰恰相反，常见情形是互斥的。**\n\n全概率公式要求的是「两两互斥 + 并为全集」，而互斥与独立在同一概率测度下几乎是对立的：若 $P(A_i)>0$ 且两两互斥，则 $P(A_iA_j)=0\\ne P(A_i)P(A_j)$，它们**不独立**。\n\n**公式本身**：\n$$P(B)=\\sum_i P(A_i)P(B\\mid A_i)$$\n它只用到「按来源分解」这一件事，与独立性无关。\n\n**什么时候才需要独立性**：是「至少一个发生」的公式\n$$P\\left(\\bigcup A_i\\right)=1-\\prod_i\\left(1-P(A_i)\\right)$$\n这一条**必须**各 $A_i$ 相互独立。两个公式的前提完全相反，千万别记混。","pack":"K5"},{"id":"K5-6","type":"judge","stem":"若 $P(A\\mid B)=P(A\\mid\\bar B)$（$0<P(B)<1$），则 $A$ 与 $B$ 相互独立。","answer":"对","solution":"**证明**：设公共值为 $c$，则\n$$P(AB)=P(B)c,\\qquad P(A\\bar B)=P(\\bar B)c$$\n两式相加：\n$$P(A)=c\\big(P(B)+P(\\bar B)\\big)=c$$\n于是 $P(AB)=P(B)P(A)$，即 $A,B$ 独立。\n\n**这条是「独立」的等价刻画**：$A$ 发生的概率不因 $B$ 是否发生而改变，这才是「独立」的字面含义。三条等价写法：\n$$P(AB)=P(A)P(B)\\iff P(A\\mid B)=P(A)\\iff P(A\\mid B)=P(A\\mid\\bar B)$$\n\n**对照上一条判断题**：$P(A\\mid B)+P(A\\mid\\bar B)=1$ 与 $P(A\\mid B)=P(A\\mid\\bar B)$ 长得像，但一个推不出独立、一个可以。区别在于「相加为 1」还是「相等」。","pack":"K5"},{"id":"K5-7","type":"fill","stem":"甲袋中有 3 红 2 白，乙袋中有 1 红 4 白。随机选一个袋子（等可能），再从中取一球，求取到红球的概率。","fields":[{"label":"$P(\\text{红})$","a":"0.4","kind":"num","alt":["2/5"]}],"solution":"**按袋型划分，用全概率。**\n$$P(R)=\\frac12\\cdot\\frac35+\\frac12\\cdot\\frac15=\\frac{3}{10}+\\frac{1}{10}=\\frac25=0.4$$\n\n**两袋的贡献相等**：甲袋红球多但白球少，乙袋反之，本题恰好各贡献 $0.3$ 与 $0.1$，合计 $0.4$。\n\n**若改为「先从两袋合并的 10 个球中取」**：红球共 4 个，概率也是 $\\dfrac4{10}=0.4$。这种巧合只在两袋球数相同时出现，**不可当作通用规律**。\n\n**易错**：直接把两袋红球比例平均 $\\dfrac{3/5+1/5}{2}=0.4$ —— 本题碰巧对，但若两袋球数不同（如甲 5 球、乙 55 球）就会错。**必须按袋加权，权重是选到该袋的概率。**","pack":"K5"},{"id":"K5-8","type":"subjective","points":10,"stem":"某工厂有两条生产线 I 和 II 生产同种产品，产量比为 $3:2$。两条线的不合格品率不同：线 I 为 $\\dfrac18$，线 II 为 $\\dfrac14$。\n\n现采用二次抽检：先从产品中随机抽取一件检测；若第一次抽到不合格品，则**从同一条生产线**再抽一件检测；只有两次都抽到不合格品才整批拒收。设每次抽检各产品是否合格相互独立。求：\n(1) 该批产品被整批拒收的概率；\n(2) 若已知某批产品被整批拒收，求它来自生产线 I 的概率。","solution":"**第一步：写出先验。** 按产量比，\n$$P(\\text{I})=\\frac35,\\qquad P(\\text{II})=\\frac25$$\n\n**第二步：把「拒收」翻译成条件概率。** 关键在题干那句「从**同一条**生产线再抽一件」——这告诉我们第二次抽检时，抽到的仍是该线的产品，且两次独立，因此\n$$P(\\text{拒收}\\mid\\text{I})=\\left(\\frac18\\right)^2=\\frac1{64},\\qquad P(\\text{拒收}\\mid\\text{II})=\\left(\\frac14\\right)^2=\\frac1{16}$$\n\n**如果漏掉这句**，误用「全体不合格率」$\\left(\\frac{3}{5}\\cdot\\frac18+\\frac25\\cdot\\frac14\\right)^2$，就把条件概率算成了边际概率，第二问会全错。\n\n**(1) 全概率。**\n$$P(R)=\\frac35\\cdot\\frac1{64}+\\frac25\\cdot\\frac1{16}=\\frac{3}{320}+\\frac{2}{80}=\\frac{3}{320}+\\frac{8}{320}=\\frac{11}{320}\\approx0.0344$$\n\n**(2) 贝叶斯。**\n$$P(\\text{I}\\mid R)=\\frac{3/320}{11/320}=\\frac{3}{11}\\approx0.273$$\n\n**合理性检查**：先验是 $0.6$，后验降到 $0.273$，因为线 II 的不合格率是线 I 的两倍，平方之后差 4 倍，把先验优势反超了。\n\n**本题的评分点**（按真题习惯）：\n- 写出两个条件概率各 2 分；\n- 全概率公式 2 分，结果 2 分；\n- 贝叶斯公式 2 分，结果 2 分；\n- 结论一句话 2 分。\n\n**通用模板**：两阶段抽检 $\\to$ 单阶段成功概率 $p_i$，两阶段为 $p_i^2$（独立）$\\to$ 对线别用全概率 $\\to$ 反查用贝叶斯。","pack":"K5"},{"id":"K6-1","type":"choice","stem":"甲、乙、丙三人独立射击同一目标，命中率分别为 $0.5,\\ 0.6,\\ 0.8$。则目标**至少被命中一次**的概率为____。","options":[["A","$0.76$"],["B","$0.88$"],["C","$0.96$"],["D","$0.90$"]],"answer":"C","solution":"**取补**：一次都没命中 $\\Leftrightarrow$ 三人全部未中，且相互独立，\n$$P(\\text{全不中})=(1-0.5)(1-0.6)(1-0.8)=0.5\\times0.4\\times0.2=0.04$$\n$$P(\\text{至少一次})=1-0.04=0.96$$\n\n**为什么不直接加**：$0.5+0.6+0.8=1.9$ 显然荒谬——加法公式要减去两两交、加回三重交，四轮计算极易出错。**「至少一个」永远先算「全都不是」。**\n\n**顺带记住本题的「恰好一个」**（近年真题常考）：\n$$0.5\\times0.4\\times0.2+0.5\\times0.6\\times0.2+0.5\\times0.4\\times0.8=0.04+0.06+0.16=0.26$$\n注意每条路径都要把「其余两人不中」乘进去。","pack":"K6"},{"id":"K6-2","type":"choice","stem":"掷两枚均匀硬币，令 $A=$「第一枚正面」，$B=$「第二枚正面」，$C=$「两枚结果相同」。关于 $A,B,C$ 的独立性，正确的是____。","options":[["A","三个事件相互独立"],["B","两两独立，但不相互独立"],["C","不两两独立"],["D","$A$ 与 $B$ 独立，但 $C$ 与 $A$ 不独立"]],"answer":"B","solution":"**逐个算**（每个都是 $\\dfrac12$）：\n$$P(AB)=\\frac14=P(A)P(B),\\quad P(AC)=\\frac14=P(A)P(C),\\quad P(BC)=\\frac14=P(B)P(C)$$\n三条两两等式全部成立，故**两两独立**。\n\n**但三重交**：$ABC=\\{$正正$\\}$，\n$$P(ABC)=\\frac14,\\qquad P(A)P(B)P(C)=\\frac18$$\n$$\\frac14\\ne\\frac18\\Rightarrow\\ \\text{不相互独立}$$\n\n**直观解释**：若已知第一枚正面且两枚相同，则第二枚必为正面，概率从 $\\dfrac12$ 跳到 1。第三个事件携带了决定性信息，所以三个一起时不独立。\n\n**这是全课程最经典的反例**，必须能默写。它说明「两两独立」是严格弱于「相互独立」的条件。\n\n**易错**：只验证了 $P(ABC)=P(A)P(B)P(C)$ 就下结论——这也不够，必须**四条同时成立**才算相互独立。","pack":"K6"},{"id":"K6-3","type":"choice","stem":"某系统由三个元件组成：元件 1 与元件 2 并联，再与元件 3 串联。设三个元件独立工作且可靠度均为 $p=0.9$，则系统可靠度为____。","options":[["A","$0.891$"],["B","$0.900$"],["C","$0.972$"],["D","$0.810$"]],"answer":"A","solution":"**并联部分**：1、2 至少一个工作，\n$$P_{12}=1-(1-0.9)^2=1-0.01=0.99$$\n\n**再与 3 串联**：两部分都必须工作，\n$$P=0.99\\times0.9=0.891$$\n\n**通用式**：$R=p\\left[1-(1-p)^2\\right]=p(2p-p^2)=2p^2-p^3$。代 $p=0.9$：$1.62-0.729=0.891$ ✓。\n\n**干扰项分析**：\n- $0.9$：只算了元件 3；\n- $0.972=1-0.1^3$：把三个全当成并联（全不工作的概率 $0.001$），结构看错；\n- $0.81$：把串并联搞反（$0.9^2\\times0.9$ 少乘了并联增益）。\n\n**口诀**：**串联乘、并联补**。先把并联块压缩成一个等效元件，再按串联相乘。","pack":"K6"},{"id":"K6-4","type":"choice","stem":"某人投篮命中率为 $0.6$，各次独立。投 5 次，恰好命中 3 次的概率为____。","options":[["A","$0.2160$"],["B","$0.2592$"],["C","$0.3174$"],["D","$0.3456$"]],"answer":"D","solution":"**识别为 $n$ 重伯努利**：固定 5 次、每次独立、成功概率不变 $\\Rightarrow X\\sim B(5,0.6)$。\n\n$$P(X=3)=\\binom53(0.6)^3(0.4)^2=10\\times0.216\\times0.16=0.3456$$\n\n**为什么乘 $\\binom53$**：命中可能发生在任意 3 次（如「中中中不不」「中不中中不」……），共 $\\binom53=10$ 种互斥排列，每种的概率都是 $0.6^3\\cdot0.4^2$。\n\n**与「第 3 次才命中」的区别**（高频混淆）：\n- 本题是**固定 5 次的计数**，不关心次序；\n- 「第 3 次才首次命中」是几何分布，概率为 $0.4^2\\times0.6=0.096$，还要限定前两次都不中。\n\n**核对**：$0.216\\times1.6=0.3456$ ✓（因为 $10\\times0.16=1.6$）。","pack":"K6"},{"id":"K6-5","type":"judge","stem":"若 $A$ 与 $B$ 相互独立，则 $\\bar A$ 与 $\\bar B$ 也相互独立。","answer":"对","solution":"**证明**：\n$$P(\\bar A\\bar B)=P(\\overline{A\\cup B})=1-P(A\\cup B)=1-P(A)-P(B)+P(AB)$$\n代入 $P(AB)=P(A)P(B)$：\n$$=1-P(A)-P(B)+P(A)P(B)=\\big(1-P(A)\\big)\\big(1-P(B)\\big)=P(\\bar A)P(\\bar B)$$\n\n**结论**：独立事件任意「取补组合」后仍独立。所以 $\\bar A$ 与 $B$、$A$ 与 $\\bar B$、$\\bar A$ 与 $\\bar B$ 全部独立。\n\n**这条结论的用处**：算「至少一个发生」时，$1-\\prod(1-P(A_i))$ 之所以成立，正是因为各 $\\bar A_i$ 也相互独立，可以把乘积拆开。\n\n**反向不成立**：$\\bar A$ 与 $\\bar B$ 独立推不出 $A$ 与 $B$ 独立——但由上面的推导可逆，实际上等价。真正不能反推的是「$A$ 与 $B$ 不独立 $\\Rightarrow$ $\\bar A$ 与 $\\bar B$ 不独立」这类错误直觉。","pack":"K6"},{"id":"K6-6","type":"judge","stem":"若 $P(A)>0$，$P(B)>0$ 且 $A,B$ 互斥，则 $A$ 与 $B$ 相互独立。","answer":"错","solution":"**互斥与独立在正概率下是互斥的两个概念。**\n\n$A,B$ 互斥 $\\Rightarrow P(AB)=P(\\varnothing)=0$；而独立要求 $P(AB)=P(A)P(B)>0$。两者矛盾，故**一定不独立**。\n\n**唯一例外**：若 $P(A)=0$ 或 $P(B)=0$，则 $P(AB)=0=P(A)P(B)$，此时互斥事件可以「独立」。零概率事件与任何事件都独立。\n\n**一句话记忆**：\n- 互斥说的是「不能同时发生」（集合不相交）；\n- 独立说的是「彼此不影响」（概率可相乘）。\n\n**数值检验**：$P(A)=0.4,P(B)=0.3$，互斥时 $P(A\\cup B)=0.7$；若独立则 $P(A\\cup B)=0.4+0.3-0.12=0.58$。差别一眼可见。","pack":"K6"},{"id":"K6-7","type":"fill","stem":"甲、乙两人独立破译同一份密码，各自成功的概率为 $\\dfrac13,\\ \\dfrac25$，求密码被破译的概率。","fields":[{"label":"$P$","a":"0.6","kind":"num","alt":["3/5"]}],"solution":"**取补**：没被破译 $\\Leftrightarrow$ 两人都失败，且独立，\n$$P(\\text{失败})=\\left(1-\\frac13\\right)\\left(1-\\frac25\\right)=\\frac23\\times\\frac35=\\frac25$$\n$$P(\\text{破译})=1-\\frac25=\\frac35=0.6$$\n\n**直接法核对**：$P=$ 甲成 + 甲败乙成 $=\\dfrac13+\\dfrac23\\cdot\\dfrac25=\\dfrac13+\\dfrac4{15}=\\dfrac{9}{15}=\\dfrac35$ ✓。\n\n**易错**：写 $\\dfrac13+\\dfrac25=\\dfrac{11}{15}$ —— 把两人都成功的情形重复计算了。\n\n**记忆**：并联（至少一个成功）用 $1-\\prod(1-p_i)$。","pack":"K6"},{"id":"K6-8","type":"subjective","points":10,"stem":"甲、乙两人轮流投篮，甲先投，命中率分别为 $p_1=\\dfrac12$（甲）与 $p_2=\\dfrac25$（乙），各次投篮相互独立，命中即结束。求甲获胜的概率与乙获胜的概率。","solution":"**第一步：找「一轮」。** 一轮 = 甲投一次 + 乙投一次。\n\n**一轮结束时比赛仍未结束**（两人都没中）：\n$$q=(1-p_1)(1-p_2)=\\frac12\\times\\frac35=\\frac3{10}$$\n\n**第二步：甲在第 $k$ 轮获胜** $=$ 前 $k-1$ 轮全空转 $+$ 第 $k$ 轮甲命中：\n$$P(\\text{甲第 }k\\text{ 轮胜})=q^{k-1}p_1$$\n\n**第三步：等比级数求和。**\n$$P(\\text{甲胜})=\\sum_{k=1}^{\\infty}q^{k-1}p_1=\\frac{p_1}{1-q}=\\frac{1/2}{1-3/10}=\\frac{1/2}{7/10}=\\frac57$$\n\n$$P(\\text{乙胜})=\\frac{(1-p_1)p_2}{1-q}=\\frac{\\frac12\\cdot\\frac25}{7/10}=\\frac{1/5}{7/10}=\\frac27$$\n\n**验算**：$\\dfrac57+\\dfrac27=1$ ✓（因为 $p_1+p_2>0$，比赛几乎必然结束）。\n\n**为什么乙要多个因子**：乙想在第 $k$ 轮获胜，需要前 $k-1$ 轮空转、第 $k$ 轮甲先不中、然后乙命中，所以分子是 $(1-p_1)p_2$ 而不是 $p_2$。\n\n**通用模板**：\n- 定「一轮」→ 算一轮未结束的概率 $q$ → 等比求和 $\\dfrac{\\text{先手本轮成功概率}}{1-q}$；\n- 若两人命中率都为 0，则 $q=1$，比赛永不结束，分母为 0，公式失效。","pack":"K6"},{"id":"K7-1","type":"choice","stem":"某射手命中率为 $0.4$，各次射击相互独立。则「第 5 次射击恰好是第 2 次命中」的概率为____。","options":[["A","$0.0576$"],["B","$0.0922$"],["C","$0.1382$"],["D","$0.2304$"]],"answer":"C","solution":"**识别为负二项**：要求「第 $r=2$ 次成功」恰发生在第 $k=5$ 次。\n\n**两步拆解**：\n- 最后一次（第 5 次）必须是命中，概率 $0.4$；\n- 前 4 次中恰有 1 次命中，概率 $\\binom41(0.4)^1(0.6)^3$。\n\n$$P=\\binom41(0.4)(0.6)^3\\times0.4=4\\times0.4\\times0.216\\times0.4=0.13824$$\n\n**负二项通式**：\n$$P(T=k)=\\binom{k-1}{r-1}p^rq^{k-r}$$\n代 $k=5,r=2,p=0.4$：$\\binom41(0.4)^2(0.6)^3=4\\times0.16\\times0.216=0.13824$ ✓。\n\n**三个易混概念（本题的全部价值）**：\n- 「5 次里恰好 2 次命中」= 二项，$\\binom52(0.4)^2(0.6)^3=0.3456$；\n- 「第 5 次才**首次**命中」= 几何，$(0.6)^4\\times0.4=0.05184$；\n- 「第 5 次恰好是**第 2 次**命中」= 负二项，$0.13824$ ← 本题。\n\n三者的区别就在「最后一次是否被钉住」以及「固定次数还是等次数」。","pack":"K7"},{"id":"K7-2","type":"choice","stem":"某路口每小时发生的交通事故数 $X$ 服从参数为 $\\lambda=2$ 的泊松分布，则 $P(X\\ge2)=$____。","options":[["A","$1-3e^{-2}$"],["B","$1-2e^{-2}$"],["C","$1-e^{-2}$"],["D","$2e^{-2}$"]],"answer":"A","solution":"**取补**：$P(X\\ge2)=1-P(X=0)-P(X=1)$。\n\n$$P(X=0)=\\frac{2^0}{0!}e^{-2}=e^{-2},\\qquad P(X=1)=\\frac{2^1}{1!}e^{-2}=2e^{-2}$$\n\n$$P(X\\ge2)=1-e^{-2}-2e^{-2}=1-3e^{-2}\\approx1-3(0.1353)=0.594$$\n\n**为什么要取补**：直接算 $\\sum_{k=2}^{\\infty}$ 是无穷级数；而 $k=0,1$ 只有两项，取补是标准做法。\n\n**易错**：\n- 写成 $1-2e^{-2}$：只扣了 $P(X=1)$，忘了 $P(X=0)$；\n- 把 $\\lambda=2$ 当成方差代错公式；\n- 忘记 $k!$：$P(X=1)$ 的分母是 $1!=1$，$P(X=0)$ 的分母是 $0!=1$。\n\n**数值速记**：$e^{-2}\\approx0.1353$，$e^{-1}\\approx0.3679$，$e^{-3}\\approx0.0498$。","pack":"K7"},{"id":"K7-3","type":"choice","stem":"100 件产品中有 10 件次品，从中**不放回**地任取 5 件，则恰好取到 2 件次品的概率为____。","options":[["A","$\\dfrac{\\binom{10}2\\binom{90}3}{\\binom{100}5}$"],["B","$\\dfrac{\\binom52(0.1)^2(0.9)^3}{\\binom{100}5}$"],["C","$\\dfrac{\\binom{10}2\\binom{90}5}{\\binom{100}5}$"],["D","$\\dfrac{\\binom{10}2}{\\binom{100}5}$"]],"answer":"A","solution":"**识别为超几何**：总体有限（100 件）、不放回、分两类（次品/正品）。\n\n**分母**：从 100 件中取 5 件，$\\binom{100}5$。\n\n**分子**：从 10 件次品中取 2 件、从 90 件正品中取 3 件，$\\binom{10}2\\binom{90}3$。\n\n$$P=\\frac{\\binom{10}2\\binom{90}3}{\\binom{100}5}=\\frac{45\\times117480}{75287520}\\approx0.0702$$\n\n**三个干扰项错在哪**：\n- B：把二项分布的项塞进超几何的分母，口径混乱（$\\binom52$ 是组合数，不该出现在这里）；\n- C：正品选了 5 件，总数变成 7 件，与「取 5 件」矛盾；\n- D：漏掉了正品的选法。\n\n**超几何 vs 二项**：本题若改成「有放回」，则应写 $\\binom52(0.1)^2(0.9)^3\\approx0.0729$。两者接近是因为抽样比例 $\\dfrac5{100}$ 只有 5%，这正说明「比例很小才能用二项近似」。","pack":"K7"},{"id":"K7-4","type":"choice","stem":"某射手命中率为 $0.6$，各次射击相互独立。则「第 3 次命中恰好发生在第 5 次射击」的概率为____。","options":[["A","$0.2074$"],["B","$0.1382$"],["C","$0.3456$"],["D","$0.1037$"]],"answer":"A","solution":"**负二项**：$r=3$，$k=5$，$p=0.6$，$q=0.4$。\n\n$$P=\\binom{5-1}{3-1}(0.6)^3(0.4)^{2}=\\binom42\\times0.216\\times0.16=6\\times0.03456=0.20736$$\n\n**为什么是 $\\binom42$**：第 5 次已锁定为命中，前 4 次中只需再安排 2 次命中，故从 4 个位置里选 2 个。\n\n**与二项的区别**：若问「5 次中恰好 3 次命中」，则是 $\\binom53(0.6)^3(0.4)^2=10\\times0.03456=0.3456$，比本题大——因为二项允许第 5 次不中。\n\n**比值检验**：$\\dfrac{0.20736}{0.3456}=\\dfrac{6}{10}=0.6$，正好等于 $p$。这不是巧合：负二项 $=$ 二项 $\\times\\,p$（要求最后一次成功）。","pack":"K7"},{"id":"K7-5","type":"judge","stem":"泊松分布的期望与方差相等，都等于参数 $\\lambda$。","answer":"对","solution":"**直接算**：\n$$E X=\\sum_{k\\ge0}k\\frac{\\lambda^k}{k!}e^{-\\lambda}=\\lambda e^{-\\lambda}\\sum_{k\\ge1}\\frac{\\lambda^{k-1}}{(k-1)!}=\\lambda e^{-\\lambda}e^{\\lambda}=\\lambda$$\n\n**方差**用阶乘矩更快：$E[(X)_2]=\\lambda^2$，而 $X^2=(X)_2+X$，故\n$$E(X^2)=\\lambda^2+\\lambda,\\qquad D X=E(X^2)-(EX)^2=\\lambda$$\n\n**这条性质的实际用途**：题目只给「均值」时，方差也就知道了；反之亦然。例如「$X\\sim P(\\lambda)$ 且 $E(X^2)=6$」可直接解 $\\lambda^2+\\lambda=6$，得 $\\lambda=2$。\n\n**对照记忆**：二项 $E=np$、$D=npq$（不等）；几何 $E=\\dfrac1p$、$D=\\dfrac q{p^2}$（不等）；只有泊松与指数满足「均值 $=$ 标准差」或「均值 $=$ 方差」。","pack":"K7"},{"id":"K7-6","type":"judge","stem":"几何分布无论从 0 开始计数还是从 1 开始计数，其期望都相同。","answer":"错","solution":"**两种约定的期望差 1。**\n\n**从 1 开始**（本课程约定）：$X$ = 首次成功所需的**总次数**，$P(X=k)=q^{k-1}p$，$k\\ge1$，\n$$E X=\\frac1p$$\n\n**从 0 开始**：$Y$ = 首次成功之前的**失败次数**，$P(Y=k)=q^kp$，$k\\ge0$，\n$$E Y=\\frac{q}{p}=\\frac1p-1$$\n\n两者关系 $Y=X-1$，故 $EY=EX-1$。\n\n**考试中的判断依据**：看题目问的是「射击多少次」还是「失败多少次」。期中卷统一用「从 1 开始」，即 $E=\\dfrac1p$，$D=\\dfrac{q}{p^2}$。\n\n**顺带**：方差在两种约定下相同（平移不改变方差），都等于 $\\dfrac{q}{p^2}$。","pack":"K7"},{"id":"K7-7","type":"fill","stem":"设 $X\\sim B(10,\\,0.2)$，求 $D(X)$。","fields":[{"label":"$D(X)$","a":"1.6","kind":"num","alt":["8/5"]}],"solution":"**二项的方差公式**：$D(X)=npq$。\n\n$$D(X)=10\\times0.2\\times0.8=1.6$$\n\n**期望**也顺带写出：$E(X)=np=2$。\n\n**易错的三个写法**：\n- $10\\times0.2=2$：那是期望，不是方差；\n- $10\\times0.2^2=0.4$：把 $q$ 写成了 $p$；\n- $\\sqrt{1.6}\\approx1.26$：那是标准差。\n\n**单位提醒**：方差与 $X$ 的单位不同（平方关系），标准差才与 $X$ 同单位。答题写「方差为 1.6」比写「波动 1.6」严谨。","pack":"K7"},{"id":"K7-8","type":"subjective","points":10,"stem":"某厂产品的次品率为 $2%$。现随机抽取 100 件检验，设其中次品数为 $X$。\n(1) 写出 $X$ 的精确分布，并给出 $X=2$ 的概率表达式；\n(2) 用泊松分布近似计算 $P(X=2)$（取 $e^{-2}\\approx0.1353$）；\n(3) 若这批产品共 500 件，其中恰好有 10 件次品，改为**不放回**抽取 100 件，模型应如何修改？","solution":"**(1) 精确模型：二项分布。**\n每件是否次品相互独立、概率恒为 $0.02$，抽 100 件 $\\Rightarrow X\\sim B(100,0.02)$。\n$$P(X=2)=\\binom{100}{2}(0.02)^2(0.98)^{98}=4950\\times0.0004\\times0.98^{98}$$\n\n**(2) 泊松近似。**\n$n=100$ 大、$p=0.02$ 小、$\\lambda=np=2$ 适中，故\n$$P(X=k)\\approx\\frac{2^k}{k!}e^{-2}$$\n$$P(X=2)\\approx\\frac{4}{2}e^{-2}=2e^{-2}\\approx2\\times0.1353=0.2707$$\n\n**近似效果**：精确值 $\\approx0.2734$，近似值 $0.2707$，相对误差不到 $1%$，完全够用。\n\n**(3) 改为超几何。**\n总体只有 500 件且**不放回**，各次抽取不再独立，须用超几何：\n$$P(X=k)=\\frac{\\binom{10}{k}\\binom{490}{100-k}}{\\binom{500}{100}}$$\n此时 $E(X)=100\\times\\dfrac{10}{500}=2$，与二项相同，但方差更小（乘以有限总体修正 $\\dfrac{500-100}{500-1}$）。\n\n**为什么仍可用二项近似**：抽样比例 $\\dfrac{100}{500}=20%$ 已不算很小，严格说应保留超几何；工程上常放宽到 $n/N\\le10%$ 才建议用二项。\n\n**答题要点**：三问分别对应「精确建模 → 近似 → 模型修正」，每一问都要点明**前提**（独立／稀有／不放回）。这是本章最高频的考法。","pack":"K7"},{"id":"K8-1","type":"choice","stem":"下列函数中，可以作为某个随机变量的分布函数的是____。","options":[["A","$F(x)=\\dfrac{1}{1+x^{2}},\\quad x\\in\\mathbb{R}$"],["B","$F(x)=\\begin{cases}e^{-x}, & x\\ge0\\\\ 0, & x<0\\end{cases}$"],["C","$F(x)=\\begin{cases}1-e^{-x}, & x\\ge0\\\\ 0, & x<0\\end{cases}$"],["D","$F(x)=\\begin{cases}0, & x<0\\\\ \\sin x, & 0\\le x<\\pi\\\\ 1, & x\\ge\\pi\\end{cases}$"]],"answer":"C","solution":"**逐条对照三条件**：单调不减、右连续、两端极限 $0$ 与 $1$。\n\n**A**：$F(+\\infty)=\\lim\\dfrac{1}{1+x^2}=0\\ne1$ ✗（而且它在 $x>0$ 上还是递减的）。\n**B**：$F(+\\infty)=\\lim e^{-x}=0\\ne1$ ✗。\n**C**：$x\\ge0$ 时 $1-e^{-x}$ 递增，$F(0)=0$ 与左段衔接，$F(+\\infty)=1$，处处连续 ✓。\n**D**：$\\sin x$ 在 $\\left[\\dfrac\\pi2,\\pi\\right)$ 上**递减**（从 $1$ 掉到 $0$），违反单调性 ✗。\n\n**答案 C**，它正是参数为 $1$ 的指数分布的分布函数。\n\n**这类题的固定套路**：先看两端极限（最容易被忽略），再看单调性，最后看右连续。三个条件里只要破一个就淘汰。\n\n**补充**：$F$ 不必处处连续，允许有跳跃（对应离散部分），但必须**右连续**——即跳跃点的函数值取在**右侧**那一支。","pack":"K8"},{"id":"K8-2","type":"choice","stem":"设离散型随机变量 $X$ 的分布函数为\n$$F(x)=\\begin{cases}0, & x<0\\\\ 0.2, & 0\\le x<1\\\\ 0.55, & 1\\le x<2\\\\ 0.9, & 2\\le x<3\\\\ 1, & x\\ge3\\end{cases}$$\n则 $P(1<X<3)=$____。","options":[["A","$0.35$"],["B","$0.45$"],["C","$0.55$"],["D","$0.70$"]],"answer":"A","solution":"**先读出各点的概率**（跳跃高度）：\n$$P(X=0)=0.2,\\quad P(X=1)=0.35,\\quad P(X=2)=0.35,\\quad P(X=3)=0.1$$\n合计 $1$ ✓。\n\n**求 $P(1<X<3)$**：两端都**开**，要分别处理\n- 左端不开：减去 $P(X=1)$，即用 $F(1)$ 而不是 $F(1-)$；\n- 右端不开：用 $F(3-)$ 而不是 $F(3)$。\n\n$$P(1<X<3)=F(3-)-F(1)=0.9-0.55=0.35$$\n\n**直接验证**：符合条件的只有 $X=2$，概率 $0.35$ ✓。\n\n**四个易错答案的来源**：\n- $0.45=F(3-)-F(1-)$：左端当成了闭区间，多算了 $X=1$；\n- $0.55=F(2)-F(1-)$ 类：区间端点取错；\n- $0.70=F(3)-F(1)$：右端多算了 $X=3$。\n\n**口诀**：**左开就用 $F(a)$，左闭就用 $F(a-)$；右闭用 $F(b)$，右开用 $F(b-)$。** 记住「开区间那一端要多减一次跳跃」。","pack":"K8"},{"id":"K8-3","type":"choice","stem":"设连续型随机变量 $X$ 的密度为 $f(x)=cx^{2}$（$0<x<2$），其余为 $0$。则 $P(X>1)=$____。","options":[["A","$\\dfrac12$"],["B","$\\dfrac34$"],["C","$\\dfrac78$"],["D","$1$"]],"answer":"C","solution":"**第一步：归一化定 $c$。**\n$$\\int_0^2cx^2\\,dx=c\\cdot\\frac{8}{3}=1\\ \\Rightarrow\\ c=\\frac38$$\n\n**第二步：求概率。**\n$$P(X>1)=\\int_1^2\\frac38x^2\\,dx=\\frac38\\cdot\\frac{8-1}{3}=\\frac38\\cdot\\frac73=\\frac78$$\n\n**验算**：$P(X\\le1)=\\dfrac18$，两者相加为 1 ✓。\n\n**常见错误**：\n- 忘记归一化，直接用 $c=1$ 得 $\\dfrac73$（概率大于 1，立刻可判错）；\n- 把「$X>1$」写成 $\\int_0^2$ 全区间，得 1；\n- 积分限写成 $0$ 到 $1$，算出 $\\dfrac18$ ——这是 $P(X<1)$。\n\n**自检习惯**：凡是算出概率 $>1$ 或 $<0$，先回去检查归一化。","pack":"K8"},{"id":"K8-4","type":"choice","stem":"某路口红绿灯周期为 30 秒：红灯 20 秒、绿灯 10 秒。某人随机时刻到达路口，设等待时间为 $W$（遇绿灯立即通过则 $W=0$）。则 $E(W)=$____ 秒。","options":[["A","$10$"],["B","$\\dfrac{20}{3}$"],["C","$5$"],["D","$20$"]],"answer":"B","solution":"**识别为混合型**：\n- 以概率 $\\dfrac{10}{30}=\\dfrac13$ 遇绿灯，$W=0$；\n- 以概率 $\\dfrac{20}{30}=\\dfrac23$ 遇红灯，剩余红灯时间在 $(0,20)$ 上均匀，条件期望 $\\dfrac{0+20}{2}=10$。\n\n**期望按来源加权**：\n$$E(W)=\\frac13\\times0+\\frac23\\times10=\\frac{20}{3}\\approx6.67\\ \\text{秒}$$\n\n**分布函数（考试常要求写出）**：\n$$F_W(w)=\\begin{cases}0, & w<0\\\\ \\dfrac13+\\dfrac{w}{30}, & 0\\le w<20\\\\ 1, & w\\ge20\\end{cases}$$\n注意 $P(W=0)=\\dfrac13$，所以在 $0$ 处有一个跳跃，$F$ 从 $0$ 直接跳到 $\\dfrac13$。\n\n**三个易错答案**：\n- $10$：只算了红灯情形的条件期望，忘了加权；\n- $5$：错把等待时间当成 $U(0,10)$；\n- $20$：把最大等待时间当成了期望。\n\n**关键提醒**：$W$ **不是**连续型（有 $P(W=0)=1/3>0$），也**不是**离散型（红灯期间取值连续），不能套单一公式，必须加权。","pack":"K8"},{"id":"K8-5","type":"judge","stem":"连续型随机变量的分布函数一定处处连续。","answer":"对","solution":"**理由**：连续型的定义是存在密度 $f$ 使 $F(x)=\\int_{-\\infty}^{x}f(t)\\,dt$。变上限积分对 $x$ 连续（即便 $f$ 有间断点），所以 $F$ 处处连续。\n\n**等价说法**：连续型 $\\Rightarrow$ 对任意 $x$ 有 $P(X=x)=F(x)-F(x-)=0$，即没有点质量、$F$ 没有跳跃。\n\n**逆命题不成立**：$F$ 连续**推不出**连续型。存在「奇异型」分布，$F$ 连续但几乎处处不可导，没有密度。本课程不涉及，但要知道不能反推。\n\n**反过来容易错的**：$F$ 有跳跃就一定有离散部分——这是对的；但「有跳跃」不等于「是离散型」，可能只是混合型（如交通灯等待时间）。","pack":"K8"},{"id":"K8-6","type":"judge","stem":"若 $F$ 在 $x_0$ 处连续，则 $P(X=x_0)=0$。","answer":"对","solution":"**直接由跳跃公式**：\n$$P(X=x_0)=F(x_0)-F(x_0-)$$\n若 $F$ 在 $x_0$ 连续，则 $F(x_0-)=F(x_0)$，故 $P(X=x_0)=0$。\n\n**反之**：$P(X=x_0)>0$ 当且仅当 $F$ 在 $x_0$ 处**有跳跃**，跳跃高度恰为该点概率。离散型的分布函数就是阶梯函数，每级台阶的高度就是 $p_i$。\n\n**这条的实用价值**：判断「$X$ 有没有点质量」只需看 $F$ 有没有跳；求点概率只需做差。考题里给分段 $F$ 让你求 $P(X=a)$，就是考这个。\n\n**注意**：连续型必有 $P(X=a)=0$ 对**所有** $a$ 成立；但 $P(X=a)=0$ 对某个 $a$ 成立，不能反推 $X$ 是连续型（可能只在这一点无质量）。","pack":"K8"},{"id":"K8-7","type":"fill","stem":"设 $X$ 的密度为 $f(x)=Ax$（$0<x<2$），其余为 $0$。求 $P(X>1)$。","fields":[{"label":"$P(X>1)$","a":"0.75","kind":"num","alt":["3/4"]}],"solution":"**归一化求 $A$**：\n$$\\int_0^2Ax\\,dx=A\\cdot\\frac{4}{2}=2A=1\\ \\Rightarrow\\ A=\\frac12$$\n\n**求概率**：\n$$P(X>1)=\\int_1^2\\frac x2\\,dx=\\frac12\\cdot\\frac{4-1}{2}=\\frac34$$\n\n**顺带**：$F(x)=\\dfrac{x^2}{4}$（$0\\le x\\le2$），$P(X>1)=1-F(1)=1-\\dfrac14=\\dfrac34$ ✓。\n\n**这个分布其实是三角分布的右半支**：密度从 0 线性升到 1（在 $x=2$ 处 $f=1$）。看清形状可以快速判断 $P(X>1)$ 应该大于 $\\dfrac12$（因为右半边更「重」），$\\dfrac34$ 合理。","pack":"K8"},{"id":"K8-8","type":"subjective","points":10,"stem":"设随机变量 $X$ 的分布函数为\n$$F(x)=\\begin{cases}0, & x<0\\\\ ax^{2}, & 0\\le x<1\\\\ 1-be^{-(x-1)}, & x\\ge1\\end{cases}$$\n已知 $P(X\\le1)=\\dfrac14$。\n(1) 求常数 $a,b$；\n(2) 写出 $X$ 的概率密度 $f(x)$，并判断 $X$ 是连续型、离散型还是混合型；\n(3) 求 $E(X)$。","solution":"**(1) 定常数。**\n由 $P(X\\le1)=F(1)=a=\\dfrac14$。\n\n$F$ 在 $x=1$ 处必须右连续（且连续型要两侧衔接）：\n$$F(1-)=a=\\frac14,\\qquad F(1+)=1-b$$\n令二者相等：$1-b=\\dfrac14$，得 $b=\\dfrac34$。\n\n**检验单调性**：$0\\le x<1$ 时 $F'=2ax=\\dfrac x2\\ge0$ ✓；$x>1$ 时 $F'=\\dfrac34e^{-(x-1)}>0$ ✓。两端极限 $0$ 与 $1$ ✓。故 $(a,b)=\\left(\\dfrac14,\\dfrac34\\right)$。\n\n**(2) 密度。** 在可导处求导：\n$$f(x)=\\begin{cases}\\dfrac x2, & 0<x<1\\\\[4pt] \\dfrac34e^{-(x-1)}, & x>1\\\\[4pt] 0, & \\text{其他}\\end{cases}$$\n\n**验证归一化**：$\\displaystyle\\int_0^1\\frac x2dx+\\int_1^{\\infty}\\frac34e^{-(x-1)}dx=\\frac14+\\frac34=1$ ✓。\n\n因 $F$ 处处连续、无跳跃，$X$ 是**连续型**。\n\n**(3) 求期望。** 分两段积分：\n$$E(X)=\\int_0^1x\\cdot\\frac x2\\,dx+\\int_1^{\\infty}x\\cdot\\frac34e^{-(x-1)}dx$$\n\n第一段：$\\displaystyle\\int_0^1\\frac{x^2}{2}dx=\\frac16$。\n\n第二段令 $t=x-1$：\n$$\\frac34\\int_0^{\\infty}(t+1)e^{-t}dt=\\frac34\\left(1+1\\right)=\\frac32$$\n用到 $\\int_0^\\infty te^{-t}dt=1$、$\\int_0^\\infty e^{-t}dt=1$。\n\n$$E(X)=\\frac16+\\frac32=\\frac53\\approx1.667$$\n\n**合理性**：$X$ 的支撑是 $[0,\\infty)$，但一半以上的质量集中在 $[0,1]$（因为 $\\int_0^1f=\\dfrac14$，$\\int_1^\\infty f=\\dfrac34$），期望 $1.667$ 落在合理范围。\n\n**易错点**：\n- 只用一个方程定两个参数（少了 $P(X\\le1)=\\dfrac14$ 这个条件）；\n- 认为「分段点必须连续」是普遍规律——**只有连续型才可以这样用**；若题目没说连续型，接点允许跳跃，此时 $a,b$ 不能这样定（见考点 08 的判断题）；\n- 求期望时漏掉 $x>1$ 段，只算 $\\dfrac16$。","pack":"K8"},{"id":"K9-1","type":"choice","stem":"设 $X\\sim U(0,1)$，令 $Y=-2\\ln X$，则 $Y$ 服从____。","options":[["A","$E(2)$"],["B","$E\\left(\\dfrac12\\right)$"],["C","$U(0,2)$"],["D","$E(1)$"]],"answer":"B","solution":"**用分布函数法（最稳，不用记公式）**。$Y>0$，对 $y>0$：\n$$F_Y(y)=P(-2\\ln X\\le y)=P\\left(\\ln X\\ge-\\frac y2\\right)=P\\left(X\\ge e^{-y/2}\\right)$$\n因 $X\\sim U(0,1)$ 且 $e^{-y/2}\\in(0,1)$，\n$$F_Y(y)=1-e^{-y/2}$$\n\n这正是参数为 $\\dfrac12$ 的指数分布的分布函数（$F=1-e^{-\\lambda y}$，$\\lambda=\\dfrac12$）。\n\n**验证密度**：$f_Y(y)=\\dfrac12e^{-y/2}$，$y>0$ ✓，积分 $\\int_0^\\infty\\frac12e^{-y/2}dy=1$。\n\n**期望检验**：$E(Y)=\\dfrac{1}{\\lambda}=2$，而 $E(-2\\ln X)=-2\\int_0^1\\ln x\\,dx=2$ ✓（因为 $\\
