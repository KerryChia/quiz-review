汰，剩下的大多是甲厂产品，**总体失效率随时间下降**（这叫「递减失效率」）。而无记忆性要求失效率恒定，所以混合指数一定不满足。\n\n**这也说明**：「无记忆性 $\\Rightarrow$ 指数分布」的逆命题成立——**只有**指数分布（在连续型中）具有无记忆性，混合的看起来像指数，其实不是。\n\n**评分要点（12 分）**：\n- (1) $S(t)$ 3 分、$E(T)$ 2 分；\n- (2) 2 分；\n- (3) 3 分（公式 2 分、数值 1 分）；\n- (4) 判断 1 分、理由 1 分。\n\n**最易失分**：\n- (1) 写成 $S(t)=e^{-0.052t}$（把率参数加权平均），这是最典型的错误；\n- (1) 用 $\\dfrac{1}{0.6\\times0.02+0.4\\times0.1}$ 算期望；\n- (3) 漏乘先验权重。","pack":"MD"},{"id":"MD-15","type":"subjective","points":"16","note":"建议 16 分钟","stem":"设 $X_1,X_2,X_3,X_4$ 相互独立，都服从 $U(0,1)$。令\n$$M=\\max\\{X_1,X_2,X_3,X_4\\},\\qquad N=\\min\\{X_1,X_2,X_3,X_4\\}$$\n(1) 求 $M$ 的分布函数与密度；\n(2) 求 $E(M)$ 与 $D(M)$；\n(3) 求 $N$ 的分布函数，并求 $E(N)$；\n(4) 求 $P\\left(M>\\dfrac12\\right)$ 与 $P\\left(N<\\dfrac14\\right)$。","solution":"**(1) $M$ 的分布。** 关键是把「最大值不超过 $x$」翻译成「每一个都不超过 $x$」：\n$$F_M(x)=P(M\\le x)=P(X_1\\le x,\\dots,X_4\\le x)=\\prod_{i=1}^4P(X_i\\le x)=x^4,\\qquad 0\\le x\\le1$$\n\n（$x<0$ 时为 0，$x>1$ 时为 1。）\n\n**求导**：\n$$f_M(x)=4x^3,\\qquad 0<x<1$$\n\n**检验**：$\\int_0^14x^3dx=1$ ✓，且 $f_M$ 随 $x$ 递增——最大值偏向 1，符合直觉。\n\n**(2) 期望与方差。**\n$$E(M)=\\int_0^1x\\cdot4x^3dx=\\frac45=0.8$$\n\n$$E(M^2)=\\int_0^1x^2\\cdot4x^3dx=\\frac46=\\frac23$$\n\n$$D(M)=\\frac23-\\left(\\frac45\\right)^2=\\frac23-\\frac{16}{25}=\\frac{50-48}{75}=\\frac{2}{75}\\approx0.0267$$\n\n**方差很小**——四个数的最大值几乎总在 $0.8$ 附近，波动不大。\n\n**通式**：$n$ 个独立 $U(0,1)$ 的最大值满足 $E(M)=\\dfrac{n}{n+1}$，$D(M)=\\dfrac{n}{(n+2)(n+1)^2}$。代 $n=4$：$E=\\dfrac45$，$D=\\dfrac{4}{6\\times25}=\\dfrac{2}{75}$ ✓。\n\n**(3) $N$ 的分布。** 「最小值大于 $x$」$\\iff$「每一个都大于 $x$」：\n$$P(N>x)=\\prod_{i=1}^4(1-x)=(1-x)^4$$\n$$F_N(x)=1-(1-x)^4,\\qquad 0\\le x\\le1$$\n\n$$f_N(x)=4(1-x)^3$$\n\n$$E(N)=\\int_0^1x\\cdot4(1-x)^3dx=\\frac15=0.2$$\n\n**对称性解释**：$N$ 与 $1-M$ 同分布（把每个 $X_i$ 换成 $1-X_i$ 即可），故 $E(N)=1-E(M)=1-\\dfrac45=\\dfrac15$ ✓。这个技巧能省掉一次积分。\n\n**(4) 尾部概率。**\n$$P\\left(M>\\frac12\\right)=1-F_M\\left(\\frac12\\right)=1-\\left(\\frac12\\right)^4=1-\\frac1{16}=\\frac{15}{16}$$\n\n$$P\\left(N<\\frac14\\right)=F_N\\left(\\frac14\\right)=1-\\left(\\frac34\\right)^4=1-\\frac{81}{256}=\\frac{175}{256}\\approx0.684$$\n\n**两问的直觉**：四个数里最大的一定「接近 1」（所以 $M>0.5$ 几乎必然），最小的一定「接近 0」（所以 $N<0.25$ 概率很大）。这两个结论都可以用「全都 $\\le0.5$ 的概率只有 $\\dfrac1{16}$」直接读出来。\n\n**评分要点（16 分）**：\n- (1) $F_M$ 推导 4 分、密度 2 分；\n- (2) $E(M)$ 2 分、$E(M^2)$ 2 分、$D(M)$ 2 分；\n- (3) $F_N$ 2 分、$E(N)$ 2 分；\n- (4) 各 1 分。\n\n**易错**：\n- 把 $F_M$ 写成 $4x$（把「至少一个 $\\le x$」与「全都 $\\le x$」搞混）；\n- 求 $E(N)$ 时从不完全 Beta 积分硬算，浪费大量时间（用对称性一秒得）；\n- (4) 把 $P(M>0.5)$ 算成 $\\left(\\dfrac12\\right)^4$（方向反了）。","pack":"MD"},{"id":"ME-1","type":"choice","points":"5","stem":"某人有两个火柴盒，起初各有 $3$ 根火柴。每次他等可能地从其中一个盒中取一根。当他第一次发现取出的盒子已空时，另一盒中恰有 $1$ 根火柴的概率为____。","options":[["A","$\\dfrac5{16}$"],["B","$\\dfrac3{16}$"],["C","$\\dfrac14$"],["D","$\\dfrac5{32}$"]],"answer":"A","solution":"**这是经典的「火柴盒问题」（Banach 问题）。**\n\n**第一步：固定「哪一盒被发现空」。** 两盒对称，先设是甲盒被发现空，最后乘 2。\n\n**第二步：还原取用序列。** 若甲盒被发现空、乙盒还剩 $r=1$ 根，则在此之前：\n- 甲盒被取了恰好 $3$ 次（把 3 根用完）；\n- 乙盒被取了 $3-1=2$ 次；\n- 最后一次（第 6 次）取的是甲盒，且发现它空了。\n\n前 $5$ 次中，甲被取 3 次、乙被取 2 次，排列方式有\n$$\\binom{5}{3}=10\\ \\text{种}$$\n\n**第三步：算概率。** 每种具体序列的概率都是 $\\left(\\dfrac12\\right)^{6}=\\dfrac1{64}$（6 次独立选择），故\n$$P(\\text{甲空、乙余1})=\\frac{10}{64}$$\n\n两盒都可能，乘 2：\n$$P=\\frac{20}{64}=\\frac{5}{16}$$\n\n**通用公式**：两盒各 $n$ 根、首次发现一盒空时另一盒余 $r$ 根，\n$$P(R=r)=2\\binom{2n-r}{n}\\left(\\frac12\\right)^{2n-r+1},\\qquad 0\\le r\\le n$$\n代 $n=3,r=1$：$2\\binom53/2^6=\\dfrac{20}{64}=\\dfrac5{16}$ ✓。\n\n**易错**：\n- 忘记乘 2（只算了一盒）—— 得 $\\dfrac{5}{32}$，正是干扰项 D；\n- 把「取了 3 次」与「取了 4 次」搞混（最后一次是**发现空**，不是取走火柴）；\n- 用组合数 $\\binom53$ 时写成 $\\binom52$（两者相等，本题不暴露，但换成别的 $r$ 就会错）。\n\n**为什么这题难**：它同时要求「路径计数」与「停止规则」两个意识。看到「第一次发现」，就要想到**固定最后一次**，再对前面对称计数。","pack":"ME"},{"id":"ME-2","type":"choice","points":"5","stem":"甲、乙两人赌博，每局甲胜的概率为 $\\dfrac23$，输则付给对方 1 元。甲原有 1 元、乙原有 3 元，直到一方输光为止。则甲最终赢光乙的钱的概率为____。","options":[["A","$\\dfrac14$"],["B","$\\dfrac35$"],["C","$\\dfrac8{15}$"],["D","$\\dfrac7{15}$"]],"answer":"C","solution":"**赌徒输光模型**：$N=4$，$i=1$，$p=\\dfrac23$，$q=\\dfrac13$，故 $\\dfrac qp=\\dfrac12$。\n\n**代公式**：\n$$W_1=\\frac{1-\\left(\\frac12\\right)^1}{1-\\left(\\frac12\\right)^4}=\\frac{1-\\frac12}{1-\\frac1{16}}=\\frac{\\frac12}{\\frac{15}{16}}=\\frac{8}{15}$$\n\n**逐值验证（推荐，能防止公式记错）**：\n$$W_0=0,\\qquad W_4=1$$\n由 $W_i=\\dfrac23W_{i+1}+\\dfrac13W_{i-1}$：\n$$W_1=\\frac23W_2,\\qquad W_2=\\frac23W_3+\\frac13W_1,\\qquad W_3=\\frac23+\\frac13W_2$$\n\n从第一式 $W_2=\\dfrac32W_1$；代入第三式 $W_3=\\dfrac23+\\dfrac12W_1$；再代入第二式\n$$W_2=\\frac23\\left(\\frac23+\\frac12W_1\\right)+\\frac13W_1=\\frac49+\\frac13W_1+\\frac13W_1=\\frac49+\\frac23W_1$$\n与 $W_2=\\dfrac32W_1$ 联立：\n$$\\frac32W_1-\\frac23W_1=\\frac49\\ \\Rightarrow\\ \\frac56W_1=\\frac49\\ \\Rightarrow\\ W_1=\\frac{8}{15}\\ ✓$$\n\n**直觉检验**：甲只有 1 元、每局胜率 $\\dfrac23$，看似很有优势，但**资金劣势太大**（1 对 3），最终赢光概率只有 $\\dfrac{8}{15}\\approx0.533$，仅略高于一半。这说明「胜率高」不等于「赢面大」，**资金规模同样关键**。\n\n**干扰项**：$\\dfrac14$ 是公平赌博的答案 $\\dfrac iN$；$\\dfrac35$、$\\dfrac7{15}$ 是公式记错（分母指数写成 $N-1$ 或 $q/p$ 取反）。","pack":"ME"},{"id":"ME-3","type":"choice","points":"5","stem":"甲、乙两人比赛，先赢 6 局者获胜（无平局）。现甲已赢 4 局、乙已赢 2 局，假设每局双方胜率均为 $\\dfrac12$ 且各局独立，则甲最终获胜的概率为____。","options":[["A","$\\dfrac{11}{16}$"],["B","$\\dfrac{13}{16}$"],["C","$\\dfrac34$"],["D","$\\dfrac78$"]],"answer":"B","solution":"**分赌本问题**：甲还差 $a=2$ 局，乙还差 $b=4$ 局。\n\n**补齐虚拟局数**：最多再打 $a+b-1=5$ 局。甲获胜 $\\iff$ 这 5 局中至少赢 2 局：\n\n$$P=\\sum_{k=2}^{5}\\binom5k\\left(\\frac12\\right)^5=\\frac{10+10+5+1}{32}=\\frac{26}{32}=\\frac{13}{16}$$\n\n**取补更快**：\n$$P=1-\\left[\\binom50+\\binom51\\right]\\frac1{32}=1-\\frac{1+5}{32}=1-\\frac6{32}=\\frac{26}{32}=\\frac{13}{16}\\ ✓$$\n\n**为什么可以「补足 5 局」**：一旦甲先到 6 胜，后面补的局无论结果如何，「5 局中至少 2 胜」这个判断都不会改变。\n\n**通用公式**：\n$$P=\\sum_{j=0}^{b-1}\\binom{a+j-1}{j}p^a q^j$$\n代 $a=2,b=4,p=q=\\dfrac12$：\n$$\\binom11\\frac14+\\binom21\\frac18+\\binom31\\frac1{16}+\\binom41\\frac1{32}=\\frac14+\\frac28+\\frac3{16}+\\frac4{32}=\\frac{8+8+6+4}{32}=\\frac{26}{32}\\ ✓$$\n\n**干扰项**：$\\dfrac{11}{16}$ 是把乙的差距算成 3 局；$\\dfrac78$ 是把虚拟局数写成 4；$\\dfrac34$ 是只算了「甲再赢 1 局」。\n\n**若赌注 32 元**，应按 $26:6=13:3$ 分配，甲得 26 元。","pack":"ME"},{"id":"ME-4","type":"choice","points":"5","stem":"设某段时间内到达的顾客数 $N\\sim P(\\lambda)$。每位顾客独立地以概率 $p$ 完成购买、以概率 $q=1-p$ 空手离开。则完成购买的顾客数 $Y$ 服从____。","options":[["A","$P(\\lambda)$"],["B","$B(N,p)$"],["C","$P\\left(\\dfrac{\\lambda}{p}\\right)$"],["D","$P(\\lambda p)$"]],"answer":"D","solution":"**这是「泊松稀释」（Poisson thinning），结论是 $Y\\sim P(\\lambda p)$。**\n\n**推导（全概率 + 求和）**：\n$$P(Y=k)=\\sum_{n\\ge k}P(N=n)\\binom nk p^kq^{n-k}=\\sum_{n\\ge k}e^{-\\lambda}\\frac{\\lambda^n}{n!}\\cdot\\frac{n!}{k!\\,(n-k)!}p^kq^{n-k}$$\n\n把 $n!$ 约掉，令 $m=n-k$：\n$$=\\frac{e^{-\\lambda}p^k}{k!}\\sum_{m\\ge0}\\frac{\\lambda^{m+k}q^{m}}{m!}=\\frac{e^{-\\lambda}(\\lambda p)^k}{k!}\\sum_{m\\ge0}\\frac{(\\lambda q)^m}{m!}$$\n\n最后那个和是 $e^{\\lambda q}$，故\n$$P(Y=k)=\\frac{e^{-\\lambda}(\\lambda p)^k}{k!}e^{\\lambda q}=\\frac{(\\lambda p)^k}{k!}e^{-\\lambda(1-q)}=\\frac{(\\lambda p)^k}{k!}e^{-\\lambda p}$$\n\n正是参数为 $\\lambda p$ 的泊松分布 ✓。\n\n**为什么不是 $B(N,p)$**：$B(N,p)$ 是「给定 $N$ 之后」的条件分布，$N$ 本身是随机的，所以 $Y$ 的边缘分布不是二项。\n\n**期望可以用全期望快速核对**：\n$$E(Y)=E\\big[E(Y\\mid N)\\big]=E(Np)=\\lambda p\\ ✓$$\n\n**这条结论的实际意义**：「随机到达的人群中，只有一部分做某事」，其人数仍是泊松，参数按比例缩小。这让泊松分布在排队论、保险、客流分析里极其好用。\n\n**记忆**：**泊松遇到独立的随机筛选，还是泊松，参数乘概率。**","pack":"ME"},{"id":"ME-5","type":"choice","points":"5","stem":"设 $Z\\sim N(0,2)$，令 $Y=e^{Z}$（对数正态分布），则 $E(Y)=$____。","options":[["A","$e^{2}$"],["B","$e^{1/2}$"],["C","$e$"],["D","$1$"]],"answer":"C","solution":"**用正态的矩母函数**：$Z\\sim N(\\mu,\\sigma^2)$ 时\n$$E\\left(e^{tZ}\\right)=e^{t\\mu+\\frac12t^2\\sigma^2}$$\n\n取 $t=1$，$\\mu=0$，$\\sigma^2=2$：\n$$E(Y)=E\\left(e^{Z}\\right)=e^{0+\\frac12(2)}=e$$\n\n**不背公式也能算**（配方法）：\n$$E(e^Z)=\\int_{-\\infty}^{\\infty}e^{z}\\cdot\\frac{1}{2\\sqrt\\pi}e^{-z^2/4}dz$$\n指数部分配成完全平方：\n$$z-\\frac{z^2}{4}=-\\frac14\\left(z-2\\right)^2+1$$\n于是\n$$E(e^Z)=\\frac{e^{1}}{2\\sqrt\\pi}\\int_{-\\infty}^{\\infty}e^{-\\frac{(z-2)^2}{4}}dz=e^{1}\\cdot\\frac{1}{2\\sqrt\\pi}\\cdot2\\sqrt\\pi=e\\ ✓$$\n（用到了 $\\int e^{-u^2/4}du=2\\sqrt\\pi$。）\n\n**干扰项**：$e^2$ 是把 $\\sigma^2$ 直接当指数；$e^{1/2}$ 是漏了 $\\sigma^2$ 或把 $\\dfrac{\\sigma^2}{2}$ 当成 $\\dfrac14$。\n\n**顺带记方差**：\n$$D(Y)=\\left(e^{\\sigma^2}-1\\right)e^{2\\mu+\\sigma^2}=\\left(e^2-1\\right)e^{2}=e^4-e^2$$\n\n**提醒**：对数正态的期望**大于** $e^{\\mu}$（中位数），因为右尾很长。本题 $e^{\\mu}=1$，而 $E(Y)=e\\approx2.718$，差距巨大。","pack":"ME"},{"id":"ME-6","type":"choice","points":"5","stem":"设随机变量 $X$ 满足 $E(X)=0$，$D(X)=1$。则必有____。","options":[["A","$P(X\\ge2)\\le\\dfrac14$"],["B","$P(X\\ge2)\\le\\dfrac12$"],["C","$P(X\\ge2)\\le\\dfrac1{16}$"],["D","$P(X\\ge2)\\le1$"]],"answer":"A","solution":"**用切比雪夫**：\n$$P(|X|\\ge2)\\le\\frac{D(X)}{2^2}=\\frac14$$\n\n**关键的一步**：$\\{X\\ge2\\}\\subseteq\\{|X|\\ge2\\}$，故\n$$P(X\\ge2)\\le P(|X|\\ge2)\\le\\frac14$$\n\n**为什么不能直接对 $P(X\\ge2)$ 用切比雪夫**：切比雪夫控制的是**双侧**概率 $P(|X-\\mu|\\ge\\varepsilon)$，单侧要先用包含关系放大到双侧，才能套用。\n\n**若想要更紧的单侧界**：可以用马尔可夫不等式（对非负变量），但对一般 $X$ 不适用；也可以用 Cantelli 不等式\n$$P(X-\\mu\\ge\\varepsilon)\\le\\frac{\\sigma^2}{\\sigma^2+\\varepsilon^2}=\\frac15$$\n这个界 $0.2$ 比 $0.25$ 更紧，但本课程不要求，选项里也没有。\n\n**三个干扰项**：$\\dfrac12$ 是没有任何依据的猜测；$\\dfrac1{16}$ 是把 $\\varepsilon=4$ 代入；$1$ 是平凡界，虽然正确但不是「必有」的最佳答案。\n\n**考试写法**：先写包含关系，再套切比雪夫，两句话拿到全部分数。","pack":"ME"},{"id":"ME-7","type":"choice","points":"5","stem":"设 $X\\sim E(\\lambda_1)$，$Y\\sim E(\\lambda_2)$ 且相互独立，则 $\\min\\{X,Y\\}$ 服从____。","options":[["A","$E(\\lambda_1\\lambda_2)$"],["B","$E(\\lambda_1+\\lambda_2)$"],["C","$E(\\lambda_1)$"],["D","$E\\left(\\dfrac{\\lambda_1+\\lambda_2}{2}\\right)$"]],"answer":"B","solution":"**用生存函数相乘**（$X,Y$ 独立是关键）：\n$$P\\big(\\min\\{X,Y\\}>t\\big)=P(X>t,\\ Y>t)=P(X>t)P(Y>t)=e^{-\\lambda_1t}e^{-\\lambda_2t}=e^{-(\\lambda_1+\\lambda_2)t}$$\n\n这正是参数为 $\\lambda_1+\\lambda_2$ 的指数分布的生存函数，故\n$$\\min\\{X,Y\\}\\sim E(\\lambda_1+\\lambda_2)$$\n\n**直观解释**：两个「独立的老化过程」同时进行，任何一个发生都算「min 发生」，所以总发生率是两者之和。\n\n**期望**：\n$$E[\\min\\{X,Y\\}]=\\frac{1}{\\lambda_1+\\lambda_2}<\\min\\left\\{\\frac1{\\lambda_1},\\frac1{\\lambda_2}\\right\\}$$\n即「先坏的那个」平均寿命短于任何一个单独的元件，符合直觉。\n\n**对照最大值**：$\\max$ **不是**指数分布：\n$$P(\\max\\le t)=(1-e^{-\\lambda_1t})(1-e^{-\\lambda_2t})$$\n展开后有两项指数 + 一个常数项。\n\n**干扰项**：$\\lambda_1\\lambda_2$ 与 $\\dfrac{\\lambda_1+\\lambda_2}{2}$ 都是「想当然」的组合，没有依据。\n\n**这条结论的用处**：串联系统的寿命 = 各元件寿命的最小值，所以串联系统在指数模型下仍是指数，率参数相加。这与「可靠度相乘」是同一件事。","pack":"ME"},{"id":"ME-8","type":"choice","points":"5","stem":"某设备每月发生的故障次数 $N\\sim P(2)$。每次故障的维修费用 $C$ 服从 $U(0,1000)$（元），且与 $N$ 相互独立。则每月总维修费用 $S=\\sum_{i=1}^{N}C_i$ 的期望为____元。","options":[["A","$500$"],["B","$1500$"],["C","$2000$"],["D","$1000$"]],"answer":"D","solution":"**用全期望公式**（这是「复合随机变量」的标准解法）：\n$$E(S)=E\\big[E(S\\mid N)\\big]$$\n\n**给定 $N=n$ 时**，$S$ 是 $n$ 个独立同分布的费用之和：\n$$E(S\\mid N=n)=nE(C)=500n$$\n\n故 $E(S\\mid N)=500N$，于是\n$$E(S)=E(500N)=500E(N)=500\\times2=1000\\ \\text{元}$$\n\n**易错点**：\n- 直接写 $E(S)=E(N)\\cdot E(C)$ 虽然结果对，但理由要说清「**独立性**保证条件期望可拆」；\n- 忘记乘 $E(C)$ 的均值 $500$（$U(0,1000)$ 的均值是 $500$，不是 $1000$）；\n- 把 $S$ 当成 $N\\cdot C$ 的单个乘积。\n\n**方差（进阶）**：\n$$D(S)=E(N)D(C)+D(N)\\big[E(C)\\big]^2=2\\cdot\\frac{10^6}{12}+2\\cdot250000$$\n$$=166667+500000=666667\\Rightarrow \\text{SD}\\approx817$$\n\n**公式记忆**：对「随机个随机变量之和」，\n$$E(S)=E(N)E(C),\\qquad D(S)=E(N)D(C)+D(N)[E(C)]^2$$\n第二项 $D(N)[E(C)]^2$ 是「个数也在波动」带来的额外方差，最容易被漏掉。","pack":"ME"},{"id":"ME-9","type":"choice","points":"5","stem":"设 $Z\\sim N(0,2)$，$Y=e^{Z}$，则 $D(Y)=$____。","options":[["A","$e^{2}-1$"],["B","$e^{4}-e^{2}$"],["C","$e^{2}$"],["D","$e^{4}$"]],"answer":"B","solution":"**先求两个矩**（用 $E(e^{tZ})=e^{t\\mu+\\frac12t^2\\sigma^2}$，$\\mu=0$、$\\sigma^2=2$）：\n$$E(Y)=E(e^{Z})=e^{1}=e$$\n$$E(Y^2)=E(e^{2Z})=e^{\\frac12\\cdot4\\cdot2}=e^{4}$$\n\n（第二个式子中 $t=2$，指数为 $2\\cdot0+\\dfrac12\\cdot2^2\\cdot2=4$。）\n\n**方差**：\n$$D(Y)=e^{4}-e^{2}=e^{2}\\left(e^{2}-1\\right)\\approx7.389\\times6.389\\approx47.2$$\n\n**通用公式**：\n$$E(Y)=e^{\\mu+\\sigma^2/2},\\qquad D(Y)=\\left(e^{\\sigma^2}-1\\right)e^{2\\mu+\\sigma^2}$$\n代 $\\mu=0,\\sigma^2=2$：$D=(e^2-1)e^{2}=e^4-e^2$ ✓。\n\n**为什么方差这么大**：对数正态的右尾极长，$E(Y^2)$ 比 $[E(Y)]^2$ 大一个量级（$54.6$ 对 $7.4$）。这也说明「对数正态的均值远大于中位数」：\n$$\\text{中位数}=e^{\\mu}=1,\\qquad \\text{均值}=e\\approx2.72$$\n\n**干扰项**：$e^2-1$ 是漏乘 $e^{2\\mu}$；$e^2$ 与 $e^4$ 分别是 $E(Y)$ 与 $E(Y^2)$，不是方差。\n\n**记忆**：$D(Y)=E(Y^2)-[E(Y)]^2=e^4-e^2$，**两个指数都要算**，只算一个必错。","pack":"ME"},{"id":"ME-10","type":"choice","points":"5","stem":"先掷一枚均匀骰子，设出现的点数为 $N$；再独立地掷 $N$ 枚均匀硬币，记正面朝上的总数为 $X$。则 $E(X)=$____。","options":[["A","$1.75$"],["B","$3.5$"],["C","$2$"],["D","$1.5$"]],"answer":"A","solution":"**全期望公式**（两步随机）：\n$$E(X)=E\\big[E(X\\mid N)\\big]$$\n\n**给定 $N=n$**：$n$ 枚硬币正面数服从 $B\\left(n,\\dfrac12\\right)$，均值 $\\dfrac n2$。故\n$$E(X\\mid N)=\\frac N2$$\n\n$$E(X)=E\\left(\\frac N2\\right)=\\frac{E(N)}{2}=\\frac{3.5}{2}=1.75$$\n\n**方差（顺带，考试常追问）**：\n$$D(X)=E(N)D\\left(\\frac12\\right)+D(N)\\left(\\frac12\\right)^2$$\n$B(1,\\frac12)$ 的方差是 $\\dfrac14$，$D(N)=\\dfrac{35}{12}\\approx2.917$：\n$$D(X)=3.5\\times0.25+2.917\\times0.25=0.875+0.729=1.604$$\n\n**干扰项**：$3.5=E(N)$，忽略了每次一半的概率；$2$ 是「$4$ 枚硬币」的误算；$1.5$ 是「骰子取 3」的粗略估算。\n\n**为什么不能写 $E(X)=\\dfrac{E(N)}{2}$ 就完事**：这个结果对，但**理由**是全期望公式，不是「平均一下」。大题要写\n$$E(X)=\\sum_{n=1}^{6}E(X\\mid N=n)P(N=n)=\\sum_{n=1}^6\\frac n2\\cdot\\frac16=\\frac{21}{12}=1.75$$\n才拿满分。\n\n**这类题的标准结构**：先条件、再平均。凡是「先随机个数、再随机结果」的题，一律这样处理。","pack":"ME"},{"id":"ME-11","type":"choice","points":"5","stem":"设 $X\\sim U(0,1)$，则 $E\\left(-\\ln X\\right)=$____。","options":[["A","$1$"],["B","$\\dfrac12$"],["C","$e$"],["D","$+\\infty$"]],"answer":"A","solution":"**直接积分**（密度为 1）：\n$$E(-\\ln X)=-\\int_0^1\\ln x\\,dx$$\n\n用分部积分：$\\displaystyle\\int\\ln x\\,dx=x\\ln x-x$，故\n$$-\\left[x\\ln x-x\\right]_0^1=-\\left[(0-1)-\\lim_{x\\to0^+}(x\\ln x-x)\\right]$$\n\n其中 $\\lim_{x\\to0^+}x\\ln x=0$（可用洛必达验证），$\\lim(-x)=0$，所以\n$$E(-\\ln X)=-\\left[-1-0\\right]=1$$\n\n**更强的结论**：$-a\\ln X\\sim E\\left(\\dfrac1a\\right)$，本题 $a=1$ 得 $-a\\ln X$ 的均值为 $a=1$ ✓。\n\n**为什么不是无穷**：虽然 $-\\ln x\\to+\\infty$（$x\\to0^+$），但只有极小的 $x$ 才会产生大的取值，而均匀密度在那里并没有额外权重，积分仍然收敛。\n\n**对照反例**：$E\\left(\\dfrac1X\\right)=\\displaystyle\\int_0^1\\frac{dx}{x}=+\\infty$，这个才发散。**两者的差别在于 $-\\ln x$ 的发散速度是对数级，而 $\\dfrac1x$ 是一阶极点。**\n\n**这条的实际用途**：$-\\ln X$ 是「用均匀随机数生成指数随机数」的标准方法（逆变换法），本题的期望 $1$ 正好对应 $E(1)$。","pack":"ME"},{"id":"ME-12","type":"choice","points":"5","stem":"设 $X\\sim N(0,1)$，令 $Y=\\max\\{X,0\\}$，则 $E(Y)=$____。","options":[["A","$\\dfrac{1}{\\sqrt{2\\pi}}\\approx0.399$"],["B","$0.5$"],["C","$0$"],["D","$1$"]],"answer":"A","solution":"**$Y$ 是混合型**：$Y=0$ 的概率为 $P(X\\le0)=\\dfrac12$，$Y>0$ 时 $Y=X$。\n\n**分段求期望**：\n$$E(Y)=0\\times P(X\\le0)+\\int_0^{\\infty}x\\varphi_0(x)\\,dx$$\n$$\\varphi_0(x)=\\frac{1}{\\sqrt{2\\pi}}e^{-x^2/2}$$\n\n第二项用换元 $u=\\dfrac{x^2}{2}$，$du=x\\,dx$：\n$$\\int_0^{\\infty}\\frac{x}{\\sqrt{2\\pi}}e^{-x^2/2}dx=\\frac{1}{\\sqrt{2\\pi}}\\int_0^{\\infty}e^{-u}du=\\frac{1}{\\sqrt{2\\pi}}\\approx0.3989$$\n\n**为什么不是 $\\dfrac12$**：有人把「$Y$ 有一半概率为 0」直接当成期望 $\\dfrac12$，错在把**条件均值**与**整体均值**混淆。正确的分解是\n$$E(Y)=P(X>0)\\cdot E(X\\mid X>0)=\\frac12\\times\\frac{2}{\\sqrt{2\\pi}}=\\frac{1}{\\sqrt{2\\pi}}$$\n其中 $E(X\\mid X>0)=\\dfrac{2}{\\sqrt{2\\pi}}\\approx0.798$（半正态分布的均值）。\n\n**顺带求二阶矩**：\n$$E(Y^2)=\\int_0^{\\infty}x^2\\varphi_0(x)dx=\\frac12$$\n故 $D(Y)=\\dfrac12-\\dfrac{1}{2\\pi}\\approx0.5-0.159=0.341$。\n\n**注意与 $\\max$ 截断的关系**：$Y=\\max\\{X,0\\}$ 在 0 处有质量 $\\dfrac12$，属于「截断型」，与 $Y=|X|$（无点质量）不同。","pack":"ME"},{"id":"ME-13","type":"subjective","points":"12","note":"建议 12 分钟","stem":"甲、乙、丙三人各掷一枚均匀硬币（每轮同时掷，各人的硬币相互独立）。若某轮出现「恰有一人的结果与另外两人不同」，则该人获胜、游戏结束；否则进入下一轮。\n(1) 求一轮就结束的概率；\n(2) 求游戏恰好进行 $k$ 轮才结束的概率；\n(3) 求游戏轮数 $T$ 的期望；\n(4) 求甲最终获胜的概率。","solution":"**(1) 一轮结束的概率。** 三人各掷一枚，共 $2^3=8$ 个等可能结果。\n\n**结束的情形**：恰有一人与众不同。\n- 甲不同：$(正,反,反)$、$(反,正,正)$，共 2 种；\n- 乙不同：2 种；丙不同：2 种。\n\n合计 $6$ 种，故\n$$p=P(\\text{一轮结束})=\\frac68=\\frac34$$\n\n**未结束的情形**只有 2 种：全正、全反，概率 $\\dfrac28=\\dfrac14$。\n\n**(2) 恰好 $k$ 轮结束。** 前 $k-1$ 轮都没结束，第 $k$ 轮结束：\n$$P(T=k)=\\left(\\frac14\\right)^{k-1}\\cdot\\frac34,\\qquad k\\ge1$$\n\n即 $T$ 服从参数 $p=\\dfrac34$ 的几何分布。\n\n**(3) 期望轮数。**\n$$E(T)=\\frac1p=\\frac{4}{3}\\approx1.33\\ \\text{轮}$$\n\n**用尾部求和验证**：\n$$E(T)=\\sum_{k\\ge0}P(T>k)=\\sum_{k\\ge0}\\left(\\frac14\\right)^k=\\frac{1}{1-\\frac14}=\\frac43\\ ✓$$\n\n**(4) 甲获胜的概率。** 因为三人的地位完全对称，且每轮结束时三人的机会相同（见下），所以\n$$P(\\text{甲胜})=\\frac13$$\n\n**严格验证**：设 $W$ 为获胜者。由于每轮的 6 个「结束结果」中三人各占 2 个（对称），故\n$$P(W=\\text{甲}\\mid\\text{本轮结束})=\\frac{2}{6}=\\frac13$$\n且这一条件概率与「第几轮结束」无关（每轮独立、同分布），于是\n$$P(W=\\text{甲})=\\sum_{k\\ge1}P(T=k)\\cdot\\frac13=\\frac13$$\n\n**关键洞察**：**获胜者身份与结束轮次相互独立**。这个结论让 (4) 一步可得，不必去算复杂级数。\n\n**评分要点（12 分）**：\n- (1) 枚举 6 个结果 3 分、概率 1 分；\n- (2) 分布律 3 分（认出几何分布给 1 分）；\n- (3) 期望 2 分；\n- (4) 结论 2 分、对称性论证 1 分。\n\n**易错**：\n- 把「恰有一人不同」算成 3 种（只数了「甲不同」）；\n- 认为 $E(T)=\\dfrac{1}{1-1/4}=\\dfrac43$ 与 $\\dfrac1p$ 矛盾——其实两者一致（$\\dfrac{1}{1-q}=\\dfrac1p$）；\n- (4) 想当然答 $\\dfrac12$（把「恰有一人不同」误当成「甲与乙丙不同」的二选一）。","pack":"ME"},{"id":"ME-14","type":"subjective","points":"12","note":"建议 14 分钟","stem":"设某段时间内到达的顾客数 $N\\sim P(\\lambda)$。每位顾客独立地以概率 $p$ 完成购买（称「成功」），以概率 $q=1-p$ 空手离开。记 $Y$ 为完成购买的顾客数，$X$ 为空手离开的顾客数。\n(1) 用全概率公式与级数求和证明 $Y\\sim P(\\lambda p)$；\n(2) 求 $E(Y)$、$D(Y)$，并用全期望公式核对 $E(Y)$；\n(3) 判断 $Y$ 与 $X$ 是否独立，说明理由。","solution":"**(1) 证明。** 由全概率公式（按 $N$ 的取值分组）：\n$$P(Y=k)=\\sum_{n\\ge k}P(N=n)\\,P(Y=k\\mid N=n)=\\sum_{n\\ge k}e^{-\\lambda}\\frac{\\lambda^n}{n!}\\binom nk p^kq^{n-k}$$\n\n把组合数写成阶乘并约去 $n!$：\n$$=\\sum_{n\\ge k}e^{-\\lambda}\\frac{\\lambda^n}{n!}\\cdot\\frac{n!}{k!\\,(n-k)!}p^kq^{n-k}=\\frac{e^{-\\lambda}p^k}{k!}\\sum_{n\\ge k}\\frac{\\lambda^n q^{n-k}}{(n-k)!}$$\n\n令 $m=n-k$，则 $\\lambda^n=\\lambda^{m+k}$：\n$$=\\frac{e^{-\\lambda}(\\lambda p)^k}{k!}\\sum_{m\\ge0}\\frac{(\\lambda q)^m}{m!}=\\frac{e^{-\\lambda}(\\lambda p)^k}{k!}e^{\\lambda q}$$\n\n用 $q=1-p$，$-\\lambda+\\lambda q=-\\lambda p$：\n$$P(Y=k)=\\frac{(\\lambda p)^k}{k!}e^{-\\lambda p},\\qquad k=0,1,2,\\dots$$\n\n这正是参数为 $\\lambda p$ 的泊松分布 ✓。\n\n**(2) 期望与方差。**\n由 (1) 直接读出\n$$E(Y)=D(Y)=\\lambda p$$\n\n**用全期望核对**：给定 $N=n$ 时，$Y$ 是 $n$ 次独立试验的成功次数，\n$$E(Y\\mid N)=Np\\ \\Rightarrow\\ E(Y)=E(Np)=pE(N)=\\lambda p\\ ✓$$\n\n**方差也可用全方差公式核对**：\n$$D(Y)=E(N)D\\left(\\text{单次}\\right)+D(N)p^2=\\lambda\\,p(1-p)+\\lambda p^2=\\lambda p\\ ✓$$\n\n**(3) $Y$ 与 $X$ 的独立性。** 二者**不独立**，因为\n$$X=N-Y$$\n给定 $Y=k$ 就限制了 $X=N-k$，而 $N$ 的分布并未固定，两者强相关。\n\n**但有一个漂亮的结果**：$Y$ 与 $X$ 的**联合分布**是\n$$P(Y=j,X=k)=e^{-\\lambda}\\frac{(\\lambda p)^j}{j!}\\frac{(\\lambda q)^k}{k!}$$\n（把 $n=j+k$ 代入即可，$n!$ 与 $j!k!$ 恰好凑成多项分布的形式），并且 $X\\sim P(\\lambda q)$、$Y\\sim P(\\lambda p)$。\n\n**严格判断独立性**：\n$$P(Y=j,X=k)=e^{-\\lambda p}e^{-\\lambda q}\\frac{(\\lambda p)^j}{j!}\\frac{(\\lambda q)^k}{k!}=P(Y=j)P(X=k)$$\n—— 咦，这里两式相等，说明 $Y$ 与 $X$ **实际上相互独立**！\n\n**结论修正**：$Y$ 与 $X$ **相互独立**，且分别服从 $P(\\lambda p)$ 与 $P(\\lambda q)$。这一结果称为**泊松过程的分解定理**：按独立同分布的标签把泊松点过程拆开，各部分仍是独立的泊松过程。\n\n**为什么会「感觉」不独立**：因为 $X=N-Y$，表面上 $N$ 固定时二者互补。但 $N$ 本身是随机的，这个约束被「随机化」掉了，反而使二者独立。**这是概率论里最反直觉的结论之一**。\n\n**评分要点（12 分）**：\n- (1) 全概率式 3 分、约分与换元 4 分、结论 1 分；\n- (2) $E$ 1 分、$D$ 2 分（全期望核对 1 分）；\n- (3) 判断 1 分（答「独立」并给出联合分布才满分）。\n\n**易错**：\n- (1) 忘记把 $\\lambda^n$ 拆成 $\\lambda^k\\lambda^{m}$；\n- (2) 把 $D(Y)$ 算成 $\\lambda p(1-p)$（那是把 $N$ 当成固定的）；\n- (3) 只凭 $X=N-Y$ 就断言「不独立」。","pack":"ME"},{"id":"ME-15","type":"subjective","points":"16","note":"建议 18 分钟","stem":"设连续型随机变量 $X$ 的概率密度为\n$$f(x)=\\begin{cases}\\dfrac{c}{x^{3}}, & x>1\\\\ 0, & x\\le1\\end{cases}$$\n(1) 求常数 $c$；\n(2) 求分布函数 $F(x)$；\n(3) 求 $E(X)$，并判断 $D(X)$ 是否存在；\n(4) 令 $Y=\\dfrac1X$，求 $Y$ 的密度与 $E(Y)$。","solution":"**(1) 归一化。** 这是**无界区间**上的广义积分：\n$$\\int_1^{+\\infty}\\frac{c}{x^3}dx=c\\left[-\\frac{1}{2x^2}\\right]_1^{+\\infty}=c\\left(0+\\frac12\\right)=\\frac c2=1$$\n故 $c=2$。\n\n**(2) 分布函数。** 对 $x\\le1$，$F=0$；对 $x>1$：\n$$F(x)=\\int_1^{x}\\frac{2}{t^3}dt=\\left[-\\frac{1}{t^2}\\right]_1^{x}=1-\\frac{1}{x^2}$$\n\n$$F(x)=\\begin{cases}0, & x\\le1\\\\ 1-\\dfrac{1}{x^2}, & x>1\\end{cases}$$\n\n**检查**：$F(1)=0$ ✓（与左段衔接），$F(+\\infty)=1$ ✓，单调递增 ✓。\n\n**(3) 期望与方差。**\n$$E(X)=\\int_1^{+\\infty}x\\cdot\\frac{2}{x^3}dx=2\\int_1^{+\\infty}\\frac{dx}{x^2}=2\\left[-\\frac1x\\right]_1^{+\\infty}=2$$\n\n**二阶矩**：\n$$E(X^2)=\\int_1^{+\\infty}x^2\\cdot\\frac{2}{x^3}dx=2\\int_1^{+\\infty}\\frac{dx}{x}=2\\lim_{b\\to\\infty}\\ln b=+\\infty$$\n\n**故 $D(X)$ 不存在**（发散到无穷）。\n\n**这就是「重尾」的典型表现**：密度按 $x^{-3}$ 衰减，刚好让一阶矩收敛（$\\int x^{-2}<\\infty$），却让二阶矩发散（$\\int x^{-1}=\\infty$）。若密度改成 $x^{-4}$（即 $\\alpha=3$ 的 Pareto），二阶矩才收敛。\n\n**一般规律**：$f(x)\\sim x^{-(\\alpha+1)}$ 时，$E(X^k)$ 存在 $\\iff k<\\alpha$。本题 $\\alpha=2$：$k=1$ 收敛，$k=2$ 发散 ✓。\n\n**(4) $Y=1/X$ 的分布。** $X>1\\Rightarrow Y\\in(0,1)$。对 $0<y<1$：\n$$F_Y(y)=P\\left(\\frac1X\\le y\\right)=P\\left(X\\ge\\frac1y\\right)=1-F_X\\left(\\frac1y\\right)$$\n$$=1-\\left(1-y^2\\right)=y^2$$\n\n（这里用了 $X$ 连续，故 $P(X\\ge1/y)=P(X>1/y)$。）\n\n$$f_Y(y)=2y,\\qquad 0<y<1$$\n\n即 $Y\\sim$ Beta(2,1)，密度在 1 处取最大值 2。\n\n**求 $E(Y)$**：\n$$E(Y)=\\int_0^1y\\cdot2y\\,dy=\\frac23$$\n\n**用 $X$ 的密度核对**：\n$$E\\left(\\frac1X\\right)=\\int_1^{+\\infty}\\frac1x\\cdot\\frac{2}{x^3}dx=2\\int_1^{+\\infty}x^{-4}dx=2\\cdot\\frac13=\\frac23\\ ✓$$\n\n**评分要点（16 分）**：\n- (1) 广义积分 3 分；\n- (2) 分段 $F$ 4 分；\n- (3) $E(X)$ 3 分、$E(X^2)$ 发散 3 分、结论 1 分；\n- (4) $F_Y$ 1 分、$f_Y$ 1 分、$E(Y)$ 1 分（用两种方法各得 1 分）。\n\n**易错**：\n- (1) 写成 $\\int_0^\\infty$，下限错（$x\\le1$ 时密度为 0）；\n- (3) 算出 $E(X^2)=\\dfrac{2}{0}$ 就直接写「不存在」而不指出是发散；\n- (4) 忘记 $Y$ 的取值范围是 $(0,1)$，密度写成全轴；\n- (4) 变换时不等号方向弄反（$1/X\\le y\\iff X\\ge1/y$，因为 $X>0$）。","pack":"ME"},{"id":"MF-1","type":"choice","points":"5","stem":"设 $A,B$ 相互独立，$P(A)=0.5$，$P(B)=0.3$，则 $P(A-B)=$____。","options":[["A","$0.35$"],["B","$0.20$"],["C","$0.15$"],["D","$0.50$"]],"answer":"A","solution":"**第一个坑**：$P(A-B)\\ne P(A)-P(B)$。\n\n**正确路径**：\n$$P(A-B)=P(A)-P(AB)$$\n\n由独立，$P(AB)=P(A)P(B)=0.5\\times0.3=0.15$，故\n$$P(A-B)=0.5-0.15=0.35$$\n\n**更快的路径**：$A-B=A\\bar B$，而 $A$ 与 $\\bar B$ 独立（独立事件取补仍独立），故\n$$P(A\\bar B)=P(A)P(\\bar B)=0.5\\times0.7=0.35\\ ✓$$\n\n**干扰项**：\n- $0.20=0.5-0.3$：典型的「$P(A)-P(B)$」错误；\n- $0.15=P(AB)$：把「只有 A」当成了「A 且 B」；\n- $0.50=P(A)$：忽略了 $B$。\n\n**这类题的固定套路**：见到「只有 A 发生」，一律写成 $A\\bar B$，再用独立性拆乘积。","pack":"MF"},{"id":"MF-2","type":"choice","points":"5","stem":"设 $X\\sim N(2,\\,4)$，则 $P(X<0)=$____（$\\Phi_0(1)=0.8413$）。","options":[["A","$0.1587$"],["B","$0.0228$"],["C","$0.3085$"],["D","$0.8413$"]],"answer":"A","solution":"**第二个坑**：$N(2,4)$ 的第二个参数是**方差**，标准差 $\\sigma=2$。\n\n**标准化**：\n$$P(X<0)=P\\left(Z<\\frac{0-2}{2}\\right)=P(Z<-1)=\\Phi_0(-1)$$\n$$=1-\\Phi_0(1)=1-0.8413=0.1587$$\n\n**干扰项**：\n- $0.0228=\\Phi_0(-2)$：用了 $\\sigma=1$（把方差当标准差）；\n- $0.3085=\\Phi_0(-0.5)$：用了 $\\sigma=4$（把方差直接当 $\\sigma$ 除）；\n- $0.8413=\\Phi_0(1)$：忘了取补。\n\n**三个答案对应三种典型错误**，这正是本题的设计意图。做题时先写下\n$$\\sigma=\\sqrt{D(X)}=2$$\n这一步，再动笔。\n\n**口诀**：$N(\\mu,\\sigma^2)$ 里**第二个数是方差**，分母永远用 $\\sqrt{\\text{第二个数}}$。","pack":"MF"},{"id":"MF-3","type":"choice","points":"5","stem":"设 $X$ 的密度为 $f(x)=2x$（$0<x<1$），其余为 $0$，则 $P\\left(X>\\dfrac12\\ \\middle|\\ X>\\dfrac14\\right)=$____。","options":[["A","$0.80$"],["B","$0.75$"],["C","$0.94$"],["D","$0.25$"]],"answer":"A","solution":"**第三个坑**：条件概率要**同时压缩分子与分母**，不能只算分子。\n\n**先求 $F(x)=x^2$**（$0\\le x\\le1$），故\n$$P\\left(X>\\frac14\\right)=1-\\frac1{16}=\\frac{15}{16}=0.9375$$\n$$P\\left(X>\\frac12\\right)=1-\\frac14=\\frac34=0.75$$\n\n**条件概率**（注意 $\\{X>\\frac12\\}\\subset\\{X>\\frac14\\}$，故交集就是前者）：\n$$P\\left(X>\\frac12\\ \\middle|\\ X>\\frac14\\right)=\\frac{P(X>\\frac12)}{P(X>\\frac14)}=\\frac{0.75}{0.9375}=0.8$$\n\n**干扰项**：\n- $0.75$：只算了分子 $P(X>\\frac12)$，忘了除以条件概率；\n- $0.9375$：算了分母；\n- $0.25$：算了 $\\frac{1}{4}$ 这个数本身。\n\n**几何理解**：条件 $X>\\frac14$ 把样本空间压到 $[0.25,1]$，在这段区间里，$X>\\frac12$ 占的长度比例是 $\\dfrac{1-0.5}{1-0.25}=\\dfrac{0.5}{0.75}=\\dfrac23$。但本题密度不是均匀的（$f=2x$ 递增），所以要用**概率质量**而非长度：$\\dfrac{0.75}{0.9375}=0.8$。**这正是不均匀密度下「比例」与「概率」不同的地方。**\n\n**检验**：$0.8>\\dfrac23$，因为密度在右侧更大，右侧的质量占比应当高于长度占比 ✓。","pack":"MF"},{"id":"MF-4","type":"choice","points":"5","stem":"某人投篮命中率为 $0.4$，各次独立。投 5 次，则**至少命中一次**的概率为____。","options":[["A","$0.92224$"],["B","$0.98976$"],["C","$0.40000$"],["D","$0.07776$"]],"answer":"A","solution":"**第四个坑**：「至少一次」必须取补，不能直接加。\n\n$$P(\\text{至少一次})=1-P(\\text{全不中})=1-(0.6)^5=1-0.07776=0.92224$$\n\n**干扰项**：\n- $0.07776=(0.6)^5$：那是「全不中」，方向反了；\n- $0.98976=1-(0.4)^5$：把「全不中」误写成「全中」；\n- $0.4$：单次命中率。\n\n**为什么不能算 $\\binom51(0.4)(0.6)^4+\\cdots$**：要加五项，且容易漏项。取补只需算一项。\n\n**顺带**：本题「恰好一次」为 $\\binom51(0.4)(0.6)^4=5\\times0.4\\times0.1296=0.2592$，与「至少一次」$0.922$ 差得很远——两者不要混。\n\n**一句话**：**「至少一次」= $1-$「一次都没有」。**","pack":"MF"},{"id":"MF-5","type":"choice","points":"5","stem":"设某元件寿命 $X\\sim E\\left(\\dfrac13\\right)$（单位：年），则 $P(X>3)=$____。","options":[["A","$e^{-1}\\approx0.368$"],["B","$e^{-3}\\approx0.050$"],["C","$1-e^{-1}\\approx0.632$"],["D","$e^{-9}\\approx0.0001$"]],"answer":"A","solution":"**第五个坑**：$E(\\lambda)$ 中的 $\\lambda$ 是**率参数**，均值是 $\\dfrac1\\lambda$。\n\n本题 $\\lambda=\\dfrac13$，均值 $\\dfrac1\\lambda=3$ 年。\n\n$$P(X>3)=e^{-\\lambda\\cdot3}=e^{-\\frac13\\cdot3}=e^{-1}\\approx0.368$$\n\n**干扰项**：\n- $e^{-3}$：把 $\\lambda$ 当成了 $1$；\n- $1-e^{-1}$：方向反了；\n- $e^{-9}$：把 $3$ 当成了 $\\lambda$ 又乘一次。\n\n**与均值的关系**：$P(X>\\text{均值})=e^{-1}$ 对**任何**指数分布都成立。本题 $3$ 正好是均值，所以答案必为 $e^{-1}$ —— 这条可以当自检。\n\n**顺带**：$P(X>2E X)=e^{-2}\\approx0.135$，$P(X>0.5 E X)=e^{-0.5}\\approx0.607$。\n\n**参数约定提醒**：有的教材写 $E(\\theta)$ 表示均值为 $\\theta$，本课程统一用**率** $\\lambda$，均值 $\\dfrac1\\lambda$。看到题目给的是「平均寿命」就要先取倒数。","pack":"MF"},{"id":"MF-6","type":"choice","points":"5","stem":"设 $X$ 服从参数为 $\\dfrac14$ 的几何分布（首次成功所需的总次数），则 $D(X)=$____。","options":[["A","$12$"],["B","$4$"],["C","$16$"],["D","$3$"]],"answer":"A","solution":"**第六个坑**：几何分布的方差分母是 $p^2$，不是 $p$。\n\n$$D(X)=\\frac{q}{p^2}=\\frac{1-\\frac14}{\\left(\\frac14\\right)^2}=\\frac{\\frac34}{\\frac1{16}}=\\frac34\\times16=12$$\n\n**期望**：$E(X)=\\dfrac1p=4$。\n\n**干扰项**：\n- $4=E(X)$，不是方差；\n- $16=\\dfrac{1}{p^2}$，漏了分子 $q$；\n- $3=\\dfrac{q}{p}$，分母漏了平方。\n\n**用另一个公式核对**：$D(X)=\\dfrac{1-p}{p^2}=\\dfrac{0.75}{0.0625}=12$ ✓。\n\n**标准差**：$\\sqrt{12}\\approx3.46$，比均值 $4$ 还接近，说明几何分布的**波动极大**——这也是「等成功」类过程的共同特点（右尾很长）。\n\n**顺带对比**：$p=\\dfrac12$ 时 $E=2$、$D=2$；$p=\\dfrac14$ 时 $E=4$、$D=12$ —— 方差增长得比均值快得多（平方关系）。","pack":"MF"},{"id":"MF-7","type":"choice","points":"5","stem":"设 $X\\sim P(4)$，则 $P(X\\le1)=$____。","options":[["A","$5e^{-4}$"],["B","$e^{-4}$"],["C","$1-5e^{-4}$"],["D","$4e^{-4}$"]],"answer":"A","solution":"**第七个坑**：$P(X\\le1)$ 包含 $k=0$ 与 $k=1$ **两项**。\n\n$$P(X\\le1)=P(X=0)+P(X=1)=e^{-4}+4e^{-4}=5e^{-4}\\approx5\\times0.0183=0.0916$$\n\n**干扰项**：\n- $e^{-4}$：只算了 $k=0$；\n- $1-5e^{-4}$：那是 $P(X\\ge2)$，方向反了；\n- $4e^{-4}$：只算了 $k=1$。\n\n**记牢边界**：$P(X\\le1)$ 含 **0 与 1**；$P(X<1)$ 只含 0；$P(X\\ge1)=1-e^{-\\lambda}$。\n\n**数值**：$e^{-4}\\approx0.0183$，故 $P(X\\le1)\\approx0.0916$，$P(X\\ge2)\\approx0.9084$。\n\n**为什么容易漏**：泊松从 0 开始取值，很多人的直觉从 1 开始。**看到泊松，先默念「从 0 开始」。**","pack":"MF"},{"id":"MF-8","type":"choice","points":"5","stem":"设 $X\\sim U(2,8)$，则 $D(X)=$____。","options":[["A","$3$"],["B","$6$"],["C","$\\sqrt3$"],["D","$12$"]],"answer":"A","solution":"**第八个坑**：均匀分布的方差是 $\\dfrac{(b-a)^2}{12}$，分母是 12 而不是别的。\n\n$$D(X)=\\frac{(8-2)^2}{12}=\\frac{36}{12}=3$$\n\n**干扰项**：\n- $6=b-a$：那是区间长度；\n- $\\sqrt3$：那是标准差；\n- $12$：把公式的分母当成了分子。\n\n**顺带**：$E(X)=\\dfrac{2+8}{2}=5$；标准差 $\\sqrt3\\approx1.732$。\n\n**为什么分母是 12**：连续均匀的方差公式来自 $\\int_a^b\\left(x-\\dfrac{a+b}{2}\\right)^2\\dfrac{dx}{b-a}=\\dfrac{(b-a)^2}{12}$。记不住时可以用 $U(0,1)$ 验证：$D=\\dfrac1{12}$ ✓。\n\n**与离散均匀的区别**：掷骰子（1~6，离散均匀）的方差是 $\\dfrac{6^2-1}{12}=\\dfrac{35}{12}\\approx2.917$，公式是 $\\dfrac{n^2-1}{12}$，别与连续的 $\\dfrac{(b-a)^2}{12}$ 混。","pack":"MF"},{"id":"MF-9","type":"choice","points":"5","stem":"设 $P(A)=0.5$，$P(B)=0.4$，$P(C)=0.3$，$P(AB)=0.2$，$P(AC)=0.15$，$P(BC)=0.1$，$P(ABC)=0.05$，则 $P(A\\cup B\\cup C)=$____。","options":[["A","$0.75$"],["B","$0.80$"],["C","$0.85$"],["D","$0.95$"]],"answer":"B","solution":"**第九个坑**：三事件容斥的符号是 $+ - - - +$，最后一项 $+P(ABC)$ 最容易漏。\n\n$$P(A\\cup B\\cup C)=P(A)+P(B)+P(C)-P(AB)-P(AC)-P(BC)+P(ABC)$$\n$$=0.5+0.4+0.3-0.2-0.15-0.1+0.05$$\n$$=1.2-0.45+0.05=0.80$$\n\n**干扰项**：\n- $0.75$：漏掉 $+0.05$；\n- $0.85$：把 $P(ABC)$ 加了两次；\n- $0.95$：把两两交全减、三重交加两次以上。\n\n**用韦恩图分段验证**：\n- 只在 $A$：$0.5-0.2-0.15+0.05=0.20$\n- 只在 $B$：$0.4-0.2-0.1+0.05=0.15$\n- 只在 $C$：$0.3-0.15-0.1+0.05=0.10$\n- 只 $AB$：$0.2-0.05=0.15$；只 $AC$：$0.10$；只 $BC$：$0.05$\n- 三个都：$0.05$\n\n合计 $0.20+0.15+0.10+0.15+0.10+0.05+0.05=0.80$ ✓\n\n**记忆**：容斥的系数是 $\\binom31-\\binom32+\\binom33=3-3+1=1$，符号交替，项数 $2^n-1$。","pack":"MF"},{"id":"MF-10","type":"choice","points":"5","stem":"某系统由 3 个相互独立的子系统串联而成，每个子系统的可靠度为 $0.9$。则系统**至少有一个**子系统失效的概率为____。","options":[["A","$0.001$"],["B","$0.271$"],["C","$0.300$"],["D","$0.729$"]],"answer":"B","solution":"**第十个坑**：「至少一个失效」要用**全部正常**取补，且串联意味着「全部正常才正常」。\n\n$$P(\\text{全部正常})=(0.9)^3=0.729$$\n$$P(\\text{至少一个失效})=1-0.729=0.271$$\n\n**干扰项**：\n- $0.001=(0.1)^3$：那是「**全部**失效」的概率；\n- $0.300=3\\times0.1$：直接相加，忽略了可能同时失效；\n- $0.729$：那是「全部正常」，方向反了。\n\n**四个概率一次说清**（$n=3$，$p=0.9$）：\n- 全部正常：$0.9^3=0.729$\n- 至少一个失效：$0.271$\n- 恰好一个失效：$\\binom31(0.1)(0.9)^2=0.243$\n- 全部失效：$0.1^3=0.001$\n\n**验算**：$0.243+3\\times(0.1)^2(0.9)+0.001=0.243+0.027+0.001=0.271$ ✓（恰一个 + 恰两个 + 全失效）。\n\n**串联系统的可靠度**就是 $0.729$——这正是「串联越多越不可靠」的量化体现。","pack":"MF"},{"id":"MF-11","type":"choice","points":"5","stem":"某设备每次启动有 $40%$ 的概率无需等待（等待时间为 $0$），其余情况下等待时间服从 $U(0,10)$（分钟）。则平均等待时间为____分钟。","options":[["A","$4$"],["B","$6$"],["C","$3$"],["D","$5$"]],"answer":"C","solution":"**第十一个坑**：混合分布的期望要**按权重加权**，不能只取连续部分的均值。\n\n$$E(W)=0.4\\times0+0.6\\times\\frac{0+10}{2}=0.6\\times5=3$$\n\n**干扰项**：\n- $4=0.4\\times10$：权重用错了；\n- $6=0.6\\times10$：忘了 $U(0,10)$ 的均值是 5 而不是 10；\n- $5$：只算了连续部分的均值，没加权。\n\n**完整分布（考试常要求）**：\n$$F_W(w)=\\begin{cases}0, & w<0\\\\ 0.4+\\dfrac{0.6w}{10}, & 0\\le w<10\\\\ 1, & w\\ge10\\end{cases}$$\n在 $w=0$ 处从 0 跳到 $0.4$。\n\n**一般公式**：\n$$E(W)=\\sum_iw_iE(W\\mid\\text{第 }i\\text{ 类})$$\n必须把每一类的条件均值乘上该类的概率。\n\n**自检**：$E(W)$ 应落在 $[0,10]$ 内，且明显小于 $5$（因为 $40%$ 的情形是 $0$），答案 $3$ 合理。","pack":"MF"},{"id":"MF-12","type":"choice","points":"5","stem":"设 $P(A)=0.3$，$P(B)=0.4$，$P(A\\mid B)=0.5$，则 $P(B\\mid A)=$____。","options":[["A","$\\dfrac23$"],["B","$\\dfrac12$"],["C","$\\dfrac35$"],["D","$\\dfrac{3}{20}$"]],"answer":"A","solution":"**第十二个坑**：条件概率的**方向不能互换**，$P(A\\mid B)\\ne P(B\\mid A)$。\n\n**第一步：先求交集。**\n$$P(AB)=P(B)P(A\\mid B)=0.4\\times0.5=0.2$$\n\n**第二步：换方向。**\n$$P(B\\mid A)=\\frac{P(AB)}{P(A)}=\\frac{0.2}{0.3}=\\frac23$$\n\n**干扰项**：\n- $0.5$：直接把 $P(A\\mid B)$ 当成答案，这是最典型的错误；\n- $0.6=\\dfrac{0.3}{0.5}$：分子分母放错；\n- $\\dfrac3{20}=0.15$：把 $P(A)P(A\\mid B)=0.15$ 当成交集。\n\n**为什么两个方向差这么多**：分母不同（$P(B)=0.4$ 对 $P(A)=0.3$），而且 $P(AB)=0.2$ 已经接近 $P(A)=0.3$，说明「A 发生时 B 几乎必然发生」，所以 $P(B\\mid A)$ 大。\n\n**检验**：$P(B\\mid A)=\\dfrac23>P(B)=0.4$，说明 $A$ 的发生提高了 $B$ 的概率（正相关）；而 $P(A\\mid B)=0.5>P(A)=0.3$，同样正相关，方向一致 ✓。\n\n**规范写法**：先写 $P(AB)=P(B)P(A\\mid B)$，再写 $P(B\\mid A)=\\dfrac{P(AB)}{P(A)}$，两步都不跳，才不会被扣步骤分。","pack":"MF"},{"id":"MF-13","type":"subjective","points":"12","note":"建议 10 分钟","stem":"某班共 40 名学生，其中选修数学的有 25 人，选修物理的有 20 人，两门都选的有 10 人。\n(1) 求至少选修一门的人数与概率；\n(2) 求两门都不选的人数与概率；\n(3) 判断「选修数学」与「选修物理」是否相互独立，并说明理由；\n(4) 求 $P(\\text{数学}\\mid\\text{物理})$ 与 $P(\\text{物理}\\mid\\text{数学})$，并解释两者为什么不同。","solution":"**设** $A=$ 选数学，$B=$ 选物理。已知\n$$|A|=25,\\quad |B|=20,\\quad |AB|=10,\\quad |\\Omega|=40$$\n\n**(1) 至少一门。**\n$$|A\\cup B|=25+20-10=35,\\qquad P(A\\cup B)=\\frac{35}{40}=0.875$$\n\n**(2) 两门都不选。**\n$$|{\\bar A\\bar B}|=40-35=5,\\qquad P(\\bar A\\bar B)=\\frac{5}{40}=0.125$$\n\n**也可由德摩根**：$P(\\bar A\\bar B)=1-P(A\\cup B)=1-0.875=0.125$ ✓。\n\n**(3) 独立性判断。**\n$$P(A)=\\frac{25}{40}=0.625,\\qquad P(B)=\\frac{20}{40}=0.5,\\qquad P(AB)=\\frac{10}{40}=0.25$$\n$$P(A)P(B)=0.625\\times0.5=0.3125\\ne0.25=P(AB)$$\n\n故**不独立**。\n\n**直观解释**：$P(A\\mid B)=\\dfrac{10}{20}=0.5<P(A)=0.625$，说明「选了物理」反而**降低**了选数学的概率（时间冲突），两者负相关。\n\n**(4) 两个方向的条件概率。**\n$$P(A\\mid B)=\\frac{10}{20}=0.5,\\qquad P(B\\mid A)=\\frac{10}{25}=0.4$$\n\n**为什么不同**：两者的**分子相同**（都是交集人数 10），但**分母不同**——分别是有条件的那一方的人数（20 与 25）。$P(A\\mid B)$ 回答「在选物理的人里，有多大比例选数学」，$P(B\\mid A)$ 回答「在选数学的人里，有多大比例选物理」。问题的提法不同，答案自然不同。\n\n**一个便于记忆的说法**：$P(\\text{病}\\mid\\text{阳性})$ 与 $P(\\text{阳性}\\mid\\text{病})$ 完全是两件事，前者是后验概率，后者是灵敏度。\n\n**评分要点（12 分）**：\n- (1) 3 分；(2) 3 分；(3) 4 分（算三个概率 2 分、比较 1 分、结论与解释 1 分）；(4) 2 分。\n\n**最易失分**：\n- (3) 只看 $P(A)+P(B)$ 与 $P(AB)$ 就下结论；\n- (4) 两个方向只答一个，或把答案写成同一个数。","pack":"MF"},{"id":"MF-14","type":"subjective","points":"12","note":"建议 12 分钟","stem":"设随机变量 $X$ 的分布函数为\n$$F(x)=\\begin{cases}0, & x<0\\\\ 0.2+0.5x, & 0\\le x<1\\\\ 1, & x\\ge1\\end{cases}$$\n(1) 判断 $F$ 是否可以作为一个随机变量的分布函数，并说明理由；\n(2) 判断 $X$ 是离散型、连续型还是混合型；\n(3) 求 $P(X=0)$、$P(X=1)$、$P(0<X<1)$；\n(4) 求 $E(X)$。","solution":"**(1) 判定。** 逐条检查：\n\n- **单调不减**：在 $[0,1)$ 上斜率为 $0.5>0$，其余段为常数 ✓；\n- **右连续**：$F(0)=0.2$，而 $F(0-)=0$，在 $0$ 处跳跃但**右连续**（$F(0)$ 取右值）✓；$F(1)=1$，$F(1-)=0.7$，同样右连续 ✓；\n- **两端极限**：$F(-\\infty)=0$，$F(+\\infty)=1$ ✓。\n\n故 $F$ **可以**作为分布函数。\n\n**注意**：它**不连续**（在 $0$ 与 $1$ 处有跳跃），但分布函数只要求右连续，所以完全合法。这是本题第一个要点。\n\n**(2) 类型判断。** 既有连续增长段（$[0,1)$ 上斜率为 $0.5$），又有点质量（$x=0$ 与 $x=1$ 处有跳跃），故为**混合型**。\n\n**(3) 点概率与区间概率。** 由跳跃公式\n$$P(X=a)=F(a)-F(a-)$$\n\n- $P(X=0)=0.2-0=0.2$\n- $P(X=1)=1-0.7=0.3$\n\n**区间 $(0,1)$ 的开区间**：\n$$P(0<X<1)=F(1-)-F(0)=0.7-0.2=0.5$$\n\n**验算总质量**：$0.2\\ (\\text{在 }0)+0.5\\ (\\text{在 }(0,1))+0.3\\ (\\text{在 }1)=1$ ✓。\n\n**(4) 期望。** 分段求和 + 积分：\n$$E(X)=0\\times0.2+\\int_0^1x\\cdot0.5\\,dx+1\\times0.3$$\n$$=0+\\left[\\frac{x^2}{4}\\right]_0^1+0.3=0.25+0.3=0.55$$\n\n其中 $f(x)=F'(x)=0.5$ 在 $(0,1)$ 上（连续部分的密度）。\n\n**评分要点（12 分）**：\n- (1) 三条各 1 分、结论 1 分；\n- (2) 判断 2 分、理由 1 分；\n- (3) 三个概率各 1 分；\n- (4) 分段求期望 3 分。\n\n**最易失分**：\n- (1) 认为「有跳跃就不是分布函数」——错，只要求右连续；\n- (3) 把 $P(0<X<1)$ 算成 $F(1)-F(0)=0.8$，多算了两个点质量；\n- (4) 只算积分部分 $0.25$，漏掉 $X=1$ 处的 $0.3$。\n\n**本题的核心**：**分段 $F$ 的接点是否连续，取决于题目有没有说「连续型」**。本题没说，所以允许跳跃，是混合型。","pack":"MF"},{"id":"MF-15","type":"subjective","points":"16","note":"建议 16 分钟","stem":"设连续型随机变量 $X$ 的概率密度为\n$$f(x)=\\begin{cases}cx(2-x), & 0<x<2\\\\ 0, & \\text{其他}\\end{cases}$$\n(1) 求常数 $c$ 与分布函数 $F(x)$；\n(2) 求 $E(X)$ 与 $D(X)$；\n(3) 令 $Y=2-X$，不计算密度，直接说明 $Y$ 与 $X$ 同分布，并求 $E(Y)$；\n(4) 求 $P\\left(X>\\dfrac32\\ \\middle|\\ X>\\dfrac12\\right)$。","solution":"**(1) 归一化与分布函数。**\n$$\\int_0^2x(2-x)dx=\\int_0^2\\left(2x-x^2\\right)dx=4-\\frac83=\\frac43$$\n故 $c\\cdot\\dfrac43=1$，得 $c=\\dfrac34$。\n\n**分布函数**：$0\\le x\\le2$ 时\n$$F(x)=\\frac34\\int_0^x\\left(2t-t^2\\right)dt=\\frac34\\left(x^2-\\frac{x^3}{3}\\right)=\\frac{3x^2-x^3}{4}$$\n\n$$F(x)=\\begin{cases}0, & x<0\\\\ \\dfrac{3x^2-x^3}{4}, & 0\\le x<2\\\\ 1, & x\\ge2\\end{cases}$$\n\n**(2) 期望与方差。**\n$$E(X)=\\frac34\\int_0^2x^2(2-x)dx=\\frac34\\int_0^2\\left(2x^2-x^3\\right)dx=\\frac34\\left(\\frac{16}{3}-4\\right)=\\frac34\\cdot\\frac43=1$$\n\n**这个结果是必然的**：密度关于 $x=1$ 对称（$f(1+t)=f(1-t)$），故期望就是对称中心 1。\n\n$$E(X^2)=\\frac34\\int_0^2x^3(2-x)dx=\\frac34\\int_0^2\\left(2x^3-x^4\\right)dx=\\frac34\\left(8-\\frac{32}{5}\\right)=\\frac34\\cdot\\frac85=\\frac65$$\n\n$$D(X)=\\frac65-1=\\frac15=0.2$$\n\n**(3) 同分布论证。** 对 $0<y<2$：\n$$f_Y(y)=\\frac{1}{|-1|}f_X(2-y)=\\frac34(2-y)\\left[2-(2-y)\\right]=\\frac34(2-y)y$$\n\n与 $f_X(y)=\\dfrac34y(2-y)$ **完全相同**，故 $Y$ 与 $X$ 同分布。\n\n**几何解释**：$f$ 关于 $x=1$ 对称，把区间左右翻转（$x\\mapsto2-x$）后图形不变，所以分布不变。\n\n**由此**：\n$$E(Y)=E(2-X)=2-E(X)=2-1=1\\ ✓$$\n与「同分布则期望相同」一致。\n\n**(4) 条件概率。** 由 $F(x)=\\dfrac{3x^2-x^3}{4}$：\n\n$$F\\left(\\frac32\\right)=\\frac{3\\cdot\\frac94-\\frac{27}{8}}{4}=\\frac{\\frac{27}{4}-\\frac{27}{8}}{4}=\\frac{\\frac{27}{8}}{4}=\\frac{27}{32}$$\n\n$$F\\left(\\frac12\\right)=\\frac{3\\cdot\\frac14-\\frac18}{4}=\\frac{\\frac34-\\frac18}{4}=\\frac{\\frac58}{4}=\\frac{5}{32}$$\n\n$$P\\left(X>\\frac32\\ \\middle|\\ X>\\frac12\\right)=\\frac{1-F\\left(\\frac32\\right)}{1-F\\left(\\frac12\\right)}=\\frac{1-\\frac{27}{32}}{1-\\frac{5}{32}}=\\frac{\\frac{5}{32}}{\\frac{27}{32}}=\\frac{5}{27}\\approx0.185$$\n\n**合理性检查**：无条件时 $P\\left(X>\\dfrac32\\right)=1-\\dfrac{27}{32}=\\dfrac{5}{32}\\approx0.156$；加了条件 $X>\\dfrac12$ 后升到 $0.185$，符合「已知 $X$ 不在左侧，则更可能在右侧」的直觉 ✓。\n\n**评分要点（16 分）**：\n- (1) $c$ 2 分、$F$ 分段 4 分；\n- (2) $E$ 2 分、$E(X^2)$ 3 分、$D$ 1 分；\n- (3) 密度比较 2 分、$E(Y)$ 1 分；\n- (4) 1 分。\n\n**最易失分**：\n- (1) 积分上下限写成 $0$ 到 $+\\infty$；\n- (2) 忘记用对称性直接得 $E(X)=1$（虽然算出来一样，但浪费时间）；\n- (3) 直接说「显然对称」而不写密度比较——评分要求给出 $f_Y(y)=f_X(y)$；\n- (4) 分母写成 1。","pack":"MF"}]}</script>
<script>
'use strict';
const DATA = JSON.parse(document.getElementById('quiz-data').textContent);
const PACKS = DATA.packs, QS = DATA.questions;
const KEY = 'quiz-review-probability-midterm';
const FILTERS = [['all','全部'],['todo','未完成'],['wrong','错题'],['star','收藏']];
const TYPE = {choice:'单项选择',judge:'判断',fill:'填空',subjective:'简答/计算'};
const byId = new Map(QS.map(q => [q.id, q]));
const $ = s => document.querySelector(s);
const esc = v => String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state = {pack:(PACKS[0]||{id:'P1'}).id, filter:'all', current:null, rec:{}};

const SYM = {
  theta:'θ', lambda:'λ', mu:'μ', sigma:'σ', varphi:'φ', phi:'φ', Phi:'Φ', alpha:'α', beta:'β',
  gamma:'γ', delta:'δ', Delta:'Δ', rho:'ρ', tau:'τ', chi:'χ', Omega:'Ω', omega:'ω', pi:'π',
  varepsilon:'ε', epsilon:'ε', eta:'η', xi:'ξ', psi:'ψ',
  infty:'∞', cdot:'·', times:'×', div:'÷', pm:'±', le:'≤', ge:'≥', ne:'≠', approx:'≈', equiv:'≡',
  to:'→', rightarrow:'→', Rightarrow:'⇒', leftarrow:'←', in:'∈', notin:'∉', subset:'⊂', cup:'∪', cap:'∩',
  emptyset:'∅', varnothing:'∅', forall:'∀', exists:'∃', therefore:'∴', because:'∵',
  sum:'Σ', prod:'∏', int:'∫', partial:'∂', nabla:'∇', mid:'|',
  bigcup:'∪', bigcap:'∩', bigoplus:'⊕', setminus:'∖', langle:'⟨', rangle:'⟩',
  ln:'ln', log:'log', exp:'exp', max:'max', min:'min', sin:'sin', cos:'cos', tan:'tan',
  ldots:'…', cdots:'…', dots:'…', prime:'′', circ:'∘', ast:'∗', star:'*',
  Leftrightarrow:'⇔', leftrightarrow:'↔', Leftarrow:'⇐', Longleftrightarrow:'⟺',
  iff:'⇔', implies:'⇒', mapsto:'↦', uparrow:'↑', downarrow:'↓',
  wedge:'∧', vee:'∨', neg:'¬', oplus:'⊕', otimes:'⊗', propto:'∝',
  leqslant:'≤', geqslant:'≥', ll:'≪', gg:'≫', mp:'∓',
  subseteq:'⊆', supseteq:'⊇', supset:'⊃', perp:'⊥', parallel:'∥',
  angle:'∠', triangle:'△', square:'□', bullet:'•', checkmark:'✓',
  quad:'\u2003', qquad:'\u2003\u2003', ' ':' ', ',':'\u2009', ';':'\u2009', '!':''
};
function readGroup(s, i){
  if(s[i] !== '{') return [s[i] || '', i + 1];
  let depth = 0, start = i + 1;
  for(let j = i; j < s.length; j++){
    if(s[j] === '{') depth++;
    else if(s[j] === '}'){
      depth--;
      if(depth === 0) return [s.slice(start, j), j + 1];
    }
  }
  return [s.slice(start), s.length];
}
function readArg(src, i){
  if(src[i] === '{') return readGroup(src, i);
  if(src[i] === '\\'){
    const mm = src.slice(i+1).match(/^[a-zA-Z]+/);
    if(mm) return [src.slice(i, i+1+mm[0].length), i + 1 + mm[0].length];
    return [src.slice(i, i+2), i + 2];
  }
  return [src[i] || '', i + 1];
}
function tex(src){
  let out = '', i = 0;
  while(i < src.length){
    const c = src[i];
    if(c === '\\'){
      const m = src.slice(i+1).match(/^[a-zA-Z]+/);
      const cmd = m ? m[0] : src[i+1];
      let ni = i + 1 + (m ? m[0].length : 1);
      if(m){ while(src[ni] === ' ') ni++; }
      if(cmd === 'begin' && src.startsWith('{cases}', ni)){
        const close = src.indexOf('\\end{cases}', ni + 7);
        const body = close < 0 ? src.slice(ni + 7) : src.slice(ni + 7, close);
        const rows = body.split('\\\\').map(r => r.trim()).filter(Boolean);
        out += '<span class="cases"><span class="cbrace" style="font-size:' + (rows.length * 1.55) + 'em">{</span><span class="crows">' +
          rows.map(r => {
            const parts = r.split('&');
            return '<span class="crow"><span class="cl">' + tex(parts[0] || '') + '</span><span class="cr">' +
              tex(parts.slice(1).join('&')) + '</span></span>';
          }).join('') + '</span></span>';
        i = close < 0 ? src.length : close + '\\end{cases}'.length;
      } else if(cmd === 'frac' || cmd === 'dfrac' || cmd === 'tfrac'){
        const [a, na] = readArg(src, ni);
        const [b, nb] = readArg(src, na);
        out += `<span class="frac"><span class="fn">${tex(a)}</span><span class="fd">${tex(b)}</span></span>`;
        i = nb;
      } else if(cmd === 'bar'){
        const [a, na] = readArg(src, ni);
        out += `<span class="acc">${tex(a)}</span>`;
        i = na;
      } else if(cmd === 'overline' || cmd === 'hat' || cmd === 'tilde'){
        const [a, na] = readArg(src, ni);
        out += `<span class="ovl">${tex(a)}</span>`;
        i = na;
      } else if(cmd === 'mathrm' || cmd === 'text' || cmd === 'mathbf'){
        const [a, na] = readGroup(src, ni);
        out += `<span class="up">${esc(a)}</span>`;
        i = na;
      } else if(cmd === 'left' || cmd === 'right'){
        i = ni;
      } else if(cmd === '{' || cmd === '}'){
        out += cmd; i = ni;
      } else if(cmd === '\\'){
        out += '<br>'; i = ni;
      } else if(cmd === 'sqrt'){
        const [a, na] = readArg(src, ni);
        out += `<span class="sqrt">√<span class="sq">${tex(a)}</span></span>`;
        i = na;
      } else if(cmd === 'binom' || cmd === 'C'){
        const [a, na] = readArg(src, ni);
        const [b, nb] = readArg(src, na);
        out += `<span class="binom">C<sub>${tex(a)}</sub><sup>${tex(b)}</sup></span>`;
        i = nb;
      } else if(cmd === 'big' || cmd === 'Big' || cmd === 'bigg' || cmd === 'Bigg' ||
                cmd === 'bigl' || cmd === 'bigr' || cmd === 'Bigl' || cmd === 'Bigr' ||
                cmd === 'biggl' || cmd === 'biggr' || cmd === 'Biggl' || cmd === 'Biggr'){
        i = ni;
      } else if(cmd === 'max' || cmd === 'min' || cmd === 'ln' || cmd === 'log' || cmd === 'exp' || cmd === 'lim' || cmd === 'sup' || cmd === 'inf'){
        out += '<span class="up">' + cmd + '</span>'; i = ni;
      } else if(SYM[cmd] !== undefined){
        out += SYM[cmd];
        i = ni;
      } else {
        out += cmd;
        i = ni;
      }
    } else if(c === '^' || c === '_'){
      const tag = c === '^' ? 'sup' : 'sub';
      if(src[i+1] === '{'){
        const [a, na] = readGroup(src, i+1);
        out += `<${tag}>${tex(a)}</${tag}>`;
        i = na;
      } else {
        out += `<${tag}>${tex(src[i+1] || '')}</${tag}>`;
        i += 2;
      }
    } else if(c === '~'){ out += '\u00a0'; i++; }
    else if(c === '<'){ out += '&lt;'; i++; }
    else if(c === '>'){ out += '&gt;'; i++; }
    else if(c === '&'){ out += '&amp;'; i++; }
    else { out += c; i++; }
  }
  return out;
}
function inline(p){
  const src = String(p);
  return src.split(/\$\$([\s\S]*?)\$\$/).map((seg, i) => {
    if(i % 2) return `<span class="eq eqi">${tex(seg)}</span>`;
    return seg.split('$').map((s2, j) => j % 2 ? `<span class="m">${tex(s2)}</span>` : esc(s2)).join('');
  }).join('')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/`([^`]+)`/g,'<code>$1</code>');
}
function paraHTML(block){
  const lines = block.split('\n');
  let html = '', buf = [], list = null;
  const flushP = () => { if(buf.length){ html += '<p>' + buf.map(inline).join('<br>') + '</p>'; buf = []; } };
  const flushL = () => { if(list){ html += '<ul style="margin:6px 0 6px 1.15em;padding:0">' + list.map(x => '<li>' + inline(x) + '</li>').join('') + '</ul>'; list = null; } };
  for(const l of lines){
    const t2 = l.trim();
    if(/^[-•]\s+/.test(t2)){ flushP(); (list = list || []).push(t2.replace(/^[-•]\s+/, '')); }
    else { flushL(); buf.push(l); }
  }
  flushP(); flushL();
  return html;
}
function rich(t){
  const src = String(t||'');
  const parts = src.split(/\$\$([\s\S]*?)\$\$/);
  return parts.map((seg, i) => {
    if(i % 2) return '<div class="eq">' + tex(seg) + '</div>';
    return seg.split(/\n\s*\n/).filter(Boolean).map(paraHTML).join('');
  }).join('');
}
const SUB = {'₀':'0','₁':'1','₂':'2','₃':'3','₄':'4','₅':'5','₆':'6','₇':'7','₈':'8','₉':'9','⁻':'-','⁰':'0','¹':'1','²':'2','³':'3'};
function norm(v){
  return String(v).normalize('NFKC').replace(/[₀-₉⁻⁰¹²³]/g, c => SUB[c] || c)
    .toLowerCase().replace(/[−–—]/g,'-').replace(/[×]/g,'*')
    .replace(/[（]/g,'(').replace(/[）]/g,')').replace(/\s/g,'').replace(/[；;。，,]$/,'');
}
function toNum(n){
  if(/^[+\-]?(\d+(\.\d*)?|\.\d+)(e[+\-]?\d+)?$/.test(n)) return Number(n);
  const m = n.match(/^([+\-]?\d+(?:\.\d+)?)\/([+\-]?\d+(?:\.\d+)?)$/);
  if(m) return Number(m[1]) / Number(m[2]);
  return null;
}
function fieldOK(val, f){
  if(!String(val).trim()) return false;
  const n = norm(val);
  if(f.kind === 'num'){
    const x = toNum(n);
    const pool = [f.a].concat(f.alt || []).map(v => toNum(norm(String(v)))).filter(v => v !== null);
    if(x !== null && pool.some(v => Math.abs(x - v) < 1e-3)) return true;
  }
  return n === norm(f.a) || (f.alt||[]).some(x => norm(x) === n);
}

function rec(id){
  if(!state.rec[id]) state.rec[id] = {picked:null, correct:null, draft:[], mastered:false, starred:false, tried:false, revealed:false};
  return state.rec[id];
}
function done(q){
  const r = rec(q.id);
  return q.type === 'subjective' ? r.mastered : r.correct !== null;
}
function save(){
  const el = $('#storage-status');
  try{
    localStorage.setItem(KEY, JSON.stringify({v:1, pack:state.pack, filter:state.filter, current:state.current, rec:state.rec}));
    if(el){ el.textContent = '已保存'; el.classList.remove('error'); }
  }catch(e){
    if(el){ el.textContent = '无法保存进度'; el.classList.add('error'); }
  }
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return;
    const saved = JSON.parse(raw);
    if(saved.v !== 1 || !saved.rec) return;
    state.rec = saved.rec;
    if(PACKS.some(p2 => p2.id === saved.pack)) state.pack = saved.pack;
    if(FILTERS.some(f => f[0] === saved.filter)) state.filter = saved.filter;
    if(byId.has(saved.current)) state.current = saved.current;
  }catch(e){}
}
function inPack(){ return QS.filter(q => q.pack === state.pack); }
function list(){
  return inPack().filter(q => {
    const r = rec(q.id);
    if(state.filter === 'todo') return !done(q);
    if(state.filter === 'wrong') return r.correct === false;
    if(state.filter === 'star') return r.starred;
    return true;
  });
}

function tabs(){
  $('#pack-tabs').innerHTML = PACKS.map(p =>
    `<button class="tab" role="tab" data-pack="${p.id}" aria-selected="${p.id===state.pack}">${p.head ? esc(p.head) + ' ' : ''}${esc(p.name)}</button>`
  ).join('');
  $('#pack-tabs').querySelectorAll('.tab').forEach(b => b.onclick = () => {
    state.pack = b.dataset.pack; state.filter = 'all';
    const first = list()[0]; if(first) state.current = first.id;
    render(); save();
  });
}
function filters(){
  $('#filters').innerHTML = FILTERS.map(([id,label]) =>
    `<button class="filter" data-f="${id}" aria-pressed="${id===state.filter}">${label}</button>`
  ).join('');
  $('#filters').querySelectorAll('.filter').forEach(b => b.onclick = () => {
    state.filter = b.dataset.f;
    const l = list(); if(l.length && !l.some(q=>q.id===state.current)) state.current = l[0].id;
    render(); save();
  });
}
function sidebar(){
  const p = PACKS.find(x=>x.id===state.pack) || PACKS[0];
  const all = inPack();
  const doneN = all.filter(done).length;
  const rightN = all.filter(q=>q.type!=='subjective' && rec(q.id).correct===true).length;
  $('#pack-name').textContent = (p.head ? p.head + ' · ' : '') + p.name;
  const sub = $('#pack-subtitle');
  sub.textContent = p.subtitle || '';
  sub.style.display = p.subtitle ? '' : 'none';
  $('#done-number').textContent = doneN;
  $('#correct-number').textContent = rightN;
  const pct = all.length ? Math.round(doneN/all.length*100) : 0;
  $('#progress-bar').style.width = pct + '%';
  $('.progress').setAttribute('aria-valuenow', pct);
  $('#progress-caption').textContent = all.length ? `完成 ${doneN}/${all.length} 题（${pct}%）` : '';
  $('#question-map').innerHTML = all.map((q,i) => {
    const r = rec(q.id);
    let cls = '';
    if(q.type==='subjective'){ if(r.mastered) cls='mastered'; }
    else if(r.correct===true) cls='done';
    else if(r.correct===false) cls='wrong';
    if(r.starred) cls += ' star';
    if(q.id===state.current) cls += ' current';
    return `<button class="${cls}" data-q="${q.id}" title="${esc(q.id)}">${i+1}</button>`;
  }).join('');
  $('#question-map').querySelectorAll('button').forEach(b => b.onclick = () => { state.current = b.dataset.q; render(); save(); });
  const notesBox = $('#pack-notes');
  notesBox.style.display = p.notes ? '' : 'none';
  notesBox.querySelector('.notes-body').innerHTML = rich(p.notes || '');
  const l = list();
  $('#filter-count').textContent = `${l.length} 题`;
}

function render(){
  tabs(); filters(); sidebar();
  const l = list();
  const q = byId.get(state.current);
  const card = $('#question-card');
  if(!q){ card.innerHTML = '<div class="empty">这个筛选条件下没有题目。</div>'; $('#page-position').textContent=''; return; }
  const idx = l.findIndex(x=>x.id===q.id);
  $('#page-position').textContent = idx >= 0 ? `${idx+1} / ${l.length}` : '';
  const r = rec(q.id);
  const p = PACKS.find(x=>x.id===q.pack);
  let body = '';
  if(q.type==='choice' || q.type==='judge'){
    const opts = q.type==='judge' ? [['对','正确'],['错','错误']] : q.options;
    body = `<div class="opts ${q.type==='judge'?'judge':''}">` + opts.map(([k,t]) => {
      let cls = '';
      if(r.picked){ if(k===q.answer) cls='correct'; else if(k===r.picked) cls='wrong'; }
      return `<button class="opt ${cls}" data-pick="${k}" ${r.picked?'disabled':''}><span class="k">${esc(k)}</span><span>${inline(t)}</span></button>`;
    }).join('') + '</div>';
  } else if(q.type==='fill'){
    body = q.fields.map((f,i) => `<div class="fillrow"><label>${inline(f.label || ('第 '+(i+1)+' 空'))}</label>
      <input type="text" data-fill="${i}" value="${esc((r.draft||[])[i]||'')}" placeholder="填答案" autocomplete="off"></div>`).join('')
      + `<div class="actions"><button class="btn" data-submit="1">提交核对</button><button class="btn ghost" data-clear="1">重填</button></div>`;
  } else {
    body = `<div class="actions"><button class="btn ghost" data-reveal="1">${r.mastered?'再看一遍参考答案':'查看参考答案与步骤'}</button>
      <button class="btn" data-master="1">${r.mastered?'✔ 已标记掌握（点击取消）':'我看懂了，标记为已掌握'}</button></div>`;
  }
  card.innerHTML = `
    <div class="qtop">
      <span class="badge">${TYPE[q.type] || esc(q.type)}</span>
      <span class="badge chap">${p ? esc((p.head ? p.head+' ' : '') + p.name) : ''}</span>
      ${q.points?`<span class="badge pts">${esc(q.points)} 分</span>`:''}
      <span class="qid">${esc(q.id)}</span>
      <button class="star" aria-pressed="${!!r.starred}" data-star="1" title="收藏本题">★</button>
    </div>
    <h2 class="stem">${inline(q.stem)}${q.note?`<div class="sub">${inline(q.note)}</div>`:''}</h2>
    ${body}
    <div id="feedback"></div>
    <div class="sol ${r.revealed?'show':''}" id="solution"><b>参考答案与解析：</b><br>${rich(q.solution||'')}</div>
  `;
  wire(q, r);
  $('#prev').disabled = idx <= 0;
  $('#next').disabled = idx < 0 || idx >= l.length-1;
}

function feedback(kind, html){
  const box = $('#feedback'); if(!box) return;
  box.className = 'fb ' + kind;
  box.innerHTML = html;
}
function wire(q, r){
  const card = $('#question-card');
  card.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => {
    if(r.picked) return;
    r.picked = b.dataset.pick; r.tried = true;
    r.correct = r.picked === q.answer;
    render(); save();
    const right = q.answer === r.picked;
    feedback(right?'ok':'no', `<h3>${right?'答对了':'答错了'}</h3><p>正确答案：<b>${esc(q.answer)}</b></p>`);
    $('#solution').classList.add('show'); r.revealed = true;
    $('#feedback').scrollIntoView({behavior:'smooth', block:'center'});
  });
  card.querySelectorAll('[data-fill]').forEach(inp => inp.oninput = () => {
    r.draft = r.draft || []; r.draft[+inp.dataset.fill] = inp.value;
  });
  const sub = card.querySelector('[data-submit]');
  if(sub) sub.onclick = () => {
    const vals = q.fields.map((f,i)=>(r.draft||[])[i]||'');
    if(vals.some(v=>!String(v).trim())){ feedback('info','<p>先把空填完再提交。</p>'); return; }
    const okAll = q.fields.every((f,i)=>fieldOK(vals[i], f));
    r.correct = okAll; r.tried = true;
    render(); save();
    feedback(okAll?'ok':'no', okAll
      ? '<h3>全部正确</h3>'
      : `<h3>有空格不对</h3><p>参考答案：<b>${q.fields.map((f,i)=>`(${i+1}) ${esc(f.a)}`).join('；')}</b></p>`);
    $('#solution').classList.add('show');
  };
  const clr = card.querySelector('[data-clear]');
  if(clr) clr.onclick = () => { r.draft=[]; r.correct=null; render(); save(); };
  const rev = card.querySelector('[data-reveal]');
  if(rev) rev.onclick = () => { r.revealed = true; $('#solution').classList.add('show'); };
  const mas = card.querySelector('[data-master]');
  if(mas) mas.onclick = () => { r.mastered = !r.mastered; render(); save(); };
  const star = card.querySelector('[data-star]');
  if(star) star.onclick = () => { r.starred = !r.starred; render(); save(); };
  if(q.type==='choice' || q.type==='judge'){
    if(r.picked){
      const right = r.picked === q.answer;
      feedback(right?'ok':'no', `<h3>${right?'答对了':'答错了'}</h3><p>正确答案：<b>${esc(q.answer)}</b></p>`);
      $('#solution').classList.add('show');
    }
  }
  if(q.type==='fill' && r.correct !== null){
    feedback(r.correct?'ok':'no', r.correct ? '<h3>全部正确</h3>' : `<h3>有空格不对</h3><p>参考答案：<b>${q.fields.map((f,i)=>`(${i+1}) ${esc(f.a)}`).join('；')}</b></p>`);
    $('#solution').classList.add('show');
  }
}
function go(step){
  const l = list(); const i = l.findIndex(x=>x.id===state.current);
  const nx = l[i+step]; if(!nx) return;
  state.current = nx.id; render(); save(); window.scrollTo({top:0,behavior:'smooth'});
}
$('#prev').onclick = () => go(-1);
$('#next').onclick = () => go(1);
$('#reset-all').onclick = () => {
  if(!confirm('确定清空所有答题记录吗？此操作不可撤销。')) return;
  state.rec = {}; state.current = inPack()[0]?.id || state.current;
  render(); save();
  $('#storage-status').textContent = '记录已清空';
};
document.addEventListener('keydown', e => {
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if(e.key === 'ArrowLeft') go(-1);
  if(e.key === 'ArrowRight') go(1);
});
load();
if(!PACKS.some(p=>p.id===state.pack)) state.pack = PACKS[0].id;
if(!byId.has(state.current)){
  const first = QS.find(q=>q.pack===state.pack);
  if(first) state.current = first.id;
}
render();
</script>
<script>window.QUIZ_AI = {"course": "概率论与数理统计 · 期中强化"};</script>
<script>
/* AI 助教 · 纯前端直连 OpenAI 兼容接口
   配置只写入本浏览器 localStorage，不经过任何第三方服务器。 */
(function () {
  'use strict';

  var CFG_KEY = 'quiz-ai-config-v1';
  var SKIP_KEY = 'quiz-ai-setup-skipped-v1';
  var DEFAULT_BASE = 'https://api.deepseek.com';
  var DEFAULT_MODEL = 'deepseek-flash';
  var COURSE = (window.QUIZ_AI && window.QUIZ_AI.course) || '本课程';
  var aiCfg = { baseUrl: DEFAULT_BASE, apiKey: '', model: DEFAULT_MODEL };

  try {
    var savedCfg = JSON.parse(localStorage.getItem(CFG_KEY) || '{}');
    if (savedCfg.baseUrl) aiCfg.baseUrl = savedCfg.baseUrl;
    if (savedCfg.apiKey) aiCfg.apiKey = savedCfg.apiKey;
    if (savedCfg.model) aiCfg.model = savedCfg.model;
  } catch (e) {}

  function persistCfg() {
    try { localStorage.setItem(CFG_KEY, JSON.stringify(aiCfg)); } catch (e) {}
  }

  var toastTimer = null;
  function toast(msg, ms) {
    var el = document.getElementById('ai-toast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'ai-toast';
      el.style.cssText = 'position:fixed;left:50%;bottom:104px;transform:translateX(-50%);z-index:95;pointer-events:none;' +
        'background:rgba(36,31,30,.92);color:#fff;font-size:13px;padding:10px 16px;border-radius:10px;' +
        'max-width:min(90vw,480px);line-height:1.6;box-shadow:0 8px 24px rgba(0,0,0,.2);transition:opacity .25s';
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.style.display = 'block';
    el.style.opacity = '1';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      el.style.opacity = '0';
      setTimeout(function () { el.style.display = 'none'; }, 260);
    }, ms || 2600);
  }

  /* ---------- 接口地址与请求 ---------- */
  function apiUrl(base) {
    var b = String(base || DEFAULT_BASE).trim().replace(/\/+$/, '');
    if (/\/chat\/completions$/.test(b)) return b;
    if (/\/v1$/.test(b)) return b + '/chat/completions';
    return b + '/v1/chat/completions';
  }

  function httpError(status, text) {
    var msg = '';
    try {
      var o = JSON.parse(text);
      msg = (o.error && (o.error.message || o.error)) || o.message || '';
    } catch (e) {
      msg = String(text || '').slice(0, 160);
    }
    return 'HTTP ' + status + (msg ? '：' + msg : '');
  }

  function chat(messages, opts) {
    opts = opts || {};
    var body = {
      model: aiCfg.model || DEFAULT_MODEL,
      messages: messages,
      temperature: opts.temperature === undefined ? 0.3 : opts.temperature,
      max_tokens: opts.max_tokens || 2000,
      stream: !!opts.onDelta
    };
    return fetch(apiUrl(aiCfg.baseUrl), {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + aiCfg.apiKey
      },
      body: JSON.stringify(body)
    }).then(function (res) {
      if (!res.ok) {
        return res.text().then(function (t) { throw new Error(httpError(res.status, t)); });
      }
      if (!opts.onDelta || !res.body || !res.body.getReader) {
        return res.json().then(function (data) {
          var m = (data.choices && data.choices[0] && data.choices[0].message) || {};
          return { text: m.content || '', reasoning: m.reasoning_content || '' };
        });
      }
      var acc = { text: '', reasoning: '' };
      var reader = res.body.getReader();
      var dec = new TextDecoder('utf-8');
      var buf = '';
      function pump() {
        return reader.read().then(function (r) {
          if (r.done) return;
          buf += dec.decode(r.value, { stream: true });
          var idx;
          while ((idx = buf.indexOf('\n')) >= 0) {
            var line = buf.slice(0, idx).trim();
            buf = buf.slice(idx + 1);
            if (line.indexOf('data:') !== 0) continue;
            var payload = line.slice(5).trim();
            if (!payload || payload === '[DONE]') continue;
            var obj;
            try { obj = JSON.parse(payload); } catch (e) { continue; }
            var d = (obj.choices && obj.choices[0] && obj.choices[0].delta) || {};
            if (d.reasoning_content) {
              acc.reasoning += d.reasoning_content;
              opts.onDelta('reasoning', d.reasoning_content);
            }
            if (d.content) {
              acc.text += d.content;
              opts.onDelta('content', d.content);
            }
          }
          return pump();
        });
      }
      return pump().then(function () { return acc; });
    }).catch(function (e) {
      if (e && e.name === 'TypeError') {
        throw new Error('连不上这个地址。检查 Base URL 是否写对、网络是否可用；若服务商不允许浏览器直连，会报 CORS 错误。');
      }
      throw e;
    });
  }

  function extractJson(text) {
    var start = text.indexOf('{');
    if (start < 0) throw new Error('模型没有返回 JSON');
    var depth = 0;
    for (var i = start; i < text.length; i++) {
      if (text[i] === '{') depth++;
      else if (text[i] === '}') {
        depth--;
        if (depth === 0) return JSON.parse(text.slice(start, i + 1));
      }
    }
    throw new Error('模型返回的 JSON 不完整');
  }

  /* ---------- 设置弹窗 ---------- */
  function buildSetup() {
    if (document.getElementById('ai-setup')) return;
    var box = document.createElement('div');
    box.id = 'ai-setup';
    box.innerHTML =
      '<div class="ai-modal-box" role="dialog" aria-modal="true" aria-labelledby="ai-setup-title">' +
      '<h3 id="ai-setup-title">启用 AI 助教</h3>' +
      '<p>填入你自己的 API Key。Key 只保存在本浏览器，请求直接发给你填的服务商，不经过任何中转。</p>' +
      '<label class="ai-field">Base URL<input id="ai-cfg-base" type="text" spellcheck="false" placeholder="' + DEFAULT_BASE + '"></label>' +
      '<label class="ai-field">API Key<input id="ai-cfg-key" type="password" spellcheck="false" placeholder="sk-..."></label>' +
      '<details><summary>高级：模型名</summary>' +
      '<label class="ai-field"><input id="ai-cfg-model" type="text" spellcheck="false" placeholder="' + DEFAULT_MODEL + '"></label>' +
      '</details>' +
      '<p class="ai-err" id="ai-cfg-err"></p>' +
      '<div class="ai-modal-actions">' +
      '<button class="btn ghost" type="button" id="ai-cfg-cancel">稍后再说</button>' +
      '<button class="btn" type="button" id="ai-cfg-save">保存并启用</button>' +
      '</div>' +
      '<p class="ai-modal-hint">还没有 Key？<a href="https://platform.deepseek.com/" target="_blank" rel="noopener">去 DeepSeek 开放平台获取</a>，充值少量金额即可使用；填好后把 Base URL 保持默认即可。</p>' +
      '</div>';
    document.body.appendChild(box);

    box.addEventListener('click', function (e) { if (e.target === box) closeSetup(true); });
    document.getElementById('ai-cfg-cancel').addEventListener('click', function () { closeSetup(true); });
    document.getElementById('ai-cfg-save').addEventListener('click', saveSetup);
    document.getElementById('ai-cfg-key').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') saveSetup();
    });
  }

  function openSetup() {
    buildSetup();
    document.getElementById('ai-cfg-base').value = aiCfg.baseUrl || DEFAULT_BASE;
    document.getElementById('ai-cfg-key').value = aiCfg.apiKey || '';
    document.getElementById('ai-cfg-model').value = aiCfg.model || DEFAULT_MODEL;
    var err = document.getElementById('ai-cfg-err');
    err.style.display = 'none';
    document.getElementById('ai-setup').classList.add('open');
    setTimeout(function () { document.getElementById('ai-cfg-key').focus(); }, 60);
  }

  function closeSetup(skipped) {
    var el = document.getElementById('ai-setup');
    if (el) el.classList.remove('open');
    if (skipped) {
      try { localStorage.setItem(SKIP_KEY, '1'); } catch (e) {}
    }
  }

  function saveSetup() {
    var base = document.getElementById('ai-cfg-base').value.trim() || DEFAULT_BASE;
    var key = document.getElementById('ai-cfg-key').value.trim();
    var model = document.getElementById('ai-cfg-model').value.trim() || DEFAULT_MODEL;
    if (!key) {
      var err = document.getElementById('ai-cfg-err');
      err.textContent = '请填 API Key。';
      err.style.display = 'block';
      return;
    }
    aiCfg.baseUrl = base;
    aiCfg.apiKey = key;
    aiCfg.model = model;
    persistCfg();
    closeSetup(false);
    syncModelSelect();
    updateFab();
    toast('AI 助教已启用');
    if (panel && panel.classList.contains('open') && !msgs.length) greet();
  }

  function updateFab() {
    var fab = document.getElementById('ai-fab');
    if (fab) fab.classList.toggle('off', !aiCfg.apiKey);
  }

  function ensureCfg() {
    if (aiCfg.apiKey) return true;
    openSetup();
    toast('先填入 API Key 才能使用 AI 助教');
    return false;
  }

  /* ---------- 主观题：作答框与 AI 判卷 ---------- */
  function afterRender() {
    var q = byId.get(state.current);
    if (!q || q.type !== 'subjective') return;
    var card = document.getElementById('question-card');
    if (!card) return;
    var actions = card.querySelector('.actions');
    if (actions && !card.querySelector('[data-sol]')) {
      var r = rec(q.id);
      var box = document.createElement('div');
      box.className = 'solinput';
      box.innerHTML = '<label>我的作答 <span>（写完可让 AI 按评分点判卷）</span></label>' +
        '<textarea data-sol rows="4" placeholder="写清思路、公式、代入与结论"></textarea>';
      card.insertBefore(box, actions);
      var ta = box.querySelector('textarea');
      ta.value = r.sol || '';
      ta.addEventListener('input', function () { r.sol = ta.value; save(); });

      var gbtn = document.createElement('button');
      gbtn.className = 'btn ghost';
      gbtn.type = 'button';
      gbtn.setAttribute('data-aigrade', '1');
      gbtn.textContent = 'AI 判卷';
      gbtn.addEventListener('click', function (e) { e.preventDefault(); doGrade(); });
      actions.appendChild(gbtn);
    }
    var grade = rec(q.id).aiGrade;
    if (grade && !document.getElementById('aigrade-box')) {
      var sol = document.getElementById('solution');
      if (sol) {
        var div = document.createElement('div');
        div.className = 'aigrade';
        div.id = 'aigrade-box';
        div.innerHTML = '<div class="hd"><b>AI 判卷</b><span class="sc">' + esc(grade.score) + ' / ' + esc(grade.max) +
          '</span><span class="mdl">' + esc(grade.model || '') + '</span></div><p>' + esc(grade.comment || '') + '</p>';
        sol.parentNode.insertBefore(div, sol);
      }
    }
  }

  var GRADE_SYS = '你是《' + COURSE + '》的助教，给简答与计算题判卷。你会得到题目、参考答案（含评分点）与学生作答。' +
    '按评分点给分：关键步骤（列公式、代入、化简、结论）到位才给分；只写答案没有过程最多给一半分；' +
    '思路正确但符号或计算小错扣 1~2 分，不判全错；空白或完全跑题给 0 分。' +
    '满分取题目给出的分值，未给出按 10 分。只输出一个 JSON 对象，不要输出其他文字：' +
    '{"score": <整数>, "max": <整数>, "comment": "<2~3 句中文点评：先肯定做对的，再指出漏了或错了什么>"}';

  function doGrade() {
    var q = byId.get(state.current);
    if (!q) return;
    var r = rec(q.id);
    var ans = (r.sol || '').trim();
    if (!ans) { toast('先写下作答，再让 AI 判卷'); return; }
    if (!ensureCfg()) return;
    var btn = document.querySelector('[data-aigrade]');
    if (btn) { btn.disabled = true; btn.textContent = '判卷中…'; }
    var userMsg = '【题目】\n' + q.stem +
      (q.points ? '\n（本题 ' + q.points + ' 分）' : '') +
      '\n\n【参考答案与评分点】\n' + (q.solution || '') +
      '\n\n【学生作答】\n' + ans + '\n\n只输出 JSON。';
    chat([{ role: 'system', content: GRADE_SYS }, { role: 'user', content: userMsg }],
      { temperature: 0.1, max_tokens: 900 })
      .then(function (out) {
        var obj = extractJson(out.text);
        var max = Math.max(1, Math.round(Number(obj.max) || Number(q.points) || 10));
        var score = Math.max(0, Math.min(max, Math.round(Number(obj.score) || 0)));
        r.aiGrade = { score: score, max: max, comment: String(obj.comment || ''), model: aiCfg.model };
        r.revealed = true;
        save(); render();
        toast('AI 判卷完成：' + score + ' / ' + max);
      })
      .catch(function (e) {
        toast('判卷失败：' + e.message, 4200);
        if (btn) { btn.disabled = false; btn.textContent = 'AI 判卷'; }
      });
  }

  /* ---------- 面板 ---------- */
  var panel = null;
  var msgs = [];
  var streaming = false;

  function buildPanel() {
    if (document.getElementById('ai-panel')) return;
    var fab = document.createElement('button');
    fab.id = 'ai-fab';
    fab.type = 'button';
    fab.title = 'AI 助教';
    fab.innerHTML = '<span class="dot"></span>AI 助教';
    document.body.appendChild(fab);
    updateFab();

    panel = document.createElement('aside');
    panel.id = 'ai-panel';
    panel.innerHTML =
      '<header><strong>AI 助教</strong>' +
      '<select id="ai-model" aria-label="选择模型"></select>' +
      '<button id="ai-gear" type="button" title="API 设置">⚙</button>' +
      '<button id="ai-close" type="button" aria-label="关闭">×</button></header>' +
      '<div id="ai-msgs"></div>' +
      '<div class="ai-quick">' +
      '<button type="button" data-q="这题的解题思路是什么？先别直接给答案">思路</button>' +
      '<button type="button" data-q="这道题最容易错在哪一步？">易错点</button>' +
      '<button type="button" data-q="用更基础的方式再讲一遍。">讲慢点</button>' +
      '<button type="button" data-q="给我一道同类型的新题，先不要给答案，等我做完再批改。">同类题</button>' +
      '</div>' +
      '<div class="ai-inputrow"><textarea id="ai-input" rows="1" placeholder="问 AI 助教…（Enter 发送）"></textarea>' +
      '<button class="btn" id="ai-send" type="button">发送</button></div>';
    document.body.appendChild(panel);

    fab.addEventListener('click', function () {
      if (!aiCfg.apiKey) { openSetup(); return; }
      panel.classList.toggle('open');
      if (panel.classList.contains('open')) {
        if (!msgs.length) greet();
        document.getElementById('ai-input').focus();
      }
    });
    document.getElementById('ai-close').addEventListener('click', function () { panel.classList.remove('open'); });
    document.getElementById('ai-gear').addEventListener('click', openSetup);
    document.getElementById('ai-model').addEventListener('change', function (e) {
      aiCfg.model = e.target.value;
      persistCfg();
      toast('已切换模型：' + aiCfg.model);
    });
    document.getElementById('ai-send').addEventListener('click', sendAsk);
    document.getElementById('ai-input').addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendAsk(); }
    });
    panel.querySelectorAll('.ai-quick button').forEach(function (b) {
      b.addEventListener('click', function () {
        if (!ensureCfg()) return;
        document.getElementById('ai-input').value = b.dataset.q;
        sendAsk();
      });
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') panel.classList.remove('open');
    });
    syncModelSelect();
  }

  function syncModelSelect() {
    var sel = document.getElementById('ai-model');
    if (!sel) return;
    var list = ['deepseek-flash', 'deepseek-chat', 'deepseek-reasoner'];
    if (list.indexOf(aiCfg.model) < 0) list.unshift(aiCfg.model);
    sel.innerHTML = list.map(function (m) {
      return '<option value="' + esc(m) + '"' + (m === aiCfg.model ? ' selected' : '') + '>' + esc(m) + '</option>';
    }).join('');
  }

  function greet() {
    var q = byId.get(state.current);
    msgs.push({
      role: 'assistant',
      text: '我是这门课的 AI 助教。当前题目 **' + (q ? q.id : '—') + '**，可以问思路、易错点，也可以让我给主观题判卷。'
    });
    paint();
  }

  function paint() {
    var box = document.getElementById('ai-msgs');
    if (!box) return;
    box.innerHTML = '';
    msgs.forEach(function (m) {
      var d = document.createElement('div');
      if (m.role === 'user') {
        d.className = 'ai-msg user';
        d.textContent = m.text;
      } else {
        d.className = 'ai-msg bot' + (m.err ? ' err' : '');
        var html = '';
        if (m.reasoning) html += '<div class="ai-reasoning">' + esc(m.reasoning) + '</div>';
        html += (m.text ? rich(m.text) : '<span style="color:var(--muted)">正在思考…</span>');
        d.innerHTML = html;
      }
      box.appendChild(d);
    });
    box.scrollTop = box.scrollHeight;
  }

  function ctxOf() {
    var q = byId.get(state.current);
    if (!q) return {};
    var r = rec(q.id);
    var opts = (q.options || []).map(function (o) { return o[0] + '. ' + o[1]; }).join('\n');
    var mine = (q.type === 'choice' || q.type === 'judge') ? (r.picked || '') :
      q.type === 'fill' ? ((r.draft || []).join(' | ')) : (r.sol || '');
    var notesEl = document.querySelector('.notes-body');
    return {
      qid: q.id, stem: q.stem, options: opts,
      notes: notesEl ? notesEl.innerText.slice(0, 1500) : '',
      myAnswer: mine, explanation: q.solution || ''
    };
  }

  var ASK_SYS = '你是《' + COURSE + '》的 AI 助教，面向正在复习备考的学生。' +
    '先给结论，再给推导；推导要写清每一步依据（用了哪条定义、公式或定理）；' +
    '涉及计算时列出中间结果，不要跳步；学生答错时先指出错在哪一步、为什么会错，再给正确做法。' +
    '公式行内用 $...$，独立成行用 $$...$$，可用 \\frac \\sqrt \\int \\sum \\lim 等；不要用 Markdown 表格。' +
    '不要寒暄，不要复述题目。';

  function sendAsk() {
    if (streaming) return;
    if (!ensureCfg()) return;
    var input = document.getElementById('ai-input');
    var text = (input.value || '').trim();
    if (!text) return;
    input.value = '';
    msgs.push({ role: 'user', text: text });
    var bot = { role: 'assistant', text: '', reasoning: '' };
    msgs.push(bot);
    paint();
    streaming = true;
    var sendBtn = document.getElementById('ai-send');
    sendBtn.disabled = true;

    var ctx = ctxOf();
    var parts = [];
    if (ctx.qid) parts.push('【当前题目编号】' + ctx.qid);
    if (ctx.stem) parts.push('【题目原文】\n' + ctx.stem);
    if (ctx.options) parts.push('【选项】\n' + ctx.options);
    if (ctx.notes) parts.push('【本板块知识点】\n' + ctx.notes);
    if (ctx.myAnswer) parts.push('【我的作答】\n' + ctx.myAnswer);
    if (ctx.explanation) parts.push('【参考答案（讲解时先引导思路，再给答案）】\n' + ctx.explanation);

    var messages = [{ role: 'system', content: ASK_SYS }];
    if (parts.length) {
      messages.push({ role: 'user', content: '【本题背景】\n' + parts.join('\n\n') });
      messages.push({ role: 'assistant', content: '好，我已读完这道题。' });
    }
    msgs.slice(0, -2).slice(-8).forEach(function (m) {
      if (m.text) messages.push({ role: m.role, content: m.text });
    });
    messages.push({ role: 'user', content: text });

    var lastPaint = 0;
    chat(messages, {
      temperature: 0.4,
      max_tokens: 2600,
      onDelta: function (kind, piece) {
        if (kind === 'content') bot.text += piece;
        else bot.reasoning += piece;
        var now = Date.now();
        if (now - lastPaint > 90) { lastPaint = now; paint(); }
      }
    }).then(function () {
      streaming = false;
      sendBtn.disabled = false;
      if (!bot.text) bot.text = '（没有返回内容，请重试）';
      paint();
    }).catch(function (e) {
      streaming = false;
      sendBtn.disabled = false;
      bot.err = true;
      bot.text = (bot.text ? bot.text + '\n\n' : '') + '出错了：' + e.message;
      paint();
    });
  }

  /* ---------- 启动 ---------- */
  var _render = render;
  render = function () { _render(); afterRender(); };

  document.documentElement.classList.add('has-ai');
  buildPanel();
  afterRender();

  if (!aiCfg.apiKey) {
    var skipped = false;
    try { skipped = !!localStorage.getItem(SKIP_KEY); } catch (e) {}
    if (!skipped) setTimeout(openSetup, 700);
  }
})();

</script>
</body>
</html>
