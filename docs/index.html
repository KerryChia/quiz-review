int_0^1\\ln x\\,dx=-1$）。\n\n**记忆**：$-a\\ln U\\sim E\\left(\\dfrac1a\\right)$，$U\\sim U(0,1)$。这是「概率积分变换」最常见的应用，随机数生成器就靠它造指数分布。","pack":"K9"},{"id":"K9-2","type":"choice","stem":"设 $X\\sim N(0,1)$，令 $Y=X^{2}$，则当 $y>0$ 时 $f_Y(y)=$____。","options":[["A","$\\dfrac{1}{\\sqrt{2\\pi y}}e^{-y/2}$"],["B","$\\dfrac{1}{\\sqrt{2\\pi}}e^{-y/2}$"],["C","$\\dfrac{1}{\\sqrt{2\\pi y}}e^{-y}$"],["D","$\\dfrac{2}{\\sqrt{2\\pi}}e^{-y/2}$"]],"answer":"A","solution":"**非单调变换，必须合并两支。**\n\n$$F_Y(y)=P(X^2\\le y)=P(-\\sqrt y\\le X\\le\\sqrt y)=\\Phi_0(\\sqrt y)-\\Phi_0(-\\sqrt y)=2\\Phi_0(\\sqrt y)-1$$\n\n**求导**（链式法则，注意内层导数是 $\\dfrac{1}{2\\sqrt y}$）：\n$$f_Y(y)=2\\varphi_0(\\sqrt y)\\cdot\\frac{1}{2\\sqrt y}=\\frac{\\varphi_0(\\sqrt y)}{\\sqrt y}$$\n代入 $\\varphi_0(u)=\\dfrac{1}{\\sqrt{2\\pi}}e^{-u^2/2}$，$u=\\sqrt y$：\n$$f_Y(y)=\\frac{1}{\\sqrt{2\\pi y}}e^{-y/2},\\qquad y>0$$\n\n**这就是自由度 1 的 $\\chi^2$ 分布**（$\\chi^2(1)$）。\n\n**通用公式对照**：$f_Y(y)=\\dfrac{f_X(\\sqrt y)+f_X(-\\sqrt y)}{2\\sqrt y}$。本题 $f_X$ 是偶函数，两支相等，故为 $\\dfrac{2f_X(\\sqrt y)}{2\\sqrt y}=\\dfrac{f_X(\\sqrt y)}{\\sqrt y}$ ✓。\n\n**三个干扰项的错误**：B 漏了 $\\dfrac{1}{\\sqrt y}$（忘了链式法则的因子）；C 指数上少了 $\\dfrac12$；D 多乘了 2（把合并两支后的系数又乘了一遍）。","pack":"K9"},{"id":"K9-3","type":"choice","stem":"设 $X$ 的密度为 $f_X(x)$，令 $Y=2X$，则 $f_Y(y)=$____。","options":[["A","$2f_X(2y)$"],["B","$\\dfrac12f_X\\left(\\dfrac y2\\right)$"],["C","$f_X\\left(\\dfrac y2\\right)$"],["D","$f_X(2y)$"]],"answer":"B","solution":"**用分布函数法**：\n$$F_Y(y)=P(2X\\le y)=P\\left(X\\le\\frac y2\\right)=F_X\\left(\\frac y2\\right)$$\n两边对 $y$ 求导，链式法则带出 $\\dfrac12$：\n$$f_Y(y)=\\frac12f_X\\left(\\frac y2\\right)$$\n\n**通用线性公式**：$f_{aX+b}(y)=\\dfrac{1}{|a|}f_X\\left(\\dfrac{y-b}{a}\\right)$。本题 $a=2,b=0$。\n\n**为什么必须除 $|a|$**：$Y$ 的取值范围被拉伸了 2 倍，为保持总积分仍为 1，密度高度必须压缩为一半。可以用均匀分布验证：$X\\sim U(0,1)$ 时 $Y=2X\\sim U(0,2)$，密度从 1 变成 $\\dfrac12$ ✓。\n\n**干扰项分析**：A 是 $a=-2$ 情形的错误写法（还漏了绝对值）；C 忘了系数；D 把「拉伸」当成了「压缩」。","pack":"K9"},{"id":"K9-4","type":"choice","stem":"设 $X\\sim E(1)$（密度 $e^{-x}$，$x>0$），令 $Y=\\min(X,2)$，则 $P(Y=2)=$____。","options":[["A","$e^{-2}$"],["B","$1-e^{-2}$"],["C","$2e^{-2}$"],["D","$0$"]],"answer":"A","solution":"**$Y$ 是混合型**：$0<Y<2$ 时连续，$Y=2$ 处有一个点质量。\n\n**点质量来自截断**：$Y=2$ 当且仅当 $X\\ge2$，\n$$P(Y=2)=P(X\\ge2)=1-F_X(2)=e^{-2}\\approx0.1353$$\n\n**完整分布函数**：\n$$F_Y(y)=\\begin{cases}0, & y<0\\\\ 1-e^{-y}, & 0\\le y<2\\\\ 1, & y\\ge2\\end{cases}$$\n在 $y=2$ 处从 $1-e^{-2}\\approx0.865$ 跳到 1，跳跃高度 $e^{-2}$ ✓。\n\n**易错**：写成 $1-e^{-2}$ ——那是 $P(X<2)$，即「没被截断」的概率，方向正好相反。截断到 2 说明**超出的部分全部堆到 2 上**。\n\n**对照 $\\max$**：若 $Y=\\max(X,2)$，则 $P(Y=2)=P(X\\le2)=1-e^{-2}$。两个函数的点质量位置相同、方向相反。","pack":"K9"},{"id":"K9-5","type":"judge","stem":"连续型随机变量的函数一定还是连续型随机变量。","answer":"错","solution":"**三类反例**（都来自连续型）：\n\n- **截断**：$Y=\\min(X,c)$。$X$ 连续，但 $Y$ 在 $c$ 处有质量 $P(X\\ge c)>0$，是混合型。\n- **取整**：$Y=\\lfloor X\\rfloor$。$X\\sim U(0,3)$ 时 $Y$ 只取 $0,1,2$，是离散型。\n- **指示**：$Y=\\mathbf{1}\\{X>0\\}$。取值只有 0 与 1，明显是离散型。\n\n**结论**：连续型的函数一般**既可能连续、也可能离散、还可能是混合型**，必须先看 $g$ 是否把区间「压成点」。\n\n**判别方法**：求 $F_Y(y)=P(g(X)\\le y)$，看有没有跳跃。有跳跃就是离散或混合。\n\n**相反方向是对的**：离散型的函数仍是离散型（取值至多可列）。","pack":"K9"},{"id":"K9-6","type":"judge","stem":"若 $g$ 严格单调且可导、$g'\\ne0$，则 $f_Y(y)=\\dfrac{f_X\\left(g^{-1}(y)\\right)}{\\left|g'\\left(g^{-1}(y)\\right)\\right|}$。","answer":"对","solution":"**推导**（以 $g$ 严格递增为例）：\n$$F_Y(y)=P(g(X)\\le y)=P\\left(X\\le g^{-1}(y)\\right)=F_X\\left(g^{-1}(y)\\right)$$\n求导并用链式法则：\n$$f_Y(y)=f_X\\left(g^{-1}(y)\\right)\\cdot\\frac{d}{dy}g^{-1}(y)$$\n而反函数求导公式给出 $\\dfrac{d}{dy}g^{-1}(y)=\\dfrac{1}{g'\\left(g^{-1}(y)\\right)}$。\n\n$g$ 递减时 $F_Y(y)=1-F_X\\left(g^{-1}(y)\\right)$，求导多一个负号，正好被绝对值吸收，所以统一写成 $\\left|g'\\right|$。\n\n**三个使用前提**：$g$ 单调、可导、导数不为 0。缺一个就要回到分布函数法。\n\n**最容易错的地方**：把 $g^{-1}(y)$ 写成 $y$，或者忘记分母。用 $Y=2X$ 检验：$g^{-1}(y)=\\dfrac y2$，$g'=2$，得 $\\dfrac12f_X\\left(\\dfrac y2\\right)$ ✓ 与考点 09 上一题一致。","pack":"K9"},{"id":"K9-7","type":"fill","stem":"设 $X\\sim U(0,1)$，令 $Y=\\sqrt X$，求 $E(Y)$。","fields":[{"label":"$E(Y)$","a":"2/3","kind":"num","alt":["0.6667"]}],"solution":"**分布函数法**：$0<y<1$ 时\n$$F_Y(y)=P(\\sqrt X\\le y)=P(X\\le y^2)=y^2$$\n$$f_Y(y)=2y,\\qquad 0<y<1$$\n\n**求期望**：\n$$E(Y)=\\int_0^1y\\cdot2y\\,dy=\\frac23$$\n\n**更快的做法（不必求分布）**：\n$$E(\\sqrt X)=\\int_0^1\\sqrt x\\,dx=\\frac23$$\n本题问的只是 $E[g(X)]$，直接用 $X$ 的密度算即可，省掉求 $f_Y$ 的一整步。\n\n**什么时候必须先求分布**：问 $D(Y)$、问 $P(Y>a)$、或问 $Y$ 的分位数时。只问 $E[g(X)]$ 就不用。\n\n**验算**：$E(Y^2)=E(X)=\\dfrac12$，故 $D(Y)=\\dfrac12-\\dfrac49=\\dfrac1{18}$。","pack":"K9"},{"id":"K9-8","type":"subjective","points":10,"stem":"设 $X\\sim U(-1,2)$，令 $Y=X^{2}$。\n(1) 求 $Y$ 的取值范围；\n(2) 求 $Y$ 的分布函数 $F_Y(y)$（分段写出）；\n(3) 求 $Y$ 的概率密度 $f_Y(y)$；\n(4) 求 $E(Y)$，并用 $E(X^2)$ 验算。","solution":"**(1) 范围。** $X\\in(-1,2)$，故 $Y=X^2\\in[0,4)$。\n\n**(2) 分布函数。** $X$ 的密度为 $\\dfrac13$（区间长度 3）。对 $y\\ge0$：\n$$F_Y(y)=P(X^2\\le y)=P(-\\sqrt y\\le X\\le\\sqrt y)$$\n**关键**：这个区间要**与 $(-1,2)$ 取交**，而左右两端的「截断点」不同：\n- 左端 $\\max(-\\sqrt y,-1)$，在 $y<1$ 时是 $-\\sqrt y$，在 $y\\ge1$ 时被 $-1$ 卡住；\n- 右端 $\\min(\\sqrt y,2)$，在 $y<4$ 时是 $\\sqrt y$。\n\n于是分段：\n$$F_Y(y)=\\begin{cases}0, & y<0\\\\ \\dfrac{2\\sqrt y}{3}, & 0\\le y<1\\\\ \\dfrac{\\sqrt y+1}{3}, & 1\\le y<4\\\\ 1, & y\\ge4\\end{cases}$$\n\n**检查接点**：$y=1$ 处 $\\dfrac{2}{3}$ 与 $\\dfrac{1+1}{3}=\\dfrac23$ ✓ 连续；$y=4$ 处 $\\dfrac{2+1}{3}=1$ ✓。\n\n**(3) 密度。** 分段求导：\n$$f_Y(y)=\\begin{cases}\\dfrac{1}{3\\sqrt y}, & 0<y<1\\\\[6pt] \\dfrac{1}{6\\sqrt y}, & 1<y<4\\\\[6pt] 0, & \\text{其他}\\end{cases}$$\n\n**归一化检验**：\n$$\\int_0^1\\frac{dy}{3\\sqrt y}=\\frac{2}{3},\\qquad \\int_1^4\\frac{dy}{6\\sqrt y}=\\frac{1}{3}\\left(2-1\\right)=\\frac13$$\n合计 $1$ ✓。两段的质量 $\\dfrac23$、$\\dfrac13$ 正好对应 $|X|<1$ 与 $1<X<2$ 两段的长度比 $2:1$。\n\n**(4) 期望。** 用 $X$ 的密度直接算最快：\n$$E(Y)=E(X^2)=\\int_{-1}^{2}x^2\\cdot\\frac13dx=\\frac13\\cdot\\frac{x^3}{3}\\Big|_{-1}^{2}=\\frac13\\cdot\\frac{8+1}{3}=1$$\n\n**用 $f_Y$ 验算**（把 $y=\\sqrt y\\cdot\\sqrt y$ 提出来更省力）：\n$$\\int_0^1\\frac{y\\,dy}{3\\sqrt y}=\\int_0^1\\frac{\\sqrt y}{3}dy=\\frac{2}{9}$$\n$$\\int_1^4\\frac{y\\,dy}{6\\sqrt y}=\\int_1^4\\frac{\\sqrt y}{6}dy=\\frac{1}{6}\\cdot\\frac23\\left(4^{3/2}-1\\right)=\\frac{1}{9}\\times7=\\frac{7}{9}$$\n$$E(Y)=\\frac29+\\frac79=1\\ ✓$$\n\n**为什么 $E(X^2)=1$**：$E(X)=\\dfrac{-1+2}{2}=0.5$，$D(X)=\\dfrac{(2+1)^2}{12}=\\dfrac34$，故 $E(X^2)=0.25+0.75=1$ ✓。\n\n**本题的关键动作**：**分段点不是由 $g$ 单独决定的，而是 $g$ 的值域与 $X$ 的支撑集「撞」出来的**。这里 $X$ 的负半轴只到 $-1$，所以 $\\sqrt y$ 到 1 就不再增长，分段点只能是 $y=1$（对应 $X=-1$）与 $y=4$（对应 $X=2$）。","pack":"K9"},{"id":"K10-1","type":"choice","stem":"设 $E(X)=2$，$D(X)=3$，则 $E(3X^{2}-1)=$____。","options":[["A","$20$"],["B","$26$"],["C","$29$"],["D","$8$"]],"answer":"A","solution":"**第一步：先求二阶原点矩。**\n$$E(X^2)=D(X)+\\big[E(X)\\big]^2=3+4=7$$\n\n**第二步：用期望的线性性。**\n$$E(3X^2-1)=3E(X^2)-1=3\\times7-1=20$$\n\n**最容易犯的两个错**：\n- 写 $3[D(X)]^2-1=26$ —— 把 $E(X^2)$ 当成了 $D(X)^2$；\n- 写 $3\\times3-1=8$ —— 忘了加 $[E(X)]^2$。\n\n**记忆链**：$E(X^2)=D+(EX)^2$ 是本章出现频率最高的恒等式，凡涉及 $X^2$ 的期望都从它出发。\n\n**注意**：$E(X^2)\\ne[E(X)]^2$，两者相差恰好一个方差。只有当 $D(X)=0$（即 $X$ 几乎必然为常数）时才相等。","pack":"K10"},{"id":"K10-2","type":"choice","stem":"设 $X\\sim B(n,p)$，且 $E(X)=2.4$，$D(X)=1.44$，则____。","options":[["A","$n=6,\\ p=0.4$"],["B","$n=8,\\ p=0.3$"],["C","$n=4,\\ p=0.6$"],["D","$n=12,\\ p=0.2$"]],"answer":"A","solution":"**列两个方程**：\n$$np=2.4,\\qquad np(1-p)=1.44$$\n\n**两式相除**（这一步最快）：\n$$\\frac{np(1-p)}{np}=1-p=\\frac{1.44}{2.4}=0.6\\ \\Rightarrow\\ p=0.4$$\n\n**回代求 $n$**：\n$$n=\\frac{2.4}{0.4}=6$$\n\n**验算四个选项**：\n- $n=6,p=0.4$：$E=2.4$，$D=6\\times0.4\\times0.6=1.44$ ✓\n- $n=8,p=0.3$：$E=2.4$ ✓ 但 $D=8\\times0.3\\times0.7=1.68$ ✗\n- $n=4,p=0.6$：$E=2.4$ ✓ 但 $D=0.96$ ✗\n- $n=12,p=0.2$：$E=2.4$ ✓ 但 $D=1.92$ ✗\n\n**看出命题人的套路**：四个选项的期望都等于 $2.4$，只有方差不同。所以**只要期望一个条件无法定参**，必须用方差。\n\n**通用解法**：$\\dfrac{D}{E}=1-p$，先得 $p$，再得 $n$。","pack":"K10"},{"id":"K10-3","type":"choice","stem":"设随机变量 $X$ 满足 $E(X)=10$，$D(X)=4$。由切比雪夫不等式，$P(|X-10|\\ge3)$ 的上界为____。","options":[["A","$\\dfrac19$"],["B","$\\dfrac23$"],["C","$\\dfrac49$"],["D","$\\dfrac59$"]],"answer":"C","solution":"**切比雪夫不等式**：\n$$P\\big(|X-E(X)|\\ge\\varepsilon\\big)\\le\\frac{D(X)}{\\varepsilon^2}$$\n\n本题 $\\varepsilon=3$，$D(X)=4$：\n$$P(|X-10|\\ge3)\\le\\frac{4}{9}$$\n\n**补充**：同一题的另一个方向\n$$P(|X-10|<3)\\ge1-\\frac49=\\frac59$$\n这就是「落在均值附近 3 以内至少 5/9」的下界。\n\n**要注意的三点**：\n- 这是**上界**，不是精确值。只有已知正态时才能算精确概率（$2\\Phi_0(1.5)-1\\approx0.866$）。\n- 若算出上界 $>1$，只能取平凡上界 1（例如 $\\varepsilon=1$ 时 $\\dfrac41=4$，只能写 $\\le1$）。\n- 不等式要求方差存在且有限，柯西分布之类不能用。","pack":"K10"},{"id":"K10-4","type":"choice","stem":"设 $X$ 的密度为 $f(x)=2x$（$0<x<1$），其余为 $0$。则 $E\\left(\\dfrac1X\\right)=$____。","options":[["A","$1$"],["B","$\\dfrac43$"],["C","$2$"],["D","不存在"]],"answer":"C","solution":"**直接用 $X$ 的密度算函数期望**（不必先求 $\\dfrac1X$ 的分布）：\n$$E\\left(\\frac1X\\right)=\\int_0^1\\frac1x\\cdot2x\\,dx=\\int_0^1 2\\,dx=2$$\n\n**为什么可以这样算**：$E[g(X)]=\\int g(x)f(x)dx$，只要积分绝对收敛。\n\n**为什么不是「不存在」**：直觉上 $\\dfrac1x$ 在 0 附近爆炸，似乎积分发散。但密度 $f(x)=2x$ 在 0 附近按 $x$ 衰减，两者相乘恰好把奇点抵消：\n$$\\frac{2x}{x}=2$$\n这是「用密度抵消奇点」的典型例子。\n\n**对照反例**：若 $X\\sim U(0,1)$（密度恒为 1），则\n$$E\\left(\\frac1X\\right)=\\int_0^1\\frac{dx}{x}=\\infty$$\n此时期望不存在。**同样是 $\\dfrac1X$，密度不同结论就不同**。\n\n**顺带求 $E(X)$ 与 $D(X)$**：$E(X)=\\int_0^12x^2dx=\\dfrac23$，$E(X^2)=\\int_0^12x^3dx=\\dfrac12$，$D(X)=\\dfrac12-\\dfrac49=\\dfrac1{18}$。","pack":"K10"},{"id":"K10-5","type":"judge","stem":"$E(XY)=E(X)E(Y)$ 成立的充要条件是 $X$ 与 $Y$ 相互独立。","answer":"错","solution":"**$E(XY)=E(X)E(Y)$ 只要求「不相关」，不要求独立。**\n\n**反例**：设 $X\\sim U(-1,1)$，$Y=X^2$。显然 $Y$ 完全由 $X$ 决定，两者**强烈不独立**；但\n$$E(XY)=E(X^3)=0,\\qquad E(X)E(Y)=0\\times\\frac13=0$$\n等式成立。\n\n**三个概念的正确关系**：\n- 独立 $\\Rightarrow$ 不相关（$E(XY)=E(X)E(Y)$）；\n- 不相关 $\\nRightarrow$ 独立（上面的反例）；\n- 对**二元正态**，不相关与独立等价（这是特例）。\n\n**什么时候才可以说「独立 $\\Leftrightarrow$ 可乘」**：只有联合分布是二元正态时。\n\n**考试写法**：题干说「已知 $X,Y$ 独立」，可以直接拆 $E(XY)$；题干只说「$E(XY)=E(X)E(Y)$」，不能推出独立，也不能用 $D(X+Y)=D(X)+D(Y)$ 以外更强的东西（该式只需不相关）。","pack":"K10"},{"id":"K10-6","type":"judge","stem":"$D(X)=0$ 的充要条件是 $P\\big(X=E(X)\\big)=1$。","answer":"对","solution":"**必要性**：$D(X)=E\\left[(X-EX)^2\\right]=0$。被积（或被和）函数非负，积分为 0 意味着它几乎处处为 0：\n$$(X-EX)^2=0\\ \\text{几乎必然}\\ \\Rightarrow\\ P(X=EX)=1$$\n\n**充分性**：若 $P(X=EX)=1$，则 $(X-EX)^2$ 几乎必然为 0，期望为 0，故 $D(X)=0$。\n\n**注意「几乎必然」不是「必然」**：结论是 $P(X=EX)=1$，不要求 $X$ 恒等于常数。例如在 $[0,1]$ 上均匀取值、但把某个零测集上的值改成 100，方差仍为 0。\n\n**实际用途**：判断「随机变量其实是常数」的唯一标准就是方差是否为 0；反过来，$D(X)>0$ 说明 $X$ 至少取两个值（正概率地）。\n\n**相关结论**：$D(aX+b)=a^2D(X)$，故平移不改变方差、缩放按平方改变。","pack":"K10"},{"id":"K10-7","type":"fill","stem":"设 $X$ 服从参数为 $\\lambda$ 的泊松分布，且 $E(X^{2})=6$，求 $\\lambda$。","fields":[{"label":"$\\lambda$","a":"2","kind":"num"}],"solution":"**泊松的矩**：$E(X)=\\lambda$，$D(X)=\\lambda$，故\n$$E(X^2)=D(X)+[E(X)]^2=\\lambda+\\lambda^2$$\n\n**解方程**：\n$$\\lambda^2+\\lambda=6\\ \\Rightarrow\\ \\lambda^2+\\lambda-6=0\\ \\Rightarrow\\ (\\lambda+3)(\\lambda-2)=0$$\n\n$\\lambda>0$，故 $\\lambda=2$（舍去 $\\lambda=-3$）。\n\n**验算**：$X\\sim P(2)$，$E(X)=2$，$E(X^2)=2+4=6$ ✓。\n\n**如果题目给的是 $D(X)$**：泊松直接读出 $\\lambda=D(X)$，一步到位。给 $E(X^2)$ 才需要解二次方程。\n\n**易错**：把 $E(X^2)$ 直接当成 $\\lambda^2$（漏了 $\\lambda$），得 $\\lambda=\\sqrt6$，不在整数解里，可作为自检信号。","pack":"K10"},{"id":"K10-8","type":"subjective","points":10,"stem":"某商店销售一种时效性商品，进货价每件 $2$ 元，售价每件 $6$ 元；当天未售出的商品不能退货，只能报废（残值为 0）。市场需求量 $Q\\sim U(0,3000)$（件），进货量记为 $y$。\n(1) 写出利润 $R$ 关于 $Q$ 与 $y$ 的表达式；\n(2) 求 $E(R)$ 作为 $y$ 的函数；\n(3) 求使期望利润最大的进货量 $y^{*}$，并求出最大期望利润。","solution":"**(1) 利润函数。** 卖出 $\\min(Q,y)$ 件，每件赚 $6$ 元；进货 $y$ 件，每件花 $2$ 元：\n$$R=6\\min(Q,y)-2y=\\begin{cases}4y, & Q\\ge y\\\\ 6Q-2y, & Q<y\\end{cases}$$\n\n**(2) 期望。** $Q$ 的密度为 $\\dfrac1{3000}$（$0<q<3000$）：\n$$E(R)=\\frac1{3000}\\left[\\int_0^{y}(6q-2y)\\,dq+\\int_y^{3000}4y\\,dq\\right]$$\n\n先算两块：\n$$\\int_0^y(6q-2y)dq=3y^2-2y^2=y^2$$\n$$\\int_y^{3000}4y\\,dq=4y(3000-y)=12000y-4y^2$$\n\n$$E(R)=\\frac{1}{3000}\\left(12000y-3y^2\\right)=4y-\\frac{y^2}{1000}$$\n\n**(3) 求最优。**\n$$\\frac{dE(R)}{dy}=4-\\frac{y}{500}=0\\ \\Rightarrow\\ y^{*}=2000$$\n\n**二阶条件**：$\\dfrac{d^2E}{dy^2}=-\\dfrac1{500}<0$，故为极大值，也是唯一驻点，即全局最大。\n\n**最大期望利润**：\n$$E(R)\\Big|_{y=2000}=4(2000)-\\frac{2000^2}{1000}=8000-4000=4000\\ \\text{元}$$\n\n**边界检查**：$y=0$ 时 $E(R)=0$，$y=3000$ 时 $E(R)=12000-9000=3000$，都低于 $4000$ ✓。\n\n**通用公式（临界分位点）**：\n$$F(y^{*})=\\frac{r-c}{r}=\\frac{6-2}{6}=\\frac23$$\n$Q\\sim U(0,3000)$ 的 $\\dfrac23$ 分位点是 $2000$ ✓，与微分法结果一致。\n\n**为什么不是「按期望需求进货 1500」**：卖不掉的损失（2 元）小于卖出的利润（4 元），所以应**多进**一些，让缺货的概率更小。$\\dfrac23$ 分位点正好体现了这个权衡。","pack":"K10"},{"id":"K11-1","type":"choice","stem":"设 $X\\sim N(2,\\,9)$，则 $P(2<X<5)=$____（$\\Phi_0(1)=0.8413$）。","options":[["A","$0.1587$"],["B","$0.3413$"],["C","$0.6826$"],["D","$0.8413$"]],"answer":"B","solution":"**注意第二个参数是方差**：$N(2,9)$ 表示 $\\mu=2$，$\\sigma^2=9$，故 $\\sigma=3$。\n\n**标准化**：\n$$P(2<X<5)=P\\left(\\frac{2-2}{3}<Z<\\frac{5-2}{3}\\right)=P(0<Z<1)$$\n$$=\\Phi_0(1)-\\Phi_0(0)=0.8413-0.5000=0.3413$$\n\n**三个干扰项的来源**：\n- $0.1587=1-\\Phi_0(1)$：算成了右尾；\n- $0.6826=2\\Phi_0(1)-1$：算的是 $|Z|<1$（以均值为中心），本题区间只取右半边；\n- $0.8413=\\Phi_0(1)$：忘了减 $\\Phi_0(0)$。\n\n**最致命错误**：把 $\\sigma$ 当成 9，除以 9 得 $Z\\in(0,0.333)$，答案约 $0.13$，四个选项里都没有——这是命题人故意留的「无解」提示。\n\n**口诀**：$N(\\mu,\\sigma^2)$ 的第二个数是方差，**标准化除标准差**。","pack":"K11"},{"id":"K11-2","type":"choice","stem":"设 $X\\sim N(\\mu,\\sigma^{2})$，则 $P(|X-\\mu|<2\\sigma)\\approx$____。","options":[["A","$0.9545$"],["B","$0.6827$"],["C","$0.9973$"],["D","$0.5000$"]],"answer":"A","solution":"**标准化**：\n$$P(|X-\\mu|<2\\sigma)=P\\left(\\left|\\frac{X-\\mu}{\\sigma}\\right|<2\\right)=P(|Z|<2)$$\n$$=2\\Phi_0(2)-1=2(0.97725)-1=0.9545$$\n\n**三个常用值（务必背）**：\n- $1\\sigma$：$2\\Phi_0(1)-1\\approx0.6827$\n- $2\\sigma$：$2\\Phi_0(2)-1\\approx0.9545$\n- $3\\sigma$：$2\\Phi_0(3)-1\\approx0.9973$\n\n**注意这个结论与 $\\mu,\\sigma$ 的具体取值无关**——这正是标准化的意义：任何正态分布都可以化到标准正态，所以「几倍标准差内」的概率是普适的。\n\n**若区间不以均值居中**：例如 $P(\\mu<X<\\mu+2\\sigma)=\\Phi_0(2)-0.5\\approx0.4772$，只有对称时才能用 $2\\Phi_0(c/\\sigma)-1$。","pack":"K11"},{"id":"K11-3","type":"choice","stem":"设 $X\\sim N(0,1)$，$Y\\sim N(1,4)$，且 $X,Y$ 相互独立，则 $X+Y$ 服从____。","options":[["A","$N(1,3)$"],["B","$N(1,5)$"],["C","$N(1,4)$"],["D","$N(0,5)$"]],"answer":"B","solution":"**正态分布的可加性**：独立正态之和仍为正态，参数**分别相加**（均值加均值，**方差**加方差）。\n\n$$E(X+Y)=0+1=1$$\n$$D(X+Y)=D(X)+D(Y)=1+4=5$$\n\n$$X+Y\\sim N(1,5)$$\n\n**易错点**：\n- 写 $N(1,3)$：把方差当成了标准差相加（$1+2=3$）；\n- 写 $N(1,4)$：漏掉了 $X$ 的方差；\n- 写 $N(0,5)$：均值没有相加。\n\n**为什么可以直接加方差**：独立保证协方差为 0，\n$$D(X+Y)=D(X)+D(Y)+2\\mathrm{Cov}(X,Y)=1+4+0=5$$\n\n**更一般**：$aX+bY\\sim N\\left(a\\mu_1+b\\mu_2,\\ a^2\\sigma_1^2+b^2\\sigma_2^2\\right)$，注意系数要平方。\n\n**若不独立**：还需加上 $2ab\\,\\mathrm{Cov}(X,Y)$，此时结果仍是正态，但方差不同。","pack":"K11"},{"id":"K11-4","type":"choice","stem":"设 $X\\sim N(10,\\,4)$，且 $P(X>c)=0.1$，已知 $\\Phi_0(1.28)=0.90$，则 $c=$____。","options":[["A","$12.56$"],["B","$11.28$"],["C","$12.80$"],["D","$10.90$"]],"answer":"A","solution":"**第一步：把条件转成左尾。**\n$$P(X>c)=0.1\\ \\Rightarrow\\ P(X\\le c)=0.9$$\n\n**第二步：标准化。**\n$$P\\left(Z\\le\\frac{c-10}{2}\\right)=0.9$$\n\n**第三步：查表反解。** 已知 $\\Phi_0(1.28)=0.90$，故\n$$\\frac{c-10}{2}=1.28\\ \\Rightarrow\\ c=10+2\\times1.28=12.56$$\n\n**注意 $\\sigma$ 是多少**：$N(10,4)$ 的方差是 4，标准差是 $\\sigma=2$。这一步用错，四个选项全部对不上。\n\n**三个干扰项的错误**：\n- $11.28$：用 $\\sigma=1$，$10+1.28$；\n- $12.80$：用 $\\sigma^2=4$ 直接乘，$10+4\\times0.7$ 之类的混算；\n- $10.90$：符号或系数弄错。\n\n**答题规范**：写「由 $\\Phi_0(1.28)=0.90$ 得 $\\dfrac{c-\\mu}{\\sigma}=1.28$」，把查表值写在等式里，阅卷时才给分。","pack":"K11"},{"id":"K11-5","type":"judge","stem":"正态分布的密度曲线关于 $x=\\mu$ 对称。","answer":"对","solution":"**密度表达式中只有 $(x-\\mu)^2$**：\n$$\\varphi(x)=\\frac{1}{\\sqrt{2\\pi}\\sigma}e^{-\\frac{(x-\\mu)^2}{2\\sigma^2}}$$\n把 $x$ 换成 $2\\mu-x$ 后 $(x-\\mu)^2$ 不变，故 $\\varphi(2\\mu-x)=\\varphi(x)$，即以 $\\mu$ 为对称轴。\n\n**由此推出三条常用结论**：\n- $F(\\mu+x)=1-F(\\mu-x)$；\n- $P(X\\le\\mu)=P(X\\ge\\mu)=\\dfrac12$；\n- $P(|X-\\mu|<c)=2\\Phi_0\\left(\\dfrac c\\sigma\\right)-1$。\n\n**推广**：若 $f(a-x)=f(b+x)$，对称中心是 $\\dfrac{a+b}{2}$。这个判别式在选择题里比配方更快。\n\n**注意**：对称且期望存在才有 $E(X)=\\mu$。柯西分布关于 0 对称但期望不存在，是著名的反例（本课程一般不考，但概念题会出现）。","pack":"K11"},{"id":"K11-6","type":"judge","stem":"若 $X\\sim N(0,1)$，则 $P(X=0)=\\dfrac{1}{\\sqrt{2\\pi}}$。","answer":"错","solution":"**$X$ 是连续型，任何单点的概率都是 0**：\n$$P(X=0)=0$$\n\n**混淆的根源**：把**密度值**当成了**概率**。$\\varphi_0(0)=\\dfrac{1}{\\sqrt{2\\pi}}\\approx0.3989$ 是密度在 0 处的高度，不是「取到 0 的概率」。\n\n**两者的关系**：$P(a<X<b)=\\int_a^b\\varphi(x)dx$，是密度曲线下的**面积**；密度值只是曲线在该点的高度。所以密度可以大于 1（如 $U(0,0.1)$ 的密度为 10），而概率永远不超过 1。\n\n**同类陷阱**：\n- 「密度必须小于 1」——错；\n- 「某点密度为 0 则该点附近概率为 0」——错，要看邻域积分；\n- 「修改密度在有限个点的值会改变分布」——错，不改变。\n\n**正确写法**：$P(X\\le0)=\\Phi_0(0)=\\dfrac12$。","pack":"K11"},{"id":"K11-7","type":"fill","stem":"设 $X\\sim N(3,16)$，求 $P(1<X<5)$（$\\Phi_0(0.5)=0.6915$）。","fields":[{"label":"$P(1<X<5)$","a":"0.383","kind":"num","alt":["0.3829","0.38"]}],"solution":"**$\\sigma=\\sqrt{16}=4$**（不是 16）。\n\n**标准化**：\n$$\\frac{1-3}{4}=-0.5,\\qquad \\frac{5-3}{4}=0.5$$\n$$P(1<X<5)=P(-0.5<Z<0.5)=2\\Phi_0(0.5)-1$$\n$$=2\\times0.6915-1=1.3830-1=0.383$$\n\n**为什么可以写成 $2\\Phi_0(0.5)-1$**：区间 $[1,5]$ 恰好以 $\\mu=3$ 为中心、半宽 2，对称区间可直接套公式。\n\n**若区间不居中**：例如 $P(3<X<7)$，则\n$$P(0<Z<1)=\\Phi_0(1)-0.5=0.3413$$\n必须两端分别标准化，不能用 $2\\Phi_0-1$。\n\n**数值核对**：一倍标准差内约 $0.6827$，本题半宽是 $0.5\\sigma$，概率应明显小于 $0.68$，$0.383$ 合理。","pack":"K11"},{"id":"K11-8","type":"subjective","points":10,"stem":"某厂生产的零件长度 $X$（单位：cm）服从正态分布 $N(10,\\,0.04)$。规定长度落在 $[9.7,\\,10.3]$ 内为合格品。设 $\\Phi_0(1.5)=0.9332$。\n(1) 求单个零件的合格率 $p$；\n(2) 任取 10 个零件，求至少 9 个合格的概率（用 $p$ 表示并给出数值）；\n(3) 若要求单个零件合格率不低于 $0.95$，标准差最多应控制在多少（取 $z_{0.975}=1.96$）？","solution":"**(1) 单件合格率。** $\\sigma=\\sqrt{0.04}=0.2$，区间 $[9.7,10.3]$ 关于 $\\mu=10$ 对称，半宽 $0.3$：\n$$p=P(9.7\\le X\\le10.3)=2\\Phi_0\\left(\\frac{0.3}{0.2}\\right)-1=2\\Phi_0(1.5)-1$$\n$$=2\\times0.9332-1=0.8664$$\n\n**(2) 二项尾部。** 10 个零件相互独立、合格率同为 $p$，设合格个数 $K\\sim B(10,p)$：\n$$P(K\\ge9)=P(K=9)+P(K=10)=\\binom{10}{9}p^{9}(1-p)+p^{10}=10p^9(1-p)+p^{10}$$\n\n代入 $p=0.8664$，$1-p=0.1336$：\n$$p^9\\approx0.2751,\\qquad p^{10}\\approx0.2383$$\n$$P(K\\ge9)\\approx10\\times0.2751\\times0.1336+0.2383\\approx0.3676+0.2383=0.6059$$\n\n**(3) 反求标准差。** 要求 $2\\Phi_0\\left(\\dfrac{0.3}{\\sigma}\\right)-1\\ge0.95$，即\n$$\\Phi_0\\left(\\frac{0.3}{\\sigma}\\right)\\ge0.975\\ \\Rightarrow\\ \\frac{0.3}{\\sigma}\\ge1.96$$\n$$\\sigma\\le\\frac{0.3}{1.96}\\approx0.1531$$\n\n即标准差最多约 $0.153$ cm，对应方差 $\\sigma^2\\le0.0234$。\n\n**本题的三个考点**：\n- 第一步：正态算单次概率，**记得 $\\sigma=\\sqrt{0.04}$**；\n- 第二步：把「10 次中至少 9 次」建成二项尾部，**不要漏掉 $K=9$ 那一项**；\n- 第三步：给定概率反解参数，方向是「不等式」而不是「等式」，注意不等号方向随单调性保持不变。\n\n**易错**：\n- 用 $\\sigma=0.04$ 标准化，得 $2\\Phi_0(7.5)-1\\approx1$，明显离谱；\n- 只算 $p^{10}$，漏掉恰有 9 个合格的情形；\n- 第三问解成 $\\sigma\\ge0.153$，把「不超过」写反。","pack":"K11"},{"id":"K12-1","type":"choice","stem":"甲、乙、丙三人传球，球开始时在甲手中。每次持球者等可能地传给另外两人之一。则传 3 次后球仍在甲手中的概率为____。","options":[["A","$\\dfrac14$"],["B","$\\dfrac13$"],["C","$\\dfrac38$"],["D","$\\dfrac12$"]],"answer":"A","solution":"**设** $p_n=P(\\text{第 }n\\text{ 次传球后球在甲手中})$，初值 $p_0=1$。\n\n**按上一步状态分类**（全概率）：\n- 上一步在甲（概率 $p_n$）：传出去后必不在甲，贡献 0；\n- 上一步不在甲（概率 $1-p_n$）：甲在两名接球者中，被选中的概率 $\\dfrac12$。\n\n$$p_{n+1}=\\frac12\\left(1-p_n\\right)$$\n\n**逐步算**：\n$$p_1=\\frac12(1-1)=0,\\quad p_2=\\frac12(1-0)=\\frac12,\\quad p_3=\\frac12\\left(1-\\frac12\\right)=\\frac14$$\n\n**平衡值检验**：令 $p=\\dfrac12(1-p)$ 得 $p^{*}=\\dfrac13$，与「$n\\to\\infty$ 时球在三人间均匀分布」一致。\n\n**通项**（了解即可）：$p_n=\\dfrac13+\\left(-\\dfrac12\\right)^n\\cdot\\dfrac23$。代 $n=3$：$\\dfrac13-\\dfrac1{12}=\\dfrac14$ ✓。\n\n**易错**：把「传给另外两人之一」当成「传给特定一人」，误用 $\\dfrac13$ 得 $\\dfrac{8}{27}$ 之类的值。**看清是「两人中任选」还是「指定某人」。**","pack":"K12"},{"id":"K12-2","type":"choice","stem":"甲、乙两人赌博，每局甲胜的概率为 $\\dfrac23$，输则付给对方 1 元。甲原有 2 元，乙原有 2 元，直到一方输光为止。则甲最终获胜（赢光乙的钱）的概率为____。","options":[["A","$\\dfrac15$"],["B","$\\dfrac12$"],["C","$\\dfrac45$"],["D","$\\dfrac56$"]],"answer":"C","solution":"**赌徒输光模型**：总资金 $N=4$，甲起始 $i=2$，赢率 $p=\\dfrac23$，$q=\\dfrac13$。\n\n**递推方程**：设 $W_i$ 为「甲从 $i$ 元出发最终赢光」的概率，\n$$W_i=pW_{i+1}+qW_{i-1},\\qquad W_0=0,\\quad W_N=1$$\n\n**解法一（作差化等比）**：整理得\n$$W_{i+1}-W_i=\\frac qp\\left(W_i-W_{i-1}\\right)$$\n故差分为等比数列，比值为 $\\dfrac qp=\\dfrac12$。由 $W_0=0$、\n$$W_i=\\frac{1-(q/p)^i}{1-(q/p)^N}$$\n\n**解法二（直接代公式）**：\n$$W_2=\\frac{1-\\left(\\frac12\\right)^2}{1-\\left(\\frac12\\right)^4}=\\frac{1-\\frac14}{1-\\frac1{16}}=\\frac{3/4}{15/16}=\\frac{4}{5}$$\n\n**验算**：$p=\\dfrac12$ 时应得 $\\dfrac iN=\\dfrac12$；本题 $p>\\dfrac12$（甲占优），结果 $0.8>\\dfrac12$ ✓ 合理。\n\n**输光概率**：$1-\\dfrac45=\\dfrac15$。\n\n**易错**：\n- 直接用 $\\dfrac iN$ ——那是**公平赌博**（$p=q$）的公式；\n- 分母写成 $1-\\left(\\dfrac qp\\right)^{N-1}$；\n- 把 $q/p$ 写成 $p/q$。","pack":"K12"},{"id":"K12-3","type":"choice","stem":"甲、乙两人进行比赛，先赢 5 局者获胜。现甲已赢 3 局、乙已赢 2 局，假设每局双方胜率均为 $\\dfrac12$ 且各局独立，则甲最终获胜的概率为____。","options":[["A","$\\dfrac58$"],["B","$\\dfrac{11}{16}$"],["C","$\\dfrac34$"],["D","$\\dfrac{21}{32}$"]],"answer":"B","solution":"**分赌本问题**：甲还差 $a=2$ 局，乙还差 $b=3$ 局。\n\n**补齐虚拟局数**：最多再打 $a+b-1=4$ 局，必有一方达标。把 4 局全「打完」（即使提前结束也按假设补足），甲获胜 $\\Leftrightarrow$ 这 4 局中至少赢 2 局：\n\n$$P=\\sum_{k=2}^{4}\\binom4k\\left(\\frac12\\right)^4=\\frac{6+4+1}{16}=\\frac{11}{16}$$\n\n**另一种写法（更常用）**：\n$$P=\\sum_{j=0}^{b-1}\\binom{a+j-1}{j}p^a q^j$$\n代 $a=2,b=3,p=q=\\dfrac12$：\n$$\\binom11\\left(\\frac12\\right)^2+\\binom21\\left(\\frac12\\right)^3+\\binom31\\left(\\frac12\\right)^4=\\frac14+\\frac28+\\frac3{16}=\\frac{4+4+3}{16}=\\frac{11}{16}\\ ✓$$\n\n**为什么要「补足 4 局」**：提前结束不影响结论——一旦甲先到 5 胜，后面补的局无论输赢都不改变「至少 2 胜」这个事实。这是分赌本问题的关键技巧。\n\n**易错答案**：$\\dfrac58$（只算了「再赢 1 局」之类的不完整枚举）、$\\dfrac34$（把乙还差 2 局当成 3 局）。\n\n**奖金分配**：若赌注 16 元，按 $11:5$ 分，甲得 11 元。","pack":"K12"},{"id":"K12-4","type":"choice","stem":"某设备每次开机有 $30%$ 的概率无需预热即可使用（等待时间 $0$），其余情况下预热时间服从 $U(0,40)$（分钟）。则平均等待时间为____分钟。","options":[["A","$10$"],["B","$12$"],["C","$14$"],["D","$20$"]],"answer":"C","solution":"**混合分布，按来源加权**：\n$$E(W)=0.3\\times0+0.7\\times E\\big[U(0,40)\\big]=0.7\\times20=14$$\n\n**完整分布函数**：\n$$F_W(w)=\\begin{cases}0, & w<0\\\\ 0.3+\\dfrac{0.7w}{40}, & 0\\le w<40\\\\ 1, & w\\ge40\\end{cases}$$\n在 $w=0$ 处从 0 跳到 $0.3$，说明有 $30%$ 的质量集中在 0。\n\n**为什么不是 $0.3\\times0+0.7\\times20$ 之外的算法**：有人会算 $\\dfrac{0+40}{2}\\times0.7$ 得 14，碰巧对；但若第二批的分布不是均匀的（例如指数），就必须用各自的期望加权，所以**记住「加权期望」这个原则，而不是背数字**。\n\n**顺带**：$E(W^2)=0.7\\times\\dfrac{40^2}{3}=0.7\\times533.33=373.33$，故\n$$D(W)=373.33-196=177.33$$\n\n**一般式**：$E(W)=\\sum w_i\\mu_i$，$E(W^2)=\\sum w_i(\\sigma_i^2+\\mu_i^2)$，再由 $D=E(W^2)-[E(W)]^2$ 求方差。","pack":"K12"},{"id":"K12-5","type":"judge","stem":"指数分布具有无记忆性，即 $P(X>s+t\\mid X>s)=P(X>t)$（$s,t\\ge0$）。","answer":"对","solution":"**验证**：设 $X\\sim E(\\lambda)$，$P(X>t)=e^{-\\lambda t}$。\n$$P(X>s+t\\mid X>s)=\\frac{P(X>s+t)}{P(X>s)}=\\frac{e^{-\\lambda(s+t)}}{e^{-\\lambda s}}=e^{-\\lambda t}=P(X>t)$$\n\n**含义**：已经等了 $s$ 小时还没坏，再等 $t$ 小时的概率与「从头开始等 $t$ 小时」相同——**过去的等待不提供任何信息**。\n\n**这是指数分布独有的性质**（连续型中）。离散型中的对应者是几何分布：$P(X>m+n\\mid X>m)=P(X>n)$。\n\n**反向结论（值得知道）**：在非负连续型分布中，**只有**指数分布具有无记忆性。这是证明题常考的「唯一性」。\n\n**实际应用**：元件的「剩余寿命」分布与原寿命相同，所以指数模型下「旧件如新」，这也说明指数模型不适合描述老化（磨损）过程。","pack":"K12"},{"id":"K12-6","type":"judge","stem":"若 $X$ 服从参数为 $p$ 的几何分布（从 1 开始计数），则 $P(X>m)=q^{m}$（$m$ 为非负整数）。","answer":"对","solution":"**直接算**：\n$$P(X>m)=P(\\text{前 }m\\text{ 次全部失败})=q^{m}$$\n\n**注意与 $P(X\\ge m)$ 的区别**：\n$$P(X\\ge m)=q^{m-1}\\quad(m\\ge1)$$\n因为 $X\\ge m$ 允许第 $m$ 次成功，相当于「前 $m-1$ 次失败」。\n\n**两者关系**：$P(X>m)=P(X\\ge m+1)=q^{m}$ ✓ 自洽。\n\n**由此得均值的另一条推导**（尾部求和）：\n$$E X=\\sum_{m\\ge0}P(X>m)=\\sum_{m\\ge0}q^m=\\frac1{1-q}=\\frac1p$$\n比逐项求和快得多，也顺便验证了 $E=\\dfrac1p$。\n\n**无记忆性**：\n$$P(X>m+n\\mid X>m)=\\frac{q^{m+n}}{q^m}=q^n=P(X>n)$$","pack":"K12"},{"id":"K12-7","type":"fill","stem":"设某元件寿命 $X\\sim E(0.2)$（单位：千小时），求 $P(X>10\\mid X>5)$。","fields":[{"label":"$P$","a":"0.3679","kind":"num","alt":["e^{-1}","0.368"]}],"solution":"**用无记忆性**（最快）：\n$$P(X>10\\mid X>5)=P(X>5)=e^{-0.2\\times5}=e^{-1}\\approx0.3679$$\n\n**硬算验证**：\n$$P(X>10\\mid X>5)=\\frac{P(X>10)}{P(X>5)}=\\frac{e^{-2}}{e^{-1}}=e^{-1}\\ ✓$$\n\n**注意「先减再算」**：条件 $X>5$ 已消耗 5 个单位，剩余等待时间仍服从 $E(0.2)$，所以「再等 5 个单位」的概率就是 $P(X>5)$。\n\n**易错**：\n- 直接写 $e^{-2}$（忘了已经等过 5）；\n- 写成 $1-e^{-1}$（方向反了，那是「在 5 之内坏掉」）；\n- 把参数 $\\lambda=0.2$ 当成均值，用 $e^{-10/0.2}$ 之类的错式。\n\n**参数约定**：本课程的 $E(\\lambda)$ 中 $\\lambda$ 是**率**，均值 $\\dfrac1\\lambda=5$（千小时）。","pack":"K12"},{"id":"K12-8","type":"subjective","points":10,"stem":"某型号电子元件由两家工厂供货，甲厂占 $70%$，乙厂占 $30%$。两厂产品的寿命（单位：小时）分别服从指数分布 $E(0.01)$ 与 $E(0.05)$，即\n$$f_{\\text{甲}}(t)=0.01e^{-0.01t},\\qquad f_{\\text{乙}}(t)=0.05e^{-0.05t},\\quad t\\ge0$$\n(1) 求任取一只元件的寿命生存函数 $S(t)=P(X>t)$ 与平均寿命；\n(2) 求该元件寿命超过 100 小时的概率；\n(3) 若已知某元件已正常工作 100 小时，求它来自甲厂的概率。","solution":"**(1) 混合生存函数。** 按来源加权（这是「全概率公式」用在分布上的形式）：\n$$S(t)=0.7e^{-0.01t}+0.3e^{-0.05t},\\qquad t\\ge0$$\n\n**平均寿命**按来源加权：\n$$E(X)=0.7\\times\\frac1{0.01}+0.3\\times\\frac1{0.05}=0.7\\times100+0.3\\times20=70+6=76\\ \\text{小时}$$\n\n**注意**：$E(X)$ **不是** $\\dfrac{1}{0.7\\times0.01+0.3\\times0.05}=\\dfrac{1}{0.022}\\approx45.5$。混合分布的期望是期望的加权平均，不是「平均参数再取倒数」。\n\n**(2) 代入 $t=100$。**\n$$S(100)=0.7e^{-1}+0.3e^{-5}\\approx0.7\\times0.36788+0.3\\times0.006738$$\n$$\\approx0.25752+0.00202=0.2595$$\n\n即约 $26%$ 的元件能工作到 100 小时。\n\n**(3) 贝叶斯反查来源。**\n$$P(\\text{甲}\\mid X>100)=\\frac{0.7\\,S_{\\text{甲}}(100)}{0.7\\,S_{\\text{甲}}(100)+0.3\\,S_{\\text{乙}}(100)}=\\frac{0.25752}{0.25954}\\approx0.9922$$\n\n**结论解读**：先验是 $0.7$，后验升到 $0.992$。原因是乙厂的率参数是甲厂的 5 倍（寿命短得多），能撑到 100 小时的几乎只能是甲厂的产品。**「活得久」这个观察极大地更新了对来源的判断**——这正是贝叶斯的思想。\n\n**本题的关键结构（务必掌握）**：\n- 混合分布：$S(t)=\\sum w_iS_i(t)$，$F$ 与 $f$ 同样加权；\n- 期望：$E X=\\sum w_i\\mu_i$，**不能**对参数取加权平均；\n- 反查：把 $w_iS_i(t)$ 当作「第 $i$ 类且存活」的联合概率，用贝叶斯。\n\n**易错点**：\n- (1) 写成 $S(t)=e^{-0.022t}$：混合指数**一般不是指数**，不能合并参数；\n- (1) 用 $\\dfrac{1}{\\bar\\lambda}$ 算期望；\n- (3) 忘记乘先验 $0.7$ 与 $0.3$，直接用 $S_{\\text{甲}}/S_{\\text{总}}$ 而漏权重。\n\n**拓展**：本题的 $S(t)$ 不满足 $S(s+t)=S(s)S(t)$，所以**混合指数没有无记忆性**。这是「无记忆性只有指数独有」这一结论的另一种体现。","pack":"K12"},{"id":"MA-1","type":"choice","points":"5","stem":"同时掷两枚均匀骰子，点数和为 $5$ 的概率为____。","options":[["A","$\\dfrac19$"],["B","$\\dfrac16$"],["C","$\\dfrac5{36}$"],["D","$\\dfrac1{12}$"]],"answer":"A","solution":"**样本空间** 36 个有序结果。和为 5 的基本事件：$(1,4),(2,3),(3,2),(4,1)$，共 4 个。\n\n$$P=\\frac4{36}=\\frac19$$\n\n**通用公式**：两骰和为 $s$ 的概率为 $\\dfrac{6-|s-7|}{36}$。代 $s=5$ 得 $\\dfrac{6-2}{36}=\\dfrac19$ ✓。\n\n**干扰项来源**：$\\dfrac16$ 是「点数和为 7」（有 6 种）；$\\dfrac5{36}$ 是「和为 6 或 8」；$\\dfrac1{12}$ 是「和为 4 或 10」。命题人就是拿相邻的和数做干扰。\n\n**注意**：$(1,4)$ 与 $(4,1)$ 是**两个不同的**结果，因为两枚骰子可区分。若把骰子当成不可区分，就会错算成 $\\dfrac{2}{21}$（21 是组合数）。","pack":"MA"},{"id":"MA-2","type":"choice","points":"5","stem":"设 $P(A)=0.4$，$P(B)=0.5$，$P(A\\mid B)=0.6$，则 $P(A\\cup B)=$____。","options":[["A","$0.5$"],["B","$0.6$"],["C","$0.7$"],["D","$0.8$"]],"answer":"B","solution":"**第一步：把条件概率还原成交集。**\n$$P(AB)=P(B)P(A\\mid B)=0.5\\times0.6=0.3$$\n\n**第二步：加法公式。**\n$$P(A\\cup B)=P(A)+P(B)-P(AB)=0.4+0.5-0.3=0.6$$\n\n**自检**：$P(A\\cup B)=0.6$ 应不小于 $\\max\\{P(A),P(B)\\}=0.5$，且不超过 $1$ ✓。\n\n**常见错法**：直接 $0.4+0.5=0.9$（忘了减交集），或把 $P(A\\mid B)$ 当成交集 $0.6$ 直接代入。","pack":"MA"},{"id":"MA-3","type":"choice","points":"5","stem":"甲、乙、丙三人独立地破译一份密码，各自成功的概率为 $\\dfrac12,\\ \\dfrac13,\\ \\dfrac14$。则密码被破译的概率为____。","options":[["A","$\\dfrac14$"],["B","$\\dfrac23$"],["C","$\\dfrac34$"],["D","$\\dfrac{11}{24}$"]],"answer":"C","solution":"**取补**：密码没被破译 $\\Leftrightarrow$ 三人都失败。\n\n$$P(\\text{全失败})=\\left(1-\\frac12\\right)\\left(1-\\frac13\\right)\\left(1-\\frac14\\right)=\\frac12\\times\\frac23\\times\\frac34=\\frac14$$\n\n$$P(\\text{破译})=1-\\frac14=\\frac34$$\n\n**为什么不能直接相加**：$\\dfrac12+\\dfrac13+\\dfrac14=\\dfrac{13}{12}>1$，已经是荒谬值。三人可能同时成功，加法会重复计数。\n\n**验证「至少一个」公式**：$P\\left(\\bigcup A_i\\right)=1-\\prod(1-P(A_i))$，前提是**相互独立**，题干已给。\n\n**若题目改成「恰有一人破译」**：\n$$\\frac12\\cdot\\frac23\\cdot\\frac34+\\frac12\\cdot\\frac13\\cdot\\frac34+\\frac12\\cdot\\frac23\\cdot\\frac14=\\frac14+\\frac18+\\frac1{12}=\\frac{11}{24}$$\n——正好是选项 D，命题人用它区分「至少一个」与「恰好一个」。","pack":"MA"},{"id":"MA-4","type":"choice","points":"5","stem":"设 $X\\sim N(0,1)$，$\\Phi_0(1)=0.8413$，$\\Phi_0(2)=0.9772$，则 $P(-1<X<2)=$____。","options":[["A","$0.8185$"],["B","$0.6826$"],["C","$0.1359$"],["D","$0.9544$"]],"answer":"A","solution":"**直接做差**：\n$$P(-1<X<2)=\\Phi_0(2)-\\Phi_0(-1)$$\n由对称性 $\\Phi_0(-1)=1-\\Phi_0(1)=1-0.8413=0.1587$，故\n$$=0.9772-0.1587=0.8185$$\n\n**三个干扰项的来源**：\n- $0.6826=2\\Phi_0(1)-1$：算的是 $|X|<1$；\n- $0.1359=\\Phi_0(2)-\\Phi_0(1)$：算的是 $1<X<2$；\n- $0.9544=2\\Phi_0(2)-1$：算的是 $|X|<2$。\n\n**四个选项都「像」正确答案**，这是命题人最爱的设计。避免的办法只有一条：**先把区间画出来，标清两端各自对应哪个 $\\Phi_0$ 值，再作差**。\n\n**注意本题区间不对称**：左端 $-1$、右端 $2$，不能用 $2\\Phi_0(c)-1$ 这种对称公式。","pack":"MA"},{"id":"MA-5","type":"choice","points":"5","stem":"设离散型随机变量 $X$ 的分布函数为\n$$F(x)=\\begin{cases}0, & x<0\\\\ 0.3, & 0\\le x<1\\\\ 0.7, & 1\\le x<2\\\\ 1, & x\\ge2\\end{cases}$$\n则 $P(0.5<X<2)=$____。","options":[["A","$0.3$"],["B","$0.4$"],["C","$0.6$"],["D","$0.7$"]],"answer":"B","solution":"**先读出点概率**：$P(X=0)=0.3$，$P(X=1)=0.4$，$P(X=2)=0.3$，合计 1 ✓。\n\n**本题区间**：左端**开**、右端**开**。\n$$P(0.5<X<2)=F(2-)-F(0.5)$$\n\n- $F(2-)=0.7$（$x$ 从左侧趋近 2 时，还停在 $1\\le x<2$ 这一段）；\n- $F(0.5)=0.3$。\n\n$$=0.7-0.3=0.4$$\n\n**直接验证**：区间 $(0.5,2)$ 内只含 $X=1$，概率 $0.4$ ✓。\n\n**为什么右端要用 $F(2-)$**：因为「$X<2$」不含 $X=2$，必须把 $X=2$ 的质量 $0.3$ 剔除。若误用 $F(2)=1$，得 $0.7$，正好是干扰项 D。\n\n**口诀**：**开区间那一端要「多扣一次跳跃」**。","pack":"MA"},{"id":"MA-6","type":"choice","points":"5","stem":"设 $X\\sim B\\left(4,\\dfrac12\\right)$，则 $P(X=2)=$____。","options":[["A","$\\dfrac38$"],["B","$\\dfrac14$"],["C","$\\dfrac12$"],["D","$\\dfrac3{16}$"]],"answer":"A","solution":"**二项分布**：\n$$P(X=2)=\\binom42\\left(\\frac12\\right)^2\\left(\\frac12\\right)^2=6\\times\\frac1{16}=\\frac38$$\n\n**核对全部分布律**（检验是否归一）：\n$$P(X=0)=\\frac1{16},\\ P(X=1)=\\frac4{16},\\ P(X=2)=\\frac6{16},\\ P(X=3)=\\frac4{16},\\ P(X=4)=\\frac1{16}$$\n合计 $\\dfrac{16}{16}=1$ ✓。\n\n**干扰项**：$\\dfrac14=\\dfrac4{16}$ 是 $P(X=1)$ 或 $P(X=3)$；$\\dfrac12=\\dfrac8{16}$ 不对应任何点；$\\dfrac3{16}$ 是常见的「忘了乘组合数后算错」的结果。\n\n**提醒**：$\\binom42=6$ 这个系数最容易漏。只写 $\\left(\\dfrac12\\right)^4=\\dfrac1{16}$ 的人，得的是「指定某两次成功」的概率，不是「恰有两次成功」。","pack":"MA"},{"id":"MA-7","type":"choice","points":"5","stem":"设连续型随机变量 $X$ 的密度为 $f(x)=cx(1-x)$（$0<x<1$），其余为 $0$，则常数 $c=$____。","options":[["A","$6$"],["B","$3$"],["C","$12$"],["D","$\\dfrac16$"]],"answer":"A","solution":"**归一化条件**：\n$$\\int_0^1cx(1-x)\\,dx=c\\int_0^1\\left(x-x^2\\right)dx=c\\left(\\frac12-\\frac13\\right)=\\frac c6=1$$\n\n故 $c=6$。\n\n**这个分布是 Beta(2,2)**，密度关于 $x=\\dfrac12$ 对称，在两端为 0、中间取最大值 $\\dfrac32$（注意密度可以大于 1）。\n\n**计算 $E(X)$ 顺便验证对称性**：\n$$E(X)=\\int_0^16x^2(1-x)dx=6\\left(\\frac13-\\frac14\\right)=6\\times\\frac1{12}=\\frac12\\ ✓$$\n与对称中心一致。\n\n**干扰项**：$3$ 是忘了乘 2 或积分算成 $\\dfrac13$；$12$ 是用了 $\\int x(1-x)=\\dfrac16$ 却把系数写反；$\\dfrac16$ 是直接取了积分值。","pack":"MA"},{"id":"MA-8","type":"choice","points":"5","stem":"设某元件寿命 $X\\sim E(2)$（单位：千小时），则 $P(X<1)=$____。","options":[["A","$1-e^{-2}$"],["B","$e^{-2}$"],["C","$1-e^{-1}$"],["D","$\\dfrac12$"]],"answer":"A","solution":"**指数分布**：$F(x)=1-e^{-\\lambda x}$，$x\\ge0$，本题 $\\lambda=2$。\n\n$$P(X<1)=F(1)=1-e^{-2}\\approx0.8647$$\n\n**注意参数是「率」**：$E(2)$ 表示 $\\lambda=2$，均值 $\\dfrac1\\lambda=0.5$（千小时），即 $500$ 小时。\n\n**干扰项**：\n- $e^{-2}=P(X>1)$，方向反了；\n- $1-e^{-1}$：把 $\\lambda$ 当成 1；\n- $\\dfrac12$：误以为是指数分布的均值落在区间内的概率。\n\n**核对数值**：均值为 $0.5$，而 $1$ 是均值的 2 倍，所以「寿命小于 1」的概率应接近 $1$，$0.865$ 合理。","pack":"MA"},{"id":"MA-9","type":"choice","points":"5","stem":"设 $E(X)=1$，$D(X)=2$，则 $E\\left[(X+1)^{2}\\right]=$____。","options":[["A","$4$"],["B","$5$"],["C","$6$"],["D","$7$"]],"answer":"C","solution":"**第一步：展开平方。**\n$$(X+1)^2=X^2+2X+1$$\n由期望的线性性：\n$$E\\left[(X+1)^2\\right]=E(X^2)+2E(X)+1$$\n\n**第二步：求 $E(X^2)$。**\n$$E(X^2)=D(X)+[E(X)]^2=2+1=3$$\n\n**第三步：代入。**\n$$=3+2(1)+1=6$$\n\n**不能这样算**：$[E(X+1)]^2=(1+1)^2=4$ —— 这是把「期望的平方」当成了「平方的期望」。两者相差一个 $D(X+1)=D(X)=2$：$4+2=6$ ✓，正好对上。\n\n**记忆**：$E(g(X))\\ne g(E(X))$，除非 $g$ 是线性的。本题 $g(x)=(x+1)^2$ 是二次的，必须展开。","pack":"MA"},{"id":"MA-10","type":"choice","points":"5","stem":"设 $E(X)=5$，$D(X)=2$，则由切比雪夫不等式，$P(|X-5|<3)\\ge$____。","options":[["A","$\\dfrac79$"],["B","$\\dfrac29$"],["C","$\\dfrac19$"],["D","$\\dfrac89$"]],"answer":"A","solution":"**切比雪夫不等式的「下界」形式**：\n$$P\\big(|X-E(X)|<\\varepsilon\\big)\\ge1-\\frac{D(X)}{\\varepsilon^2}$$\n\n代入 $\\varepsilon=3$，$D(X)=2$：\n$$P(|X-5|<3)\\ge1-\\frac29=\\frac79$$\n\n**注意问的是「$<$」还是「$\\ge$」**：切比雪夫原文控制的是 $P(|X-\\mu|\\ge\\varepsilon)\\le\\dfrac{D}{\\varepsilon^2}$，取补即得上式。区间端点开闭在不等式里不影响界的形式，但严谨写法应与原式一致。\n\n**数值合理性**：$\\varepsilon=3$ 约等于 $2.12$ 个标准差（$\\sqrt2\\approx1.414$），正态时概率约 $0.966$，切比雪夫给出 $0.778$ 的下界，偏保守但正确。\n\n**若 $\\varepsilon$ 很小**：例如 $\\varepsilon=1$，则 $1-\\dfrac21=-1$，此时只能取平凡下界 $0$（概率非负）。","pack":"MA"},{"id":"MA-11","type":"choice","points":"5","stem":"甲箱中有 2 个红球、3 个白球，乙箱中有 3 个红球、1 个白球。随机选一个箱子（等可能），再从中任取一球，则取到红球的概率为____。","options":[["A","$\\dfrac{23}{40}$"],["B","$\\dfrac{11}{20}$"],["C","$\\dfrac35$"],["D","$\\dfrac58$"]],"answer":"A","solution":"**按箱型划分，用全概率**：\n$$P(R)=\\frac12\\cdot\\frac25+\\frac12\\cdot\\frac34=\\frac15+\\frac38$$\n\n通分：$\\dfrac15=\\dfrac8{40}$，$\\dfrac38=\\dfrac{15}{40}$，故\n$$P(R)=\\frac{23}{40}=0.575$$\n\n**不能直接平均**：两箱球数不同（5 个与 4 个），若把两箱合并再抽，红球比例是 $\\dfrac{5}{9}\\approx0.556$，与 $0.575$ 不同。**「先选箱再抽」与「合并后抽」是两种不同的抽样机制**，只有两箱球数相同且权重相等时才碰巧一致。\n\n**干扰项**：$\\dfrac{11}{20}=0.55$ 是「两箱红球比例取算术平均」$\\dfrac{0.4+0.75}{2}=0.575$ —— 等等，$\\dfrac{0.4+0.75}{2}=0.575$ 其实等于正确答案。说明这个干扰项是对「合并抽样」的错误近似。\n\n**规范写法**：\n$$P(R)=P(\\text{甲})P(R\\mid\\text{甲})+P(\\text{乙})P(R\\mid\\text{乙})$$\n先把来源与条件概率写全，再代数字，能拿全步骤分。","pack":"MA"},{"id":"MA-12","type":"choice","points":"5","stem":"设 $X\\sim N(0,1)$，令 $Y=3X+1$，则 $Y$ 服从____。","options":[["A","$N(1,3)$"],["B","$N(1,9)$"],["C","$N(0,9)$"],["D","$N(3,1)$"]],"answer":"B","solution":"**正态的线性变换仍为正态**，参数按线性变换规则走：\n$$E(Y)=3E(X)+1=1$$\n$$D(Y)=3^2D(X)=9$$\n\n故 $Y\\sim N(1,9)$。\n\n**易错点**：写成 $N(1,3)$ —— 那是把**标准差**当方差（$\\sqrt9=3$ 是标准差，方差是 9）。\n\n**一般公式**：$X\\sim N(\\mu,\\sigma^2)\\Rightarrow aX+b\\sim N(a\\mu+b,\\ a^2\\sigma^2)$。**系数要平方**，这是与「均值」最大的不同。\n\n**反向用法**：若题目给「$Y\\sim N(1,9)$，$Y=3X+1$，求 $X$ 的分布」，则\n$$X=\\frac{Y-1}{3}\\sim N\\left(\\frac{1-1}{3},\\frac{9}{9}\\right)=N(0,1)$$\n即 $X$ 是标准正态——这正是标准化的逆过程。","pack":"MA"},{"id":"MA-13","type":"subjective","points":"12","note":"建议 10 分钟","stem":"某年级共 50 名学生，其中参加数学竞赛的有 25 人，参加物理竞赛的有 20 人，参加化学竞赛的有 15 人；同时参加数学与物理的有 8 人，数学与化学的有 5 人，物理与化学的有 4 人；三科都参加的有 2 人。\n(1) 求至少参加一科的人数；\n(2) 求只参加一科的人数；\n(3) 求恰好参加两科的人数；\n(4) 从全年级任取一人，求他恰好参加两科的概率；\n(5) 已知某人至少参加一科，求他恰好参加两科的概率。","solution":"**设** $A,B,C$ 分别为参加数学、物理、化学。已知\n$$P(A)=\\frac{25}{50},\\ P(B)=\\frac{20}{50},\\ P(C)=\\frac{15}{50},\\ P(AB)=\\frac8{50},\\ P(AC)=\\frac5{50},\\ P(BC)=\\frac4{50},\\ P(ABC)=\\frac2{50}$$\n\n为便于书写，以下均用「人数」计算，最后再除以 50。\n\n**(1) 至少参加一科（三事件容斥）。**\n$$|A\\cup B\\cup C|=25+20+15-8-5-4+2=45$$\n$$\\Rightarrow P= \\frac{45}{50}=0.9$$\n\n**(2) 只参加一科。** 以「只参加数学」为例，要从 25 中扣掉与物理、化学的重叠，而三科都参加的 2 人被扣了两次，需加回一次：\n$$|{\\text{只数学}}|=25-8-5+2=14$$\n同理\n$$|{\\text{只物理}}|=20-8-4+2=10,\\qquad |{\\text{只化学}}|=15-5-4+2=8$$\n$$|{\\text{只一科}}|=14+10+8=32,\\qquad P=\\frac{32}{50}=0.64$$\n\n**(3) 恰好两科。** 「参加数学与物理但不参加化学」$=8-2=6$；同理 $5-2=3$，$4-2=2$：\n$$|{\\text{恰两科}}|=6+3+2=11,\\qquad P=\\frac{11}{50}=0.22$$\n\n**(4)** 由 (3) 直接得 $P=\\dfrac{11}{50}=0.22$。\n\n**(5) 条件概率。**\n$$P(\\text{恰两科}\\mid\\text{至少一科})=\\frac{11/50}{45/50}=\\frac{11}{45}\\approx0.244$$\n\n**交叉验算（必做的自检）**：\n$$32\\ (\\text{只一科})+11\\ (\\text{恰两科})+2\\ (\\text{三科})=45\\ ✓$$\n与 (1) 的并集人数吻合。另外「一科也不参加」的有 $50-45=5$ 人，概率 $0.1$。\n\n**最易失分处**：\n- 直接写 $25+20+15-8-5-4=43$，漏掉 $+2$；\n- 求「只参加一科」时忘记把三科交集加回，得 $25-8-5=12$ 这类错值；\n- 第 (5) 问分母写成 50 而不是 45。\n\n**评分习惯**：解答题写出容斥公式本身就有分，即使最后算错；所以**先把公式列出来**。","pack":"MA"},{"id":"MA-14","type":"subjective","points":"12","note":"建议 12 分钟","stem":"甲、乙两台机器生产同种零件，产量比为 $3:1$。甲机器的不合格品率为 $0.02$，乙机器为 $0.06$。\n(1) 从全部产品中任取一件，求它是不合格品的概率；\n(2) 已知取到的是一件不合格品，求它来自甲机器的概率；\n(3) 工厂改为二次抽检：先随机抽一件，若不合格，则**从同一台机器**再抽一件；只有两次都不合格才拒收整批。求整批被拒收的概率，并求在拒收条件下该批来自甲机器的概率。","solution":"**(1) 全概率。** 产量比 $3:1$ 给出先验\n$$P(\\text{甲})=\\frac34=0.75,\\qquad P(\\text{乙})=\\frac14=0.25$$\n\n$$P(D)=P(\\text{甲})P(D\\mid\\text{甲})+P(\\text{乙})P(D\\mid\\text{乙})=0.75\\times0.02+0.25\\times0.06$$\n$$=0.015+0.015=0.03$$\n\n**(2) 贝叶斯。**\n$$P(\\text{甲}\\mid D)=\\frac{0.015}{0.03}=0.5$$\n\n**解读**：先验是 $0.75$，后验降到 $0.5$。虽然甲产量是乙的三倍，但乙的不合格率是甲的三倍，两者正好抵消。\n\n**(3) 二次抽检。** 关键在「从同一台机器再抽一件」，故两次独立、条件概率仍用该机器的不合格率：\n$$P(R\\mid\\text{甲})=0.02^2=0.0004,\\qquad P(R\\mid\\text{乙})=0.06^2=0.0036$$\n\n$$P(R)=0.75\\times0.0004+0.25\\times0.0036=0.0003+0.0009=0.0012$$\n\n$$P(\\text{甲}\\mid R)=\\frac{0.0003}{0.0012}=0.25$$\n\n**注意 (2) 与 (3) 的差别**：一次抽检时后验是 $0.5$，二次抽检后降到 $0.25$。原因是平方放大了两台机器不合格率的差距（3 倍 → 9 倍），乙机器更容易「连续两次不合格」。\n\n**评分要点**：\n- (1) 公式 2 分、结果 2 分；\n- (2) 公式 1 分、结果 1 分；\n- (3) 两个条件概率各 2 分、全概率 1 分、贝叶斯 3 分。\n\n**最易失分**：把 (3) 的第二次抽检写成「全体不合格率 $0.03$」，得 $(0.03)^2=0.0009$。题干「同一条生产线」这五个字就是提示，必须按线列条件概率。","pack":"MA"},{"id":"MA-15","type":"subjective","points":"16","note":"建议 16 分钟","stem":"设连续型随机变量 $X$ 的概率密度为\n$$f(x)=\\begin{cases}kx^{2}, & 0<x<3\\\\ 0, & \\text{其他}\\end{cases}$$\n(1) 求常数 $k$；\n(2) 求分布函数 $F(x)$；\n(3) 求 $E(X)$ 与 $D(X)$；\n(4) 求 $P(1<X<2\\mid X>1)$。","solution":"**(1) 归一化。**\n$$\\int_0^3kx^2dx=k\\cdot\\frac{27}{3}=9k=1\\ \\Rightarrow\\ k=\\frac19$$\n\n**(2) 分布函数。** 分段积分：\n- $x<0$：$F=0$；\n- $0\\le x<3$：$\\displaystyle F(x)=\\int_0^x\\frac{t^2}{9}dt=\\frac{x^3}{27}$；\n- $x\\ge3$：$F=1$。\n\n$$F(x)=\\begin{cases}0, & x<0\\\\ \\dfrac{x^3}{27}, & 0\\le x<3\\\\ 1, & x\\ge3\\end{cases}$$\n\n**检查**：$F(3)=\\dfrac{27}{27}=1$ ✓，单调递增 ✓，右连续 ✓。\n\n**(3) 期望与方差。**\n$$E(X)=\\int_0^3x\\cdot\\frac{x^2}{9}dx=\\frac19\\cdot\\frac{81}{4}=\\frac94$$\n\n$$E(X^2)=\\int_0^3x^2\\cdot\\frac{x^2}{9}dx=\\frac19\\cdot\\frac{243}{5}=\\frac{27}{5}$$\n\n$$D(X)=\\frac{27}{5}-\\left(\\frac94\\right)^2=\\frac{27}{5}-\\frac{81}{16}=\\frac{432-405}{80}=\\frac{27}{80}=0.3375$$\n\n**数值合理性**：均匀分布 $U(0,3)$ 的方差是 $\\dfrac{9}{12}=0.75$；本题密度向右递增（质量偏向 3），应当更集中，$0.3375<0.75$ ✓。\n\n**(4) 条件概率。**\n$$P(1<X<2\\mid X>1)=\\frac{P(1<X<2)}{P(X>1)}$$\n\n分子：$F(2)-F(1)=\\dfrac{8}{27}-\\dfrac{1}{27}=\\dfrac{7}{27}$。\n\n分母：$1-F(1)=1-\\dfrac{1}{27}=\\dfrac{26}{27}$。\n\n$$\\Rightarrow\\frac{7/27}{26/27}=\\frac{7}{26}\\approx0.269$$\n\n**另一种算法（直接用密度）**：\n$$P(X>1)=\\int_1^3\\frac{x^2}{9}dx=\\frac{27-1}{27}=\\frac{26}{27}\\ ✓$$\n\n**本题的评分结构**（16 分）：\n- (1) 归一化 3 分；\n- (2) 分段 $F$ 4 分（三段各 1 分，接点 1 分）；\n- (3) $E$ 3 分、$E(X^2)$ 3 分、$D$ 1 分；\n- (4) 2 分。\n\n**易错点**：\n- (3) 忘记先算 $E(X^2)$ 就直接写 $D$；\n- (4) 把分母写成 1（当成无条件概率），得 $\\dfrac{7}{27}$；\n- 分段 $F$ 忘记写 $x\\ge3$ 时为 1。","pack":"MA"},{"id":"MB-1","type":"choice","points":"5","stem":"以事件 $A$ 表示「甲来听课」，$B$ 表示「乙来听课」，则 $\\bar A B$ 的对立事件表示____。","options":[["A","甲来听课且乙没来听课"],["B","甲没来听课且乙来听课"],["C","甲来听课或乙没来听课"],["D","甲没来听课或乙来听课"]],"answer":"C","solution":"**先翻译 $\\bar AB$**：甲**没**来（$\\bar A$）**且**乙来了（$B$）。\n\n**取对立（德摩根）**：把「且」翻成「或」，每个事件各自取反——\n$$\\overline{\\bar A B}=A\\cup\\bar B$$\n\n即「甲来**或**乙没来」。\n\n**用日常语言核对**：「$\\bar AB$ 不发生」意味着「不可能同时出现『甲没来』和『乙来了』」——只要甲来了，或者乙没来，就足以否定它。所以是「甲来 **或** 乙没来」✓。\n\n**易错点**：\n- 选成「甲来且乙没来」（$\\bar AB$ 本身）；\n- 选成「甲没来或乙来」（$\\bar A\\cup B$，这是 $\\overline{A\\bar B}$）；\n- 忘了「或」而不是「且」。\n\n**口诀**：**取反时「且」变「或」，每个事件各自取补。** 这是德摩根的直观版本。","pack":"MB"},{"id":"MB-2","type":"choice","points":"5","stem":"现有一副不含大小王、其余完整的扑克牌（52 张），洗牌后随机抽取一张。下列叙述正确的是____。","options":[["A","「这张牌不是黑桃」与「这张牌是红桃」相互独立"],["B","「这张牌是黑桃」与「这张牌是红桃」相互独立"],["C","「这张牌不是黑桃」与「这张牌不是 $K$」相互独立"],["D","「这张牌是红色」与「这张牌是黑桃」相互独立"]],"answer":"C","solution":"**判断独立只看一条**：$P(EF)=P(E)P(F)$ 是否成立。\n\n**C 选项**：\n$$P(\\text{非黑桃})=\\frac{39}{52}=\\frac34,\\qquad P(\\text{非}K)=\\frac{48}{52}=\\frac{12}{13}$$\n$$P(\\text{非黑桃且非}K)=\\frac{52-13-4+1}{52}=\\frac{36}{52}=\\frac9{13}$$\n而 $\\dfrac34\\times\\dfrac{12}{13}=\\dfrac{36}{52}=\\dfrac9{13}$ ✓ **独立**。\n\n**A 选项**：$P(\\text{红桃})=\\dfrac14$，但「红桃」必然「非黑桃」，交集概率就是 $\\dfrac14$，而 $\\dfrac34\\times\\dfrac14=\\dfrac3{16}\\ne\\dfrac14$ ✗ 不独立（实际上是包含关系）。\n\n**B 选项**：黑桃与红桃互斥，交集概率 0，而乘积 $\\dfrac14\\cdot\\dfrac14=\\dfrac1{16}>0$ ✗。\n\n**D 选项**：红色与黑桃互斥 ✗。\n\n**背后的规律**：一副牌里**花色与点数独立**，所以任何「只涉及花色」的事件都与任何「只涉及点数」的事件独立；而两个都涉及花色的事件一般不独立。\n\n**这题的陷阱**：A 看起来「差不多」，但「不是黑桃」包含了红桃，是包含关系，绝不会独立（除非概率为 0 或 1）。","pack":"MB"},{"id":"MB-3","type":"choice","points":"5","stem":"设事件 $A,B,C$ 两两互不相容，且 $P(A)=0.2$，$P(B)=0.3$，$P(C)=0.4$，则 $P\\left[(A\\cup B)-C\\right]=$____。","options":[["A","$0.1$"],["B","$0.3$"],["C","$0.5$"],["D","$0.9$"]],"answer":"C","solution":"**化简事件**：由减法公式\n$$(A\\cup B)-C=(A\\cup B)\\cap\\bar C$$\n\n因 $A,B$ 都与 $C$ 互斥，故 $A\\bar C=A$、$B\\bar C=B$，于是\n$$(A\\cup B)\\bar C=A\\bar C\\cup B\\bar C=A\\cup B$$\n\n**求概率**：$A,B$ 互斥，\n$$P(A\\cup B)=P(A)+P(B)=0.2+0.3=0.5$$\n\n**也可以直接代减法公式**：$P((A\\cup B)-C)=P(A\\cup B)-P((A\\cup B)C)$，而 $(A\\cup B)C=AC\\cup BC=\\varnothing$，故仍得 $0.5$。\n\n**注意「互不相容」不等于「和为 1」**：$0.2+0.3+0.4=0.9<1$，说明还存在不属于三者的事件，这完全可能（划分不必穷尽）。\n\n**易错**：$0.9$ 是把三个概率全加起来；$0.1$ 是 $1-0.9$，与本题无关。","pack":"MB"},{"id":"MB-4","type":"choice","points":"5","stem":"10 个人中至少有两人**出生月份相同**的概率为____（设 12 个月等可能，各人出生月份相互独立）。","options":[["A","$\\dfrac{A_{12}^{10}}{12^{10}}$"],["B","$1-\\dfrac{A_{12}^{10}}{12^{10}}$"],["C","$1-\\dfrac{12!}{12^{10}}$"],["D","$1-\\dfrac{A_{10}^{12}}{12^{10}}$"]],"answer":"B","solution":"**取补**：至少两人同月 $\\Leftrightarrow$ 并非 10 人月份全不同。\n\n**10 人月份全不同**：第一个人有 12 种选择，第二个 11 种……第十个 3 种，\n$$P(\\text{全不同})=\\frac{12\\times11\\times\\cdots\\times3}{12^{10}}=\\frac{A_{12}^{10}}{12^{10}}$$\n\n故\n$$P(\\text{至少两人同月})=1-\\frac{A_{12}^{10}}{12^{10}}$$\n\n**为什么选项 A 错**：那是「全不同」的概率，方向相反。\n**为什么 C 错**：$\\dfrac{12!}{12^{10}}$ 是「12 人全不同」的概率（分子用了 $12!$，分母却是 $10$ 次方），人数与分母不匹配。\n**为什么 D 错**：$A_{10}^{12}$ 无意义（从 10 个里取 12 个排列），是概念错误。\n\n**数值感**：$\\dfrac{A_{12}^{10}}{12^{10}}\\approx0.0035$，所以至少两人同月约 $0.9965$——**几乎必然**。这与「23 人里至少两人生日相同超过一半」是同一类反直觉结论（生日悖论）。\n\n**通用写法**：$n$ 人、$m$ 个等可能类别，至少一对相同的概率为 $1-\\dfrac{A_m^n}{m^n}$（$n\\le m$）。","pack":"MB"},{"id":"MB-5","type":"choice","points":"5","stem":"设 $P(A)=0.6$，$P(B)=0.5$，$P(AB)=0.3$，且 $P(C\\mid AB)=0.8$，$P(C\\mid A\\bar B)=0.5$，$P(C\\mid\\bar A)=0.2$。则 $P(C)=$____。","options":[["A","$0.35$"],["B","$0.47$"],["C","$0.52$"],["D","$0.60$"]],"answer":"B","solution":"**先补齐 $\\Omega$ 的一个划分**：$AB$、$A\\bar B$、$\\bar A$ 三块互斥且并为全集。\n\n$$P(AB)=0.3,\\qquad P(A\\bar B)=P(A)-P(AB)=0.6-0.3=0.3,\\qquad P(\\bar A)=0.4$$\n\n**全概率：**\n$$P(C)=0.3\\times0.8+0.3\\times0.5+0.4\\times0.2=0.24+0.15+0.08=0.47$$\n\n**为什么划分是这三块**：题干给的三个条件概率，竖线后面分别是 $AB$、$A\\bar B$、$\\bar A$，它们正好把样本空间切完（$\\bar A$ 已经包含了 $\\bar A B$ 与 $\\bar A\\bar B$）。**按题目给的条件概率来定划分**，是这类题的第一原则。\n\n**易错**：\n- 用 $AB$、$A\\bar B$、$\\bar A B$、$\\bar A\\bar B$ 四块，却没有第四块的条件概率，只能再假设 $\\bar A$ 内部细分的条件概率均为 $0.2$ —— 本题恰好可以这样合并，但若题目分别给出就不可合并；\n- 忘记先算 $P(A\\bar B)=P(A)-P(AB)$，直接拿 $P(A)=0.6$ 当权重。\n\n**验算**：$0.3+0.3+0.4=1$ ✓。","pack":"MB"},{"id":"MB-6","type":"choice","points":"5","stem":"某厂零件长度 $X$ 满足 $E(X)=10$ cm，$D(X)=0.36$。规定长度在 $8$ cm 到 $12$ cm 之间为合格，则该批零件的合格率至少为____。","options":[["A","$0.91$"],["B","$0.94$"],["C","$0.82$"],["D","$0.70$"]],"answer":"A","solution":"**把区间写成「围绕均值的偏差」**：$[8,12]$ 关于 $\\mu=10$ 对称，半宽 $c=2$。\n\n$$P(8\\le X\\le12)=P(|X-10|\\le2)$$\n\n由切比雪夫（注意此处是「$\\le$」，需取补形式）：\n$$P(|X-10|<2)\\ge1-\\frac{D(X)}{2^2}=1-\\frac{0.36}{4}=1-0.09=0.91$$\n\n端点是否包含不影响概率（离散情形差一个点，本题作为界仍写成 $0.91$）。\n\n**为什么叫「至少」**：切比雪夫只给下界，不知道分布就无法算精确值。若题目补充「$X$ 服从正态」，则应算 $2\\Phi_0(1)-1\\approx0.683$ ——**反而比切比雪夫的界小**，因为切比雪夫的界在所有分布上都成立（保守），而正态的实际分布更集中在中间。\n\n**数值提醒**：$\\sigma=\\sqrt{0.36}=0.6$，$c=2$ 相当于 $3.33$ 个标准差，所以 $0.91$ 的下界看起来偏低但正确。\n\n**易错**：把 $D(X)=0.36$ 当成 $\\sigma$ 代入，得 $1-\\dfrac{0.36^2}{4}$ 之类的错值。","pack":"MB"},{"id":"MB-7","type":"choice","points":"5","stem":"设某元件寿命 $X\\sim E(0.2)$（单位：千小时），则 $P(X>10\\mid X>5)=$____。","options":[["A","$e^{-2}\\approx0.135$"],["B","$e^{-1}\\approx0.368$"],["C","$1-e^{-1}\\approx0.632$"],["D","$e^{-5}\\approx0.007$"]],"answer":"B","solution":"**用无记忆性**：条件 $X>5$ 已经「消耗」了 5 个单位，剩下要再看 5 个单位，\n$$P(X>10\\mid X>5)=P(X>5)=e^{-0.2\\times5}=e^{-1}\\approx0.368$$\n\n**硬算核对**：\n$$\\frac{P(X>10)}{P(X>5)}=\\frac{e^{-2}}{e^{-1}}=e^{-1}\\ ✓$$\n\n**四类易错答案的对应错误**：\n- $e^{-2}$：直接用 $P(X>10)$，忘了条件已经等过 5；\n- $1-e^{-1}$：方向反了，那是「5 个单位内坏掉」；\n- $e^{-5}$：把 $\\lambda$ 与时间混用。\n\n**为什么可以「相减」**：无记忆性的本质是\n$$P(X>s+t\\mid X>s)=P(X>t)$$\n把 $s=5$、$s+t=10$ 代进去，得 $P(X>5)$。\n\n**参数提示**：$E(0.2)$ 中 $0.2$ 是率，均值 5 千小时。本题的两个时间点 $5$、$10$ 正好都是均值的整数倍，命题人这样设计是为了让「减去已等待时间」看起来自然。","pack":"MB"},{"id":"MB-8","type":"choice","points":"5","stem":"设 $X$ 的密度为 $f(x)=cx$（$0<x<2$），其余为 $0$，则 $E(X)=$____。","options":[["A","$\\dfrac43$"],["B","$1$"],["C","$\\dfrac32$"],["D","$2$"]],"answer":"A","solution":"**第一步：归一化。**\n$$\\int_0^2cx\\,dx=c\\cdot\\frac{4}{2}=2c=1\\ \\Rightarrow\\ c=\\frac12$$\n\n**第二步：求期望。**\n$$E(X)=\\int_0^2x\\cdot\\frac x2dx=\\frac12\\cdot\\frac83=\\frac43\\approx1.333$$\n\n**合理性**：密度 $f(x)=\\dfrac x2$ 随 $x$ 递增（在 2 处取 1），质量偏向右侧，所以期望应大于区间中点 1，$\\dfrac43$ 符合直觉。\n\n**顺便求方差**：\n$$E(X^2)=\\int_0^2x^2\\cdot\\frac x2dx=\\frac12\\cdot\\frac{16}{4}=2$$\n$$D(X)=2-\\frac{16}{9}=\\frac29$$\n\n**易错**：忘记归一化直接用 $c=1$，得 $E(X)=\\dfrac83$（超出区间，立刻可判错）—— 这是最快的自检方式：**期望必须落在支撑集内**。","pack":"MB"},{"id":"MB-9","type":"choice","points":"5","stem":"设 $X$ 服从参数为 $3$ 的泊松分布，则 $E(X^{2})=$____。","options":[["A","$9$"],["B","$12$"],["C","$6$"],["D","$3$"]],"answer":"B","solution":"**泊松的两个矩**：$E(X)=\\lambda=3$，$D(X)=\\lambda=3$。\n\n$$E(X^2)=D(X)+[E(X)]^2=3+9=12$$\n\n**四个选项正好对应四种错误**：\n- $9=[E(X)]^2$，漏了 $D(X)$；\n- $12$ ✓；\n- $6=\\lambda^2-\\lambda$，公式符号写错；\n- $3=E(X)$ 或 $D(X)$。\n\n**这条恒等式的重要性**：$E(X^2)=D(X)+[E(X)]^2$ 是连接「二阶矩」与「方差」的桥梁，凡题目给 $E(X^2)$ 让你求 $D$（或反之），都靠它。\n\n**反向题型**：若给 $E(X^2)=12$ 且 $X\\sim P(\\lambda)$，则 $\\lambda^2+\\lambda=12$，解得 $\\lambda=3$（舍去 $-4$）。","pack":"MB"},{"id":"MB-10","type":"choice","points":"5","stem":"设 $X\\sim U(0,1)$，令 $Y=2X+1$，则 $Y$ 服从____。","options":[["A","$U(0,1)$"],["B","$U(1,3)$"],["C","$U(1,2)$"],["D","$N(1,4)$"]],"answer":"B","solution":"**均匀分布的线性变换仍是均匀分布**，只需把区间端点做同样的变换：\n$$X\\in(0,1)\\ \\Rightarrow\\ Y=2X+1\\in(1,3)$$\n\n且变换是线性（保序、等比）的，所以 $Y$ 在 $(1,3)$ 上均匀，$Y\\sim U(1,3)$。\n\n**用密度公式核对**：$f_Y(y)=\\dfrac1{2}f_X\\left(\\dfrac{y-1}{2}\\right)$，而 $f_X=1$ 在 $(0,1)$ 上，故 $f_Y=\\dfrac12$ 在 $(1,3)$ 上 ✓（区间长度 2，密度 $\\dfrac12$）。\n\n**参数对照**：$E(Y)=2\\times\\dfrac12+1=2$，$D(Y)=4\\times\\dfrac1{12}=\\dfrac13$；而 $U(1,3)$ 的期望 $\\dfrac{1+3}{2}=2$、方差 $\\dfrac{(3-1)^2}{12}=\\dfrac13$ ✓ 完全一致。\n\n**易错**：选 $U(1,2)$ —— 只把左端点平移了，忘了右端点也要变换；选 $N$ —— 线性变换保持正态，但 $X$ 本来就不是正态。","pack":"MB"},{"id":"MB-11","type":"choice","points":"5","stem":"某射手命中率为 $0.8$，各次射击相互独立。他射击 5 次，恰好命中 4 次的概率为____。","options":[["A","$0.4096$"],["B","$0.0819$"],["C","$0.3277$"],["D","$0.5000$"]],"answer":"A","solution":"**二项分布** $X\\sim B(5,0.8)$：\n$$P(X=4)=\\binom54(0.8)^4(0.2)^1=5\\times0.4096\\times0.2=0.4096$$\n\n**注意「恰好 5 次」与「恰好 4 次」**：\n$$P(X=5)=0.8^5=0.32768$$\n后者是干扰项 C，命题人故意放进去。\n\n**直接法核对**：命中 4 次意味着「有一次不中」，不中可能发生在 5 个位置中的任意一个，共 5 种，每种概率 $0.8^4\\times0.2$，合计 $5\\times0.08192=0.4096$ ✓。\n\n**常见错法**：只算 $0.8^4\\times0.2=0.0819$（选项 B），漏掉组合数。\n\n**一句话记**：二项概率 $=$ 组合数 $\\times$ 成功概率的成功次方 $\\times$ 失败概率的失败次方，三个因子一个都不能少。","pack":"MB"},{"id":"MB-12","type":"choice","points":"5","stem":"设连续型随机变量 $X$ 的密度为 $f(x)$、分布函数为 $F(x)$。下列叙述正确的是____。","options":[["A","必有 $0\\le f(x)\\le1$"],["B","对任意 $x$ 有 $P(X=x)=f(x)$"],["C","对任意 $x$ 有 $P(X=x)=0$"],["D","$F$ 一定处处可导"]],"answer":"C","solution":"**连续型的定义**：存在密度 $f\\ge0$ 使 $F(x)=\\int_{-\\infty}^{x}f$。由此\n$$P(X=x)=F(x)-F(x-)=0$$\n对**所有** $x$ 成立 ✓，故 C 正确。\n\n**A 错**：密度只需非负、积分为 1，**可以大于 1**。例：$U(0,0.1)$ 的密度是 10。\n\n**B 错**：$f(x)$ 是密度值，不是概率。$P(a<X<b)=\\int_a^bf$，是面积而非高度。\n\n**D 错**：$F$ 只需连续（连续型必连续），不保证处处可导。例如 $U(-1,1)$ 的 $F$ 在 $\\pm1$ 处不可导；更极端的奇异型分布 $F$ 连续但几乎处处不可导。\n\n**这四个选项正好覆盖了「一、密度是不是概率；二、密度能不能大于 1；三、F 是否可导」三组高频混淆点**，建议整段背下来。","pack":"MB"},{"id":"MB-13","type":"subjective","points":"12","note":"建议 10 分钟","stem":"某产品的出厂检验要经过三道相互独立的工序，每道工序的判定结果只有「通过」与「不通过」两种。设三道工序不通过的概率依次为 $0.1$、$0.15$、$0.2$。\n(1) 用有序三元组写出该随机试验的样本空间 $\\Omega$（顺序为第一、二、三道工序的结果）；\n(2) 用样本点的集合表示事件 $A=$「第一道工序不通过」，$E=$「三道工序中至少有一道不通过」，并求 $A\\cap E$；\n(3) 求 $P(A)$、$P(E)$、$P(A\\cup E)$；\n(4) 求 $P(A\\mid E)$。","solution":"**(1) 样本空间。** 每道工序有两种结果，三道共 $2^3=8$ 个样本点（记「通」为 $P$，「不通」为 $F$）：\n$$\\Omega=\\{(P,P,P),(P,P,F),(P,F,P),(P,F,F),(F,P,P),(F,P,F),(F,F,P),(F,F,F)\\}$$\n\n**(2) 事件表示。**\n- $A=\\{(F,P,P),(F,P,F),(F,F,P),(F,F,F)\\}$（第一个分量为 $F$，共 4 个）；\n- $E=\\Omega\\setminus\\{(P,P,P)\\}$（除「全通过」以外的 7 个）；\n- 因 $A$ 中每个点都至少有一个 $F$，故 $A\\subset E$，于是\n$$A\\cap E=A$$\n\n**(3) 概率。** 三道独立，\n$$P(A)=0.1$$\n\n$$P(E)=1-P(\\text{全通过})=1-(0.9)(0.85)(0.8)=1-0.612=0.388$$\n\n**$P(A\\cup E)$**：因 $A\\subset E$，故 $A\\cup E=E$，\n$$P(A\\cup E)=P(E)=0.388$$\n\n**(4) 条件概率。**\n$$P(A\\mid E)=\\frac{P(A\\cap E)}{P(E)}=\\frac{P(A)}{P(E)}=\\frac{0.1}{0.388}=\\frac{100}{388}=\\frac{25}{97}\\approx0.258$$\n\n**本题的关键判断**：$A\\subset E$ 是整个解答的枢纽。若不识别这一点，会去算 $P(A\\cup E)=P(A)+P(E)-P(AE)=0.1+0.388-0.1=0.388$（结果相同，但绕了远路，且容易算错）。\n\n**评分要点**：\n- (1) 8 个样本点写全 3 分（缺一个扣 0.5）；\n- (2) 三个事件的集合表示各 1 分；\n- (3) 三个概率各 1 分；\n- (4) 公式 1 分、结果 1 分。\n\n**易错**：\n- 样本空间只写 3 个样本点（把「通过几个」当成结果），错在没按有序三元组写；\n- $P(E)$ 用 $0.1+0.15+0.2=0.45$，忘了三道可以同时不通过，必须取补；\n- (4) 分母写成 1。","pack":"MB"},{"id":"MB-14","type":"subjective","points":"12","note":"建议 12 分钟","stem":"某工厂有两条生产线 I 和 II 生产同种产品，产量比为 $2:1$。线 I 的不合格品率为 $\\dfrac1{10}$，线 II 的不合格品率为 $\\dfrac15$。\n采用二次抽检：先随机抽一件检测；若第一次抽到不合格品，则**从同一条生产线**再抽一件；只有两次都抽到不合格品才整批拒收。设各次抽检相互独立。\n(1) 求整批被拒收的概率；\n(2) 已知某批被拒收，求它来自生产线 I 的概率。","solution":"**第一步：先验。** 产量比 $2:1$，\n$$P(\\text{I})=\\frac23,\\qquad P(\\text{II})=\\frac13$$\n\n**第二步：条件概率（本题的核心）。** 「从同一条生产线再抽一件」意味着第二次抽到的仍是该线的产品，两次独立：\n$$P(R\\mid\\text{I})=\\left(\\frac1{10}\\right)^2=\\frac1{100},\\qquad P(R\\mid\\text{II})=\\left(\\frac15\\right)^2=\\frac1{25}$$\n\n**(1) 全概率。**\n$$P(R)=\\frac23\\cdot\\frac1{100}+\\frac13\\cdot\\frac1{25}=\\frac{2}{300}+\\frac{1}{75}=\\frac{2}{300}+\\frac{4}{300}=\\frac{6}{300}=\\frac1{50}=0.02$$\n\n**(2) 贝叶斯。**\n$$P(\\text{I}\\mid R)=\\frac{2/300}{1/50}=\\frac{2}{300}\\times50=\\frac{100}{300}=\\frac13$$\n\n**结果解读**：先验是 $\\dfrac23\\approx0.667$，后验只有 $\\dfrac13\\approx0.333$——被拒收的批次反而更可能来自**不合格率高的线 II**，因为平方把 $5$ 倍的差距放大成了 $25$ 倍。\n\n**与一次抽检的对比**（做一遍能加深理解）：一次抽检时\n$$P(D)=\\frac23\\cdot\\frac1{10}+\\frac13\\cdot\\frac15=\\frac{2}{30}+\\frac{1}{15}=\\frac{2}{15}$$\n$$P(\\text{I}\\mid D)=\\frac{2/30}{2/15}=\\frac12$$\n可见二次抽检把后验从 $\\dfrac12$ 进一步压到 $\\dfrac13$。\n\n**评分要点**：两个条件概率各 2 分，全概率 2 分 + 2 分，贝叶斯公式 2 分 + 2 分。\n\n**最易失分**：把第二次抽检的概率写成「全体不合格率」$\\left(\\dfrac{2}{15}\\right)^2$。这是把边际概率误当成条件概率，第二问会连带全错。","pack":"MB"},{"id":"MB-15","type":"subjective","points":"16","note":"建议 16 分钟","stem":"设随机变量 $X$ 的概率密度为\n$$f_X(x)=\\frac{\\alpha c^{\\alpha}}{x^{\\alpha+1}},\\qquad x\\ge c$$\n其中 $c>0$、$\\alpha>0$ 为参数（这是 Pareto 分布）。\n(1) 求 $X$ 的分布函数 $F_X(x)$；\n(2) 若 $X$ 的方差存在，参数 $\\alpha$ 需满足什么条件？并在此条件下求 $D(X)$；\n(3) 令 $Y=\\ln X$，$r=\\ln c$，写出 $Y$ 的分布函数，并求 $E(Y)$。","solution":"**(1) 分布函数。** 对 $x\\ge c$：\n$$F_X(x)=\\int_c^{x}\\frac{\\alpha c^{\\alpha}}{t^{\\alpha+1}}dt=\\alpha c^{\\alpha}\\left[-\\frac{1}{\\alpha t^{\\alpha}}\\right]_{c}^{x}=1-\\frac{c^{\\alpha}}{x^{\\alpha}}$$\n当 $x<c$ 时 $F=0$。故\n$$F_X(x)=\\begin{cases}0, & x<c\\\\ 1-\\left(\\dfrac{c}{x}\\right)^{\\alpha}, & x\\ge c\\end{cases}$$\n\n**检查**：$F(c)=0$ ✓，$F(+\\infty)=1$ ✓，单调递增 ✓。\n\n**(2) 方差存在的条件。**\n$$E(X)=\\int_c^{\\infty}x\\cdot\\frac{\\alpha c^{\\alpha}}{x^{\\alpha+1}}dx=\\alpha c^{\\alpha}\\int_c^{\\infty}x^{-\\alpha}dx$$\n\n这个积分在**$\\alpha>1$** 时收敛，此时\n$$E(X)=\\alpha c^{\\alpha}\\cdot\\frac{c^{1-\\alpha}}{\\alpha-1}=\\frac{\\alpha c}{\\alpha-1}$$\n\n再算二阶矩：\n$$E(X^2)=\\alpha c^{\\alpha}\\int_c^{\\infty}x^{1-\\alpha}dx=\\frac{\\alpha c^{2}}{\\alpha-2}\\quad(\\alpha>2)$$\n\n故方差存在要求**$\\alpha>2$**，且\n$$D(X)=\\frac{\\alpha c^2}{\\alpha-2}-\\frac{\\alpha^2c^2}{(\\alpha-1)^2}=c^2\\cdot\\frac{\\alpha(\\alpha-1)^2-\\alpha^2(\\alpha-2)}{(\\alpha-2)(\\alpha-1)^2}=c^2\\cdot\\frac{\\alpha}{(\\alpha-2)(\\alpha-1)^2}$$\n\n**关键点**：Pareto 分布的矩**不是总有**的。$\\alpha\\le1$ 时连期望都不存在；$1<\\alpha\\le2$ 时期望存在但方差无穷。这是「重尾」的本质。\n\n**(3) 对数变换。** 因 $Y=\\ln X$ 严格递增，且 $X\\ge c\\iff Y\\ge r$。对 $y\\ge r$：\n$$F_Y(y)=P(\\ln X\\le y)=P(X\\le e^{y})=1-\\left(\\frac{c}{e^{y}}\\right)^{\\alpha}=1-e^{-\\alpha(y-r)}$$\n\n当 $y<r$ 时为 0。即\n$$F_Y(y)=\\begin{cases}0, & y<r\\\\ 1-e^{-\\alpha(y-r)}, & y\\ge r\\end{cases}$$\n\n**这就是「起点为 $r$、率为 $\\alpha$ 的平移指数分布」**，密度 $f_Y(y)=\\alpha e^{-\\alpha(y-r)}$。\n\n**期望**：\n$$E(Y)=r+\\frac1{\\alpha}=\\ln c+\\frac1\\alpha$$\n\n**结论的意义**：Pareto 变量取对数后变成指数分布——这正是「幂律分布取对数变直线」的数学根据，也是处理重尾数据的标准手段。\n\n**评分要点（16 分）**：\n- (1) 积分与分段 4 分；\n- (2) 期望条件 2 分、$E(X)$ 2 分、$E(X^2)$ 2 分、$D(X)$ 2 分、结论「$\\alpha>2$」1 分；\n- (3) $F_Y$ 2 分、$E(Y)$ 1 分。\n\n**最易失分**：\n- 直接对整条实轴积分，不写 $x<c$ 时 $F=0$；\n- 只写「方差存在需 $\\alpha>2$」却不验证，或把条件写成 $\\alpha>1$（那是期望存在的条件）；\n- (3) 忘记 $Y$ 的下界是 $\\ln c$ 而不是 0。","pack":"MB"},{"id":"MC-1","type":"choice","points":"5","stem":"设 $P(A)=P(B)=P(C)=0.3$，$P(AB)=P(BC)=0.1$，$P(AC)=0.05$，$P(ABC)=0.02$。则 $A,B,C$ 中**恰好一个**发生的概率为____。","options":[["A","$0.46$"],["B","$0.42$"],["C","$0.50$"],["D","$0.38$"]],"answer":"A","solution":"**用 $S_1,S_2,S_3$ 简式**：\n$$S_1=0.3\\times3=0.9,\\qquad S_2=0.1+0.1+0.05=0.25,\\qquad S_3=0.02$$\n\n$$\\text{恰好一个}=S_1-2S_2+3S_3=0.9-0.5+0.06=0.46$$\n\n**韦恩图核对**：只发生 $A$ 的部分\n$$P(A)-P(AB)-P(AC)+P(ABC)=0.3-0.1-0.05+0.02=0.17$$\n只 $B$：$0.3-0.1-0.1+0.02=0.12$；只 $C$：$0.3-0.1-0.05+0.02=0.17$。\n合计 $0.17+0.12+0.17=0.46$ ✓\n\n**顺带**：恰好两个 $=S_2-3S_3=0.25-0.06=0.19$；至少两个 $=S_2-2S_3=0.21$。\n\n**易错**：直接 $S_1-2S_2=0.4$，漏掉 $+3S_3$。三项系数 $1,-2,+3$ 必须成组记忆。","pack":"MC"},{"id":"MC-2","type":"choice","points":"5","stem":"在区间 $(0,3)$ 内独立地均匀取两个数 $a,b$，则方程 $x^{2}+2ax+b=0$ 有实根的概率为____。","options":[["A","$\\dfrac13$"],["B","$\\dfrac23$"],["C","$\\dfrac{9-2\\sqrt3}{9}$"],["D","$\\dfrac{9-3\\sqrt3}{9}$"]],"answer":"C","solution":"**第一步：把「有实根」化成不等式。**\n$$\\Delta=(2a)^2-4b=4(a^2-b)\\ge0\\iff b\\le a^2$$\n\n**第二步：算有利区域面积。** 样本空间是 $9$ 的正方形。曲线 $b=a^2$ 在 $a\\in(0,3)$ 上从 $0$ 升到 $9$，与正方形上边界 $b=3$ 交于 $a=\\sqrt3$。\n\n分段积分（**这是本题的关键，曲线在 $a=\\sqrt3$ 处穿出正方形**）：\n$$\\int_0^{\\sqrt3}a^2da+\\int_{\\sqrt3}^{3}3\\,da=\\frac{3\\sqrt3}{3}+3\\left(3-\\sqrt3\\right)=\\sqrt3+9-3\\sqrt3=9-2\\sqrt3$$\n\n**第三步：作比。**\n$$P=\\frac{9-2\\sqrt3}{9}\\approx0.615$$\n\n**为什么不能直接算 $\\int_0^3 a^2da$**：那样得 $9$，与总面积相等，概率为 1——错在忽略了 $b$ 只到 3，当 $a>\\sqrt3$ 时整个竖条都满足条件。\n\n**三个干扰项**：$\\dfrac23$ 是「粗略估计」；$\\dfrac13$ 是把曲线当成直线；$\\dfrac{9-3\\sqrt3}{9}$ 是积分上限算成 $\\sqrt3$ 后少算了一段。\n\n**这类题的通用套路**：先画区域，找出曲线与**边界**的交点，再分段积分，最后除以总面积。","pack":"MC"},{"id":"MC-3","type":"choice","points":"5","stem":"10 件产品中有 3 件次品，不放回地逐个抽取。则「第 3 次才首次抽到次品」的概率为____。","options":[["A","$0.525$"],["B","$0.300$"],["C","$0.250$"],["D","$0.175$"]],"answer":"D","solution":"**乘法链**：前两次都是正品，第三次是次品。\n\n$$P=\\frac{7}{10}\\times\\frac{6}{9}\\times\\frac{3}{8}=\\frac{126}{720}=0.175$$\n\n**分母的变化**：$10\\to9\\to8$；**分子的变化**：正品 $7\\to6$，次品仍是 3。\n\n**验算另一条路**：先算「前两次都正品」$=\\dfrac{7}{10}\\cdot\\dfrac69=\\dfrac{7}{15}$，再乘第三次次品率 $\\dfrac38$：$\\dfrac{7}{15}\\cdot\\dfrac38=\\dfrac{21}{120}=0.175$ ✓。\n\n**干扰项**：$0.525$ 是「三次中恰有一次次品」的概率（超几何）；$0.25$ 是「第三次才首次」的有放回版本 $\\left(\\dfrac7{10}\\right)^2\\cdot\\dfrac3{10}=0.147$ 的粗略近似；$0.3$ 是次品占比。\n\n**关键区分**：\n- 「三次中恰有一次次品」不关心次序，用超几何 $\\dfrac{\\binom31\\binom72}{\\binom{10}3}=\\dfrac{63}{120}=0.525$；\n- 「第三次**才首次**」限定了前两次的结果，必须用乘法链。","pack":"MC"},{"id":"MC-4","type":"choice","points":"5","stem":"有三扇门，只有一扇后面有奖品。你选定 1 号门后，主持人（知道奖品在哪）打开了 3 号门，门后没有奖品，然后问你是否改选 2 号门。若改选，中奖概率为____。","options":[["A","$\\dfrac12$"],["B","$\\dfrac23$"],["C","$\\dfrac13$"],["D","$\\dfrac34$"]],"answer":"B","solution":"**这是经典的三门问题，答案是 $\\dfrac23$。**\n\n**关键前提**：主持人**知道**奖品在哪，且**一定会**打开一扇没有奖品的门。这两点缺一不可。\n\n**按奖品位置分三种等可能情形**（你始终选 1 号）：\n- 奖品在 1 号（概率 $\\dfrac13$）：主持人只能在 2、3 号中开一扇空门。此时**改选必输**。\n- 奖品在 2 号（概率 $\\dfrac13$）：主持人只能开 3 号。此时**改选必赢**。\n- 奖品在 3 号（概率 $\\dfrac13$）：主持人只能开 2 号。此时**改选必赢**。\n\n所以改选的中奖概率是 $\\dfrac13+\\dfrac13=\\dfrac23$，不选则是 $\\dfrac13$。\n\n**为什么不是 $\\dfrac12$**：主持人开门**不是随机事件**，他的行为受「奖品位置」约束，因此开门这件事携带了信息。把开门当成随机，就会错误地把样本空间压成「剩下两扇门各占一半」。\n\n**极端版本帮助理解**：若有 100 扇门，你选 1 号，主持人打开其余 99 扇中的 98 扇空门，只留 1 扇。这时你会毫不犹豫地改选——那扇门承载了 $99%$ 的概率。\n\n**答题要点**：先写「设 $A_i=$ 奖品在 $i$ 号门」，再用贝叶斯\n$$P(A_2\\mid\\text{开 3 号})=\\frac{P(A_2)P(\\text{开 3}\\mid A_2)}{P(A_2)P(\\text{开 3}\\mid A_2)+P(A_1)P(\\text{开 3}\\mid A_1)}=\\frac{\\frac13\\cdot1}{\\frac13\\cdot1+\\frac13\\cdot\\frac12}=\\frac23$$","pack":"MC"},{"id":"MC-5","type":"choice","points":"5","stem":"设随机变量 $X$ 的分布函数为 $F(x)=A+B\\arctan x$（$x\\in\\mathbb{R}$），则常数 $A,B$ 为____。","options":[["A","$A=\\dfrac12,\\ B=\\dfrac1\\pi$"],["B","$A=0,\\ B=\\dfrac1\\pi$"],["C","$A=\\dfrac12,\\ B=\\dfrac2\\pi$"],["D","$A=1,\\ B=-\\dfrac1\\pi$"]],"answer":"A","solution":"**用两端极限列方程。** $\\arctan(+\\infty)=\\dfrac\\pi2$，$\\arctan(-\\infty)=-\\dfrac\\pi2$。\n\n$$\\lim_{x\\to-\\infty}F(x)=A-\\frac{\\pi B}{2}=0$$\n$$\\lim_{x\\to+\\infty}F(x)=A+\\frac{\\pi B}{2}=1$$\n\n**两式相加**：$2A=1\\Rightarrow A=\\dfrac12$。\n**两式相减**：$\\pi B=1\\Rightarrow B=\\dfrac1\\pi$。\n\n所以 $F(x)=\\dfrac12+\\dfrac1\\pi\\arctan x$，这正是**标准柯西分布**的分布函数。\n\n**顺带检查另两个条件**：$\\arctan$ 单调递增 ⇒ $F$ 单调递增 ✓；连续 ✓。\n\n**有趣的事实**：柯西分布的密度 $f(x)=\\dfrac{1}{\\pi(1+x^2)}$，虽然关于 0 对称，但 $E|X|=\\infty$，所以**期望不存在**。这说明「$F$ 是分布函数」并不意味着「矩存在」。\n\n**易错**：把 $\\arctan(+\\infty)$ 当成 $\\pi$（漏了 $\\dfrac12$），得 $B=\\dfrac2\\pi$，恰是干扰项 C。","pack":"MC"},{"id":"MC-6","type":"choice","points":"5","stem":"设 $X\\sim U(0,4)$，令 $Y=\\min(X,2)$，则 $E(Y)=$____。","options":[["A","$1$"],["B","$\\dfrac54$"],["C","$\\dfrac32$"],["D","$2$"]],"answer":"C","solution":"**$Y$ 是混合型**：$Y\\in[0,2]$，在 2 处有点质量 $P(Y=2)=P(X\\ge2)=\\dfrac12$。\n\n**按分段求期望**（$X$ 的密度为 $\\dfrac14$）：\n$$E(Y)=\\int_0^2x\\cdot\\frac14dx+2\\cdot P(X\\ge2)$$\n\n第一段：$\\displaystyle\\frac14\\cdot\\frac{4}{2}=\\frac12$。\n第二段：$2\\times\\dfrac12=1$。\n\n$$E(Y)=\\frac12+1=\\frac32$$\n\n**直观理解**：有一半的样本被「压」到 $Y=2$，另一半在 $[0,2]$ 上均匀分布。所以 $E(Y)$ 介于 $\\dfrac{2}{2}\\cdot\\dfrac12+\\dfrac12\\cdot2=1.5$ 这个加权值。\n\n**易错答案**：\n- $1$：只算了连续部分，忘了点质量；\n- $2$：把 $\\min$ 当成了 $\\max$；\n- $\\dfrac54$：把 $Y$ 当成 $U(0,2)$ 的一半处理。\n\n**通用公式**：$E[\\min(X,c)]=\\int_0^cP(X>t)dt$（当 $X\\ge0$）。本题 $\\int_0^2P(X>t)dt=\\int_0^2\\left(1-\\dfrac t4\\right)dt=2-\\dfrac{2}{4}=\\dfrac32$ ✓，更快。","pack":"MC"},{"id":"MC-7","type":"choice","points":"5","stem":"设 $X\\sim U(-1,1)$，则 $E(|X|)=$____。","options":[["A","$\\dfrac14$"],["B","$\\dfrac23$"],["C","$1$"],["D","$\\dfrac12$"]],"answer":"D","solution":"**直接积分**（密度为 $\\dfrac12$）：\n$$E(|X|)=\\int_{-1}^{1}|x|\\cdot\\frac12dx=2\\int_0^1\\frac x2dx=2\\times\\frac14=\\frac12$$\n\n**为什么可以只算一半再乘 2**：$|x|$ 是偶函数、密度也是偶函数，乘积是偶函数，故全区间积分为半区间的两倍。\n\n**对照 $E(X)$**：$\\displaystyle E(X)=\\int_{-1}^1\\frac x2dx=0$（奇函数），所以 $E|X|\\ne E(X)$。\n\n**这也说明**：$|E(X)|\\le E|X|$（本题 $0\\le0.5$），这是 Jensen 不等式的一个特例。\n\n**易错**：把 $|X|$ 的分布当成 $U(0,1)$，得 $E=\\dfrac12$ —— 碰巧对！但若算 $D(|X|)$ 就会错：$|X|\\sim U(0,1)$ 其实是对的（因为 $X$ 对称均匀），所以 $D(|X|)=\\dfrac1{12}$。这个巧合只出现在均匀对称的情形。","pack":"MC"},{"id":"MC-8","type":"choice","points":"5","stem":"设 $X$ 服从参数为 $\\lambda$ 的泊松分布，且 $E\\left[X(X-1)(X-2)\\right]=8$，则 $\\lambda=$____。","options":[["A","$2$"],["B","$4$"],["C","$8$"],["D","$\\sqrt8$"]],"answer":"A","solution":"**用阶乘矩**。泊松分布的 $r$ 阶阶乘矩为 $E[(X)_r]=\\lambda^r$，而\n$$(X)_3=X(X-1)(X-2)$$\n故\n$$\\lambda^3=8\\ \\Rightarrow\\ \\lambda=2$$\n\n**为什么阶乘矩这么整齐**：直接验证\n$$E[X(X-1)]=\\sum_{k\\ge2}k(k-1)\\frac{\\lambda^k}{k!}e^{-\\lambda}=\\lambda^2e^{-\\lambda}\\sum_{k\\ge2}\\frac{\\lambda^{k-2}}{(k-2)!}=\\lambda^2$$\n同理 $(X)_3$ 提出 $\\lambda^3$。**阶乘矩把 $k!$ 分母吃掉**，这是它唯一的用处，也是唯一的用法。\n\n**三个干扰项**：$8$ 是直接取 $\\lambda^3=8$ 却答成 $\\lambda=8$；$\\sqrt8$ 是把三阶当成二阶；$4$ 是 $\\lambda^2=8$ 的解取整。\n\n**反过来用**：若给 $E(X^3)=26$，则\n$$X^3=(X)_3+3(X)_2+X\\ \\Rightarrow\\ E(X^3)=\\lambda^3+3\\lambda^2+\\lambda=26$$\n可解出 $\\lambda=2$（$8+12+2=22\\ne26$，说明该值不对；实际 $\\lambda=2$ 时 $E(X^3)=8+12+2=22$）。","pack":"MC"},{"id":"MC-9","type":"choice","points":"5","stem":"设 $X\\sim N(3,\\sigma^{2})$，且 $P(2<X<4)=0.6826$（$\\Phi_0(1)=0.8413$），则 $\\sigma=$____。","options":[["A","$1$"],["B","$2$"],["C","$4$"],["D","$\\sqrt2$"]],"answer":"A","solution":"**区间关于均值对称**（$[2,4]$ 的中心正是 $\\mu=3$，半宽 $c=1$），可套对称公式：\n$$P(|X-3|<1)=2\\Phi_0\\left(\\frac{1}{\\sigma}\\right)-1=0.6826$$\n\n**反解**：\n$$2\\Phi_0\\left(\\frac1\\sigma\\right)=1.6826\\ \\Rightarrow\\ \\Phi_0\\left(\\frac1\\sigma\\right)=0.8413$$\n\n查表 $\\Phi_0(1)=0.8413$，故\n$$\\frac1\\sigma=1\\ \\Rightarrow\\ \\sigma=1$$\n\n**注意题目给的是 $\\sigma^2$ 的位置**：$N(3,\\sigma^2)$ 的第二参数是方差，但本题要求的正是标准差 $\\sigma$，不要混淆。\n\n**若区间不居中**：例如 $P(3<X<5)=0.4772$，则需 $\\Phi_0\\left(\\dfrac2\\sigma\\right)-0.5=0.4772$，即 $\\Phi_0\\left(\\dfrac2\\sigma\\right)=0.9772$，得 $\\dfrac2\\sigma=2$，$\\sigma=1$。两步走，不能直接套 $2\\Phi_0-1$。\n\n**数值提醒**：$0.6826$ 就是「一倍标准差」的经典值，看到这个数应立刻反应 $\\dfrac c\\sigma=1$。","pack":"MC"},{"id":"MC-10","type":"choice","points":"5","stem":"甲、乙、丙、丁四人传球，球开始时在甲手中，每次持球者等可能地传给其余三人之一。则传 3 次后球在甲手中的概率为____。","options":[["A","$\\dfrac29$"],["B","$\\dfrac13$"],["C","$\\dfrac19$"],["D","$\\dfrac49$"]],"answer":"C","solution":"**设** $p_n=P(\\text{第 }n\\text{ 次后球在甲手中})$，$p_0=1$。\n\n**按上一步分类**：上一步在甲（概率 $p_n$）时，传出去必不在甲；上一步不在甲（概率 $1-p_n$）时，甲是三名接球者之一，被选中概率 $\\dfrac13$：\n$$p_{n+1}=\\frac{1-p_n}{3}$$\n\n**逐步算**：\n$$p_1=\\frac{1-1}{3}=0,\\qquad p_2=\\frac{1-0}{3}=\\frac13,\\qquad p_3=\\frac{1-\\frac13}{3}=\\frac{2}{9}$$\n\n**平衡值**：$p=\\dfrac{1-p}{3}\\Rightarrow p^*=\\dfrac14$，与「$n\\to\\infty$ 时球在四人中均匀分布」一致。\n\n**干扰项**：$\\dfrac13=p_2$，$\\dfrac49$ 是把递推写成 $p_{n+1}=\\dfrac{1-p_n}{2}$ 的结果，$\\dfrac19$ 是漏掉 $1-p_n$ 中的 1。\n\n**通式**（了解）：$p_n=\\dfrac14+\\left(-\\dfrac13\\right)^n\\cdot\\dfrac34$。代 $n=3$：$\\dfrac14-\\dfrac1{36}=\\dfrac{8}{36}=\\dfrac29$ ✓。","pack":"MC"},{"id":"MC-11","type":"choice","points":"5","stem":"某厂两台机器生产同种零件，产量分别占 $60%$ 与 $40%$，次品率分别为 $2%$ 与 $5%$。已知取到的一件是次品，则它来自**第二台**机器的概率为____。","options":[["A","$0.375$"],["B","$0.625$"],["C","$0.400$"],["D","$0.500$"]],"answer":"B","solution":"**先验与似然**：\n$$P(M_1)=0.6,\\ P(D\\mid M_1)=0.02;\\qquad P(M_2)=0.4,\\ P(D\\mid M_2)=0.05$$\n\n**全概率**：\n$$P(D)=0.6\\times0.02+0.4\\times0.05=0.012+0.020=0.032$$\n\n**贝叶斯**：\n$$P(M_2\\mid D)=\\frac{0.020}{0.032}=0.625$$\n\n**对照第一台的后验**：$\\dfrac{0.012}{0.032}=0.375$，两者相加为 1 ✓（正好是干扰项 A）。\n\n**解读**：第二台产量少（40%），但次品率是第一台的 2.5 倍，所以次品里它反而占多数（62.5%）。**「产量大」与「次品贡献大」是两件事**，这就是全概率与贝叶斯的区别所在。\n\n**易错**：直接用先验 $0.4$，或把 $0.05/(0.02+0.05)$ 当成答案（漏了产量权重）。","pack":"MC"},{"id":"MC-12","type":"choice","points":"5","stem":"设 $X,Y$ 相互独立，$D(X)=2$，$D(Y)=3$，则 $D(2X-3Y+1)=$____。","options":[["A","$5$"],["B","$13$"],["C","$23$"],["D","$35$"]],"answer":"D","solution":"**方差的性质**：常数不影响方差，系数要平方；独立时方差可直接相加。\n\n$$D(2X-3Y+1)=2^2D(X)+(-3)^2D(Y)=4\\times2+9\\times3=8+27=35$$\n\n**三个要点**：\n- 常数 $+1$ 不产生方差（平移不改变离散程度）；\n- 系数 $-3$ 平方后变成 $+9$（方差永远非负，所以负系数不会让方差变小）；\n- 独立保证交叉项 $2ab\\,\\mathrm{Cov}(X,Y)=0$。\n\n**若不独立**：\n$$D(2X-3Y)=4D(X)+9D(Y)-12\\,\\mathrm{Cov}(X,Y)$$\n交叉项系数是 $2ab=2\\times2\\times(-3)=-12$，容易被漏掉。\n\n**干扰项**：$5=2+3$（既没平方又当成相加），$13=2+9+...$ 混算，$23=4\\times2+3\\times...$。\n\n**口诀**：**方差里「加号恒成立、系数必平方、常数全丢掉」**。","pack":"MC"},{"id":"MC-13","type":"subjective","points":"12","note":"建议 12 分钟","stem":"袋中有 5 个白球、3 个黑球，共 8 个球。不放回地任取 3 个球，设取到的白球个数为 $X$。\n(1) 写出 $X$ 的分布律；\n(2) 求 $E(X)$ 与 $D(X)$；\n(3) 求 $P(X\\ge2)$。","solution":"**(1) 分布律。** $X$ 服从超几何分布：$N=8$，白球 $M=5$，取 $n=3$，故\n$$P(X=k)=\\frac{\\binom5k\\binom3{3-k}}{\\binom83},\\qquad k=0,1,2,3$$\n\n分母 $\\binom83=56$。逐个算：\n\n- $k=0$：$\\binom50\\binom33=1\\times1=1$，$P=\\dfrac1{56}$\n- $k=1$：$\\binom51\\binom32=5\\times3=15$，$P=\\dfrac{15}{56}$\n- $k=2$：$\\binom52\\binom31=10\\times3=30$，$P=\\dfrac{30}{56}$\n- $k=3$：$\\binom53\\binom30=10\\times1=10$，$P=\\dfrac{10}{56}$\n\n**归一化检验**：$1+15+30+10=56$ ✓。\n\n**(2) 期望与方差。**\n直接用超几何的公式：$E(X)=n\\dfrac MN=3\\times\\dfrac58=\\dfrac{15}{8}=1.875$。\n\n**用分布律验证**：\n$$E(X)=0\\cdot\\frac1{56}+1\\cdot\\frac{15}{56}+2\\cdot\\frac{30}{56}+3\\cdot\\frac{10}{56}=\\frac{15+60+30}{56}=\\frac{105}{56}=\\frac{15}{8}\\ ✓$$\n\n二阶矩：\n$$E(X^2)=\\frac{0+15+4\\times30+9\\times10}{56}=\\frac{15+120+90}{56}=\\frac{225}{56}$$\n\n$$D(X)=\\frac{225}{56}-\\left(\\frac{15}{8}\\right)^2=\\frac{225}{56}-\\frac{225}{64}=225\\cdot\\frac{64-56}{56\\times64}=\\frac{1800}{3584}=\\frac{225}{448}\\approx0.502$$\n\n**用超几何方差公式核对**：\n$$D(X)=npq\\cdot\\frac{N-n}{N-1},\\quad p=\\frac58,\\ q=\\frac38$$\n$$=3\\cdot\\frac58\\cdot\\frac38\\cdot\\frac{8-3}{8-1}=\\frac{45}{64}\\cdot\\frac57=\\frac{225}{448}\\ ✓$$\n\n**修正因子的意义**：$\\dfrac{N-n}{N-1}=\\dfrac57<1$，说明不放回抽样比有放回（二项）**方差更小**——因为抽样之间负相关，结果更「稳定」。\n\n**(3) 尾部。**\n$$P(X\\ge2)=\\frac{30}{56}+\\frac{10}{56}=\\frac{40}{56}=\\frac57$$\n\n**评分要点（12 分）**：\n- (1) 四个概率各 2 分（公式对、数值错扣 1 分）；\n- (2) $E$ 2 分，$E(X^2)$ 1 分，$D$ 1 分；\n- (3) 2 分。\n\n**易错**：\n- 把 $\\binom{3}{3-k}$ 写成 $\\binom{3}{k}$（黑球个数与白球个数要互补）；\n- 忘记分母是 $\\binom83$ 而不是 $8^3$（放回才用幂）；\n- (2) 直接套二项公式 $npq$，漏掉修正因子。","pack":"MC"},{"id":"MC-14","type":"subjective","points":"12","note":"建议 14 分钟","stem":"甲、乙两个袋子各有 $N=3$ 个球。起初唯一的黑球在甲袋中，其余都是白球。每次从两个袋子中各取一球互换（各袋内每球被取到的机会相同，且两袋的选取相互独立）。\n设 $p_n$ 为交换 $n$ 次后黑球仍在甲袋中的概率。\n(1) 求 $p_{n+1}$ 与 $p_n$ 的递推关系；\n(2) 求 $p_n$ 的通项，并计算 $p_3$；\n(3) 若已知第 3 次交换后黑球在甲袋，求第 2 次交换后黑球也在甲袋的概率。","solution":"**(1) 列递推。** 按第 $n$ 次后黑球的位置分类：\n\n- 黑球在甲（概率 $p_n$）：甲袋的 3 个球中被取走的是黑球的概率为 $\\dfrac13$，此时黑球离开甲；\n- 黑球在乙（概率 $1-p_n$）：乙袋中被取走的是黑球的概率为 $\\dfrac13$，此时黑球进入甲。\n\n$$p_{n+1}=p_n\\left(1-\\frac13\\right)+(1-p_n)\\cdot\\frac13=\\frac23p_n+\\frac13\\left(1-p_n\\right)=\\frac13+\\frac13p_n$$\n\n整理得\n$$p_{n+1}=\\frac{1+p_n}{3},\\qquad p_0=1$$\n\n**(2) 解递推。** 先求不动点：\n$$p^*=\\frac{1+p^*}{3}\\ \\Rightarrow\\ 3p^*=1+p^*\\ \\Rightarrow\\ p^*=\\frac12$$\n\n作差：\n$$p_{n+1}-\\frac12=\\frac{1+p_n}{3}-\\frac12=\\frac{2+2p_n-3}{6}=\\frac{2p_n-1}{6}=\\frac13\\left(p_n-\\frac12\\right)$$\n\n故 $\\left\\{p_n-\\dfrac12\\right\\}$ 是公比为 $\\dfrac13$ 的等比数列，首项 $p_0-\\dfrac12=\\dfrac12$：\n$$p_n=\\frac12+\\frac12\\left(\\frac13\\right)^n$$\n\n**验算**：$p_0=\\dfrac12+\\dfrac12=1$ ✓；$n\\to\\infty$ 时 $p_n\\to\\dfrac12$（黑球在两个袋子中等可能）✓。\n\n**算 $p_3$**：\n$$p_3=\\frac12+\\frac12\\cdot\\frac1{27}=\\frac12+\\frac1{54}=\\frac{27+1}{54}=\\frac{14}{27}\\approx0.519$$\n\n顺带：$p_1=\\dfrac12+\\dfrac16=\\dfrac23$，$p_2=\\dfrac12+\\dfrac1{18}=\\dfrac59$。\n\n**(3) 反向条件概率。**\n$$P(\\text{第 2 次在甲}\\mid\\text{第 3 次在甲})=\\frac{P(\\text{第2次在甲}\\cap\\text{第3次在甲})}{p_3}$$\n\n分子 $=p_2\\cdot P(\\text{第3次仍在甲}\\mid\\text{第2次在甲})=p_2\\left(1-\\dfrac13\\right)=\\dfrac59\\cdot\\dfrac23=\\dfrac{10}{27}$。\n\n$$\\Rightarrow\\frac{10/27}{14/27}=\\frac{10}{14}=\\frac57\\approx0.714$$\n\n**结果解读**：$0.714>p_2=0.556$，符合「若第 3 次在甲，则第 2 次更可能在甲」的直觉——因为黑球每次有 $\\dfrac13$ 的概率离开，连续停留在甲需要「没被选中」。\n\n**评分要点（12 分）**：\n- (1) 分类讨论 + 递推式 4 分；\n- (2) 不动点 2 分、通项 3 分、$p_3$ 1 分；\n- (3) 条件概率 2 分。\n\n**易错**：\n- 递推写成 $p_{n+1}=\\dfrac{2}{3}p_n$，漏掉「黑球从乙回到甲」这一支；\n- 解不动点时写成 $p^*=\\dfrac13$；\n- (3) 直接答 $p_2=\\dfrac59$，把「已知第 3 次在甲」这个条件丢掉了。","pack":"MC"},{"id":"MC-15","type":"subjective","points":"16","note":"建议 16 分钟","stem":"设 $X\\sim U(-2,2)$，令 $Y=X^{2}$。\n(1) 求 $Y$ 的分布函数 $F_Y(y)$ 与概率密度 $f_Y(y)$；\n(2) 求 $E(Y)$ 与 $D(Y)$；\n(3) 令 $V=\\min(Y,3)$，求 $P(V=3)$。","solution":"**(1) 分布函数。** $X$ 的密度为 $\\dfrac14$（区间长 4），$Y$ 的取值范围是 $[0,4]$。\n\n对 $0\\le y<4$：\n$$F_Y(y)=P(X^2\\le y)=P(-\\sqrt y\\le X\\le\\sqrt y)=\\frac{\\sqrt y-(-\\sqrt y)}{4}=\\frac{\\sqrt y}{2}$$\n\n分段写出：\n$$F_Y(y)=\\begin{cases}0, & y<0\\\\ \\dfrac{\\sqrt y}{2}, & 0\\le y<4\\\\ 1, & y\\ge4\\end{cases}$$\n\n**接点检查**：$F_Y(4)=\\dfrac{2}{2}=1$ ✓；$F_Y(0)=0$ ✓；单调递增 ✓。\n\n**求导得密度**（$0<y<4$）：\n$$f_Y(y)=\\frac12\\cdot\\frac{1}{2\\sqrt y}=\\frac{1}{4\\sqrt y}$$\n\n**归一化检验**：$\\displaystyle\\int_0^4\\frac{dy}{4\\sqrt y}=\\frac{2\\sqrt y}{4}\\Big|_0^4=1$ ✓。\n\n**注意 $f_Y(y)\\to\\infty$（$y\\to0^+$）**：密度可以无界，只要积分为 1，不影响它是合法的密度。\n\n**(2) 期望与方差。** 用 $X$ 的密度最快：\n$$E(Y)=E(X^2)=\\int_{-2}^{2}x^2\\cdot\\frac14dx=\\frac14\\cdot\\frac{2\\times8}{3}=\\frac{4}{3}$$\n\n$$E(Y^2)=E(X^4)=\\int_{-2}^{2}x^4\\cdot\\frac14dx=\\frac14\\cdot\\frac{2\\times32}{5}=\\frac{16}{5}$$\n\n$$D(Y)=\\frac{16}{5}-\\left(\\frac43\\right)^2=\\frac{16}{5}-\\frac{16}{9}=\\frac{144-80}{45}=\\frac{64}{45}\\approx1.422$$\n\n**对照**：若 $X\\sim U(0,2)$（同长度但非负），则 $Y$ 的分布不同，$E(Y)=\\dfrac{4}{3}$ 仍然相同（因为对称性），但密度不同——**这说明 $Y$ 的分布依赖于 $X$ 的支撑，而 $E(X^2)$ 只依赖二阶矩**。\n\n**(3) 截断的点质量。**\n$$P(V=3)=P\\big(\\min(Y,3)=3\\big)=P(Y\\ge3)$$\n\n$$=1-F_Y(3)=1-\\frac{\\sqrt3}{2}\\approx1-0.866=0.134$$\n\n**为什么不是 $P(Y=3)$**：$Y$ 是连续型，$P(Y=3)=0$。点质量来自「所有 $Y\\ge3$ 的情形被压缩到 3」，所以概率是**尾部概率** $P(Y\\ge3)$，而不是某一点的概率。\n\n**完整分布函数**（$V$ 是混合型）：\n$$F_V(v)=\\begin{cases}0, & v<0\\\\ \\dfrac{\\sqrt v}{2}, & 0\\le v<3\\\\ 1, & v\\ge3\\end{cases}$$\n在 $v=3$ 处从 $\\dfrac{\\sqrt3}{2}$ 跳到 1，跳跃高度 $1-\\dfrac{\\sqrt3}{2}$ ✓。\n\n**评分要点（16 分）**：\n- (1) $F_Y$ 分段 4 分、$f_Y$ 3 分；\n- (2) $E(Y)$ 2 分、$E(Y^2)$ 3 分、$D(Y)$ 2 分；\n- (3) 识别为尾部概率 2 分。\n\n**易错**：\n- $F_Y$ 忘记写 $y<0$ 与 $y\\ge4$ 两段；\n- $f_Y$ 忘记链式法则的 $\\dfrac{1}{2\\sqrt y}$，写成 $\\dfrac12$；\n- (3) 写成 $P(Y>3)$ 或 $P(Y=3)=0$。","pack":"MC"},{"id":"MD-1","type":"choice","points":"5","stem":"设 $P(A)>0$，$P(B)>0$。关于「互斥」与「独立」，下列叙述正确的是____。","options":[["A","互斥的两个事件一定相互独立"],["B","相互独立的两个事件一定互斥"],["C","若 $A,B$ 互斥，则它们一定不独立"],["D","若 $A,B$ 独立，则 $P(A\\cup B)=P(A)+P(B)$"]],"answer":"C","solution":"**C 正确**：互斥给出 $P(AB)=0$，而独立要求 $P(AB)=P(A)P(B)>0$，矛盾，故不独立。\n\n**A 错**：同 C 的理由。\n\n**B 错**：独立时 $P(AB)=P(A)P(B)>0$，与「互斥」的 $P(AB)=0$ 矛盾。除非有一个事件概率为 0（但题干已排除）。\n\n**D 错**：独立时\n$$P(A\\cup B)=P(A)+P(B)-P(A)P(B)<P(A)+P(B)$$\n只有当 $P(A)P(B)=0$ 时才相等。\n\n**一句话总结**：\n- 互斥 = 集合不相交 = $P(AB)=0$；\n- 独立 = 概率可相乘 = $P(AB)=P(A)P(B)$。\n\n正概率下两者**互相排斥**。零概率事件是唯一的例外（它与任何事件都独立，也可以与某事件互斥）。","pack":"MD"},{"id":"MD-2","type":"choice","points":"5","stem":"若 $P(A)=1$，则下列结论正确的是____。","options":[["A","必有 $A=\\Omega$"],["B","$A$ 与任意事件 $B$ 相互独立"],["C","$A$ 包含 $\\Omega$ 的全部样本点"],["D","对任意 $B$ 有 $P(A\\mid B)=0$"]],"answer":"B","solution":"**B 正确**：$P(\\bar A)=0$，故对任意 $B$，\n$$P(AB)=P(B)-P(B\\bar A)=P(B)-0=P(B)=P(A)P(B)$$\n最后一步用了 $P(A)=1$。\n\n**A、C 错**：$P(A)=1$ 只说明「几乎必然」，不保证集合相等。例如在 $[0,1]$ 上均匀取点，\n$$A=[0,1)\\setminus\\{0.5\\}$$\n则 $P(A)=1$，但 $A\\ne\\Omega=[0,1]$，也不包含 $0.5$ 这个样本点。\n\n**D 错**：应为 $P(A\\mid B)=1$（只要 $P(B)>0$），因为 $AB$ 与 $B$ 只差一个零概率集。\n\n**核心观念**：概率论里的「必然」是「几乎必然」（almost surely），与集合论里的「等于 $\\Omega$」不同。这个区别在连续型问题里尤其重要。","pack":"MD"},{"id":"MD-3","type":"choice","points":"5","stem":"设连续型随机变量 $X$ 的密度为 $f(x)$。下列叙述正确的是____。","options":[["A","必有 $0\\le f(x)\\le1$"],["B","$f(x)$ 就是 $X$ 取值 $x$ 的概率"],["C","$f$ 可以大于 $1$，只要求 $f\\ge0$ 且 $\\int_{-\\infty}^{+\\infty}f=1$"],["D","若 $f$ 在某点无定义，则 $X$ 不是连续型"]],"answer":"C","solution":"**C 正确**：密度的两条要求只有「非负」与「积分为 1」，没有上界限制。\n\n**反例（针对 A）**：$X\\sim U(0,0.1)$ 的密度为 $10$，远大于 1，但它是完全合法的密度（区间很短，总面积为 1）。\n\n**B 错**：$P(X=x)=0$ 对连续型恒成立；$f(x)$ 是**密度值**，不是概率。\n正确的换算是 $P(a<X<b)=\\int_a^bf$，即**面积**。\n\n**D 错**：密度在有限个（甚至可列个）点的取值不影响分布，可以任意改动甚至不定义。\n\n**为什么容易记错**：把「概率不超过 1」直接迁移到密度上。但密度是「单位长度的概率」，区间很短时单位长度的概率自然可以很大。\n\n**检验习惯**：算完密度先看两条——非负吗？积分为 1 吗？至于是否大于 1，完全不必担心。","pack":"MD"},{"id":"MD-4","type":"choice","points":"5","stem":"设 $F$ 是某随机变量的分布函数。下列叙述正确的是____。","options":[["A","$F$ 必处处连续"],["B","$F$ 必右连续，允许在跳跃点处左极限小于函数值"],["C","$F$ 的跳跃高度等于该点的密度"],["D","$F$ 必严格单调递增"]],"answer":"B","solution":"**B 正确**：这是分布函数三条判定条件之一（单调不减、右连续、两端极限 0 与 1）。**只要求右连续**，左侧允许跳跃。\n\n**A 错**：离散型的 $F$ 是阶梯函数，在每个取值点都跳，不连续。\n\n**C 错**：跳跃高度等于该点的**概率**：\n$$P(X=a)=F(a)-F(a-)$$\n连续型的密度不产生跳跃（跳高为 0）。\n\n**D 错**：只要求「不减」，允许常数段与跳跃。例如退化分布 $X\\equiv0$ 的 $F$ 在 $x<0$ 处恒为 0，完全不「严格」。\n\n**这条的实战价值**：\n- 给你一个分段函数让你判断能否作分布函数 —— 查三条件；\n- 给你 $F$ 求 $P(X=a)$ —— 做差 $F(a)-F(a-)$；\n- 已知连续型在接点连续 —— 才能用「两侧相等」求参数。\n\n**注意**：只有题目明确说「连续型」时，才可以用「接点两侧相等」；否则接点允许跳跃（见考点 08 的混合型例子）。","pack":"MD"},{"id":"MD-5","type":"choice","points":"5","stem":"下列关于「随机变量的函数」的说法，正确的是____。","options":[["A","连续型随机变量的函数一定是连续型"],["B","离散型随机变量的函数一定是离散型"],["C","连续型随机变量的函数一定是离散型"],["D","混合型随机变量的函数一定是连续型"]],"answer":"B","solution":"**B 正确**：离散型的取值至多可列，函数作用后取值集合仍是至多可列，故仍为离散型。\n\n**A、C 错**：连续型的函数可以是连续型、离散型或混合型。\n- 连续型：$Y=2X$（线性）；\n- 离散型：$Y=\\lfloor X\\rfloor$（取整）；\n- 混合型：$Y=\\min(X,c)$（截断，在 $c$ 处有点质量）。\n\n**D 错**：混合型的函数同样可以是任意类型。\n\n**判别方法**：一律回到 $F_Y(y)=P(g(X)\\le y)$，看有没有跳跃、跳跃之后是否还有连续增长。\n\n**顺带记住**：$Y=g(X)$ 是「连续型」的充分条件之一是 $g$ 严格单调且可导——但这不是必要条件，也不是必然结果。","pack":"MD"},{"id":"MD-6","type":"choice","points":"5","stem":"设 $X,Y$ 的方差都存在。若 $E(XY)=E(X)E(Y)$，则下列结论正确的是____。","options":[["A","$X$ 与 $Y$ 相互独立"],["B","$X$ 与 $Y$ 一定不独立"],["C","$D(X+Y)=D(X)+D(Y)$"],["D","$D(XY)=D(X)D(Y)$"]],"answer":"C","solution":"**C 正确**：由协方差公式\n$$\\mathrm{Cov}(X,Y)=E(XY)-E(X)E(Y)=0$$\n于是\n$$D(X+Y)=D(X)+D(Y)+2\\mathrm{Cov}(X,Y)=D(X)+D(Y)$$\n\n**A 错**：$E(XY)=E(X)E(Y)$ 只说明「不相关」，比独立弱。反例：$X\\sim U(-1,1)$，$Y=X^2$，则 $E(XY)=E(X^3)=0=E(X)E(Y)$，但 $Y$ 完全由 $X$ 决定。\n\n**B 错**：独立必然不相关，但不相关也可能独立（例如二元正态）。\n\n**D 错**：方差的乘积没有这种公式。$D(XY)$ 一般需要 $E(X^2Y^2)$，只有在独立时才等于 $E(X^2)E(Y^2)$。\n\n**三个层次的正确关系**：\n- 独立 $\\Rightarrow$ 不相关 $\\Rightarrow$ $D(X+Y)=D(X)+D(Y)$；\n- 反向均不成立（二元正态是特例）。\n\n**考试提示**：题干给「独立」可以放心拆；只给「不相关」就只能用在方差相加上，不能用 $P(AB)=P(A)P(B)$ 之类的独立性结论。","pack":"MD"},{"id":"MD-7","type":"choice","points":"5","stem":"设 $X,Y$ 的方差都存在。$D(X+Y)=D(X)+D(Y)$ 成立的**充要条件**是____。","options":[["A","$X$ 与 $Y$ 相互独立"],["B","$\\mathrm{Cov}(X,Y)=0$（即 $X$ 与 $Y$ 不相关）"],["C","$X$ 与 $Y$ 互斥"],["D","对任意 $X,Y$ 都成立"]],"answer":"B","solution":"**展开方差**：\n$$D(X+Y)=D(X)+D(Y)+2\\mathrm{Cov}(X,Y)$$\n故等式成立 $\\iff \\mathrm{Cov}(X,Y)=0$，即不相关。这是**充要条件**，比独立弱。\n\n**A 错（不是充要）**：独立能推出不相关，所以独立是**充分不必要**条件。存在不相关但不独立的例子（如 $X\\sim U(-1,1)$、$Y=X^2$）。\n\n**C 错**：「互斥」是事件的运算关系，对随机变量没有「互斥」这个概念；若硬理解为「不可能同时取某值」，与方差无关。\n\n**D 错**：不独立时一般不等。例：$Y=X$，则 $D(X+Y)=D(2X)=4D(X)\\ne2D(X)$。\n\n**这条在考试中的两种问法**：\n- 「已知独立，求 $D(X+Y)$」—— 直接用，不用想；\n- 「$D(X+Y)=D(X)+D(Y)$ 成立说明什么」—— 答「不相关」，不能答「独立」。\n\n**推广**：$D(aX+bY)=a^2D(X)+b^2D(Y)+2ab\\,\\mathrm{Cov}(X,Y)$。","pack":"MD"},{"id":"MD-8","type":"choice","points":"5","stem":"设 $X$ 服从参数为 $p$ 的几何分布（首次成功所需的**总次数**，从 1 开始）。下列叙述正确的是____。","options":[["A","$E(X)=\\dfrac1p$，$D(X)=\\dfrac{q}{p}$"],["B","$P(X>m)=q^{m}$（$m$ 为非负整数）"],["C","无记忆性只在「从 0 开始计数」的定义下成立"],["D","$P(X=k)=pq^{k}$，$k\\ge0$"]],"answer":"B","solution":"**B 正确**：$X>m$ 表示前 $m$ 次全部失败，概率 $q^m$。\n\n**A 错**：期望对，方差错。正确的方差是 $D(X)=\\dfrac{q}{p^2}$（分母是 $p$ 的平方）。\n\n**C 错**：无记忆性在两种约定下都成立，只是表述的时间起点不同。\n\n**D 错**：从 1 开始计数时 $P(X=k)=q^{k-1}p$，$k\\ge1$；$pq^k$ 是「从 0 开始计数」的写法。\n\n**四个量务必分清**：\n- $P(X=k)=q^{k-1}p$，$k\\ge1$\n- $P(X>m)=q^{m}$\n- $P(X\\ge m)=q^{m-1}$\n- $E X=\\dfrac1p$，$D X=\\dfrac{q}{p^2}$\n\n**用 $p=\\dfrac12$ 自检**：$E=2$，$D=2$，$P(X>2)=\\dfrac14$，$P(X\\ge2)=\\dfrac12$ —— 四个数各不相同，可以互相印证。","pack":"MD"},{"id":"MD-9","type":"choice","points":"5","stem":"从 $N$ 件产品（含 $M$ 件次品）中**不放回**地抽取 $n$ 件。下列叙述正确的是____。","options":[["A","次品数精确服从二项分布 $B\\left(n,\\dfrac MN\\right)$"],["B","各次抽取的结果相互独立"],["C","第 $k$ 次抽到次品的概率与 $k$ 无关，都等于 $\\dfrac MN$"],["D","当抽样比例 $\\dfrac nN$ 较大时，超几何分布可精确等同于二项分布"]],"answer":"C","solution":"**C 正确**（抽签的边际性）：把 $N$ 件产品随机排成一列，第 $k$ 个位置上的产品在 $N$ 个位置中对称，故它是次品的概率为 $\\dfrac MN$，与 $k$ 无关。\n\n**A 错**：不放回时各次不独立，精确分布是超几何\n$$P(X=k)=\\frac{\\binom Mk\\binom{N-M}{n-k}}{\\binom Nn}$$\n二项只是 $n/N$ 很小时的近似。\n\n**B 错**：不放回导致负相关——抽到一件次品后，下次抽到次品的概率变小。\n\n**D 错**：比例越大，超几何与二项的差别越大（有限总体修正因子 $\\dfrac{N-n}{N-1}$ 越小）。「$n/N$ 很大时可用二项」正好说反了。\n\n**数值体会**：$N=100$、$M=10$、$n=5$ 时，超几何方差 $=npq\\cdot\\dfrac{95}{99}$，与二项的差别只有 4%；若 $n=50$，修正因子降到 $\\dfrac{50}{99}$，差别接近一半。\n\n**这两条要同时记住**：**边际概率与次序无关，但联合概率与次序强相关**。","pack":"MD"},{"id":"MD-10","type":"choice","points":"5","stem":"设 $X$ 的期望与方差都存在且 $D(X)>0$，令 $Z=\\dfrac{X-E(X)}{\\sqrt{D(X)}}$。下列叙述正确的是____。","options":[["A","$Z$ 一定服从 $N(0,1)$"],["B","$E(Z)=0$，$D(Z)=1$，但 $Z$ 不一定是正态"],["C","只有离散型随机变量可以这样标准化"],["D","标准化要求 $E(X)=0$"]],"answer":"B","solution":"**直接计算**：\n$$E(Z)=\\frac{E(X)-E(X)}{\\sqrt{D(X)}}=0$$\n$$D(Z)=\\frac{D(X)}{D(X)}=1$$\n（第二步用了 $D(aX+b)=a^2D(X)$，系数 $\\dfrac{1}{\\sqrt{D(X)}}$ 平方后是 $\\dfrac{1}{D(X)}$。）\n\n**A 错**：标准化只保证均值 0、方差 1，**不改变分布形状**。若原分布是均匀，标准化后仍是均匀（只是区间变成 $\\left(-\\sqrt3,\\sqrt3\\right)$ 之类）。只有原本正态，标准化后才恰好是标准正态。\n\n**C 错**：任意有有限方差的随机变量都能标准化，与离散/连续无关。\n\n**D 错**：标准化就是**为了**把均值变成 0，不要求原来为 0。\n\n**这条的实战意义**：题目说「$X\\sim N(\\mu,\\sigma^2)$，求 $P(X<a)$」时要标准化，因为正态的标准化结果仍是正态；若题目说「$X\\sim U(a,b)$，求 $P(X<c)$」，则**不能**用 $\\Phi_0$，要直接算长度比。\n\n**易错提醒**：把「标准化」与「正态化」混为一谈，是选择题最常见的失分点之一。","pack":"MD"},{"id":"MD-11","type":"choice","points":"5","stem":"关于切比雪夫不等式 $P\\big(|X-E(X)|\\ge\\varepsilon\\big)\\le\\dfrac{D(X)}{\\varepsilon^2}$，下列叙述正确的是____。","options":[["A","它能给出概率的精确值"],["B","它只给出界；若算出的界大于 1，只能取 1"],["C","它要求 $X$ 服从正态分布"],["D","它对期望不存在的随机变量也适用"]],"answer":"B","solution":"**B 正确**：切比雪夫是**不等式**，给的是上界（或下界），不是精确值。\n\n**为什么界可能大于 1**：右端 $\\dfrac{D(X)}{\\varepsilon^2}$ 在 $\\varepsilon$ 很小时会超过 1，而概率本身不超过 1，故此时只能写 $P\\le1$。例如 $D=4$、$\\varepsilon=1$ 时 $\\dfrac41=4$，只能取 1。\n\n**A 错**：只有已知具体分布（如正态）时才能算精确概率：\n$$X\\sim N(\\mu,\\sigma^2)\\Rightarrow P(|X-\\mu|<\\varepsilon)=2\\Phi_0\\left(\\frac\\varepsilon\\sigma\\right)-1$$\n\n**C 错**：切比雪夫对**任意**方差有限的分布都成立，这正是它的价值——不需要知道分布。\n\n**D 错**：不等式用到 $D(X)$，所以要求方差（从而期望）存在。柯西分布期望都不存在，不能套。\n\n**一个反直觉的点**：正态时 $P(|X-\\mu|<2\\sigma)\\approx0.954$，而切比雪夫只给 $\\ge1-\\dfrac14=0.75$。**界比真值宽松**是正常的，因为它要对所有分布负责。\n\n**答题规范**：写「由切比雪夫不等式得 $P\\ge\\ldots$」，并注明这是**下界**，不要写成等号。","pack":"MD"},{"id":"MD-12","type":"choice","points":"5","stem":"设连续型随机变量 $X$ 的密度 $f(x)$ 关于 $0$ 对称（即 $f(-x)=f(x)$）。下列叙述正确的是____。","options":[["A","若 $E(X)$ 存在，则 $E(X)=0$"],["B","一定有 $E(X)=0$"],["C","一定有 $D(X)=1$"],["D","$X$ 一定服从正态分布"]],"answer":"A","solution":"**A 正确**：对称 + 期望存在 $\\Rightarrow$ 期望为对称中心 0。\n\n**B 错**：对称**不保证**期望存在。标准柯西分布 $f(x)=\\dfrac{1}{\\pi(1+x^2)}$ 关于 0 对称，但\n$$\\int_{-\\infty}^{+\\infty}\\frac{|x|}{\\pi(1+x^2)}dx=+\\infty$$\n故 $E(X)$ 不存在。**这是「对称 $\\Rightarrow$ 均值 0」这句话必须加前提的原因。**\n\n**C 错**：方差与对称无关。$U(-1,1)$ 的方差是 $\\dfrac13$，$U(-2,2)$ 的方差是 $\\dfrac43$，都对称但方差不同。\n\n**D 错**：对称的密度有无穷多种（均匀、三角、$t$ 分布……）。\n\n**判据补充**：若 $f(a-x)=f(b+x)$，对称中心是 $\\dfrac{a+b}{2}$，此时（期望存在时）$E(X)=\\dfrac{a+b}{2}$。\n\n**这条在考试里的价值**：见到「关于 $x=\\mu$ 对称」应立刻想到 $P(X>\\mu)=\\dfrac12$、$F(\\mu+x)=1-F(\\mu-x)$，可以省掉大量积分。","pack":"MD"},{"id":"MD-13","type":"subjective","points":"12","note":"建议 14 分钟","stem":"某商店销售一种时效性商品：进价每件 $3$ 元，售价每件 $5$ 元，当天未售出的商品只能报废（残值 $0$）。市场需求量 $Q\\sim U(1000,3000)$（件），进货量为 $y$（$1000\\le y\\le3000$）。\n(1) 写出利润 $R$ 关于 $Q,y$ 的表达式；\n(2) 求 $E(R)$ 关于 $y$ 的函数；\n(3) 求最优进货量 $y^{*}$ 与最大期望利润；\n(4) $y^{*}$ 与需求均值 $2000$ 谁大？说明判据。","solution":"**(1) 利润函数。** 卖出 $\\min(Q,y)$ 件，每件收入 $5$ 元；进货 $y$ 件，每件成本 $3$ 元：\n$$R=5\\min(Q,y)-3y=\\begin{cases}2y, & Q\\ge y\\\\ 5Q-3y, & Q<y\\end{cases}$$\n\n**(2) 期望。** $Q$ 的密度为 $\\dfrac1{2000}$，分两段积分：\n$$E(R)=\\frac1{2000}\\left[\\int_{1000}^{y}(5q-3y)\\,dq+\\int_y^{3000}2y\\,dq\\right]$$\n\n**第一段**：\n$$\\int_{1000}^{y}5q\\,dq=\\frac52\\left(y^2-10^6\\right),\\qquad \\int_{1000}^{y}(-3y)\\,dq=-3y(y-1000)$$\n合并：\n$$\\frac52y^2-2.5\\times10^6-3y^2+3000y=-\\frac12y^2+3000y-2.5\\times10^6$$\n\n**第二段**：\n$$\\int_y^{3000}2y\\,dq=2y(3000-y)=6000y-2y^2$$\n\n**相加**：\n$$E(R)=\\frac{1}{2000}\\left(-\\frac52y^2+9000y-2.5\\times10^6\\right)$$\n\n**(3) 求最优。**\n$$\\frac{dE(R)}{dy}=\\frac{1}{2000}\\left(-5y+9000\\right)=0\\ \\Rightarrow\\ y^{*}=1800$$\n\n**二阶条件**：$\\dfrac{d^2E}{dy^2}=-\\dfrac{5}{2000}<0$，唯一驻点即全局最大（另两个端点 $y=1000$ 与 $y=3000$ 的期望利润都更低）。\n\n**最大期望利润**：\n$$E(R)\\Big|_{y=1800}=\\frac{-\\frac52(3.24\\times10^6)+9000\\times1800-2.5\\times10^6}{2000}$$\n$$=\\frac{-8.1\\times10^6+16.2\\times10^6-2.5\\times10^6}{2000}=\\frac{5.6\\times10^6}{2000}=2800\\ \\text{元}$$\n\n**另一种算法（更稳，推荐）**：先算\n$$E[\\min(Q,y)]=\\int_0^{y}P(Q>t)\\,dt$$\n对 $y=1800$：\n$$\\int_{1000}^{1800}\\frac{q-1000}{2000}dq=\\frac{1800^2-1000^2}{4000}=\\frac{2240000}{4000}=560$$\n$$\\int_{1800}^{3000}1800\\cdot\\frac1{2000}dq=1800\\times\\frac{1200}{2000}=1080$$\n$$E[\\min]=560+1080=1640$$\n$$E(R)=5\\times1640-3\\times1800=8200-5400=2800\\ \\text{元}\\ ✓$$\n\n**(4) 判据。** 本题 $y^{*}=1800<2000$，**小于**需求均值。\n\n**一阶条件的含义**：多进一件的期望边际收益是「卖得掉的概率 $\\times$ 单件毛利」：\n$$P(Q>y)\\cdot(r-c)\\quad\\text{对比}\\quad\\text{单件成本 }c$$\n让两者相等即得\n$$r\\,P(Q>y^{*})=c\\ \\iff\\ P(Q>y^{*})=\\frac cr=\\frac35$$\n\n即 $F(y^{*})=\\dfrac25$，故\n$$y^{*}=1000+\\frac25\\times2000=1800\\ \\checkmark$$\n\n**临界分位点法则**：\n$$F(y^{*})=\\frac{r-c}{r}=\\frac{5-3}{5}=0.4$$\n\n- $r-c$ 是「卖出一件赚的毛利」，$\\dfrac{r-c}{r}$ 是**毛利率**；\n- 毛利率越高（成本占比越低），越应该多进货，$y^{*}$ 越大；\n- 本题毛利率 $0.4<0.5$，成本占比高，所以宁可少进、避免压货，$y^{*}<2000$；\n- 若成本降到 $1$ 元，则 $F(y^{*})=0.8$，$y^{*}=2600$，明显大于均值。\n\n**评分要点（12 分）**：\n- (1) 分段利润 3 分；\n- (2) 分段积分 3 分、化简 1 分；\n- (3) 一阶条件 2 分、$y^{*}$ 1 分、$E(R)$ 2 分；\n- (4) 判据 1 分。\n\n**最易失分**：\n- 分段积分时忘记 $\\displaystyle\\int_{1000}^y(-3y)dq$ 这一项（被积函数里含参数 $y$）；\n- 只写 $y^{*}=1800$ 不给二阶条件或端点比较；\n- 把「未售出亏损」理解成「每件都亏 3 元」，写成 $5Q-3Q=2Q$。\n\n**通用模板**：报童类问题的标准解法是\n$$E(R)=r\\int_0^{y}P(Q>t)dt-cy\\ \\Rightarrow\\ \\frac{dE}{dR}=rP(Q>y)-c=0$$\n不必展开积分，也不容易算错。","pack":"MD"},{"id":"MD-14","type":"subjective","points":"12","note":"建议 12 分钟","stem":"某型号电池由甲、乙两厂供货，甲厂占 $60%$，乙厂占 $40%$。两厂电池的寿命（单位：百小时）分别服从指数分布 $E(0.02)$ 与 $E(0.1)$。\n(1) 求任取一只电池的生存函数 $S(t)=P(T>t)$ 与平均寿命；\n(2) 求 $P(T>50)$；\n(3) 已知某电池已使用 50 百小时仍正常，求它来自甲厂的概率；\n(4) 判断该混合分布是否具有无记忆性，并说明理由。","solution":"**(1) 混合生存函数。** 按来源加权：\n$$S(t)=0.6e^{-0.02t}+0.4e^{-0.1t},\\qquad t\\ge0$$\n\n**平均寿命**（加权，不是对参数取加权）：\n$$E(T)=0.6\\times\\frac1{0.02}+0.4\\times\\frac1{0.1}=0.6\\times50+0.4\\times10=30+4=34$$\n\n**(2) 代入 $t=50$。**\n$$S(50)=0.6e^{-1}+0.4e^{-5}\\approx0.6\\times0.36788+0.4\\times0.006738$$\n$$\\approx0.22073+0.00270=0.22343$$\n\n即约 $22.3%$ 的电池能用到 $5000$ 小时。\n\n**(3) 贝叶斯。**\n$$P(\\text{甲}\\mid T>50)=\\frac{0.6\\,S_{\\text{甲}}(50)}{S(50)}=\\frac{0.22073}{0.22343}\\approx0.9879$$\n\n**解读**：先验 $0.6$，后验 $0.988$。乙厂的寿命只有甲厂的 $\\dfrac15$（均值 10 对 50），撑到 50 百小时的几乎只能是甲厂产品。\n\n**(4) 无记忆性判断。**\n\n**不具有。** 检验条件 $S(s+t)=S(s)S(t)$。取 $s=t=1$：\n$$S(2)=0.6e^{-0.04}+0.4e^{-0.2}\\approx0.6(0.9608)+0.4(0.8187)=0.5765+0.3275=0.9040$$\n$$S(1)^2=\\left(0.6e^{-0.02}+0.4e^{-0.1}\\right)^2\\approx(0.5880+0.3619)^2=(0.9499)^2=0.9023$$\n\n两者不等（$0.9040\\ne0.9023$），故无记忆性不成立。\n\n**更本质的理由**：混合分布相当于「随机选一个率参数」，随着时间推移，寿命短的乙厂产品先被淘
